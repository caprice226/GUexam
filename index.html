# 腎細胞癌（Renal Cell Carcinoma, RCC）　考試導向筆記
### 講者：高建璋（三軍總醫院 泌尿外科）｜2026 泌尿科核心課程｜泌專考試高標版

> 本檔涵蓋 RCC 的 **overview（分類/影像/分期/病理）、localized（手術與 adjuvant pembrolizumab）、local advanced、metastatic（IMDC 風險分層、IO/TKI 系統治療、cytoreductive nephrectomy）** 全套架構。以泌專口試＋筆試高頻點為核心，整合 NCCN 2.2026、AJCC 8th、KEYNOTE-564、CARMENA/SURTIME 與台灣健保（NHIA）給付路徑。

---

## 📑 Section 1：PDF 整體架構

| 章節 | 主題 | 頁數範圍 | 考試重要度 | 為什麼重要 |
|------|------|----------|:----------:|-----------|
| Ch.1 | RCC overview 與其他腎腫瘤分類 | 1–4 | **中高** | Table 97.1 良/惡性分類、oncocytoma/AML |
| Ch.2 | Bosniak 囊腫分類（I–IV） | 4–6 | **最高** | ≥III 須手術、各級惡性風險與處置 |
| Ch.3 | RCC 症狀（triad、paraneoplastic、Stauffer） | 7 | **最高** | 三聯 6–10%、paraneoplastic 20–30%、Stauffer |
| Ch.4 | 理學檢查與影像 workup | 8–10 | **高** | CT 為 staging 主力、轉移評估時機 |
| Ch.5 | Renal mass biopsy（RMB）適應症 | 11 | **高** | 何時切片、infiltrative/UC 不切片 |
| Ch.6 | RCC 病理亞型（clear/papillary/chromophobe） | 12 | **最高** | VHL/MET/BHD、各亞型基因與預後 |
| Ch.7 | AJCC 8th TNM 分期 | 13 | **最高** | T1-4 切點、T3a-c IVC、預後分組 |
| Ch.8 | 5 年存活率（依分期） | 14 | **中** | Localized 93%、Distant ~19% |
| Ch.9 | NCCN localized 治療與 surveillance | 15,18 | **高** | Stage I/II 手術選項、adjuvant pembro |
| Ch.10 | Localized RCC 治療總覽（PN/RN/ablation/AS） | 16 | **最高** | PN 為 gold standard、ablation 適應症 |
| Ch.11 | R.E.N.A.L / PADUA nephrometry score | 17–19 | **高** | 評估手術複雜度、各參數計分 |
| Ch.12 | 預後 nomogram / SSIGN / UISS | 19–22 | **中高** | SSIGN（stage/size/grade/necrosis）、UISS |
| Ch.13 | Adjuvant therapy（KEYNOTE-564 pembrolizumab） | 23–29 | **最高** | 唯一 DFS+OS 獲益、高風險 ccRCC、Cat 1 |
| Ch.14 | Metastatic 風險分層（IMDC / MSKCC） | 31,33 | **最高** | IMDC 6 因子、favorable/int/poor、mOS |
| Ch.15 | 一線系統治療（IO combo / TKI / 演進） | 32,34–40 | **最高** | IO+IO、IO+TKI、四大 phase III trial |
| Ch.16 | 二/三線與難治性治療 | 39,41 | **中** | METEOR/CABOSUN、後線藥物 |
| Ch.17 | 台灣 NHIA 治療路徑 | 42 | **中高** | 健保 1L/2L/3L 給付（cabozantinib等） |
| Ch.18 | Cytoreductive nephrectomy（CARMENA/SURTIME） | 43–49 | **最高** | upfront→deferred 典範轉移、適應症 |

### 整體判斷（最可能上榜的內容）

這份是「教科書 overview ＋ 2026 最新指引」的完整 RCC 講義，**口試/筆試命中率最高的五大塊**：

1. **Bosniak 分類**（I–IV 的影像特徵、惡性風險、處置；**≥III 須手術**）— 幾乎必考。
2. **AJCC 8th TNM**（T1a<4、T1b 4–7、T2a 7–10、T2b>10；**T3a 腎靜脈/腎竇脂肪/pelvicalyceal、T3b IVC 橫膈下、T3c IVC 橫膈上或侵 IVC 壁、T4 超出 Gerota/同側腎上腺**）。
3. **病理亞型與遺傳症候群**（clear cell 70–80%＋VHL 3p25；papillary＋MET/trisomy 7,17；chromophobe＋BHD/FLCN）。
4. **Adjuvant pembrolizumab（KEYNOTE-564）**：唯一證實 **DFS 與 OS 雙重獲益**、用於高風險 ccRCC（pT2 高惡性度、pT3-T4、N1、M1 NED）、**NCCN Category 1**。
5. **Metastatic 的 IMDC 風險分層與系統治療典範**（IMDC 6 因子；一線 IO+IO（nivo/ipi）或 IO+TKI；**CARMENA → upfront CN 在 int/poor risk 不再常規，改 deferred、selective**）。

筆試另偏好：RCC 三聯（6–10%）、paraneoplastic（20–30%）與 **Stauffer syndrome**（非轉移性肝功能異常）、RMB 適應症（lymphoma/ablation 前/疑轉移；infiltrative 疑 UC 不做）、PN 為 small renal mass gold standard、SSIGN/UISS 預後模型。

## 📚 Section 2：各章節 A–H 格式筆記

---

# Ch.1　RCC Overview 與其他腎腫瘤

**A. 一句話重點**
RCC 約占腎腫瘤 85–90%，其餘 10–15% 包含良性（oncocytoma、AML）與其他惡性（Wilms、sarcoma、lymphoma），影像與病理需鑑別。

**B. 必背定義（Table 97.1 分類）**
- **惡性**：RCC（clear cell、papillary、chromophobe、collecting duct of Bellini、medullary、MiT translocation 等）、urothelial/SCC/adenocarcinoma、sarcoma、nephroblastic（Wilms）、neuroendocrine、lymphoma/leukemia、metastasis。
- **良性**：simple/hemorrhagic cyst、**angiomyolipoma（AML）**、**oncocytoma**、papillary/metanephric adenoma、leiomyoma、cystic nephroma、reninoma 等。
- 其餘 **10–15%** 腎腫瘤含：renal cortical adenoma、metanephric adenoma、oncocytoma、AML（hamartoma）、multilocular cystic nephroma、leiomyoma、Wilms、sarcoma、lymphoma/leukemia。

**C. 臨床判斷流程**
```
腎腫塊 → 影像特徵分類（Table 97.2）
 含脂肪(-20 HU↓) → AML
 強化實質 → clear cell RCC / oncocytoma / AML
 囊性 → 依 Bosniak 分級
 浸潤性 → lymphoma / 高惡性度 UC / collecting duct / medullary
```

**D. 診斷工具**：CT/MRI 影像特徵 + 必要時 RMB（見 Ch.5）。

**E. 治療原則**
- **Bosniak ≥ III** 的囊性腫塊 → 手術切除。
- **切片證實 oncocytoma** → 可考慮 follow-up（觀察）。

**F. 考試高頻重點**
1. RCC 占腎腫瘤 85–90%，其餘 **10–15%**。
2. 含脂肪腫塊 → **AML**（hamartoma）。
3. **Bosniak ≥III 須手術**。
4. **Oncocytoma 切片證實可觀察**。
5. 浸潤性腫塊想 lymphoma / UC。

**G. 容易混淆**：AML（含脂肪、良性、TS 相關）vs RCC（強化、惡性）；oncocytoma vs chromophobe（影像難分，需病理）。

**H. 臨床記憶法**
> 「**有脂肪是 AML、囊腫看 Bosniak、浸潤想淋巴瘤/UC**」。

---

# Ch.2　Bosniak 囊腫分類（★必考）

**A. 一句話重點**
Bosniak 依 CT 強化、間隔、鈣化、壁厚將腎囊腫分 I/II/IIF/III/IV，惡性風險遞增，**III 級以上原則上須手術**。

**B. 必背定義（Table 97.3）**

| Bosniak | 影像特徵 | 惡性風險 | 處置 |
|:-------:|---------|:--------:|------|
| **I** | 水樣密度、薄壁、無間隔/鈣化/強化 | None | 不需追蹤 |
| **II** | 少數髮絲狀間隔、細鈣化；hyperdense ≤3 cm 無明確強化 | Minimal | 不需追蹤（hyperdense 需週期追蹤） |
| **IIF** | 多條髮絲狀薄間隔、壁/間隔輕微增厚、鈣化可厚或結節但無強化；hyperdense >3 cm | **3–10%** | **週期性追蹤** |
| **III** | 「indeterminate」壁/間隔增厚不規則且**有可測量強化** | **~50%** | **手術切除** |
| **IV** | 明顯惡性、含**強化軟組織成分** | **75–90%** | **手術切除** |

- 註：囊性病灶**避免 thermal ablation**（擔心 tumor spillage）；健康者建議手術，select 病人可主動監測。

**C. 臨床判斷流程**
```
腎囊腫 → CT 看強化/間隔/鈣化/壁
 I、II → 不需追蹤
 IIF → 週期追蹤
 III、IV → 手術切除（避免 ablation）
```

**D. 診斷工具**：對比 CT（有/無顯影）或 MRI（gadolinium）評估「強化」是關鍵。

**E. 治療策略**：≥III 切除；IIF 追蹤；I/II 觀察。

**F. 考試高頻重點**
1. **III/IV 須手術**；IIF 追蹤；I/II 觀察。
2. **III 惡性風險 ~50%、IV 75–90%**。
3. **IIF ~3–10%**。
4. 「有明確強化」＝升級的關鍵。
5. 囊性病灶**避免 ablation**（tumor spillage）。

**G. 容易混淆比較表**

| | IIF | III |
|--|-----|-----|
| 強化 | 無明確強化 | 有可測量強化 |
| 處置 | 追蹤 | 手術 |
| 惡性 | 3–10% | ~50% |

**H. 臨床記憶法**
> 「**Bosniak 3 上桌（手術）、2F 追蹤、1/2 放著**」；III 約一半惡性、IV 大多惡性。

---

# Ch.3　RCC 症狀（★必考）

**A. 一句話重點**
多數 RCC 無症狀偶然發現；典型三聯（血尿、腰痛、腫塊）僅 6–10% 且代表晚期；paraneoplastic 20–30%，其中 Stauffer syndrome 為非轉移性肝功能異常。

**B. 必背定義（Table 137.10）**
- **多數無症狀**（incidental，最常見），直到病程晚期。
- **典型三聯（triad）：血尿 + 同側腰痛 + 可觸及腫塊，僅 6–10%**（出現時通常已晚期）。
- **Paraneoplastic syndrome：20–30%** — 高血壓、體重下降、發燒、neuromyopathy、貧血、紅血球增多（polycythemia）、amyloidosis、ESR↑、**肝功能異常**。
- **Stauffer syndrome**：非轉移性肝功能異常（無肝轉移卻肝指數異常），切除腫瘤後可恢復。
- **轉移相關疼痛/腫塊：25–30%**。
- IVC 阻塞表現：雙下肢水腫、**不可回縮或右側 varicocele**。

**C. 臨床判斷流程**
```
偶然發現腎腫塊（最多）→ 影像分期
 有三聯/系統症狀 → 多為晚期，積極分期找轉移
 男性新發不可回縮 varicocele / 右側 varicocele → 查 IVC/腎靜脈侵犯
```

**D. 診斷工具**：影像為主；理學檢查角色有限（見 Ch.4）。

**E. 治療策略**：依分期（見後續章節）。

**F. 考試高頻重點**
1. **多數無症狀**（incidental 最常見）。
2. **三聯僅 6–10%**（晚期表現）。
3. **Paraneoplastic 20–30%**。
4. **Stauffer syndrome＝非轉移性肝功能異常**（切瘤後可逆）。
5. **不可回縮/右側 varicocele → IVC 侵犯**。

**G. 容易混淆**：Stauffer（肝功能異常，無肝轉移）vs 真正肝轉移；polycythemia（EPO 分泌）vs 貧血（慢性病）。

**H. 臨床記憶法**
> 「**三聯只有 6–10%，等到出現多半晚**」；「**Stauffer：肝壞了但不是轉移，切腎就好**」；「右側突然 varicocele → 查腎靜脈/IVC」。

# Ch.4　理學檢查與影像 Workup

**A. 一句話重點**
理學檢查角色有限，contrast-enhanced CT 是 RCC 分期主力；轉移評估依風險選擇 CXR/chest CT、bone scan、brain image。

**B. 必背定義**
- **理學檢查**：角色有限，但下列須安排影像 — 可觸及腹部腫塊、可觸及頸部淋巴結、不可回縮 varicocele、雙下肢水腫（疑靜脈侵犯）。
- **原發腫瘤影像**：腹部超音波（偵測）；**對比 CT 為精準分期所必須**；**MRI 對腎腫塊角色有限**（但對 IVC blood thrombus 評估佳）。
- **轉移評估**：低風險者 **plain CXR 足夠評估肺部**，但 **chest CT 最敏感**；**bone scan 只在骨痛或 ALP↑**；**brain CT/MRI 只在有症狀時**；**PET-CT 很少用於 RCC 分期**。

**C. 臨床判斷流程（renal mass workup algorithm）**
```
偵測腎腫塊 →
 simple cyst（水樣）→ 觀察（除非有症狀）
 complex cyst / solid mass →
   無顯著對比過敏：
     eGFR>45 → dedicated renal CT (±contrast) / MRI
     eGFR 30–45 → periprocedural hydration 後同上
     eGFR<30 → 非對比 CT / MRI gadolinium / US/CEUS
   顯著對比過敏 → MRI (±gadolinium)
 → 含脂肪(-20 HU↓)→AML；實質強化→評估 + 考慮 RMB 風險分層
```

**D. 診斷工具與適應症**：CT（分期主力）、US（偵測/CEUS）、MRI（對比過敏/IVC thrombus）、bone scan/brain image（症狀導向）。

**E. 治療策略**：依影像分期決定（見後）。

**F. 考試高頻重點**
1. **對比 CT 為分期所必須**。
2. **MRI 對腎腫塊角色有限**（但評估 IVC thrombus 佳）。
3. **bone scan 只在骨痛/ALP↑**；**brain image 只在有症狀**。
4. **PET-CT 很少用於 RCC 分期**。
5. eGFR 低 → 改非對比 CT/MRI/CEUS。

**G. 容易混淆**：low-risk 用 CXR 即可，但 staging workup 最敏感是 chest CT。

**H. 臨床記憶法**
> 「**CT 分期、骨痛才掃骨、有腦症狀才掃腦、PET 幾乎不用**」。

# Ch.5　Renal Mass Biopsy（RMB）

**A. 一句話重點**
RMB 安全（併發症低），適應症為疑 lymphoma、ablation 前、疑轉移性腫瘤；浸潤性疑 UC 病灶不做切片。

**B. 必背定義（適應症與 Key Points）**
- **適應症**：① 疑 **lymphoma**；② **ablative therapy 前**；③ 疑 **metastatic tumor**（轉移到腎）。
- **不適應**：**浸潤性病灶疑 UC**（urothelial carcinoma）不做 RMB。
- **安全性**：hematoma 4.9%、明顯疼痛 1.2%、gross hematuria 1.0%、pneumothorax 0.6%、需輸血出血 0.4%；**幾乎無 tumor seeding** 案例。
- **準確度**：陽性切片 specificity 94%、PPV 98.8%；**nondiagnostic rate ~14%**（重複切片可降低）；亞型判讀 >90%，但 **grade 準確度僅 60–80%**；**良性結果不代表真的良性**。

**C. 臨床判斷流程**
```
腎腫塊 → 是否影響治療決策?
 疑 lymphoma / 疑轉移 / 要做 ablation → RMB
 典型可切除 RCC、浸潤疑 UC → 不一定 RMB（直接手術）
```

**D. 診斷工具**：core needle biopsy（FNA 常不足）。

**E. 治療策略**：依切片決定（lymphoma 化療、轉移找原發、ablation 確認等）。

**F. 考試高頻重點**
1. RMB 適應症：**lymphoma / ablation 前 / 疑轉移**。
2. **浸潤疑 UC 不做 RMB**。
3. nondiagnostic ~14%。
4. **grade 準確度差（60–80%）**。
5. 良性切片**不能完全排除惡性**。

**G. 容易混淆**：RMB 對亞型可靠（>90%），但對 grade 不可靠。

**H. 臨床記憶法**
> 「**切片三時機：淋巴瘤、燒灼前、疑轉移；浸潤像 UC 別切**」。

# Ch.6　RCC 病理亞型（★必考）

**A. 一句話重點**
Clear cell（70–80%，VHL/3p、最惡且最常見、對 TKI/IO 反應好）、papillary（5–10%，MET/trisomy 7,17，預後好、多中心）、chromophobe（3–5%，BHD/FLCN，預後相對好）。

**B. 必背定義（Table 137.9）**

| 亞型 | 比例 | 遺傳/基因 | 病理/影像 | 其他特徵 |
|------|:----:|----------|-----------|---------|
| **Clear cell** | **70–80%** | **VHL（3p25）mutation/hypermethylation**；3p deletion、5q gain | hypervascular、clear cells nests；IHC: CA-IX、vimentin、EMA | 源自 proximal tubule；較惡；**對 TKI/IO 反應好** |
| **Papillary** | **5–10%** | HPRC、**trisomy 7,17**、**MET**（81% sporadic）| hypovascular、papillary、纖維血管核心；IHC: CK7、AMACR | 源 proximal tubule；**預後好**、**多中心**、ARCD 常見；不再分 type 1/2 |
| **Chromophobe** | **3–5%** | **Birt-Hogg-Dubé（BHD）、FLCN（17p）**；多染色體缺失；TP53/PTEN | well-circumscribed、plant cells、perinuclear halo、raisinoid nuclei；IHC: 瀰漫 CK7 | 源 collecting duct intercalated cells；**預後好**；sarcomatoid variant 差 |
| Clear cell papillary | ~5% | VHL | low-grade、good capsule | 源 ESRD/VHL；**預後極佳，現多視為良性** |
| Unclassified | 1–3% | 保留 SMARCB1 | varied | 預後差 |

**C. 臨床判斷流程**
```
RCC 病理 →
 clear cell → 想 VHL、最常見、系統治療反應好
 papillary → 想 MET/trisomy 7,17、預後較好、多中心
 chromophobe → 想 BHD/FLCN、預後相對好
 collecting duct / medullary（鐮型細胞）→ 預後極差
```

**D. 診斷工具**：病理 + IHC（CA-IX、CK7、AMACR、vimentin）。

**E. 治療策略**：clear cell 對 IO/TKI 反應好，是多數系統治療 trial 的對象；non-clear cell 多以 surveillance / clinical trial / cabozantinib 等。

**F. 考試高頻重點**
1. **Clear cell 70–80%、VHL/3p25、最惡、IO/TKI 反應好**。
2. **Papillary 5–10%、MET/trisomy 7,17、預後好、多中心**。
3. **Chromophobe 3–5%、BHD/FLCN、CK7 瀰漫、預後相對好**。
4. clear cell 源 proximal tubule、chromophobe 源 collecting duct。
5. clear cell papillary 預後極佳（近乎良性）。

**G. 容易混淆比較表**

| | Clear cell | Papillary | Chromophobe |
|--|-----------|-----------|-------------|
| 基因 | VHL(3p) | MET/7,17 | BHD/FLCN(17p) |
| 血管 | hyper | hypo | — |
| IHC | CA-IX | CK7/AMACR | 瀰漫CK7 |
| 預後 | 較差 | 好 | 相對好 |

**H. 臨床記憶法**
> 「**Clear＝VHL，Papillary＝MET（trisomy 7,17），Chromophobe＝BHD（CK7）**」。

# Ch.7　AJCC 8th TNM 分期（★必考）

**A. 一句話重點**
T 依大小（4/7/10 cm）與局部侵犯（腎靜脈、IVC、Gerota、腎上腺）分級；N0/N1；M0/M1，據此組成 Stage I–IV。

**B. 必背定義（2017 AJCC 8th）**
- **T1a**：腫瘤 **<4 cm**，限於腎臟。
- **T1b**：**>4 且 <7 cm**，限於腎臟。
- **T2a**：**>7 且 <10 cm**，限於腎臟。
- **T2b**：**>10 cm**，限於腎臟。
- **T3a**：侵入**腎靜脈/節段分支**，或侵入 **pelvicalyceal system**，或侵入 **perirenal/腎竇脂肪但未超出 Gerota**。
- **T3b**：延伸入 **IVC 橫膈下**。
- **T3c**：延伸入 **IVC 橫膈上**，或侵犯 **IVC 壁**。
- **T4**：超出 **Gerota's fascia**（含連續侵犯**同側腎上腺**）。
- **N0** 無區域淋巴結轉移；**N1** 有區域淋巴結轉移。
- **M0** 無遠端轉移；**M1** 有遠端轉移。

**預後分組（AJCC）**
```
Stage I   : T1   N0 M0
Stage II  : T2   N0 M0
Stage III : T1-2 N1 M0 ；或 T3 N0-N1 M0
Stage IV  : T4 any N M0 ；或 any T any N M1
```

**C. 臨床判斷流程**
```
腫瘤大小 → T1a(<4)/T1b(4-7)/T2a(7-10)/T2b(>10)
局部侵犯 → 腎靜脈/腎竇脂肪/pelvicalyceal=T3a；IVC橫膈下=T3b；IVC橫膈上/侵壁=T3c；超Gerota/同側腎上腺=T4
→ 合併 N、M 組成 stage
```

**D. 診斷工具**：對比 CT/MRI（評估 IVC thrombus 高度尤其重要）。

**E. 治療策略**：依 stage（見 Ch.9–18）。

**F. 考試高頻重點**
1. **T1a<4、T1b 4–7、T2a 7–10、T2b>10**。
2. **T3a＝腎靜脈/腎竇脂肪/pelvicalyceal**；**T3b＝IVC 橫膈下**；**T3c＝IVC 橫膈上或侵 IVC 壁**。
3. **T4＝超出 Gerota 或侵同側腎上腺**。
4. N1 即 Stage III（T1-2N1）。
5. 8th 版新增 pelvicalyceal system 侵犯歸 T3a。

**G. 容易混淆比較表**

| T3 | 範圍 |
|----|------|
| T3a | 腎靜脈/腎竇脂肪/pelvicalyceal |
| T3b | IVC 橫膈下 |
| T3c | IVC 橫膈上 / 侵 IVC 壁 |

**H. 臨床記憶法**
> 「**4、7、10 分 T1a/T1b/T2a/T2b**」；「**T3：a 進靜脈、b 到橫膈下、c 過橫膈或咬血管壁；T4 破 Gerota（含同側腎上腺）**」。

# Ch.8　5 年存活率（依分期）

**A. 一句話重點**
依 SEER：localized ~93%、regional ~76%、distant ~19%、整體 ~79%；早期手術可治癒，遠端轉移因免疫/標靶組合而較過去改善。

**B. 必背數據**
- **SEER 分期**：Localized **93–94%**、Regional **~76%**、Distant **~19%**、整體 **~79%**。
- **AJCC 粗略對照**：Stage I ~90–95%↑、Stage II ~75–90%、Stage III ~63–78%、Stage IV ~15–28%。
- 早期（I–II）多可手術治癒（5 年 75–95%↑）；Stage III 預後下降但積極手術＋藥物可改善；Stage IV 近年因 IO/TKI 組合顯著改善部分病人長期存活。

**C–E.** 依分期治療，見後續章節。

**F. 考試高頻重點**
1. Localized ~93%、Distant ~19%、整體 ~79%。
2. Stage IV 5 年僅 15–28%。
3. IO/TKI 組合改善遠端轉移存活。
4. relative survival 排除其他死因。
5. 早期以手術治癒為主。

**H. 臨床記憶法**
> 「**局部 9 成、遠端不到 2 成**」。

# Ch.9–10　Localized RCC 治療（NCCN + 總覽）★必考

**A. 一句話重點**
Localized RCC 以手術為主，**partial nephrectomy（PN）為 small renal mass 的 gold standard**；不適合 PN（局部晚期、位置不佳、健康差）改 radical nephrectomy；ablation/AS 用於 small mass 或不適合手術者。

**B. 必背定義（治療選項）**
- **Radical nephrectomy（RN）**：腫瘤大、局部晚期、位置不利、PN 不可行時。
- **Partial nephrectomy（PN，gold standard）**：**small renal mass 首選**（盡量保腎）；不適合 PN：local advanced、tumor 位置不佳、病人健康差。
- **Ablation（RFA/cryo/HIFU）**：small renal mass、手術風險高者（**囊性病灶避免 ablation**）。
- **Active surveillance（AS）**：small mass、老衰/共病多、預期壽命短。
- **NCCN Stage I（T1a）**：PN（preferred）/ percutaneous ablation / SBRT / AS / RN（select）。
- **NCCN Stage I（T1b）**：PN / RN / AS（select）/ ablation（2B）/ SBRT（select）。
- **NCCN Stage II**：PN / RN / SBRT（select, 2B）→ adjuvant 視病理（見 Ch.13）。

**C. 臨床判斷流程（fishbone）**
```
Localized RCC →
 標準手術：RN 或 PN（small mass 首選 PN）
 PN 不適合（local advanced / 位置不佳 / 健康差）→ RN
 small renal mass 且手術風險高 → RFA / cryo / HIFU / AS
```

**D. 診斷工具**：CT 分期 + nephrometry score（Ch.11）評估保腎可行性。

**E. 治療策略**：盡量保腎（PN）；ablation/AS 為替代；術後依風險決定 adjuvant。

**F. 考試高頻重點**
1. **PN 為 small renal mass 的 gold standard**（保腎）。
2. PN 不適合：local advanced、位置不佳、健康差。
3. ablation/AS 用於小腫瘤/高手術風險。
4. **囊性病灶避免 ablation**。
5. T1a 首選 PN（NCCN preferred）。

**G. 容易混淆**：RN（大/晚期/位置差）vs PN（小/可保腎）。

**H. 臨床記憶法**
> 「**小腫瘤先保腎（PN），不能保才整顆切（RN），更高風險才燒/觀察**」。

# Ch.11　R.E.N.A.L / PADUA Nephrometry Score

**A. 一句話重點**
R.E.N.A.L 與 PADUA 以腫瘤大小、內外生性、與集尿系統距離、位置等量化手術複雜度，分數越高越複雜。

**B. 必背定義（R.E.N.A.L score）**
- **R**adius（最大徑）：≤4＝1、>4–<7＝2、≥7＝3。
- **E**xophytic/endophytic：≥50% 外生＝1、<50%＝2、完全內生＝3。
- **N**earness 至集尿系統/腎竇（mm）：≥7＝1、>4–<7＝2、≤4＝3。
- **A**nterior/Posterior：不計分，標 a/p/x。
- **L**ocation 相對極線：完全在極線上/下＝1、跨極線＝2、>50% 跨極線或跨中線或完全在極線間＝3。
- 後綴 **"h"**：腫瘤觸及主腎動脈/靜脈（hilar）。
- **複雜度**：**4–6 低、7–9 中、10–12 高**。
- **PADUA**：類似，含 longitudinal polar location、renal sinus、collecting system、renal rim（lateral/medial）、touches hilum、a/p。

**C–E.** 用於術前規劃 PN 難度與併發症風險。

**F. 考試高頻重點**
1. **R.E.N.A.L 五字母**：Radius/Exophytic/Nearness/Anterior-posterior/Location。
2. 分數 **4–6 低、7–9 中、10–12 高**。
3. **"h" 後綴＝觸及腎門血管**。
4. A/P 不計分。
5. PADUA 另計 renal rim / sinus / collecting system。

**H. 臨床記憶法**
> 「**RENAL：半徑、內外生、離集尿系統、前後、位置；h 代表碰到腎門**」。

# Ch.12　預後模型：Nomogram / SSIGN / UISS

**A. 一句話重點**
SSIGN（Stage、Size、Grade、Necrosis）預測 ccRCC 腎切後轉移與存活；UISS 結合 TNM/Fuhrman grade/ECOG 分低中高風險；用於 adjuvant trial 病人篩選。

**B. 必背定義**
- **SSIGN classification**：**S**tage（pT/pN）、tumor **S**ize（<10 vs ≥10 cm）、Fuhrman **G**rade（1–4）、histologic tumor **N**ecrosis（有/無）→ 計分分 **low / intermediate / high** risk；預測 RN 後 metastasis-free survival（high risk 5 年 MFS 僅 ~31%）。
- **UISS（UCLA Integrated Staging System）**：整合 **T stage + Fuhrman grade + ECOG PS** → low/intermediate/high；high risk 5 年復發率 58.1%、中位復發時間 9.5 個月。
- **Adjuvant trial 病人選擇**：S-TRAC、ASSURE、PROTECT 依 TNM/grade/ECOG/nodal 納入不同風險族群。
- **ccRCC 復發 nomogram**（Kattan/Leibovich 類）：size、pT、grade、necrosis、vascular invasion、presentation → 5 年無復發機率。

**C–E.** 用於風險分層、追蹤強度與 adjuvant 決策。

**F. 考試高頻重點**
1. **SSIGN＝Stage、Size、Grade、Necrosis**（ccRCC）。
2. **UISS＝TNM + Fuhrman grade + ECOG**。
3. high risk 預後明顯較差（SSIGN high 5 年 MFS ~31%）。
4. 用於 adjuvant 病人篩選。
5. necrosis 與 vascular invasion 是不良預後因子。

**H. 臨床記憶法**
> 「**SSIGN 簽名：Stage-Size-Grade-Necrosis**；**UISS：分期＋惡性度＋體能**」。

# Ch.13　Adjuvant Therapy（KEYNOTE-564 Pembrolizumab）★最新最常考

**A. 一句話重點**
手術仍是 localized RCC 主要治療；高風險 clear cell RCC 術後 adjuvant pembrolizumab（KEYNOTE-564）是**唯一證實 DFS 與 OS 雙重獲益**者，為現行 standard、NCCN Category 1。

**B. 必背定義（KEYNOTE-564）**
- **設計**：Phase III、randomized、double-blind、placebo-controlled。
- **族群**：**clear cell RCC、術後（nephrectomy ≤12 週）、無前線系統治療、ECOG 0–1**。
- **用法**：**Pembrolizumab 200 mg IV Q3W，最多約 1 年（≤17 cycles）**。
- **主要 endpoint：DFS**；**次要：OS、safety**。
- **適用高風險族群（eligible）**：
  - Intermediate-high risk：**pT2 grade 4/sarcomatoid 或 pT3 N0**。
  - High risk：**pT4 或 N1**。
  - **M1 NED**（轉移完全切除、無疾病證據，且 ≤1 年內）。
- **結果（ASCO 2025 更新，median f/u ~69.5 mo）**：
  - **DFS HR 0.71–0.72**（Pembro 63.7% vs Placebo 56.6%）。
  - **OS HR 0.62–0.66**（4 年 OS 91.2% vs 86.0%）。
  - **首個且唯一同時證實 DFS 與 OS 獲益的 adjuvant 免疫治療**。
  - Grade ≥3 treatment-related AE ~18.6%。
- **其他 adjuvant trial（多為陰性）**：ASSURE（sunitinib/sorafenib，陰）、S-TRAC（sunitinib，DFS+但採用有限）、PROTECT（pazopanib，borderline）、ATLAS（axitinib，陰）、EVEREST（everolimus，marginal）、IMmotion010（atezo，陰）、CheckMate-914（nivo+ipi，陰）、PROSPER（perioperative nivo，陰）。

**C. 臨床判斷流程（practical strategy）**
```
Localized RCC → nephrectomy（RN/PN）→ 病理 + 風險分層
 low risk → surveillance
 high risk（pT3/T4/N1/M1 NED/pT2 grade4-sarcomatoid，且 clear cell）
   → 討論 adjuvant pembrolizumab 200 mg Q3W ×1 年
 → 長期追蹤（irAE 監測：甲狀腺/腸炎/肝炎/肺炎/腎炎）
```

**D. 診斷工具**：病理風險分層（stage/grade/sarcomatoid/nodal/M1 NED）；治療中監測 irAE。

**E. 治療策略**
- **Clear cell 高風險** → adjuvant pembrolizumab（Cat 1）或 surveillance。
- **Non-clear cell** → surveillance 或 clinical trial。
- 須謹慎討論族群：low-risk（過度治療）、frail/老年、自體免疫病、CKD/移植、non-clear cell（證據有限）。

**F. 考試高頻重點**
1. **KEYNOTE-564 pembrolizumab：唯一 DFS+OS 雙重獲益 adjuvant**。
2. **用於高風險 clear cell RCC（pT2 grade4/sarcomatoid、pT3、pT4、N1、M1 NED）**。
3. **200 mg Q3W ×1 年**；**NCCN Category 1**。
4. 其他 TKI/mTOR adjuvant trial 多為**陰性**（ASSURE/PROTECT/ATLAS…）。
5. irAE：甲狀腺低下、腸炎、肝炎、肺炎、免疫腎炎。

**G. 容易混淆比較表**

| Trial | 藥 | 結果 |
|-------|----|------|
| KEYNOTE-564 | Pembrolizumab | **DFS + OS 陽性（Cat 1）** |
| S-TRAC | Sunitinib | DFS 陽性，採用有限 |
| ASSURE / ATLAS / IMmotion010 / CheckMate-914 / PROSPER | TKI / IO | 陰性 |

**H. 臨床記憶法**
> 「**Adjuvant 只有 Pembrolizumab（KEYNOTE-564）真的有效——高風險 clear cell，打一年**」。

# Ch.14　Metastatic 風險分層（IMDC / MSKCC）★必考

**A. 一句話重點**
轉移性 RCC 以 IMDC（6 因子，現行標準）或 MSKCC（5 因子，cytokine 年代）分 favorable/intermediate/poor，決定預後與一線治療選擇。

**B. 必背定義**
- **IMDC（2009，VEGFR-targeted 年代，現行標準）6 因子**：
  1. **Karnofsky PS <80%**
  2. **診斷到治療 <12 個月（TDT <12 mo）**
  3. **Hemoglobin < LLN（貧血）**
  4. **Corrected calcium > ULN（高血鈣）**
  5. **Neutrophils > ULN（嗜中性球高）**
  6. **Platelets > ULN（血小板高）**
  - **0 因子＝favorable（mOS 43 mo）、1–2＝intermediate（23 mo）、3–6＝poor（8 mo）**。
- **MSKCC（2002，cytokine 年代）5 因子**：KPS<80、TDT<12 mo、Hb<LLN、**corrected Ca >10 mg/dL**、**LDH >1.5×ULN**（**無中性球/血小板**）。
  - 0＝favorable(30 mo)、1–2＝intermediate(14 mo)、3–5＝poor(5 mo)。

**C. 臨床判斷流程**
```
mRCC → 計算 IMDC 6 因子
 0 → favorable
 1–2 → intermediate
 3–6 → poor
→ 據此選一線治療（見 Ch.15）並評估 cytoreductive nephrectomy
```

**D. 診斷工具**：實驗室（Hb、Ca、ANC、Plt、LDH）+ KPS + 病史時序。

**E. 治療策略**：見 Ch.15（favorable 可 IO+TKI 或 select IO+IO；int/poor 偏好 IO+IO/IO+TKI）。

**F. 考試高頻重點**
1. **IMDC 6 因子**：KPS<80、TDT<12mo、Hb↓、Ca↑、ANC↑、Plt↑。
2. **MSKCC** 用 **LDH** 取代中性球/血小板。
3. **0/1-2/3-6＝favorable/intermediate/poor**。
4. mOS：favorable 43、intermediate 23、poor 8 個月（IMDC）。
5. IMDC 為現行標準（targeted/IO 年代）。

**G. 容易混淆比較表**

| | IMDC | MSKCC |
|--|------|-------|
| 年代 | VEGFR-targeted | cytokine |
| 共同 | KPS<80、TDT<12mo、Hb↓ | 同 |
| 差異 | **Ca↑、ANC↑、Plt↑** | **Ca>10、LDH>1.5×ULN** |
| 因子數 | 6 | 5 |

**H. 臨床記憶法**
> 「**IMDC：一鈣、一貧、兩高血球（ANC/Plt）、體能差、診治間隔短**」；MSKCC 把兩高血球換成 **LDH**。

# Ch.15　一線系統治療（IO/TKI）★必考

**A. 一句話重點**
mRCC 治療已從 cytokine→TKI→IO→combination 演進；現行一線標準為 **IO+IO（nivolumab+ipilimumab）或 IO+TKI（pembro+axi、nivo+cabo、pembro+lenva）**，依 IMDC 風險與腫瘤生物學選擇。

**B. 必背定義（演進與一線方案）**
- **演進四時代**：
  - **Cytokine（1980s–early 2000s）**：IFN-α、IL-2（mOS ~8–13 mo，毒性高）。
  - **Targeted/TKI（2005–2013）**：sunitinib、sorafenib、pazopanib、bevacizumab+IFN；mTOR：temsirolimus、everolimus（mOS ~20–26 mo）。
  - **IO（2014–2017）**：nivolumab、pembrolizumab、atezolizumab（mOS ~25–30+ mo）。
  - **Combination（2018–present）**：IO+IO、IO+TKI（mOS ~40 mo，部分 5 年 OS 40–50%）。
- **NCCN 一線（clear cell）**：
  - **Favorable**：axi+pembro、cabo+nivo、ipi+nivo、lenva+pembro（皆 Cat 1）；其他 axi+avelumab、pazopanib、sunitinib。
  - **Poor/intermediate**：axi+pembro、cabo+nivo、ipi+nivo、lenva+pembro（Cat 1）、cabozantinib。
- **四大關鍵 phase III trial（vs sunitinib）**：
  - **CheckMate 214**：**Nivo+Ipi（IO+IO）**；int/poor risk OS 獲益；HR 0.66；首個 IO+IO 證實優於 sunitinib。
  - **KEYNOTE-426**：**Pembro+Axitinib（IO+TKI）**；全 risk OS 獲益；HR 0.73。
  - **CheckMate 9ER**：**Nivo+Cabozantinib**；HR 0.70；骨/侵襲性疾病佳。
  - **CLEAR（KEYNOTE-581）**：**Lenvatinib+Pembro**；HR 0.72；ORR 最高（~71%）但毒性高。
- **Cytokine/TKI 單藥 vs IFN**：sunitinib、pazopanib、temsirolimus 等有 PFS/OS 獲益；sorafenib vs IFN 無顯著差。

**C. 臨床判斷流程（EAU algorithm）**
```
mRCC clear cell → MDT 討論
 oligometastatic → 觀察/SBRT/metastasectomy ±pembro（<1y）；select cytoreductive nephrectomy
 sarcomatoid features → Nivo+Ipi
 否則依 IMDC：
   favorable → pembro+axi / nivo+cabo / pembro+lenva（select：nivo+ipi 或 TKI 單藥）
   intermediate/poor →
     需快速控制 → pembro+axi / nivo+cabo / pembro+lenva
     不需快速 → 醫師偏好 nivo+ipi / IO+TKI（select：TKI 單藥）
```

**D. 診斷工具**：IMDC 風險、sarcomatoid 病理、轉移負荷/部位、是否需快速控制。

**E. 治療策略**
- **IO+IO（nivo+ipi）**：int/poor、sarcomatoid、追求 durable remission。
- **IO+TKI**：需快速腫瘤縮小/高負荷/symptomatic（高 ORR）。
- non-clear cell：clinical trial（preferred）/ cabozantinib / sunitinib / everolimus+lenva 等。

**F. 考試高頻重點**
1. **一線：IO+IO（nivo/ipi）或 IO+TKI（pembro+axi、nivo+cabo、pembro+lenva）**。
2. **CheckMate 214＝nivo+ipi**（int/poor）；**KEYNOTE-426＝pembro+axi**（全 risk）。
3. **sarcomatoid → nivo+ipi**。
4. 需快速控制/高負荷 → **IO+TKI**（高 ORR，CLEAR ORR ~71%）。
5. cytokine（IFN/IL-2）已被取代。

**G. 容易混淆比較表**

| Trial | 組合 | 類型 | 特點 |
|-------|------|------|------|
| CheckMate 214 | Nivo+Ipi | IO+IO | int/poor、durable |
| KEYNOTE-426 | Pembro+Axi | IO+TKI | 全 risk |
| CheckMate 9ER | Nivo+Cabo | IO+TKI | 骨轉移 |
| CLEAR | Lenva+Pembro | IO+TKI | ORR 最高、毒性高 |

**H. 臨床記憶法**
> 「**肉瘤樣（sarcomatoid）給 Ipi/Nivo；要快縮瘤給 IO+TKI**」。

# Ch.16–17　後線治療與台灣 NHIA 路徑

**A. 一句話重點**
後線（refractory）以 cabozantinib、axitinib、lenvatinib+everolimus、tivozanib、nivolumab 等；台灣健保（2021/12 後）路徑以 cabozantinib、pazopanib/sunitinib、everolimus、nivolumab 等分線給付。

**B. 必背定義**
- **後線重要 trial**：**METEOR**（cabozantinib vs everolimus，PFS/OS 獲益，HR 0.51/0.66）、**CABOSUN**（cabozantinib vs sunitinib 一線 int/poor，PFS 獲益）、AXIS（axitinib vs sorafenib）、TIVO-3（tivozanib）、Study 205/CLEAR-后線（lenva+eve）。
- **NCCN 後線（clear cell）**：IO-naïve 或 prior-IO 後選 axitinib、cabozantinib、lenva+everolimus、tivozanib、belzutifan、nivolumab 等。
- **台灣 NHIA（2021/12/1 後）**：
  - **Clear cell**：int/poor → 1L cabozantinib → 2L everolimus → 3L nivolumab；favorable → pazopanib/sunitinib → 2L cabozantinib/axitinib → 3L nivolumab。
  - **Non-clear cell**：int/poor → cabozantinib → everolimus；favorable → sunitinib。

**C–E.** 依線數與前次治療史選藥。

**F. 考試高頻重點**
1. **METEOR：cabozantinib 後線優於 everolimus**。
2. **CABOSUN：cabozantinib 一線 int/poor**。
3. belzutifan（HIF-2α inhibitor）為新後線選項。
4. 台灣健保 1L int/poor 常用 **cabozantinib**。
5. non-clear cell 健保 int/poor 用 cabozantinib。

**H. 臨床記憶法**
> 「**Cabozantinib 後線王者（METEOR）；台灣健保 int/poor 一線就用 cabo**」。

# Ch.18　Cytoreductive Nephrectomy（CARMENA / SURTIME）★必考

**A. 一句話重點**
cytokine 年代 cytoreductive nephrectomy（CN）有 OS 獲益；但 IO/TKI 年代，**CARMENA 顯示 int/poor risk upfront CN 不再常規**，典範轉移為「先系統治療、再對選擇性病人 deferred CN」。

**B. 必背定義（關鍵 trial）**
- **CARMENA（NEJM 2018）**：upfront CN + sunitinib **vs** sunitinib 單獨（int/poor risk）→ **sunitinib 單獨不劣於甚至優於**（CN+suni 13.9 mo vs suni 18.4 mo，HR 1.19）→ **upfront CN 在 int/poor risk 不應常規**。
- **SURTIME（Eur Urol 2019）**：immediate CN+suni **vs** deferred CN（先 suni 再 CN）→ **deferred CN 有存活優勢**（OS 32.4 vs 15.0 mo，HR 0.57）。
- **進行中**：**PROBE**、**NORDIC-SUN**（IO 年代 CN 角色，OS 待結果）。
- **典範轉移（2026）**：從「**upfront surgery for all**」→「**selective, deferred, response-directed surgery**」。
- **適合 CN（systemic therapy 後考慮 deferred）**：IMDC favorable 或 select intermediate（1–2 因子）、ECOG 0–1、低轉移負荷/oligometastatic、對系統治療反應佳、原發可切除、有原發腫瘤症狀（血尿/痛/感染/mass effect）。
- **不適合 upfront CN**：IMDC poor risk、ECOG≥2、高轉移負荷/多器官、sarcomatoid/rhabdoid、快速進展/symptomatic 需緊急系統治療、不可切除原發。

**C. 臨床判斷流程（practical approach）**
```
新診斷 mRCC → 完整評估（IMDC/ECOG/負荷/原發症狀）
 需立即系統治療?（poor risk/高負荷/symptomatic/poor PS）
   YES → 先 systemic therapy（IO-based）
   NO  → systemic therapy → 3–6 個月後重評估
 → 若反應佳/低負荷/PS佳/原發可切/病人意願 → 考慮 deferred CN
 口訣：Good biology + Good performance + Good response = Deferred CN
```

**D. 診斷工具**：IMDC 風險、ECOG、轉移負荷影像、系統治療反應評估、CN feasibility 模型（Culp、REMARCC 等）。

**E. 治療策略**
- **IO 年代**：先系統治療，選擇性 deferred CN。
- oligometastatic：metastasectomy/SBRT ± CN。

**F. 考試高頻重點**
1. **CARMENA：int/poor risk upfront CN 不再常規**（sunitinib 不劣）。
2. **SURTIME：deferred CN 優於 immediate CN**。
3. 典範：**upfront for all → selective/deferred/response-directed**。
4. 適合 deferred CN：good biology + performance + response。
5. poor risk/高負荷/sarcomatoid/symptomatic → 不宜 upfront CN。

**G. 容易混淆比較表**

| Trial | 比較 | 結論 |
|-------|------|------|
| CARMENA | upfront CN+suni vs suni | suni 單獨不劣 → 不常規 upfront CN |
| SURTIME | immediate vs deferred CN | deferred 較佳 |

**H. 臨床記憶法**
> 「**CARMENA：先別急著切腎（int/poor 先吃藥）；SURTIME：要切也是延後切（deferred）**」；「**好生物學＋好體能＋好反應＝才切腎**」。

### 🎯 單選題 10 題（附答案與解析）

**Q1.** 腎囊腫 CT 顯示壁與間隔不規則增厚且有可測量強化，Bosniak 分類與處置為何？
- (A) IIF，追蹤　(B) III，手術切除　(C) II，觀察　(D) IV，化療

<details><summary>答案</summary>

**(B) Bosniak III，手術切除**。有「可測量強化」即升為 III（惡性風險 ~50%），健康者建議切除；囊性病灶避免 ablation。</details>

**Q2.** 關於 RCC 的 Stauffer syndrome，下列何者正確？
- (A) 代表肝臟轉移
- (B) 為非轉移性肝功能異常，切除腫瘤後可恢復
- (C) 屬於三聯症之一
- (D) 表示骨轉移

<details><summary>答案</summary>

**(B)**。Stauffer syndrome 是 paraneoplastic 的非轉移性肝功能異常（無肝轉移），腫瘤切除後肝指數可恢復。</details>

**Q3.** AJCC 8th，腫瘤侵入腎竇脂肪與 pelvicalyceal system 但未超出 Gerota，T 分期為？
- (A) T2b　(B) T3a　(C) T3b　(D) T4

<details><summary>答案</summary>

**(B) T3a**。T3a＝侵腎靜脈/節段分支、或 pelvicalyceal system、或 perirenal/腎竇脂肪但未超 Gerota。IVC 膈下=T3b、膈上/侵壁=T3c、超 Gerota/同側腎上腺=T4。</details>

**Q4.** Clear cell RCC 最常見的相關基因/染色體異常為？
- (A) MET / trisomy 7,17
- (B) FLCN（17p）
- (C) VHL（3p25）
- (D) SMARCB1

<details><summary>答案</summary>

**(C) VHL（3p25）**。Clear cell（70–80%）與 VHL/3p 相關，對 TKI/IO 反應好。Papillary→MET/trisomy 7,17；Chromophobe→BHD/FLCN（17p）。</details>

**Q5.** 關於 small renal mass 的治療，下列何者為 gold standard？
- (A) Radical nephrectomy
- (B) Partial nephrectomy
- (C) Cryotherapy
- (D) Active surveillance

<details><summary>答案</summary>

**(B) Partial nephrectomy**（保腎）。不適合 PN（local advanced、位置不佳、健康差）才改 RN；ablation/AS 用於高手術風險。</details>

**Q6.** 下列哪一項是 IMDC 風險因子，但**不是** MSKCC 模型的因子？
- (A) Karnofsky PS <80%
- (B) Hemoglobin < LLN
- (C) Neutrophils > ULN
- (D) 診斷到治療 <12 個月

<details><summary>答案</summary>

**(C) Neutrophils > ULN**。IMDC 用中性球與血小板（>ULN）；MSKCC 改用 LDH>1.5×ULN，不含中性球/血小板。</details>

**Q7.** 關於 adjuvant therapy in localized RCC，下列何者正確？
- (A) Sunitinib 為現行 Category 1 標準
- (B) Pembrolizumab（KEYNOTE-564）是唯一證實 DFS 與 OS 獲益者
- (C) 所有亞型皆建議 adjuvant 免疫治療
- (D) Everolimus 顯著改善 OS

<details><summary>答案</summary>

**(B)**。KEYNOTE-564 的 pembrolizumab 是唯一同時證實 DFS 與 OS 獲益的 adjuvant，用於高風險 clear cell RCC（pT2 grade4/sarcomatoid、pT3、pT4、N1、M1 NED），NCCN Category 1。其他 TKI/mTOR trial 多為陰性。</details>

**Q8.** 轉移性 ccRCC 合併 sarcomatoid features，NCCN/EAU 偏好的一線治療為？
- (A) Sunitinib 單藥
- (B) Nivolumab + Ipilimumab
- (C) Pazopanib
- (D) Everolimus

<details><summary>答案</summary>

**(B) Nivolumab + Ipilimumab（IO+IO）**。Sarcomatoid features 對 IO+IO 反應特別好（CheckMate 214）。</details>

**Q9.** CARMENA trial 的主要結論為？
- (A) Upfront cytoreductive nephrectomy + sunitinib 優於 sunitinib 單獨
- (B) 在 int/poor risk，sunitinib 單獨不劣於 upfront CN + sunitinib
- (C) Deferred CN 無存活優勢
- (D) 所有 mRCC 都應接受 upfront CN

<details><summary>答案</summary>

**(B)**。CARMENA（NEJM 2018）顯示 int/poor risk mRCC，sunitinib 單獨不劣於 upfront CN + sunitinib，故 upfront CN 不再常規；SURTIME 進一步顯示 deferred CN 較佳。</details>

**Q10.** Renal mass biopsy 的適應症，下列何者**不適合**做切片？
- (A) 疑似 lymphoma
- (B) ablative therapy 前
- (C) 浸潤性病灶疑 urothelial carcinoma
- (D) 疑似轉移性腫瘤

<details><summary>答案</summary>

**(C)**。浸潤性病灶疑 UC 不做 RMB（應走 UC 路徑：尿細胞學/輸尿管鏡等）。RMB 適應症為 lymphoma、ablation 前、疑轉移。</details>

### 🗣️ 口試題 5 題（標準答案）

**口試 Q1：請說明 Bosniak 囊腫分類及各級處置原則。**

標準答案：Bosniak 依 CT 的強化、間隔、鈣化與壁厚將腎囊腫分為五級。**第 I 級**為單純水樣囊腫、薄壁無間隔鈣化強化，惡性風險為零，不需追蹤；**第 II 級**有少數髮絲狀間隔或細鈣化、無明確強化，惡性風險極低，不需追蹤；**IIF 級**有多條薄間隔、壁輕微增厚或厚/結節狀鈣化但無強化，惡性風險約 3–10%，需週期性追蹤；**第 III 級**為不確定的壁/間隔增厚且有可測量強化，惡性風險約 50%，建議手術切除；**第 IV 級**有明顯強化的軟組織成分，惡性風險 75–90%，須手術切除。關鍵是「明確強化」為升級依據，且囊性病灶應避免 thermal ablation 以免 tumor spillage。

**口試 Q2：請說明 RCC 三大常見病理亞型的基因與臨床特徵。**

標準答案：最常見的是 **clear cell RCC（70–80%）**，與 **VHL 基因（3p25）**突變或甲基化、3p 缺失相關，源自近端腎小管，影像為 hypervascular，行為較惡，但對 TKI 與免疫治療反應好。其次為 **papillary RCC（5–10%）**，與 **MET proto-oncogene、第 7、17 對染色體三體**相關，源自近端腎小管，影像 hypovascular，預後較好且常多中心、常見於後天性囊腎病。第三為 **chromophobe RCC（3–5%）**，與 **Birt-Hogg-Dubé 症候群、FLCN 基因（17p）**相關，源自集尿管嵌入細胞，病理可見 plant cells、核周 halo、raisinoid 核，IHC 瀰漫 CK7，預後相對好，但 sarcomatoid variant 預後差。

**口試 Q3：請說明 AJCC 8th 版 RCC 的 T 分期。**

標準答案：T 分期依大小與局部侵犯。限於腎臟者：**T1a <4 cm、T1b >4 至 <7 cm、T2a >7 至 <10 cm、T2b >10 cm**。局部侵犯：**T3a** 侵入腎靜脈或其節段分支、或侵入 pelvicalyceal system、或侵入腎周/腎竇脂肪但未超出 Gerota 筋膜；**T3b** 延伸入橫膈以下的下腔靜脈；**T3c** 延伸入橫膈以上的下腔靜脈或侵犯下腔靜脈壁；**T4** 超出 Gerota 筋膜，包含連續侵犯同側腎上腺。其中 8th 版將 pelvicalyceal system 侵犯歸入 T3a 為重要更新。

**口試 Q4：高風險 localized clear cell RCC 術後是否需要輔助治療？根據為何？**

標準答案：需要與病人討論 **adjuvant pembrolizumab**。根據 **KEYNOTE-564** 第三期隨機雙盲試驗，clear cell RCC 於腎切後 12 週內、無前線治療的高風險族群（**pT2 grade 4 或 sarcomatoid、pT3、pT4、N1，以及 M1 NED**）給予 pembrolizumab 200 mg 每三週一次、為期約一年，**同時改善了 disease-free survival（HR 約 0.71）與 overall survival（HR 約 0.62–0.66）**，是目前唯一證實 DFS 與 OS 雙重獲益的輔助治療，列為 NCCN Category 1。其他 TKI 或 mTOR 抑制劑的輔助試驗（ASSURE、PROTECT、ATLAS 等）多為陰性。治療須監測免疫相關不良反應如甲狀腺低下、腸炎、肝炎、肺炎與免疫腎炎。

**口試 Q5：轉移性 RCC 的 cytoreductive nephrectomy 角色如何演變？**

標準答案：在 **cytokine（IFN）年代**，cytoreductive nephrectomy（CN）合併干擾素曾證實改善 overall survival，是標準做法。但進入 **TKI 與免疫治療年代後典範轉移**：**CARMENA trial（NEJM 2018）**顯示在 IMDC 中/高風險的轉移性 RCC，sunitinib 單獨不劣於（甚至優於）upfront CN 加 sunitinib，因此 upfront CN 不再常規；**SURTIME trial** 進一步顯示先給系統治療再做 deferred CN 較 immediate CN 有存活優勢。因此現行策略從「**upfront surgery for all**」轉為「**selective, deferred, response-directed surgery**」——先以免疫為基礎的系統治療，於 IMDC favorable 或選擇性 intermediate、體能好（ECOG 0–1）、低轉移負荷、對治療反應佳、原發可切除或有原發症狀的病人，才考慮延後性 CN。原則是「好生物學＋好體能＋好反應」才切腎；poor risk、高負荷、sarcomatoid、快速進展者則不宜 upfront CN。PROBE 與 NORDIC-SUN 試驗將進一步釐清免疫年代 CN 的角色。

### 🏆 Top 20 優先必背重點

1. **Bosniak III/IV 須手術**（III ~50%、IV 75–90% 惡性）；IIF 追蹤；囊性病灶**避免 ablation**。
2. **RCC 多無症狀**（incidental 最常見）；**三聯（血尿/腰痛/腫塊）僅 6–10%**（晚期）。
3. **Paraneoplastic 20–30%**；**Stauffer syndrome＝非轉移性肝功能異常**（切瘤後可逆）。
4. **不可回縮/右側 varicocele → 疑腎靜脈/IVC 侵犯**。
5. **對比 CT 為分期主力**；bone scan 只在骨痛/ALP↑；brain image 只在症狀；PET 少用。
6. **RMB 適應症：lymphoma、ablation 前、疑轉移**；**浸潤疑 UC 不做**；grade 準確度差。
7. **Clear cell 70–80%、VHL/3p25、最惡、IO/TKI 反應好**。
8. **Papillary 5–10%、MET/trisomy 7,17、預後好、多中心**。
9. **Chromophobe 3–5%、BHD/FLCN、瀰漫 CK7、預後相對好**。
10. **TNM：T1a<4、T1b 4–7、T2a 7–10、T2b>10**。
11. **T3a＝腎靜脈/腎竇脂肪/pelvicalyceal；T3b＝IVC 膈下；T3c＝IVC 膈上或侵壁；T4＝超 Gerota/同側腎上腺**。
12. **PN 為 small renal mass 的 gold standard**（保腎）；不適合→RN。
13. **R.E.N.A.L score**：Radius/Exophytic/Nearness/A-P/Location；4–6 低、7–9 中、10–12 高；**h＝腎門**。
14. **SSIGN＝Stage-Size-Grade-Necrosis**；**UISS＝TNM+Fuhrman grade+ECOG**。
15. **Adjuvant pembrolizumab（KEYNOTE-564）：唯一 DFS+OS 獲益、高風險 ccRCC、200 mg Q3W×1 年、Cat 1**。
16. **IMDC 6 因子**：KPS<80、TDT<12mo、Hb↓、Ca↑、ANC↑、Plt↑；0/1-2/3-6＝fav/int/poor（mOS 43/23/8 mo）。
17. **MSKCC** 以 **LDH>1.5×ULN** 取代中性球/血小板。
18. **一線：IO+IO（nivo+ipi，CheckMate 214）或 IO+TKI（pembro+axi 等，KEYNOTE-426）**；**sarcomatoid→nivo+ipi**；**需快縮瘤→IO+TKI**。
19. **CARMENA：int/poor upfront CN 不再常規（sunitinib 不劣）；SURTIME：deferred CN 較佳**。
20. **CN 典範：upfront for all → selective/deferred/response-directed**；「好生物學＋好體能＋好反應」才切腎。

> 本檔對應教科書 Campbell Ch.95–100（病因/流病、急性處置、輸尿管結石手術、上泌尿道結石手術、結石預防、下泌尿道結石）並整合 **EAU 2024–2026、AUA、UAA（Int J Urol 2019）** 結石指引。核心三大主軸為：**① 結石形成與成分（supersaturation、Randall plaque、HU 判讀）、② 急性處置與手術決策（MET、緊急引流適應症、依大小/位置選 SWL／URS／PCNL／RIRS／ECIRS）、③ 代謝評估與依結石種類之預防（24 小時尿液、低/高風險分流、calcium／uric acid／cystine／infection stone 治療演算法）**。

### 整體判斷（最可能上榜的內容）

這份是「教科書結石章節 ＋ EAU/AUA/UAA 最新演算法」的完整講義，**口試/筆試命中率最高的五大塊**：

1. **急性處置的緊急引流（urgent decompression）適應症**：阻塞合併感染（infected obstructed system）、雙側阻塞、單一/移植腎阻塞、免疫抑制、難治疼痛/嘔吐、impending renal deterioration → 立即 D-J stent 或 nephrostomy。**幾乎必考**。
2. **MET（medical expulsive therapy）**：用於遠端輸尿管 <10 mm，藥物 α-blocker（**tamsulosin／silodosin**）；4~6 週給通過機會，>6 mm 約 99% 需介入。
3. **依大小/位置選手術**：輸尿管近端 vs 遠端、>10 vs <10 mm；腎結石 <10／10–20／>20 mm、lower pole 與不利 SWL 因子（steep infundibulopelvic angle、long lower-pole calyx、narrow infundibulum）。
4. **代謝評估分流**：低風險 → 一般預防；高風險 → 完整代謝檢查（24 小時尿液）；workup 時機（stone-free ≥20 天後）。
5. **各類結石的治療演算法**：CaOx → thiazide／potassium citrate；Ca-phosphate → 找 **RTA type 1／HPT**；uric acid → **鹼化尿液（urine pH 6.2–6.8）＋allopurinol**；cystine → 大量水分＋鹼化(pH 7.5–8.0)＋tiopronin；infection → urease 菌、抗生素＋完全清石＋acetohydroxamic acid。

筆試另偏好：**結石成分占比（CaOx 60%、hydroxyapatite 20%、uric acid 7%、struvite 7%、cystine 1–3%）**、**HU 判讀**（uric acid 低 HU、cystine 中、calcium 高）、radiolucent 結石（uric acid、xanthine、2,8-DHA、純 matrix）、NCCT 為 gold standard、Randall plaque 成分為 **calcium apatite**。

## 📚 Section 2：各章節 A–H 格式筆記

---

# Ch.1　流行病學與危險因子（Epidemiology）

**A. 一句話重點**
泌尿道結石為常見且高復發疾病，台灣整體盛行率約 9.6%，男性明顯高於女性，好發 40–60 歲。

**B. 必背數字**
- 全球腎結石盛行率：**1%~15%**；台灣整體 **9.6%（男 12.2%、女 3.1%）**。
- 性別：**男：女 ≈ 2~3:1**。
- 種族：**Whites > Hispanics > Asians > African-Americans**。
- 年齡：高峰於 **第 4~6 個十年（40–60 歲）**。
- 危險因子：**肥胖、糖尿病、metabolic syndrome（女>男）**、心血管疾病、CKD。

**C. 考試高頻重點**
1. 台灣盛行率 **9.6%**、男女比 **2~3:1**。
2. 好發 **40–60 歲**。
3. 代謝症候群與肥胖增加結石風險。

**D. 容易混淆**：盛行率（prevalence）vs 復發率（recurrence，5 年約 50%、10 年高達 ~75%）。

---

# Ch.2　結石成分與 HU／X-ray 判讀（★必考）

**A. 一句話重點**
含鈣結石（CaOx 為主）約佔七成，結石成分決定影像表現（X-ray 可透性與 CT HU 值）與治療策略。

**B. 必背定義（Table 95.1 結石成分與佔比）**

| 結石成分 | 佔比 (%) | 分類 |
|---------|:--------:|------|
| **Calcium oxalate（CaOx）** | **60** | 含鈣 |
| Hydroxyapatite（calcium phosphate） | 20 | 含鈣 |
| Brushite | 2 | 含鈣 |
| **Uric acid** | **7** | 非鈣 |
| **Struvite（感染石）** | **7** | 非鈣 |
| **Cystine** | **1–3** | 非鈣 |
| Triamterene／Silica／2,8-DHA | <1 | 非鈣 |

**C. 結石依病因分類**
- **非感染石**：calcium oxalate、calcium phosphate、uric acid、ammonium urate。
- **感染石**：magnesium ammonium phosphate（struvite）、carbonate apatite、ammonium urate。
- **遺傳性**：cystine、xanthine、2,8-dihydroxyadenine。
- **藥物石（drug stone）**：triamterene 等。

**D. X-ray 可透性（radiopacity）**

| Radiopaque（不透 X 光） | Poor radiopacity（弱） | Radiolucent（透 X 光） |
|------|------|------|
| Calcium oxalate（di-／mono-hydrate）、calcium phosphate | Magnesium ammonium phosphate、cystine | **Uric acid、ammonium urate、xanthine、2,8-DHA、drug stone** |

**E. CT Hounsfield unit（HU）判讀**
```
CT HU 由低 → 高（協助推測結石成分）
  Uric acid（最低 HU，~200–400）
  Struvite / cystine（中等 HU）
  Calcium oxalate / calcium phosphate（最高 HU，可 >1000）
※ HU<1000 且 skin-to-stone distance <10 cm → SWL 成功率較高
```

**F. 考試高頻重點**
1. **CaOx 佔 60%**、最常見。
2. **Radiolucent 結石記憶：uric acid、xanthine、2,8-DHA、（純 matrix）** → 普通 KUB 看不到，需超音波/CT。
3. **HU 低 → uric acid**（可口服溶石）；**HU 高 → calcium**。
4. SWL 抗性結石：**calcium oxalate monohydrate、brushite、cystine**（HU 高、硬）。

**G. 容易混淆**：struvite 是「弱 radiopaque」非完全透光；uric acid 在 X 光透光但 CT 仍可見（HU 低）。

---

# Ch.3　結石形成機轉（Stone Formation）

**A. 一句話重點**
結石形成第一步是 **supersaturation（過飽和）**，CaOx 結石常源自腎乳頭的 **Randall plaque（成分為 calcium apatite）**。

**B. 必背機轉**
1. **The first step：Supersaturation** — 尿中成石物質濃度超過溶解度。
2. 結晶 nucleation → growth → aggregation → retention。
3. **Randall plaque**：起於腎乳頭間質的鈣磷沉積（**crystal component = calcium apatite**），plaque 露出尿路上皮後成為 CaOx 結石的附著錨點。
4. 三種形成假說：自由顆粒（free-particle）、附著生長（fixed particle on plaque）、Randall plaque 模式。

**C. 形成路徑流程**
```
尿液過飽和 (Supersaturation)
  → 結晶成核 nucleation
  → 結晶生長 / 聚集 growth & aggregation
  → 結晶滯留 retention（需附著錨點）
        ├ Randall plaque（apatite，於腎乳頭間質）→ CaOx 結石
        └ 集尿管栓子（Randall plug）→ 其他結石
```

**D. 考試高頻重點**
1. 第一步＝**supersaturation**。
2. Randall plaque 成分＝**calcium apatite（calcium phosphate）**。
3. 抑制因子：**citrate、magnesium**（降低結石風險）。

# Ch.4　礦物質代謝與高草酸尿（Mineral Metabolism）

**A. 一句話重點**
鈣磷代謝（Ca-VitD-PTH 軸）與草酸代謝異常是含鈣結石的核心機轉；高草酸尿分為原發性與腸源性。

**B. 必背概念**
- **Ca–vitamin D–1,25(OH)₂D₃–PTH** 軸調控鈣磷恆定，需先理解此軸才能讀懂代謝表格。
- 相關離子：**P（磷）、Mg（鎂）、oxalate（草酸）**。

**C. 高草酸尿（hyperoxaluria）兩大類**
| 類型 | 機轉 | 特點 |
|------|------|------|
| **Primary hyperoxaluria** | 肝臟酵素缺陷（AGT 等）導致內生性草酸過量 | 遺傳、兒童/年輕、可致全身 oxalosis、ESRD |
| **Enteric hyperoxaluria** | 脂肪吸收不良（短腸/腸切除/吸收不良）→ 游離鈣被脂肪結合 → 腸道草酸吸收↑ | 後天、IBD/bariatric surgery 後 |

**D. 代謝缺陷分類（Table 95.2 重點）**
- **Absorptive hypercalciuria**：腸道鈣吸收↑。
- **Renal hypercalciuria**：腎小管漏鈣（renal leak）。
- **Resorptive hypercalciuria**：原發性副甲狀腺亢進（**HPT**）骨吸收↑。

**E. 考試高頻重點**
1. **Mineral metabolism 表格務必先讀懂 Ca-VitD-PTH 軸**（顏醫師強調！）。
2. Enteric hyperoxaluria 見於 **短腸症/減重手術後**。
3. 高 oxalate、低 citrate、低 magnesium → 促結石。

# Ch.5　急性處置 Acute Care（★最高頻）

**A. 一句話重點**
急性腎絞痛以 **NCCT 為黃金診斷、NSAID 為第一線止痛**；遠端小結石給 MET，符合緊急引流適應症者須立即減壓。

**B. 必背臨床表現與診斷**
- 噁心/嘔吐約 **50%**，血尿（顯微或肉眼）約 **90%**。
- 尿液 **>50 WBC/HPF** 與陽性尿培養相關（警覺感染）。
- **NCCT（non-contrast CT）= gold standard**。

**C. 止痛用藥**
- **First-line：NSAIDs**。
- Second-line：靜脈 acetaminophen。
- 其他：dexamethasone（8 mg）、opioid。

**D. 急性處置決策流程（Acute care algorithm）**
```
急性輸尿管結石
├─ 遠端輸尿管 <10 mm → MET（α-blocker：tamsulosin / silodosin）
│      ├ 結石排出（stone passage）→ 完成
│      └ 4~6 週未排出 → 建議介入
│           （4–6 mm 約 50% 需介入；>6 mm 約 99% 需介入）
│
└─ 符合「緊急介入 Urgency intervention」適應症 → 立即減壓
       • 阻塞合併泌尿道感染（infected, obstructed system）★
       • 雙側阻塞
       • 解剖或功能上單一腎之阻塞
       • 免疫抑制
       • impending renal deterioration（腎功能即將惡化）
       • 止痛無效之難治疼痛
       • 難治性噁心/嘔吐
   → 處置：Nephrostomy 或 D-J stent；
          近端輸尿管石可 ESWL；URS laser lithotripsy
```

**E. 特殊族群考量（Special consideration）**
- **懷孕（Pregnancy）**、虛弱/年長（Frailty & elderly）、**移植腎（Transplant kidney）** → 處置需個別化（孕婦優先超音波、避免輻射；急需減壓多用 D-J stent 或 nephrostomy）。

**F. 考試高頻重點**
1. **血尿 90%、嘔吐 50%、NCCT gold standard**。
2. 止痛 **第一線 NSAID**。
3. **MET：遠端 <10 mm、tamsulosin/silodosin、觀察 4~6 週**。
4. **緊急減壓適應症（感染＋阻塞最重要）→ D-J stent 或 PCN**，先引流再清石。

**G. 容易混淆**：感染合併阻塞時**禁止**一次清石（避免菌血症/敗血症）→ 先引流（PCN/stent）、抗生素穩定後再處理結石。

# Ch.6　輸尿管結石手術演算法（★必考）

**A. 一句話重點**
輸尿管結石（需移除時）依「位置（近端/遠端）」與「大小（>10 vs <10 mm）」決定 URS 或 SWL。

**B. 治療演算法（EAU / UAA, Figure 3.1）**
```
輸尿管結石（已決定須移除）
├ 近端輸尿管 Proximal ureteral stone
│    ├ >10 mm → ① URS（順行或逆行）  ② SWL
│    └ <10 mm → SWL 或 URS
│
└ 遠端輸尿管 Distal ureteral stone
     ├ >10 mm → ① URS  ② SWL
     └ <10 mm → SWL 或 URS（亦可先試 MET）
```

**C. 考試高頻重點**
1. 輸尿管石 >10 mm → **URS 為優先**；<10 mm → SWL 或 URS 皆可。
2. 近端 >10 mm 也可選 SWL；遠端 URS 成功率高。
3. 顆粒愈大、愈近端 → URS 取石率優於 SWL。

**D. 容易混淆**：MET 屬「保守」適用遠端 <10 mm；一旦決定主動移除即進入上述手術演算法。

---

# Ch.7　腎／上泌尿道結石手術演算法（★必考）

**A. 一句話重點**
腎結石依大小（<10／10–20／>20 mm）與是否 lower pole、SWL 不利因子決定 SWL／RIRS（軟式輸尿管鏡）／PCNL。

**B. 治療演算法（EAU, Figure 3.2）**
```
腎結石 Kidney stone（lower pole 10–20 mm 除外）
├ >20 mm     → ① PCNL          ② RIRS 或 SWL
├ 10–20 mm   → SWL 或 endourology（RIRS/PCNL）
└ <10 mm     → ① SWL 或 RIRS    ② PCNL

Lower pole stone（下盞結石；>20 與 <10 mm 同上）
└ 10–20 mm → 評估「SWL 不利因子」
       ├ 無不利因子 → SWL 或 endourology
       └ 有不利因子 → ① endourology（RIRS/PCNL）  ② SWL
```

**C. SWL 較不易成功（unfavorable）的因子**
```
Factors that make SWL less likely：
  • Shockwave-resistant 結石（CaOx monohydrate、brushite、cystine）
  • Steep infundibular-pelvic angle（陡峭漏斗-腎盂角）
  • Long lower-pole calyx（>10 mm）
  • Narrow infundibulum（<5 mm）
```

**D. AUA「腎結石」第一線治療演算法（補充）**
```
腎結石第一線治療（AUA）
├ <1 cm
│   ├ Non-lower pole → SWL、URS
│   └ Lower pole     → SWL、URS、PCNL（可考慮 mPCNL）
├ 1–2 cm
│   ├ Non-lower pole ─ favorable SWL → SWL、URS、PCNL
│   │               └ non-favorable → URS、PCNL
│   └ Lower pole     → URS、PCNL（考慮 mPCNL）
└ >2 cm → PCNL（2–3 cm 可考慮 mPCNL）
```

**E. 手術技術演進與 ECIRS**
```
URS → Flex URS ┐
PCNL → mPCNL → Supine/Prone ┤→ 合併 → Bidirectional bilateral approach / ECIRS
Flex nephroscope ┘
```
- **ECIRS（Endoscopic Combined Intrarenal Surgery）**＝同時逆行軟鏡＋順行 PCNL（多採 supine 體位）。
- UAA 指引 ECIRS 適應症：大型/複雜結石、大腎石合併輸尿管石或狹窄、憩室結石、impacted UPJ 結石合併完全阻塞等。

**F. 考試高頻重點**
1. **>20 mm 腎石首選 PCNL**；<10 mm 首選 SWL/RIRS。
2. **Lower pole 10–20 mm** 要評估 SWL 不利因子。
3. SWL 抗性結石：**CaOx monohydrate、brushite、cystine**。
4. **ECIRS = supine 體位、順行＋逆行合併**。

**G. 容易混淆**：RIRS（retrograde intrarenal surgery，軟式輸尿管鏡雷射）vs PCNL（經皮腎造瘻碎石）；大結石 PCNL 清石率高，小結石 RIRS/SWL 創傷小。

# Ch.8　代謝評估與時機（Metabolic Evaluation）

**A. 一句話重點**
所有結石病人先做基本評估與風險分流：**低風險 → 一般預防；高風險 → 完整代謝檢查（24 小時尿液）**。

**B. 風險分流（EAU, Figure 4.1）**
```
STONE（結石病人）
   → 基本評估（病史、血液、尿液、結石分析、影像）
   → 風險因子評估
        ├ 無 → Low-risk stone former → 一般預防措施
        └ 有 → High-risk stone former → 專一代謝評估（24 小時尿液）
```

**C. 高風險（high-risk stone former）常見族群**
- 兒童/青少年早發、家族史、復發、雙側、單一腎。
- 與結石相關疾病：**HPT、metabolic syndrome、腸道疾病（Crohn's/吸收不良/減重手術後）、RTA、痛風、cystinuria、primary hyperoxaluria、髓質海綿腎、結節病、慢性感染**。
- 解剖異常：馬蹄腎、UPJO、憩室、髓質海綿腎等。

**D. New stone former 篩檢（BOX 99.1）**
```
病史 history：GI 疾病、痛風、復發 UTI、骨密度疾病、家族史；用藥(鈣/VitC/VitD/acetazolamide/類固醇)
血液 blood：Na、K、creatinine、calcium、uric acid
尿液 urine：urine pH、crystalluria；疑感染做培養
結石分析 stone analysis：辨識 cystine／struvite／uric acid 等預示性結石
影像 radiography：評估基礎結石量
        ↓
   高風險 → metabolic evaluation；低風險 → general prevention
```

**E. 代謝檢查時機（timing for metabolic workup）**
- **初次**：stone-free 後 **至少 20 天**（正常飲食、日常狀態下）。
- **藥物預防中追蹤**：**8–12 週**。
- **穩定後**：**每 12 個月**。
- 完整檢查需 **2 次 24 小時尿液**（含 pH、volume、Ca、oxalate、citrate、uric acid、Na、Mg、cystine 等）。

**F. 考試高頻重點**
1. **低/高風險分流**是預防策略的核心。
2. 高風險才做完整代謝檢查（24h 尿液）。
3. **Workup 時機：stone-free 後 ≥20 天**，避免急性期影響。

# Ch.9　各類結石診療演算法（★必考）

**A. 一句話重點**
不同成分結石有專一的診斷與治療演算法；務必記住各類別的「關鍵尿液異常」與「核心藥物」。

**B. 鈣結石（calcium stone）診療演算法（Figure 4.5）**
```
結石episode（已緩解）
 └ 曾有 episode？
      ├ 否 → Low risk：保守（尿量↑至 >2 L/day、↓鈉、↓肉類攝取）
      └ 是 → High risk：血液 + 24 小時尿液檢查
             ├ Uncomplicated calcium stone（normocalcemia、無腸病、無 UTI）
             │     ├ Normocalciuria → potassium citrate
             │     └ Hypercalciuria → thiazide（依 urine citrate 加 potassium citrate）
             └ Other stone disease
                   ├ Hypercalcemia → 查 hyperparathyroid（HPT）
                   ├ Uric acid stone → potassium citrate（復發加 allopurinol）
                   ├ Hyperuricemia（gout）→ allopurinol
                   ├ Cystinuria → 水分、tiopronin（Thiola）
                   └ Infection stone → 抗生素（嚴重 acetohydroxamic acid）
```

**C. 磷酸鈣結石（calcium phosphate）演算法（Figure 4.4）**
```
Calcium phosphate stones
├ Carbonate apatite stones → basic evaluation
│     ├ Hypercalciuria → hydrochlorothiazide（25→50 mg/d）
│     ├ Urine pH >6.5–6.8 → 排除 RTA/UTI；可 acetazolamide/topiramate/zonisamide；
│     │                     鹼太高考慮 L-methionine 調 pH 5.8–6.2
│     └ Elevated calcium → 排除 HPT
└ Brushite stones → basic evaluation
      ├ 排除 HPT、排除 RTA
      └ Hypercalciuria >8 mmol/d → hydrochlorothiazide/chlorthalidone/indapamide
※ Type 1（distal）RTA 三特徵：hypercalciuria、hypocitraturia、↑urine pH（鹼）；亦想 HPT
```

**D. 尿酸/尿酸銨結石（uric acid）演算法（Figure 4.7）**
```
Uric acid / urate-containing stones
├ Uric acid stone → basic evaluation
│     ├ "Uric acid arrest"（urine pH <6）→ 鹼化（alkaline citrate 3–10 g/d 或 NaHCO₃）；
│     │        劑量依目標 pH：預防 pH 6.2–6.8、溶石 chemolitholysis pH 6.5–7.2
│     └ Hyperuricosuria → allopurinol（依排泄量 100–300 mg/d）
└ Ammonium urate stones（urine pH >6.5）
      ├ UTI → 抗生素
      └ L-methionine 200–500 mg tid（目標 urine pH 5.8–6.2）+ 矯正誘因
```
- 重點：**尿酸結石 radiolucent、可純藥物溶石（鹼化尿液）**，是少數能口服溶解的結石。

**E. 胱胺酸結石（cystine）演算法（Figure 4.x）**
```
Cystine stones → basic evaluation
 └ 大量水分（成人 >3.5 L/d；兒童 1.5 L/m²）+ 鹼化尿液 pH 7.5–8.0（alkaline citrate / NaHCO₃）
      ├ Cystine 排泄 <3 mmol/d → 視復發加 tiopronin
      └ Cystine 排泄 >3 mmol/d → 加 tiopronin 250 mg/d（最高 2000 mg/d）
```

**F. 考試高頻重點**
1. **CaOx 高鈣尿 → thiazide**；低 citrate → potassium citrate。
2. **Ca-phosphate → 找 RTA type 1（高鈣尿、低 citrate、尿鹼）與 HPT**。
3. **Uric acid → 鹼化尿液（pH 6.2–6.8）＋allopurinol**，可口服溶石。
4. **Cystine → 大量水分＋鹼化 pH 7.5–8.0＋tiopronin**。

# Ch.10　感染結石（Struvite / Infection Stone）

**A. 一句話重點**
感染結石由 **產 urease 細菌**造成，成分為 struvite（magnesium ammonium phosphate）±carbonate apatite±ammonium urate，常形成鹿角結石。

**B. 必背重點**
- 成分：**struvite（鳥糞石）、carbonate apatite、ammonium urate**。
- 機轉：**urease 菌**（Proteus、Klebsiella、Pseudomonas、Staphylococcus 等）分解尿素 → 鹼性尿（**urine pH 高**）→ 磷酸銨鎂沉澱。
- 常見表現：**staghorn（鹿角）結石**、反覆 UTI。
- 治療原則：**完全清除結石（PCNL 為主）＋針對性抗生素**；嚴重/無法清石者用 **acetohydroxamic acid（urease inhibitor）**。

**C. 考試高頻重點**
1. Struvite ＝ 感染石 ＝ **urease 菌 ＝ 鹼性尿**。
2. 治療關鍵：**完全清石**（殘留 → 復發/持續感染）。
3. Acetohydroxamic acid 用於嚴重病例（副作用多）。

---

# Ch.11　下泌尿道結石（Lower Urinary Tract Calculi）

**A. 一句話重點**
膀胱結石分原發與繼發；原發多見於兒童男性，成人多繼發於 BOO（攝護腺肥大）或異物/留置導管。

**B. 必背重點**
- **膀胱結石（bladder calculi）**：原發性 **男 > 女**，年齡 **<10 歲（高峰 2–4 歲）**。
- 治療：藥物、**ESWL、經尿道碎石（transurethral lithotripsy）、suprapubic cystolithotomy/cystolithotripsy、open surgery**。
- 特殊情境：**neurogenic bladder、膀胱擴大成形術（augmentation）、尿路改流（urinary diversion）** 易生結石。

**C. 考試高頻重點**
1. 原發膀胱結石 → **兒童男性**。
2. 成人膀胱結石 → 想 **BOO / 留置導管 / 異物**。
3. Neurogenic bladder、augmentation 為高風險情境。

# Ch.12　預防、追蹤與指引更新（Prevention & Updates）

**A. 一句話重點**
所有結石病人皆給「一般預防」，高風險再加「結石專一預防」；治療後依風險與殘餘碎片決定追蹤影像頻率。

**B. 一般預防措施（general prevention）**
- **尿量 2.5–3 L/day**（最重要）、均衡飲食。
- **限鈉、限動物蛋白**、維持正常鈣攝取（不可過度限鈣）。
- 多蔬果、增加 citrate；肥胖者減重。

**C. 治療後追蹤演算法（Figure, follow-up）**
```
治療後追蹤
├ Stone-free 病人
│    ├ 一般族群 → imaging 為主，逐步間隔拉長
│    └ 高風險 → imaging + 代謝 + 治療監測（持續長期）
└ 殘餘碎片
     ├ ≤4 mm（dust）→ 追蹤 4 年或介入
     └ >4 mm → 安排再介入（re-intervention）
※ 高風險者建議追蹤至少 4 年，部分至 10 年（高復發風險）
```

**D. 基因檢測（genetic testing，新版指引）**
- 對象：**兒童、≤25 歲成人，以及 >25 歲但臨床懷疑遺傳/代謝疾病者**。
- 觸發條件：**反覆（≥2 次）、雙側、強烈家族史**。
- 應與其他代謝檢查（血液＋24 小時尿液）合併進行。

**E. 指引更新趨勢（Part 2/3）**
- 近年（2022–2026）EAU/AUA/UAA 指引多為「小幅修訂」，新增/變動處（如 ECIRS 適應症、基因檢測、追蹤年限）為命題熱點。

**F. 考試高頻重點**
1. **一般預防核心：尿量 2.5–3 L/day、限鈉限動物蛋白、正常鈣攝取**。
2. **過度限鈣反而增加草酸吸收 → 不可低鈣飲食**。
3. 高風險/殘石者需長期影像追蹤。
4. 基因檢測對象：兒童、≤25 歲、反覆/雙側/家族史。

### 🎯 整體判斷（最可能考什麼）

本講義是**「篩檢—診斷—早期/局部處置」導向**，最高頻考點集中在四大塊：

1. **PSA 篩檢與 PSA 解讀**：起始年齡（一般 50／高風險 45／BRCA2 40）、baseline PSA<1 的意義、ERSPC mortality reduction 21–29%、PSA-D cut-off 0.15、各種使 PSA 上升/下降的干擾因子（UTI、retention、biopsy、5-ARI 降 50%）。
2. **影像 PI-RADS 與 PSMA-PET**：PI-RADS 1–5 的 csPCa 偵測率（6/20/55/83%）、MRI 為 csPCa 偵測標準、PSMA-PET 用於高風險分期與 negative MRI but rising PSA。
3. **基因檢測**：BRCA2 早發/惡性、germline vs somatic、HRR panel、MSI-H/dMMR→Lynch/pembrolizumab、PARPi synthetic lethality。
4. **期待性管理**：AS vs WW vs AM 三者區分（意圖、追蹤、適應症）、ProtecT 15 年（CSS 都 >96%、AM 轉移較高）、SPCG-4 vs PIVOT、PRIAS/favourable intermediate-risk 納入條件。

其次常考：切片途徑（TP 優於 TR，感染少）、PHI 台灣健保適應症四條件、5-ARI 降風險 25%、castration level（<20 ng/dL 為佳）、LHRH agonist 有 flare／antagonist 無 flare。

### Ch.1 流行病學 Epidemiology

**A. 一句話重點**
攝護腺癌是全球 >50% 國家男性最常見癌症、25% 國家男性癌症死因首位；發生率有強烈地理/種族差異，台灣發生率持續上升（2006 年 23 → 2021 年 >35 /10萬）。

**B. 必背定義與數字**
- 2020 全球：**1.4 million 新診斷、375,000 死亡**。
- 盛行率隨年齡上升：**<30 歲 5%；>79 歲 59%**（屍檢/組織學盛行率）。
- 發生率（/10萬男性）：高—Australia/NZ 111、N. America 97.2、W. Europe 94.9、N. Europe 85；低但上升—E. Asia 10.5、S-C. Asia 4.5。
- 死亡率（/10萬）：最高 Caribbean 29、Sub-Saharan Africa 14–19；最低 S-C. Asia 2.9；西方多在下降。
- 影響因素：PSA 檢測普及度、各國篩檢指引、年齡/種族/飲食。

**C. 臨床判斷流程**
```
地理/種族 + 年齡 → 評估基礎風險
西方高發生率 ← PSA 普及（過度偵測）
台灣上升 ← 飲食西化 + PSA 普及
```

**D. 診斷工具與適應症**
（本章為背景流病，無診斷工具）

**E. 治療策略**
（無）

**F. 考試高頻重點**
1. >50% 國家男性最常見癌、25% 國家死因首位。
2. <30 歲屍檢盛行率 5%、>79 歲 59%（潛伏癌很常見）。
3. 台灣發生率上升：23（2006）→ >35（2021）。
4. 最高發生率 Australia/NZ；最低 S-C. Asia。
5. 死亡率最高 Caribbean / Sub-Saharan Africa（非洲裔）。

**G. 容易混淆比較表**

|---|---|---|
| 地區 | Australia/NZ、北美、西歐 | Caribbean、Sub-Saharan Africa |
| 原因 | PSA 普及→過度偵測 | 晚期診斷、非洲裔惡性度高 |

**H. 臨床記憶法**
「**發生看西方（PSA 多），死亡看非洲（診斷晚）**」；潛伏癌「**老人一半有（59%）**」。

### Ch.2 危險因子 Aetiology & Risk Factors

**A. 一句話重點**
危險因子分**遺傳性**（種族、家族史、germline mutation）與**非遺傳性**（飲食、代謝），環境/飲食影響可由「亞裔移民美國後風險仍比美國出生亞裔低 ~50%」佐證。

**B. 必背定義與數字**
- 遺傳性：Ethnicity、Family history、Germline mutations。
- 非遺傳性：Diet、代謝疾病（肥胖、metabolic syndrome）。
- **非洲裔**：advanced disease 比率高、prostatectomy 後 Gleason upgrading 較多、Polygenic Risk Score（**278 SNPs**）預測力強；但轉移性 PCa 在白人/黑人/西班牙裔間 **OS 與 PCSM 無差異**；黑人 baseline PSA 較高→過度偵測風險。
- **5-ARIs**：↓ PCa 風險 **25%**（主要 ISUP GG1）；略↑ high-grade 但**不增死亡率**；EMA 未核准作化學預防。
- **Testosterone**：補充 testosterone 在 hypogonadal 男性**不增 PCa 風險**；free T 最低 10% 者 PCa 風險反↓（OR 0.77）；治療後補充不惡化存活。
- 體格：高身材↑風險（可能經 IGF-1）；頭頂禿 vertex baldness 部分研究相關。
- **IBD（尤其 ulcerative colitis）**：ISUP GG≥2 PCa 的 **HR 4.04**。

**C. 臨床判斷流程**
```
家族史/種族 → 評估遺傳風險 → 考慮基因檢測與提早篩檢
5-ARI 使用者 → 解讀 PSA 要 ×2（PSA 被壓低 50%）
IBD(UC) 男性 → 提高警覺 csPCa
```

**D. 診斷工具與適應症**
（連結至 Ch.3 基因檢測）

**E. 治療策略**
- 5-ARI **不建議單純作化學預防**（EMA 未核准）。

**F. 考試高頻重點**
1. 亞裔移民美國後風險降 ~50% → 環境/飲食可改變。
2. 5-ARI 降 PCa 風險 25%（主要 GG1），略↑ high-grade 但不增死亡。
3. Testosterone 補充不增 PCa 風險（推翻舊觀念）。
4. IBD（UC）→ ISUP GG≥2 PCa HR 4.04。
5. 非洲裔 PRS 278 SNPs；轉移後各種族 OS/PCSM 無差異。

**G. 容易混淆比較表**

| 因子 | 對 PCa 風險 | 對死亡率 |
|---|---|---|
| 5-ARI | ↓25%（GG1） | 不增加 |
| 低 free testosterone | ↓（OR 0.77） | — |
| Testosterone 補充 | 不增加 | 不惡化 |
| IBD(UC) | ↑（GG≥2 HR 4.04） | — |

**H. 臨床記憶法**
「**5-ARI 降 25、testosterone 別怕、UC 要小心（4.04）**」；移民研究＝「環境可改變，基因非宿命」。

### Ch.3 遺傳性 vs 家族性 PCa 與基因檢測

**A. 一句話重點**
**Familial**（家族聚集）≠ **Hereditary**（遺傳性，定義更嚴格）；BRCA2 帶因者早發且惡性，germline（血液/唾液）vs somatic（腫瘤組織）檢測各有適應症，HRR panel 與 MSI-H/dMMR 決定 PARPi 與免疫治療。

**B. 必背定義與數字**
- **Familial 定義**：≥2 位一等親罹 PCa（任何年齡）；或 1 位一等親＋≥2 位二等親。
- **Hereditary 定義**：同家族 ≥3 例；或連續 3 代；或 ≥2 例 <55 歲診斷。
- Swedish（父＋2 兄弟）：65 歲前 high-risk PCa **11.4%**（vs 1.4% 一般）；any PCa **43.9%**（vs 4.8%）。
- US database：HPCA 盛行率 2.18%；RR any PCa 2.30、early-onset 3.93、lethal 2.21、clinically significant 2.32。
- **Germline BRCA1/2** 一般人群 **0.2–0.3%**；germline＝血液/唾液，somatic＝腫瘤組織；檢測前後需 genetic counselling。
- **HRR gene panel**：BRCA1, BRCA2, ATM, PALB2, FANCA, RAD51D, CHEK2, CDK12（**BRCA1/2 loss 強烈關聯 PARPi 反應**）。
- **MSI-H/dMMR**：mCRPC **必做**，regional/metastatic CSPC 可考慮；NGS 測 MSI 優於 IHC。
- **TMB**：mCRPC 建議測；**HIGH ≥10 mutations/Mb**。
- 檢體：**轉移病灶切片為佳**；不可行→PSA/影像惡化時用 plasma ctDNA（PSA undetectable 時避免；注意 CHIP 偽陽性）。
- 建議基因檢測對象：強家族史、診斷 **≤55 歲**、metastatic/high-risk/intraductal PCa。
- 建議 panel：BRCA1, BRCA2, HOXB13；ATM, CHEK2, DNA MMR genes（MSH2, MLH1）。
- 若驗到 MSI-H/dMMR → 評估 **Lynch syndrome**。

**C. 臨床判斷流程**
```
家族史/早發/轉移 → germline testing（血液/唾液，需 counselling）
metastatic PCa → somatic（腫瘤）+ HRR panel + MSI-H/dMMR
HRR/BRCA1/2 (+) → PARPi 適用
MSI-H/dMMR (+) → pembrolizumab；查 Lynch syndrome
```

**D. 診斷工具與適應症**
- Germline：強家族史、≤55 歲、metastatic/high-risk/intraductal。
- Somatic：metastatic 引導標靶/臨床試驗；疾病惡化時 re-biopsy。

**E. 治療策略**
- BRCA1/2 或 HRR mutation → **PARPi**。
- MSI-H/dMMR → **pembrolizumab**（tumor-agnostic）。

**F. 考試高頻重點**
1. Familial vs Hereditary 定義（≥3 例／3 代／≥2 例 <55 歲＝Hereditary）。
2. Germline BRCA1/2 一般人群 0.2–0.3%；germline=血液，somatic=腫瘤。
3. HRR panel 八基因；BRCA1/2 loss → PARPi。
4. MSI-H/dMMR mCRPC 必做 → pembrolizumab、查 Lynch。
5. TMB-high ≥10 mut/Mb；ctDNA 注意 CHIP 偽陽性。
6. 基因檢測對象：≤55 歲、強家族史、metastatic/high-risk/intraductal。

**G. 容易混淆比較表**

| | Familial | Hereditary |
|---|---|---|
| 定義 | ≥2 一等親 / 1+≥2 二等親 | ≥3 例 / 3 代 / ≥2 例<55 歲 |
| 風險 | 較高 | 更高 |

| | Germline | Somatic |
|---|---|---|
| 檢體 | 血液/唾液 | 腫瘤組織 |
| 意義 | 遺傳、家族篩檢 | 標靶治療引導 |
| 對象 | 家族史/早發 | metastatic |

**H. 臨床記憶法**
「**3 例、3 代、2 例早（<55）＝Hereditary**」；「**Germline 抽血查家族，Somatic 切腫瘤選藥**」；「**BRCA→PARP、MMR→pembro（查 Lynch）**」。

### Ch.4 PSA 早期偵測、PSA 誤差與 PSA Density

**A. 一句話重點**
PSA 篩檢起始年齡依風險分層（一般 50／家族史或非洲裔 45／BRCA2 40）；baseline PSA 與後續風險高度相關，但 PSA 易受 UTI/retention/biopsy/5-ARI 干擾，**PSA density（PSA/體積）cut-off 0.15** 提升 csPCa 預測力。

**B. 必背定義與數字**
- **起始年齡**：average risk **50**；family history / African descent **45**；**BRCA2 帶因 40**。
- **Baseline PSA <1.0 ng/mL @60 歲** → 85 歲前 PCa 死亡風險 **≤0.2%**。
- 低風險男性 retest 間隔 **8–10 年**；at-risk 每 **2 年**。
- 餘命 **<15 年**且無症狀 → **不建議檢測**。
- **ERSPC**：incidence↑（IR 1.23）、localized↑（RR 1.39）、advanced↓（RR 0.85）、但 OS 無顯著效益（RR 0.96）；長期追蹤 **mortality reduction 21–29%**。
- **NNS/NNT（隨追蹤年限下降）**：9 年 NNS 1410/NNT 48；13 年 781/27；16 年 570/18。Rotterdam 21 年 NNS 246/NND 14；Göteborg 22 年 NNS 221/NND 9。
- **GÖTEBORG-2 RCT**：MRI 可整合進第一線篩檢流程。

**PSA 誤差來源（必背表）**

| 因子 | 影響 |
|---|---|
| 個體內變異 | ±15%（25°C 下穩定 ~8 小時） |
| UTI / febrile | PSA 大幅↑，可能 1 年才正常 |
| 尿滯留 retention | PSA 中度↑（~2X） |
| Biopsy | PSA↑，切片後 ≥1 個月再驗 |
| 5-ARI | PSA ↓50%，判讀前須校正（×2） |
| DRE | 無顯著 PSA 變化 |
| 實驗室/assay | ±5%，同實驗室標準化重驗 |

- **PSA Density（PSA-D）= PSA / 攝護腺體積**；csPCa cut-off **0.15 ng/mL/cc**；**<0.09 → 低風險（4%）**。
- 體積估計：DRE 低估；TRUS 比 MRI 低估 ~8%；**MRI 最準**（ICC>0.90）；TAUS 高估 ~9.9 mL（不建議）。

**C. 臨床判斷流程**
```
評估風險 → 決定起始年齡(50/45/40)
PSA 異常 → 排除干擾(UTI/retention/biopsy/5-ARI×2) → 重驗
PSA + 體積 → PSA-D；≥0.15 提高 csPCa 警覺 → MRI
餘命<15 年且無症狀 → 不檢測
```

**D. 診斷工具與適應症**
- PSA：早期偵測主軸，需配合 PSA-D 與 MRI。
- DRE：見 Ch.9（檢出 ~18%，可疑 DRE 提升切片陽性率）。

**E. 治療策略**
（篩檢章節，無）

**F. 考試高頻重點**
1. 起始年齡 50／45（家族史、非洲裔）／40（BRCA2）。
2. Baseline PSA<1@60 → 85 歲前死亡風險 ≤0.2%。
3. 餘命<15 年無症狀不檢測。
4. ERSPC mortality reduction 21–29%；NNS 隨追蹤拉長而下降。
5. 5-ARI 使 PSA↓50%（判讀×2）；biopsy 後 ≥1 月再驗。
6. PSA-D cut-off 0.15；<0.09 低風險；MRI 量體積最準。

**G. 容易混淆比較表**

| 使 PSA ↑ | 使 PSA ↓ | 不影響 |
|---|---|---|
| UTI、retention、biopsy | 5-ARI（−50%） | DRE |

**H. 臨床記憶法**
篩檢年齡「**50–45–40 對應 一般–家族–BRCA2**」；干擾因子「**炎、滯、切 升；5-ARI 降一半；DRE 不變**」；PSA-D「**0.15 是門檻**」。

### Ch.5 影像學：MRI / PI-RADS / 超音波 / PSMA-PET（診斷）

**A. 一句話重點**
**MRI（PI-RADS）是 csPCa 偵測的標準影像**；PI-RADS 分數對應 csPCa 偵測率（1–2:6%、3:20%、4:55%、5:83%）；mpUS/micro-US 為輔助/替代，PSMA-PET 提升敏感度但降特異度，於 negative MRI but rising PSA 有價值。

**B. 必背定義與數字**
- **PI-RADS → csPCa 偵測率**：1–2 **6%**、3 **20%**、4 **55%**、5 **83%**。
- MRI 對 csPCa 有高 **NPV（達 91%）**。
- 超音波：standard TRUS 敏感度低；**mpUS**（B-mode＋Doppler＋elastography＋CEUS）CADMUS trial 比 mpMRI 少測 4.3% csPCa、多送 11.1% 去切片；**micro-US** 解析度高但 anterior tumor 較弱，與 MRI 互補（各約 73–76% csPCa）；MRI 偵測 anterior、micro-US 偵測 apex。
- **PSMA-PET/CT 診斷 csPCa**：sensitivity **0.89**、specificity **0.56**。
- PSMA+MRI vs MRI alone（N=291）：NPV 91 vs 72、sensitivity 97 vs 83、specificity 40 vs 53（PSMA ↑NPV/敏感度，↓特異度）。
- **結論：MRI 仍為 csPCa 偵測標準影像**，PSMA 與 micro-US 為輔助/替代。

**C. 臨床判斷流程**
```
PSA/risk 異常 → mpMRI（PI-RADS 評分）
PI-RADS ≥3 → 切片（分數越高 csPCa 機率越高）
negative MRI but rising PSA → 考慮 PSMA-PET
MRI 偵測 anterior、micro-US 偵測 apex（互補）
```

**D. 診斷工具與適應症**
- mpMRI：csPCa 偵測標準；切片前評估。
- PSMA-PET：高 NPV/敏感度但低特異度（注意偽陽性）。

**E. 治療策略**
（診斷章節）

**F. 考試高頻重點**
1. PI-RADS 1–5 偵測率 6/20/55/83（必背）。
2. MRI 為 csPCa 標準影像、NPV 高（91%）。
3. PSMA-PET 診斷 sensitivity 0.89/specificity 0.56。
4. PSMA+MRI ↑NPV/敏感度但↓特異度。
5. MRI→anterior、micro-US→apex 互補。

**G. 容易混淆比較表**

| PI-RADS | csPCa 偵測率 |
|---|---|
| 1–2 | 6% |
| 3 | 20% |
| 4 | 55% |
| 5 | 83% |

**H. 臨床記憶法**
PI-RADS「**6→20→55→83**」（3 分以上才切片）；「**MRI 看前面（anterior），micro-US 看尖端（apex）**」。

### Ch.6 血液與尿液生物標記 Biomarkers

**A. 一句話重點**
生物標記主要用於 **PSA 2–10 ng/mL 灰色地帶**做風險分層、減少不必要切片；PHI/4Kscore 優於 f/t PSA，Stockholm3 可減少 MRI 與低惡性偵測；台灣 **PHI 健保適應症有四條件**。

**B. 必背定義與數字**
- 角色：risk stratification、減少不必要切片；**最有用範圍 PSA 2–10 ng/mL**；常需與 MRI/PSA-D/家族史整合。
- **若已考慮 PSA density，f/t PSA 不再增加價值**。

**血液生物標記表**

| 檢測 | 組成 | 備註 |
|---|---|---|
| **PHI** | Total PSA, Free PSA, [-2]proPSA | FDA 核准；優於 f/t PSA |
| **4Kscore** | Free/intact/total PSA, hK2, 臨床資料 | 與 PHI 相當 |
| **IsoPSA** | PSA structure-based | high-grade AUC 0.784 |
| **Stockholm3** | PSA, f/t PSA, hK2, MIC-1, MSMB, genetic risk | ↓低惡性、↓MRI 使用 |
| **Proclarix** | Thrombospondin-1, Cathepsin D, PSA, age | 適合 PI-RADS 3 |

- **台灣 PHI 健保適應症（四條件全符合）**：
  1. PSA 介於 **4–10 ng/mL**；
  2. 尿液分析及臨床症狀已**排除攝護腺感染或發炎**；
  3. **肛門指診無異常**；
  4. **≥50 歲**，或 <50 歲但有攝護腺癌**家族史**。

**C. 臨床判斷流程**
```
PSA 2–10（灰色地帶）→ 生物標記 + PSA-D + MRI 整合
PHI/4Kscore → 提升 csPCa 預測、減少切片
Stockholm3 → 減少不必要 MRI 與低惡性偵測
Proclarix → PI-RADS 3 病人輔助決策
```

**D. 診斷工具與適應症**
- PHI/4Kscore：PSA 4–10、排除感染/發炎、DRE 正常。
- Stockholm3：減少 MRI 與低惡性偵測。

**E. 治療策略**
（診斷章節）

**F. 考試高頻重點**
1. 生物標記最有用範圍 PSA 2–10 ng/mL。
2. PHI 組成＝Total＋Free＋[-2]proPSA；FDA 核准、優於 f/t PSA。
3. 4Kscore 與 PHI 相當。
4. 已用 PSA-D，f/t PSA 無額外價值。
5. 台灣 PHI 健保四條件（4–10、排除發炎、DRE 正常、≥50 或家族史）。

**G. 容易混淆比較表**

| 標記 | 特點 |
|---|---|
| PHI | [-2]proPSA，FDA 核准 |
| 4Kscore | 含 hK2＋臨床，等同 PHI |
| Stockholm3 | 多基因，↓MRI/低惡性 |
| Proclarix | PI-RADS 3 輔助 |

**H. 臨床記憶法**
「**灰色地帶 2–10 用標記**」；PHI＝「**總、游離、[-2]proPSA 三兄弟**」；健保 PHI「**4–10、無發炎、指診正常、年過 50 或有家族**」。

### Ch.7 切片適應症與風險工具 Biopsy Indication & Risk Tools

**A. 一句話重點**
現代切片決策由「PSA→MRI」「PSA→風險計算器→MRI」「PSA→生物標記→MRI」多階路徑取代單純 PSA 閾值；risk calculator（ERSPC、PCPT-RC 2.0）與 PI-RADS 閾值可在不大量漏掉 csPCa 下避免切片。

**B. 必背定義與數字**
- 古典：PSA 閾值或 DRE 異常；現代：多階路徑（PSA→MRI／→RC→MRI／→biomarker→MRI），並考慮 age、comorbidity、life expectancy、treatment intent。
- **Risk calculators（csPCa）**：
  - **ERSPC RC**：age, PSA, DRE, prostate volume, f/t PSA ratio, family history（更新 2014 ISUP grading）。
  - **PCPT-RC 2.0**：age, PSA, DRE, f/t PSA ratio, family history, race/ethnicity, biopsy history（美國線上工具）。
  - 限制：不同人群 miscalibration，須在地驗證/校正。
- **避免切片數據（Rotterdam 分支）**：

| 工具/閾值 | 避免切片 | 漏掉 csPCa |
|---|---|---|
| **Rotterdam RC** | 37% | 4/73（5.5%） |
| PHI >30 | 25% | 8% |
| Stockholm3 ≥10% | 38% | 8% |
| MRI-based RC | 22%（95% 敏感度） | 5% |

- **PI-RADS 閾值（meta-analysis）**：threshold **≥3** 避免 30% 切片、漏 11% csPCa；threshold **≥4** 避免 59% 切片、漏 28% csPCa。
- **MR PROPER trial**（MRI vs RC）：csPCa 偵測相同（24–25%）、切片更少（55% vs 42%）、GG1 更少（8.3% vs 13%）。
- 低風險病人若餘命 >15 年仍應追蹤。

**C. 臨床判斷流程**
```
PSA 異常 → risk calculator / biomarker → MRI
PI-RADS ≥3 → 切片（閾值越高，避免越多但漏越多）
低風險 + 餘命>15 年 → 持續追蹤
```

**D. 診斷工具與適應症**
- ERSPC/PCPT-RC：切片前風險分層。
- MRI 閾值（PI-RADS ≥3 或 ≥4）：依漏診容忍度選擇。

**E. 治療策略**
（診斷章節）

**F. 考試高頻重點**
1. 現代路徑：PSA→（RC/biomarker）→MRI→切片。
2. ERSPC RC vs PCPT-RC 2.0 變數差異（PCPT 含 race/ethnicity、biopsy history、無 volume）。
3. PI-RADS ≥3 避免 30% 切片漏 11%；≥4 避免 59% 漏 28%。
4. Rotterdam RC 避免 37% 切片、僅漏 5.5%。

**G. 容易混淆比較表**

| | ERSPC RC | PCPT-RC 2.0 |
|---|---|---|
| 含 prostate volume | ✅ | ❌ |
| 含 race/ethnicity | ❌ | ✅ |
| 含 biopsy history | ❌ | ✅ |

**H. 臨床記憶法**
「**先算風險再 MRI，PI-RADS≥3 才切**」；閾值「**3 省三成漏一成、4 省六成漏三成**」。

### Ch.8 MRI-targeted Biopsy：Perilesional 策略與偵測半徑

**A. 一句話重點**
MRI-targeted biopsy 每病灶取 ≥3–5 cores，加上**同側 peri-lesional（鄰近 sextant）**可增加 csPCa 偵測；對側切片價值低；csPCa 偵測半徑與 PI-RADS 分數成反比（分數越高、病灶越集中）。

**B. 必背定義與數字**
- Targeted cores：每個 MRI 病灶 **≥3–5 cores**。
- **對側切片**：價值低（csPCa added value 0.3–4%）。
- **同側 peri-lesional**：added value 較高（4.9–18.4%），尤其 adjacent sextants。
- Detection efficiency（meta）：targeted＋peri-lesional vs targeted＋systematic：RR 0.95（p=0.09，相當）；vs targeted only：RR 1.18（p<0.001，較佳）。
- **csPCa 偵測半徑**：10 mm 內 90–92%；15 mm 內 94–97%。
- **PI-RADS 依賴 90% 偵測半徑**：PI-RADS 5 = **5.5 mm**、PI-RADS 4 = **12 mm**、PI-RADS 3 = **16 mm**。

**C. 臨床判斷流程**
```
MRI 病灶 → targeted ≥3–5 cores
+ 同側 peri-lesional（adjacent sextant，提升偵測）
對側 → 一般不需（價值低）
PI-RADS 高(5) → 病灶集中(半徑小)；PI-RADS 3 → 半徑大需較廣取樣
```

**D. 診斷工具與適應症**
- MRI-targeted＋peri-lesional：取代部分 systematic biopsy。

**E. 治療策略**
（診斷章節）

**F. 考試高頻重點**
1. 每病灶 ≥3–5 targeted cores。
2. 同側 peri-lesional 有價值（4.9–18.4%），對側無（0.3–4%）。
3. targeted＋peri-lesional ≈ targeted＋systematic（RR 0.95）。
4. 90% 偵測半徑：PI-RADS 5=5.5、4=12、3=16 mm。

**G. 容易混淆比較表**

| 加做部位 | csPCa added value |
|---|---|
| 同側 peri-lesional | 4.9–18.4%（高） |
| 對側 contralateral | 0.3–4%（低） |

**H. 臨床記憶法**
「**打靶要打旁邊（同側），對面別浪費**」；偵測半徑「**5 分最集中(5.5)、3 分最散(16)**」。

### Ch.9 切片併發症與抗生素 Infectious Complications

**A. 一句話重點**
**Transperineal（TP）切片感染/sepsis 率明顯低於 transrectal（TR）**，是現行首選；TR 切片需 povidone-iodine 與抗生素降感染，但 fluoroquinolone 抗藥性上升使其周術期使用受限。

**B. 必背定義與數字**
- **感染併發症**：TP sepsis 0.1%（22/807）；TR sepsis 0.9%（48/789）；**RR（TR vs TP）2.48 [1.47–4.2]**。
- PREVENT trial：TP sepsis 0% vs TR 1.4%（p=0.059）；UK cohort（n=73,630）re-admission for sepsis TP 1.0% vs TR 1.4%。
- **TP 切片**：有無抗生素無顯著差異（感染 1.35% vs 1.22%，p=0.8；sepsis 0.05% vs 0.08%，p=0.2）。
- **TR 切片**：切片前 **povidone-iodine** ↓感染（RR 0.47）；抗生素 ↓感染（RR 0.56）；FQ 抗藥↑→EC 限制周術期使用。
- 替代抗生素：Fosfomycin（RR 0.49，非各地核准）、cephalosporins/aminoglycosides；rectal swab-guided targeted prophylaxis 有潛力（無 non-FQ RCT）。
- **臨床建議：TP 切片為首選**——csPCa 偵測相當、感染低、可局麻、符合抗生素管理（stewardship）。

**C. 臨床判斷流程**
```
切片途徑選擇 → 優先 TP（感染少、可局麻）
若 TR → povidone-iodine + 抗生素；注意 FQ 抗藥
TP → 是否抗生素差異不大
```

**D. 診斷工具與適應症**
（切片技術）

**E. 治療策略**
- TP 為首選；TR 須 povidone-iodine ± 抗生素。

**F. 考試高頻重點**
1. TP sepsis 0.1% vs TR 0.9%，RR 2.48。
2. PREVENT trial：TP 0% vs TR 1.4% sepsis。
3. TR 切片 povidone-iodine RR 0.47、抗生素 RR 0.56。
4. TP 切片有無抗生素差異不大。
5. TP 為首選（感染少、局麻、抗生素管理）。

**G. 容易混淆比較表**

| | TP（經會陰） | TR（經直腸） |
|---|---|---|
| Sepsis 率 | 0.1% | 0.9% |
| 抗生素必要性 | 差異不大 | 必須＋povidone-iodine |
| 麻醉 | 可局麻 | — |
| 推薦 | **首選** | 次選 |

**H. 臨床記憶法**
「**經會陰（TP）感染少，經直腸（TR）要碘洗＋抗生素**」；RR「**TR 比 TP 多 2.48 倍 sepsis**」。

### Ch.10 PSMA PET/CT 分期 Staging

**A. 一句話重點**
PSMA PET/CT 結合 PSMA 標靶放射示蹤劑與功能/解剖影像，PSMA 在 **>90% PCa 細胞過度表現**；在**高風險局部或局部晚期 PCa 的分期**優於傳統 CT＋bone scan，但小淋巴結與發炎/ganglia 有偽陽性。

**B. 必背定義與數字**
- 示蹤劑：68Ga-PSMA-11、18F-DCFPyL；PSMA 在 >90% PCa 過度表現、良性攝取低→高 tumor-to-background。
- **適用**：high-risk localized 或 locally advanced PCa 的 pelvic LN 分期（尤其 nodes >4 mm）與 visceral/bone 轉移偵測；LN 轉移敏感度 ~75%、特異度 >95%；骨轉移優於 bone scan、偵測更早。
- **有價值情境**：negative MRI but rising PSA、MDT 前確認 oligometastatic、curative 手術/RT 前評估範圍、post-biopsy upstaging。
- **限制**：small LN（<4 mm/micromet）易漏；偽陽性（發炎、ganglia、fracture）；可近性/費用/給付不一；判讀標準仍演進中。

**C. 臨床判斷流程**
```
high-risk / locally advanced PCa → PSMA PET/CT 分期
negative MRI + rising PSA → PSMA-PET 找病灶
curative 治療前 → 確認 LN/轉移範圍
注意偽陽性(發炎/ganglia)與小 LN 漏診
```

**D. 診斷工具與適應症**
- PSMA PET/CT：高風險分期首選；優於傳統影像。

**E. 治療策略**
- 影響治療範圍（手術/RT/MDT）決策。

**F. 考試高頻重點**
1. PSMA 在 >90% PCa 過度表現。
2. 用於 high-risk/locally advanced 分期；LN 敏感度 ~75%、特異度 >95%。
3. 骨轉移優於 bone scan、更早偵測。
4. 偽陽性：發炎、ganglia、fracture；小 LN（<4 mm）易漏。

**G. 容易混淆比較表**

| | PSMA PET/CT | 傳統 CT＋bone scan |
|---|---|---|
| LN 分期 | 較準（>4 mm） | 較差 |
| 骨轉移 | 更早偵測 | 較晚 |
| 偽陽性 | 發炎/ganglia | — |

**H. 臨床記憶法**
「**PSMA 高風險才用，>90% 表現、骨轉早抓，但發炎會偽陽**」。

### Ch.11 淋巴結廓清 Extended Pelvic Lymph Node Dissection (ePLND)

**A. 一句話重點**
ePLND（external iliac＋obturator＋internal iliac）提供**準確分期但無存活效益**，併發症較 limited PLND 高（lymphocele 最常見），**peritoneal flap** 可顯著降低 symptomatic lymphocele。

**B. 必背定義與數字**
- 範圍：external iliac、obturator、internal iliac nodes。
- 準確分期，但 **2 個 RCT 顯示無存活效益**。
- 併發症：**ePLND 19.8% vs Limited PLND 8.2%**；lymphocele 最常見（10.3% vs 4.6%）；DVT RR 7.8、PE RR 6.3。
- **Peritoneal flap** ↓併發症：symptomatic lymphocele OR 0.46、Clavien ≥3 OR 0.41；**PELYCAN trial**：lymphocele 27.2%→10.3%（p<0.001）。

**C. 臨床判斷流程**
```
high-risk PCa 需分期 → ePLND（準確但無存活效益）
併發症風險高(lymphocele) → 考慮 peritoneal flap
```

**D. 診斷工具與適應症**
- ePLND：高風險 PCa 分期；非治療性。

**E. 治療策略**
- Peritoneal flap 降低 lymphocele。

**F. 考試高頻重點**
1. ePLND 準確分期但**無存活效益**（2 RCT）。
2. ePLND 19.8% vs limited 8.2% 併發症；lymphocele 最常見。
3. Peritoneal flap：lymphocele OR 0.46、PELYCAN 27.2%→10.3%。

**G. 容易混淆比較表**

| | ePLND | Limited PLND |
|---|---|---|
| 併發症 | 19.8% | 8.2% |
| Lymphocele | 10.3% | 4.6% |
| 存活效益 | 無 | 無 |

**H. 臨床記憶法**
「**ePLND 分期準、存活無、lymphocele 多；peritoneal flap 救場**」。

### Ch.12 預後工具：CAPRA / proPSMA Prognostic Role

**A. 一句話重點**
PSMA PET/CT 不僅分期，N1/M1 結果結合 **CAPRA score** 可提升 BCR-free survival 預測；proPSMA trial 證實 PSMA 準確度與管理改變優於傳統影像、且輻射劑量較低。

**B. 必背定義與數字**
- **PSMA PET/CT 表現**：lesion-level sensitivity 33–99%、specificity 達 100%。
- **proPSMA trial（n=302）**：accuracy PSMA **92% vs 傳統 65%**（p<0.0001）；sensitivity 85% vs 38%；specificity 98% vs 91%；management change 28% vs 15%；輻射 **8.4 mSv vs 19.2 mSv**。
- **CAPRA score** 組成：PSA、Gleason、T stage、% positive biopsy cores、Age（分數越高存活越差）。
- **PSMA PET N1/M1 ＋ CAPRA** → ↑BCR-free survival 預測，c-statistic **0.70 vs 0.63**（p<0.001）。
- 結論：PSMA PET/CT 與 whole-body MRI 偵測 M1 優於傳統影像，整合進預後工具改善風險分層。

**C. 臨床判斷流程**
```
PSMA PET 分期(N1/M1) + CAPRA → 預測 BCR-free survival
proPSMA：PSMA 取代傳統影像(更準、輻射低、改變管理)
```

**D. 診斷工具與適應症**
- CAPRA：臨床預後分層。
- PSMA PET：提升預後預測。

**E. 治療策略**
- 影響後續監測與治療強度。

**F. 考試高頻重點**
1. proPSMA：PSMA accuracy 92% vs 傳統 65%；輻射 8.4 vs 19.2 mSv。
2. CAPRA 五變數：PSA、Gleason、T stage、% positive cores、Age。
3. PSMA N1/M1＋CAPRA c-statistic 0.70 vs 0.63。

**G. 容易混淆比較表**

| | proPSMA：PSMA | 傳統影像 |
|---|---|---|
| Accuracy | 92% | 65% |
| 輻射 | 8.4 mSv | 19.2 mSv |
| Management change | 28% | 15% |

**H. 臨床記憶法**
CAPRA「**PSA、Gleason、T、% cores、Age 五件事**」；proPSMA「**準兩成、輻射半**」。

### Ch.13 餘命與健康狀態評估 Life Expectancy & Frailty

**A. 一句話重點**
治療決策應依**餘命與健康狀態（G8、Clinical Frailty Scale）**而非單純年齡；fit 的高齡男性同樣可從根除性治療獲益，避免 undertreatment。

**B. 必背定義與數字**
- 中位診斷年齡 **68 歲**；**71% PCa 死亡發生在 >75 歲**；2030 年 >65 歲診斷 +70%。
- **>10 年餘命**才能從局部治療獲益。
- **RP 效益最大在 <65 歲**（PCa 死亡 RR 0.45）；老年男性 RP 也↓轉移與 ADT 使用（RR 0.68、0.60）；**RT >72 Gy** 各年齡皆有效。
- **G8 Score**：>14/17 → fit，標準治療；**≤14** → 需 Comprehensive Geriatric Assessment（CGA）。CGA 領域：co-morbidities、nutrition、cognition、function、support。
- **Clinical Frailty Scale（CFS）**：1–9（越高越衰弱），預測 30 天死亡與出院結果。
- Undertreatment：>75 歲中/高風險 PCa 僅 41% 接受 curative 治療（65–74 歲為 88%）。

**C. 臨床判斷流程**
```
診斷 → 評估餘命(>10 年?) + G8 score
G8 >14 → fit → 標準治療
G8 ≤14 → CGA 全面老年評估
不以年齡單獨決定治療
```

**D. 診斷工具與適應症**
- G8、CFS：治療前 fitness 分流。

**E. 治療策略**
- Fit（含高齡）→ curative；frail → 個別化/保守。

**F. 考試高頻重點**
1. 71% PCa 死亡 >75 歲；中位診斷 68 歲。
2. >10 年餘命才從局部治療獲益。
3. G8 >14 fit／≤14 做 CGA。
4. CFS 1–9 預測 30 天死亡。
5. 不以年齡決定，避免 undertreatment。

**G. 容易混淆比較表**

| 工具 | 分數 | 意義 |
|---|---|---|
| G8 | >14/17 fit | ≤14 → CGA |
| CFS | 1–9 | 越高越衰弱、預測 30 天死亡 |

**H. 臨床記憶法**
「**G8 過 14 算 fit，餘命過 10 才開刀；看 fitness 不看年齡**」。

### Ch.14 期待性管理：Active Surveillance vs Watchful Waiting

**A. 一句話重點**
**AS（意圖治癒，固定追蹤，低/選擇性中風險，餘命 >10 年）** 與 **WW（緩和意圖，症狀導向，任何風險但不適合治癒，餘命 <10 年）** 是兩種不同的保守策略；可借 PREDICT Prostate 平衡 PCa 死亡與競爭死亡。

**B. 必背定義與數字**

| | Active Surveillance | Watchful Waiting |
|---|---|---|
| 意圖 | **Curative** | **Palliative** |
| 追蹤 | 固定 protocol（DRE、PSA、MRI） | 症狀導向、±年度 PSA |
| 餘命 | **>10 年** | **<10 年** |
| 對象 | 低風險、選擇性中風險 | 任何風險但不適合治癒 |
| 目標 | 延後根除治療、保 QoL | 延後 ADT、減毒性 |

- **無局部治療 CSS**：10 年 82–87%（T1/T2、GG≤2 為 80–95%）；15 年 58–80%；20 年 32–57%；分化—well 91%、moderate 90%、poor 74%（10 年 CSS）。
- 高共病（CCI ≥2）→ 高非 PCa 死亡 → 診斷/治療效益有限。
- **ProtecT**：PCa-specific death 3% @15 年；all-cause 21.7%。
- 工具：**PREDICT Prostate**（prostate.predict.nhs.uk）平衡 PCa vs competing mortality。

**C. 臨床判斷流程**
```
低風險 + 餘命>10 年 + 治癒意圖 → AS（固定追蹤 PSA/MRI/biopsy）
餘命<10 年 / 高共病 / 不適合治癒 → WW（症狀導向，延後 ADT）
用 PREDICT 平衡 PCa vs 競爭死亡
```

**D. 診斷工具與適應症**
- AS：低/選擇性中風險、餘命>10 年。
- WW：餘命<10 年、高共病。

**E. 治療策略**
- AS：reclassification 時轉 curative。
- WW：症狀進展時給緩和 ADT。

**F. 考試高頻重點**
1. AS＝curative 意圖；WW＝palliative 意圖（最常考對比）。
2. AS 餘命>10 年；WW <10 年。
3. AS 固定追蹤(含 MRI/biopsy)；WW 症狀導向。
4. 無治療 10 年 CSS 82–87%（GG≤2 達 80–95%）。
5. ProtecT 15 年 PCa death 僅 3%。

**G. 容易混淆比較表**
（見 B 表；核心：意圖 curative vs palliative、餘命 >10 vs <10、追蹤 固定 vs 症狀）

**H. 臨床記憶法**
「**AS 想治癒（>10 年，密集追蹤）；WW 想緩和（<10 年，等症狀）**」。

### Ch.15 Watchful Waiting：經典試驗 SPCG-4 / PIVOT

**A. 一句話重點**
WW 適合高齡/高共病、餘命短者，目標延後緩和性 ADT；SPCG-4（pre-PSA era）顯示 RP 優於 WW，PIVOT（early-PSA era）整體無 OS 差異但中風險受益，Cochrane 統合顯示 RP 降死亡但增副作用。

**B. 必背定義與數字**
- WW 定義：不適合治癒者的保守處置；目標延後緩和 ADT 至症狀進展。**早期 ADT 考慮**：PSA doubling time <12 月、PSA 30–50 ng/mL、locally advanced 或高 ISUP GG。追蹤：半年或年度 PSA，PSA 明顯上升時加 DRE/bone scan。
- **Swedish registry（非轉移 WW）**：低風險 ADT-free 5 年 66.2%、10 年 25.5%、CRPC@10 年 4.1%、死於他因 92.3%；高風險 ADT-free 5 年 36.1%、10 年 10.4%、CRPC 10.8%、死於他因 84.1%。
- **SPCG-4**（pre-PSA，n=695，追蹤 23.6 年）：RP 優於 WW（CSS、OS、PFS），效益在 10 年後才顯現。
- **PIVOT**（early-PSA，n=731，追蹤 18.6 年）：RP vs WW **OS 無顯著差異**；subgroup intermediate-risk 受益（RR 0.84）；兩組 QoL 相當。
- **Cochrane（3 RCT）**：all-cause mortality HR 0.79（0.70–0.90）、PCa-specific HR 0.57（0.44–0.73）、metastatic progression HR 0.56（0.46–0.70）；但 RP 副作用增加—urinary incontinence RR 3.97、ED RR 2.67。

**C. 臨床判斷流程**
```
高齡/高共病/餘命短 → WW
PSA DT<12 月 / PSA 30–50 / 高 GG → 考慮早期 ADT
中風險 + 餘命>10 年 → RP 可能有長期存活效益
```

**D. 診斷工具與適應症**
- WW：餘命短、不適合治癒。

**E. 治療策略**
- WW：症狀/PSA 進展時緩和 ADT。
- RP：中風險、餘命長者長期受益。

**F. 考試高頻重點**
1. SPCG-4（pre-PSA）RP 優於 WW、效益 10 年後顯現。
2. PIVOT（early-PSA）整體 OS 無差異、中風險受益（RR 0.84）。
3. Cochrane：RP all-cause HR 0.79、PCa-specific HR 0.57。
4. RP 副作用：incontinence RR 3.97、ED RR 2.67。
5. 早期 ADT：PSA DT<12 月、PSA 30–50。

**G. 容易混淆比較表**

| | SPCG-4 | PIVOT |
|---|---|---|
| 年代 | pre-PSA | early-PSA |
| 結果 | RP 優（CSS/OS/PFS） | OS 無差異 |
| 受益族群 | 整體 | intermediate-risk |

**H. 臨床記憶法**
「**SPCG-4 老（pre-PSA）RP 贏，PIVOT 新（PSA）只贏中風險**」；RP「**漏尿 ED 是代價**」。

### Ch.16 Active Surveillance：ProtecT、納入條件、PRIAS

**A. 一句話重點**
AS 目標是延後/避免低與選擇性中風險 PCa 的不必要治療（餘命 ≥10 年），ProtecT 證實 15 年 CSS >96% 且各組相近、但純 PSA 監測（AM）轉移較高；納入須 ISUP GG1（或低量 GG2）、PSA<10、PSA-D<0.15、≤cT2a，排除 cribriform/ductal 等不良病理。

**B. 必背定義與數字**
- AS 目標：低/選擇性中風險，餘命 ≥10 年；reclassification（GG upgrade、腫瘤量增）時轉 curative。
- **ProtecT（n=1,643，15 年）**：

| 組 | CSS@15yr | Metastasis | Clinical Progression | Radical Tx |
|---|---|---|---|---|
| Active Monitoring (AM) | 96.9% | 9.4% | 25.9% | 61.1%(15 年內) |
| RP | 97.8% | 4.7% | 10.7% | — |
| EBRT | 97.1% | 5.0% | 10.7% | — |

  - **AM 僅用 PSA、無 MRI/biopsy → 進展高於正規 AS protocol**。
- AS 結果：long-term CSS/OS 佳；追蹤期間 reclassification **>33%**；53% 進展者初始為 ISUP GG1（需謹慎分層）。
- 進展預測：age 65–69、PSA/ISUP GG、cores 數目與長度、perineural invasion、CAPRA/D'Amico、MRI 使用不足與切片不足→低估。
- **AS 納入條件**：ISUP **GG1**（systematic biopsy）、cT1c 或 cT2a、PSA <10、PSA-D <0.15；排除 cribriform/ductal/sarcomatoid/small cell、LVI/EPE/PNI。
- **Favourable intermediate-risk 也可 AS**：low-volume ISUP **GG2**、PSA<10、PSA-D<0.15、≤cT2a、positive cores ≤2；建議 6–12 月 re-biopsy。
- **PRIAS expanded MRI-based**：ISUP GG1 或 GG2（無 cribriform/intraductal）、PSA ≤20、PSA-D <0.25、GG2 ≤50% positive cores；**停止 AS**：ISUP ≥GG3、cribriform/intraductal、或 >50% cores。
- BRCA2+ 不排除 AS 但需更密集監測；MRI-targeted biopsy 可能測到較高 grade 但改善結果。

**C. 臨床判斷流程**
```
低風險(GG1, PSA<10, PSA-D<0.15, ≤cT2a) → AS（PSA+MRI+repeat biopsy）
favourable intermediate(low-volume GG2) → 可 AS，6–12 月 re-biopsy
reclassification(≥GG3 / cribriform / >50% cores) → 轉 curative
無 MRI → 6–12 月 confirmatory biopsy
```

**D. 診斷工具與適應症**
- AS 監測：PSA、DRE、MRI、repeat/confirmatory biopsy。

**E. 治療策略**
- Reclassification → RP 或 RT。

**F. 考試高頻重點**
1. ProtecT 15 年 CSS 三組皆 >96%；AM 轉移 9.4% 高於 RP/RT。
2. AM（純 PSA）≠ AS（含 MRI/biopsy）；AM 進展較高。
3. AS 納入：GG1、PSA<10、PSA-D<0.15、≤cT2a。
4. Favourable intermediate（low-volume GG2、cores≤2）可 AS。
5. PRIAS：PSA≤20、PSA-D<0.25、GG2≤50% cores；≥GG3/cribriform 停 AS。
6. 53% 進展者初始為 GG1 → 謹慎分層。

**G. 容易混淆比較表**

| | Active Surveillance | Active Monitoring(ProtecT) |
|---|---|---|
| 監測 | PSA＋MRI＋repeat biopsy | **PSA only** |
| 切片 | systematic±MRI | 診斷後不再 |
| 觸發治療 | 預定進展(GG/量) | PSA 上升 |
| 結果 | 較佳風險控制 | 轉移風險較高 |

**H. 臨床記憶法**
AS 納入「**GG1、PSA<10、PSA-D<0.15、≤cT2a**」；「**AM 只看 PSA，所以轉移多**」；停 AS「**≥GG3 或 cribriform 就停**」。

### Ch.17 手術切緣 Surgical Margin Status (PSM)

**A. 一句話重點**
**Positive surgical margin（PSM）＝腫瘤細胞接觸到 inked surface**，是 biochemical recurrence（BCR）的**獨立危險因子**，與病理分期（EPE）獨立；切緣的長度（focal vs extensive）與 margin 處 Gleason 影響預後。

**B. 必背定義與數字**
- **PSM 定義**：tumor cells 接觸 inked surface；Negative margin＝inked surface 無腫瘤（即使很近）；crush artifact 可能妨礙判讀。
- **Margin status ≠ EPE**；PSM 與 pathological stage **獨立**。
- PSM 為 **BCR 獨立危險因子**。
- 切緣範圍：**Focal ≤1 mm、Extensive >1 mm**；PSM block 數目也重要。
- Margin 處 **Gleason score** 獨立預測結果。
- 16 篇回顧：margin length（<3 mm vs >3 mm）對 BCR-free survival 有預後價值。

**C. 臨床判斷流程**
```
RP 病理 → 評估 margin（inked surface 有無腫瘤）
PSM(+) → BCR 獨立風險 → 加強監測 ± adjuvant/salvage RT
focal vs extensive、margin Gleason → 風險分層
```

**D. 診斷工具與適應症**
- RP 病理切緣判讀。

**E. 治療策略**
- PSM → 考慮 adjuvant/salvage RT（依整體風險）。

**F. 考試高頻重點**
1. PSM＝腫瘤接觸 inked surface；為 BCR 獨立因子。
2. Margin status 與 EPE/病理分期獨立。
3. Focal ≤1 mm、Extensive >1 mm。
4. Margin 處 Gleason 獨立預測。

**G. 容易混淆比較表**

| | Positive margin | EPE |
|---|---|---|
| 定義 | 腫瘤接觸 inked surface | 腫瘤超出攝護腺外 |
| 關係 | 彼此獨立 | 彼此獨立 |

**H. 臨床記憶法**
「**碰到墨水就是 PSM，跟 EPE 各算各的；focal≤1mm、extensive>1mm**」。

### Ch.18 系統治療概論：ADT、Taxane、PARPi、Immunotherapy

**A. 一句話重點**
ADT 目標達 **castration level（歷史 <50、現代以 <20 ng/dL 為佳）**，LHRH agonist 有 flare（需 anti-androgen 覆蓋）、antagonist 無 flare；docetaxel/cabazitaxel 為 taxane 化療主力；PARPi 用於 BRCA/HRR 突變、pembrolizumab 用於 MSI-H/dMMR。

**B. 必背定義與數字**
- **Castration level**：歷史 <50 ng/dL（1.7 nmol/L）；**最佳 <20 ng/dL（0.7 nmol/L）**；越低 oncologic outcome 越好。
- **達 castration 方法**：
  - Orchiectomy：立即、不可逆、cost-effective。
  - **LHRH agonist**：主流、depot；**有 flare risk**（需 anti-androgen 如 bicalutamide 覆蓋）。
  - **LHRH antagonist**：快速、**無 flare**、限月劑型。
  - Degarelix：快速抑制、PSA PFS 可能優於 leuprorelin。
  - **Relugolix（口服）**：CV profile 優於 leuprolide（MACE ↓54%）。
- **Taxane**：機轉—促進 microtubule polymerization／阻止 depolymerization、阻斷 mitotic spindle；docetaxel 另活化 NF-κB→mitochondrial apoptosis；cabazitaxel 阻斷 AR nuclear translocation（dynein）。
  - **Docetaxel**：mCRPC、mHSPC，改善 OS（standard of care）。
  - **Cabazitaxel**：post-docetaxel，docetaxel-resistant mCRPC 有效。
  - 副作用：neutropenia、peripheral neuropathy、myalgia、arthralgia。
- **PARPi**：阻斷 single-strand DNA repair，BRCA1/2 或 HR-deficient 腫瘤 synthetic lethality；mCRPC 帶 HRR mutation 療效佳。
- **Immunotherapy（pembrolizumab，PD-1）**：FDA 核准用於 **MSI-H/dMMR PCa（tumor-agnostic）**；EMA 未核准；未篩選族群療效有限。

**C. 臨床判斷流程**
```
需 ADT → orchiectomy / LHRH agonist(加 anti-androgen 防 flare) / antagonist
目標 testosterone <20 ng/dL
mHSPC/mCRPC → ± docetaxel
docetaxel 失敗 → cabazitaxel
BRCA/HRR(+) → PARPi
MSI-H/dMMR(+) → pembrolizumab
```

**D. 診斷工具與適應症**
- 系統治療前須 germline/somatic（HRR、MSI-H/dMMR）檢測引導標靶。

**E. 治療策略**
- 保守：AS/WW（前章）。
- 藥物：ADT（agonist/antagonist/relugolix）、docetaxel/cabazitaxel、PARPi、pembrolizumab。
- 內視鏡/手術：RP、ePLND（前章）。
- 適應症：依風險、轉移、基因。

**F. 考試高頻重點**
1. Castration level 歷史 <50、最佳 <20 ng/dL。
2. LHRH agonist 有 flare（需 anti-androgen）；antagonist 無 flare。
3. Relugolix 口服、MACE ↓54%。
4. Docetaxel 改善 OS（mHSPC/mCRPC）；cabazitaxel post-docetaxel。
5. PARPi → BRCA/HRR；pembrolizumab → MSI-H/dMMR（無 EMA）。

**G. 容易混淆比較表**

| | LHRH agonist | LHRH antagonist |
|---|---|---|
| Flare | **有**（需 anti-androgen） | **無** |
| 起效 | 較慢 | 快速 |
| 劑型 | depot 多選擇 | 限月劑型 |

| 標靶 | 適應症 |
|---|---|
| PARPi | BRCA1/2、HRR mutation |
| Pembrolizumab | MSI-H/dMMR |

**H. 臨床記憶法**
「**agonist 會 flare（先給 bicalutamide），antagonist 不 flare**」；castration「**目標 20 比 50 好**」；標靶「**BRCA→PARP、MMR→pembro**」。

### ✍️ 10 道單選題（含答案與解析）

**Q1.** 關於 PSA 篩檢起始年齡，下列何者正確？
(A) 一般男性 45 歲
(B) BRCA2 帶因者 40 歲
(C) 非洲裔 50 歲
(D) 所有人 40 歲

<details><summary>答案</summary>

**B**。一般 50、家族史/非洲裔 45、**BRCA2 帶因 40**。餘命<15 年且無症狀者不建議檢測。
</details>

**Q2.** 一位使用 finasteride（5-ARI）的男性，量得 PSA 2.0 ng/mL，判讀時應如何校正？
(A) 維持 2.0
(B) 視為 1.0
(C) 視為約 4.0（×2）
(D) 視為 0.5

<details><summary>答案</summary>

**C**。5-ARI 使 PSA **下降約 50%**，判讀時應 ×2（約 4.0）。此外 5-ARI 可降 PCa 風險 25%（主要 GG1）。
</details>

**Q3.** PI-RADS 4 病灶的 csPCa 偵測率約為？
(A) 6%
(B) 20%
(C) 55%
(D) 83%

<details><summary>答案</summary>

**C**。PI-RADS 1–2:6%、3:20%、**4:55%**、5:83%。MRI 為 csPCa 偵測的標準影像。
</details>

**Q4.** 關於 PSA density（PSA-D），下列何者正確？
(A) ＝PSA × 攝護腺體積
(B) csPCa 風險 cut-off 為 0.15 ng/mL/cc
(C) TAUS 是最準的體積估計法
(D) <0.09 代表高風險

<details><summary>答案</summary>

**B**。PSA-D＝PSA/體積，**cut-off 0.15**；<0.09 為低風險（4%）。體積估計以 **MRI 最準**（TAUS 高估、不建議）。
</details>

**Q5.** 關於 hereditary prostate cancer 的定義，下列何者符合？
(A) ≥2 位一等親罹病
(B) 同家族 ≥3 例或連續 3 代或 ≥2 例 <55 歲診斷
(C) 僅 1 位二等親罹病
(D) 任何 BRCA 帶因即算

<details><summary>答案</summary>

**B**。Hereditary＝**≥3 例／3 代／≥2 例 <55 歲**；(A) 是 familial 的定義。
</details>

**Q6.** 經直腸（TR）相較經會陰（TP）攝護腺切片，敗血症相對風險（RR）約為？
(A) 0.5
(B) 1.0
(C) 2.48
(D) 5.0

<details><summary>答案</summary>

**C**。TR vs TP sepsis **RR 2.48**（TP 0.1% vs TR 0.9%）。TP 為首選；TR 須 povidone-iodine ± 抗生素。
</details>

**Q7.** 關於 PSMA PET/CT，下列何者**錯誤**？
(A) PSMA 在 >90% PCa 細胞過度表現
(B) 用於 high-risk/locally advanced PCa 分期
(C) 對 <4 mm 小淋巴結偵測極佳、無偽陽性
(D) 骨轉移偵測優於 bone scan

<details><summary>答案</summary>

**C**。PSMA PET **小 LN（<4 mm/micromet）易漏**，且發炎/ganglia/fracture 可偽陽性。其餘正確。
</details>

**Q8.** ProtecT 試驗（15 年）中，下列何者正確？
(A) Active Monitoring 組 PCa-specific 存活率明顯低於手術組
(B) 三組 CSS 皆 >96%，但 AM 組轉移率最高（9.4%）
(C) AM 組使用 MRI 與 repeat biopsy
(D) 手術組 15 年 CSS 僅約 80%

<details><summary>答案</summary>

**B**。三組 15 年 CSS 皆 >96%（AM 96.9、RP 97.8、EBRT 97.1），**AM 轉移 9.4% 最高**；AM 僅用 PSA、無 MRI/biopsy。
</details>

**Q9.** 下列哪一組病人**最適合**納入 Active Surveillance？
(A) ISUP GG3、PSA 15
(B) ISUP GG1、PSA 6、PSA-D 0.10、cT2a
(C) cribriform pattern、PSA 8
(D) 有 LVI、PSA 5

<details><summary>答案</summary>

**B**。AS 納入：**GG1、PSA<10、PSA-D<0.15、≤cT2a**，排除 cribriform/ductal/sarcomatoid/small cell、LVI/EPE/PNI。
</details>

**Q10.** 關於 ADT，下列何者正確？
(A) LHRH agonist 無 flare 風險
(B) LHRH antagonist 起效慢
(C) 現代理想 castration level 為 testosterone <20 ng/dL
(D) Relugolix 為靜脈注射劑

<details><summary>答案</summary>

**C**。castration 歷史 <50、**理想 <20 ng/dL**。LHRH agonist **有 flare**（需 anti-androgen 覆蓋）、antagonist 無 flare 且起效快；**relugolix 為口服**（MACE ↓54%）。
</details>

### 🗣️ 5 道口試題（含標準答案）

**口試 1：請說明攝護腺切片應如何選擇途徑與預防感染。**
<details><summary>標準答案</summary>

優先選擇**經會陰（transperineal, TP）切片**：csPCa 偵測率與經直腸（TR）相當，但**感染/敗血症明顯較低**（TP sepsis 0.1% vs TR 0.9%，RR 2.48；PREVENT trial TP 0% vs TR 1.4%），且可在局部麻醉下進行、符合抗生素管理目標。TP 切片有無預防性抗生素差異不大。若採 TR，切片前以 **povidone-iodine** 直腸消毒（RR 0.47）並給抗生素（RR 0.56）；因 fluoroquinolone 抗藥性上升，可考慮 fosfomycin、cephalosporin 或 rectal swab-guided 標靶預防。切片後 PSA 會升高，需 ≥1 個月再驗。
</details>

**口試 2：請比較 Active Surveillance、Watchful Waiting 與 ProtecT 的 Active Monitoring。**
<details><summary>標準答案</summary>

**AS** 為**治癒意圖**，對象為低風險與選擇性 favourable intermediate-risk、餘命 ≥10 年，採固定 protocol 追蹤（PSA、DRE、MRI、repeat/confirmatory biopsy），於 reclassification（GG upgrade、腫瘤量增）時轉根除治療。**WW** 為**緩和意圖**，對象為餘命 <10 年或高共病、不適合治癒者，採症狀導向追蹤，延後緩和性 ADT 至症狀進展（早期 ADT 考慮 PSA DT<12 月、PSA 30–50）。**ProtecT 的 AM** 僅用 **PSA 監測、無 MRI/biopsy**，故 15 年轉移率（9.4%）高於正規 AS protocol，雖然三組 CSS 皆 >96%。臨床上應採含 MRI 與切片的正規 AS，而非單純 PSA 監測。
</details>

**口試 3：一位 52 歲男性 PSA 6 ng/mL、DRE 正常、無感染證據，請說明後續評估流程。**
<details><summary>標準答案</summary>

此為 PSA 4–10 灰色地帶。先排除干擾因素（UTI、尿滯留、近期切片、5-ARI 使用）並於同實驗室重驗。可運用**生物標記**（PHI、4Kscore；台灣 PHI 健保適應症：PSA 4–10、排除攝護腺感染/發炎、DRE 正常、≥50 歲或有家族史，本例符合）與 **PSA density**（搭配 MRI 量體積，cut-off 0.15）做風險分層，並安排 **mpMRI（PI-RADS 評分）**。PI-RADS ≥3 則安排 MRI-targeted 切片（每病灶 ≥3–5 cores，加同側 peri-lesional），優先經會陰途徑。risk calculator（ERSPC/PCPT-RC）可協助決定是否切片，以減少不必要的切片與低惡性偵測。
</details>

**口試 4：請說明基因檢測在攝護腺癌的角色（germline vs somatic）及其治療意涵。**
<details><summary>標準答案</summary>

**Germline 檢測**（血液/唾液）用於強家族史、診斷 ≤55 歲、metastatic/high-risk/intraductal PCa，panel 含 BRCA1/2、HOXB13、ATM、CHEK2、DNA MMR genes；需檢測前後遺傳諮詢，並可作家族 cascade screening。**Somatic 檢測**（腫瘤組織，轉移病灶為佳）用於 metastatic 病人引導標靶治療，包含 **HRR panel**（BRCA1/2、ATM、PALB2、FANCA、RAD51D、CHEK2、CDK12）與 **MSI-H/dMMR**（mCRPC 必做）、TMB（HIGH ≥10 mut/Mb）。治療意涵：BRCA1/2 或 HRR 突變 → **PARP inhibitor**（synthetic lethality）；MSI-H/dMMR → **pembrolizumab**（tumor-agnostic）並評估 Lynch syndrome。ctDNA 可在無法切片時替代，但 PSA undetectable 時避免、並注意 CHIP 偽陽性。
</details>

**口試 5：請說明 PSMA PET/CT 在攝護腺癌分期的適應症、優勢與限制。**
<details><summary>標準答案</summary>

**適應症**：high-risk localized 或 locally advanced PCa 的初次分期、negative MRI but rising PSA、curative 手術/RT 或 metastasis-directed therapy 前評估範圍、post-biopsy upstaging。**優勢**：PSMA 在 >90% PCa 過度表現、tumor-to-background 高；對 pelvic LN（>4 mm）敏感度 ~75%、特異度 >95%，骨轉移較 bone scan 更早偵測；proPSMA trial 顯示 accuracy 92% vs 傳統 65%、輻射劑量更低（8.4 vs 19.2 mSv）、改變管理 28%。整合 CAPRA 可提升 BCR-free survival 預測。**限制**：小淋巴結（<4 mm/micromet）易漏；發炎、ganglia、fracture 可偽陽性；可近性、費用與給付不一；判讀標準仍演進中。
</details>

### 🏆 Top 20 必背重點（考前 10 分鐘速掃）

1. **PSA 篩檢年齡**：一般 50／家族史·非洲裔 45／**BRCA2 40**；餘命<15 年無症狀不檢測。
2. **Baseline PSA <1@60 歲** → 85 歲前死亡風險 ≤0.2%。
3. **PSA 干擾**：UTI/retention/biopsy ↑；**5-ARI ↓50%（×2）**；DRE 不變；切片後 ≥1 月再驗。
4. **PSA-D ＝PSA/體積，cut-off 0.15**；<0.09 低風險；MRI 量體積最準。
5. **ERSPC mortality reduction 21–29%**；NNS 隨追蹤拉長而下降。
6. **PI-RADS csPCa 偵測率：6 / 20 / 55 / 83%**（1–2/3/4/5）；MRI 為標準影像。
7. **影像互補**：MRI→anterior、micro-US→apex；PSMA ↑NPV/敏感度、↓特異度。
8. **生物標記用於 PSA 2–10**；PHI 含 [-2]proPSA、4Kscore≈PHI；台灣 PHI 健保四條件。
9. **遺傳定義**：Hereditary＝≥3 例/3 代/≥2 例<55 歲；Familial＝≥2 一等親。
10. **基因檢測**：germline=血液、somatic=腫瘤；HRR→PARPi；**MSI-H/dMMR→pembro＋查 Lynch**；TMB-H≥10。
11. **切片途徑**：**TP sepsis 0.1% < TR 0.9%（RR 2.48）**；TP 首選；TR 用 povidone-iodine＋抗生素。
12. **MRI-targeted**：每病灶 ≥3–5 cores＋同側 peri-lesional；90% 半徑 PI-RADS 5=5.5、4=12、3=16 mm。
13. **PSMA PET**：>90% PCa 表現；high-risk 分期；LN 敏感度~75%/特異>95%；偽陽性發炎/ganglia/fracture。
14. **ePLND**：準確分期、**無存活效益**；lymphocele 最常見；peritoneal flap 改善（PELYCAN 27%→10%）。
15. **CAPRA** 五變數（PSA、Gleason、T、% cores、Age）；**proPSMA accuracy 92% vs 65%**、輻射 8.4 vs 19.2 mSv。
16. **Fitness**：**G8 >14 fit／≤14 做 CGA**；CFS 1–9；不以年齡決定治療。
17. **AS vs WW**：AS 治癒意圖/>10 年/密集追蹤(PSA+MRI+biopsy)；WW 緩和/<10 年/症狀導向。
18. **ProtecT 15 年**：三組 CSS 皆 >96%；**AM（純 PSA）轉移 9.4% 最高**；SPCG-4(pre-PSA)RP 優、PIVOT(PSA)OS 無差異。
19. **AS 納入**：**GG1、PSA<10、PSA-D<0.15、≤cT2a**；favourable intermediate(low-vol GG2、cores≤2)可 AS；≥GG3/cribriform 停 AS。
20. **ADT/系統**：castration 理想 <20 ng/dL；**agonist 有 flare(加 bicalutamide)、antagonist 無**、relugolix MACE↓54%；docetaxel(OS)、cabazitaxel(post-doce)；**PARPi→BRCA/HRR、pembro→MSI-H/dMMR**；**PSM 為 BCR 獨立因子、與 EPE 獨立**。
