# 📗 Section 2：各章節高效率學習筆記（A–H 格式）

---

## 【主題一】腎上腺解剖生理與功能性腫瘤評估

**A. 一句話重點**
腎上腺＝**皮質（3 層，由外到內分泌 mineralocorticoid → glucocorticoid → androgen）＋髓質（分泌 catecholamine）**；任何 adrenal mass 都必須先做「**功能性評估＋排除 pheochromocytoma**」再決定處置。

**B. 必背定義／分泌對應（口訣 GFR → 鹽糖性）**
- **Zona Glomerulosa**（最外）→ **Mineralocorticoid（aldosterone）**；受 **angiotensin II（RAAS）＋血鉀** 調控；**是腦下垂體衰竭時唯一不萎縮的皮質層**。
- **Zona Fasciculata**（中）→ **Glucocorticoid（cortisol）**；受 ACTH 調控。
- **Zona Reticularis**（內）→ **Androgen（DHEA）**。
- **Medulla（髓質）**→ **Catecholamine（epinephrine, norepinephrine, dopamine）**；由 tyrosine 合成，受**節前交感神經**支配。
- Cortisol 有日夜節律：**早晨最高、約 23:00（11 PM）最低**。

**C. 臨床判斷流程（Adrenal mass / incidentaloma）**
```
發現 adrenal mass
  → ① 功能性檢查（必做，含排除 pheochromocytoma）
       - Low-dose dexamethasone suppression test / 午夜唾液或 24h 尿 cortisol（查 Cushing）
       - 24h 尿/血漿 free metanephrines（查 pheochromocytoma）
       - 若高血壓 → 晨起 aldosterone-to-renin ratio (ARR) + aldosterone（查 PA）
  → ② 影像評估惡性風險（大小、HU、邊界、washout）
  → 功能性 / >4 cm / 影像疑惡性 / 追蹤長大>1cm → 手術
  → 非功能性、良性影像、≤4cm → 6/12/24 月追蹤影像，功能檢查每年×4 年
```

**D. 診斷工具與適應症**
- **Unenhanced CT（HU 值）**：良性腺瘤富含脂質 → **HU < 10**；pheochromocytoma 與惡性 → **HU > 10**。
- **CT washout（延遲洗脫）**：腺瘤 rapid washout；pheochromocytoma **不會** rapid washout（考點）。
- **18F-FDG PET**：區分良惡性，敏感度/特異度可達 ~97%/91%。
- **生化**：dexamethasone suppression、metanephrines、ARR。

**E. 治療策略（Adrenalectomy 適應症總整理）**
- **功能性腫瘤**：cortisol / aldosterone / catecholamine 過度分泌。
- **Mass > 4 cm**（myelolipoma 除外）。
- **影像疑惡性**（lipid-poor、不均質、邊界不規則、侵犯周邊）。
- **Incidentaloma 追蹤長大 > 1 cm**。
- **孤立性 adrenal metastasis**（需多科決策）、RCC 手術中發現腎上腺異常或 vein thrombus 到 adrenal vein。
- 腹腔鏡 adrenalectomy **絕對禁忌**（考題 Q39 答案 C）：**腎上腺皮質癌合併下腔靜脈血栓**（需開放手術完整切除，避免腫瘤破裂播種）。

**F. 考試高頻重點**
1. **Zona glomerulosa = 唯一不因腦下垂體衰竭而萎縮的皮質層**（因受 RAAS 而非 ACTH 主控）。
2. 分泌口訣 **GFR = 鹽（aldo）、糖（cortisol）、性（androgen）**。
3. Aldosterone 主要受 **angiotensin II ＋血鉀** 調控。
4. **HU > 10 → 不是單純腺瘤**；pheochromocytoma 無 rapid washout。
5. 腹腔鏡腎上腺切除絕對禁忌 = **ACC 有下腔靜脈血栓**。
6. 所有 adrenal mass 術前都要**排除 pheochromocytoma**（避免術中高血壓危象）。

**G. 容易混淆比較表**
| 皮質層 | 分泌 | 主控 | 萎縮(垂體衰竭)? |
|---|---|---|---|
| Glomerulosa | Aldosterone | AngII＋K⁺ | **否** |
| Fasciculata | Cortisol | ACTH | 是 |
| Reticularis | Androgen | ACTH | 是 |

**H. 臨床記憶法**
- **GFR ＝ Salt, Sugar, Sex**（由外到內）。
- 「**Glomerulosa 靠血管(RAAS)不靠腦(ACTH)，所以垂體壞了它不萎縮**」。
- HU 口訣「**脂多則良，HU 低於 10**」。

---

## 【主題二】Cushing Syndrome（庫欣氏症候群）

**A. 一句話重點**
腎上腺腫瘤分泌 cortisol 造成的是 **ACTH-independent Cushing**（約佔非外源性 Cushing 的 10%）；臨床見 moon face、central obesity、purple striae、buffalo hump，泌尿科可能以 **urolithiasis 或性腺低下** 表現。

**B. 必背定義／數字**
- Cortisol 高峰在**清晨**、最低點約 **11 PM**。
- **內源性 Cushing 病因**：ACTH-dependent（**pituitary ~70%＝Cushing disease 最常見**、ectopic ACTH 10–15%、CRH <1%）；ACTH-independent（**primary adrenal ~10%**）。
- 高發症狀（盛行率）：central obesity / moon face ~90–100%、purple striae / hypertension / 月經與性功能異常 70–90%、muscle weakness / buffalo hump 50–70%。
- **Adrenal mass 一定要檢測 cortisol hypersecretion（mandatory）**。

**C. 臨床判斷流程**
```
疑 Cushing → 確認有無高皮質醇
  → 篩檢：1mg overnight dexamethasone suppression / 午夜唾液 cortisol / 24h 尿游離 cortisol
  → 確診後測 ACTH 區分 dependent vs independent
        ├─ ACTH 低（independent）→ 影像找 adrenal tumor → adrenalectomy
        └─ ACTH 高（dependent）→ pituitary MRI / 找 ectopic source
```

**D. 診斷工具與適應症**
- 篩檢三選一：**low-dose DST、午夜唾液 cortisol、24h 尿游離 cortisol**。
- **血漿 ACTH**：區分 dependent / independent。
- 影像：adrenal CT（independent）；pituitary MRI（dependent）。

**E. 治療策略**
- **腎上腺源（ACTH-independent）**：手術切除腫瘤（adrenalectomy），術後須補充類固醇（對側因長期抑制而萎縮）。
- Cushing disease：經蝶竇切除腦下垂體腺瘤；失敗時可考慮**雙側腎上腺切除**。

**F. 考試高頻重點**
1. 腎上腺腫瘤分泌 cortisol = **ACTH-independent**，約佔 10%。
2. Cushing disease（pituitary）是內源性 Cushing 最常見原因（~70%）。
3. 篩檢工具三件組要記熟。
4. Adrenal mass 檢測 cortisol 為**強制**。
5. 術後注意 **adrenal insufficiency**（需類固醇補充）。

**G. 容易混淆比較表**
| 類型 | ACTH | 機轉 | 占比 |
|---|---|---|---|
| Cushing disease | 高 | pituitary ACTH 瘤 | ~70% |
| Ectopic ACTH | 高 | 肺小細胞癌等 | 10–15% |
| Adrenal Cushing | **低** | 腎上腺自主分泌 | ~10% |
| Iatrogenic | 低 | 外源類固醇 | 最常見(整體) |

**H. 臨床記憶法**
- 「**Disease 在腦(pituitary)、Syndrome 看全身**」；adrenal 源 ACTH 被壓低。
- 泌尿科看到**年輕高血壓＋結石＋性腺低下** → 想 Cushing。

## 【主題三】Primary Aldosteronism（原發性醛固酮增多症 / Conn）

**A. 一句話重點**
PA 是續發性高血壓最常見的可矯正原因，**多數病人血鉀正常（normokalemic）**；診斷靠 **ARR 篩檢 → 確診試驗 → 影像 ± 腎上腺靜脈取樣（AVS）判斷單側/雙側**。

**B. 必背定義／數字**
- 病因分布：**bilateral hyperplasia（IHA）~60%（最多）**、**aldosterone-producing adenoma ~35%**、unilateral hyperplasia 2%、carcinoma <1%、家族性 <1%。
- **多數現代病例為 normokalemic**（低血鉀不是必要條件）。
- PA 較 essential HTN 有**更高的標的器官損傷風險**。
- **篩檢適應症（高頻）**：高血壓＋低血鉀、頑固型高血壓（≥3 種藥控制不良）、adrenal incidentaloma 合併高血壓、早發高血壓(<20 歲)或早發 stroke(<50 歲)、**嚴重高血壓 ≥160/≥110**、不明原因低血鉀、標的器官損傷與高血壓程度不成比例、PA 家族史。

**C. 臨床判斷流程**
```
符合篩檢適應症 → 晨起 ARR（PAC/PRA）＋ aldosterone（停 K-sparing 利尿劑6週）
  → 陽性 → 確診試驗（鹽水負荷/口服鈉負荷等）
  → 確診 PA 且為手術候選 → adrenal CT
        ├─ 單側 nodule >1cm 且年輕(<35-40) → 可直接手術
        └─ 其餘 → 「腎上腺靜脈取樣 AVS」判斷 lateralization
                ├─ Lateralization(+) → 患側 adrenalectomy
                └─ Lateralization(-)/雙側 → 藥物治療(MRA)
```

**D. 診斷工具與適應症**
- **ARR（aldosterone-to-renin ratio）**：第一線篩檢。
- **確診試驗**：鹽水輸注、口服鈉負荷、fludrocortisone、captopril challenge。
- **Adrenal CT**：定位，但小腺瘤/雙側增生難分。
- **AVS（adrenal vein sampling）= 區分單側 vs 雙側的 gold standard**：先用 **cortisol gradient（R/I、L/I）** 確認取樣成功（selective），再算 aldosterone ratio 判斷 lateralization；A=aldosterone、C=cortisol，比較 (A顯性/C顯性)/(A非顯性/C非顯性)。

**E. 治療策略**
- **單側（adenoma/單側增生，AVS lateralization +）**：**腹腔鏡 adrenalectomy**（可治癒或大幅改善）。
- **雙側增生（IHA）或非手術候選**：**Mineralocorticoid receptor antagonist（spironolactone / eplerenone）**。

**F. 考試高頻重點**
1. PA 多數 **normokalemic**（別只想到低血鉀）。
2. 病因最多 = **bilateral hyperplasia (~60%)**，其次 adenoma (~35%)。
3. 篩檢首選 = **ARR**。
4. **AVS 用 cortisol gradient 確認取樣成功，再判斷 aldosterone lateralization**。
5. 嚴重高血壓門檻 **≥160/≥110** 列入篩檢。
6. 雙側 → 藥物（MRA）；單側 → 手術。

**G. 容易混淆比較表**
| 項目 | Adenoma (APA) | Bilateral hyperplasia (IHA) |
|---|---|---|
| 占比 | ~35% | ~60% |
| AVS | 單側 lateralization | 無 lateralization |
| 治療 | 手術 | MRA 藥物 |

**H. 臨床記憶法**
- 「**篩 ARR、確認 saline、定位 AVS**」三步驟。
- AVS 先看 **cortisol（C）確認針有插對**，再看 **aldosterone（A）分左右**。
- **單側開刀、雙側吃藥**。

## 【主題四】Pheochromocytoma（嗜鉻細胞瘤）★ 術前準備經典考點

**A. 一句話重點**
嗜鉻細胞瘤分泌過量 catecholamine，診斷靠 **metanephrines**，**惡性只能由是否轉移定義**；術前必須**先 α-block 再 β-block**，順序顛倒會致命性高血壓危象。

**B. 必背定義／數字**
- **約 25% 看似偶發者，基因檢測後其實為遺傳性**（高頻數字）。
- 「**10% 法則**」（傳統）：10% 雙側、10% 腎上腺外（paraganglioma）、10% 惡性、10% 兒童、10% 家族性——但現代認為遺傳比例更高（~25–40%）。
- **遺傳症候群**：MEN 2A/2B（**RET**，pheo 風險~50%）、von Hippel-Lindau type 2（**VHL**，RCC＋pheo）、NF1（**NF1**）、家族性 paraganglioma（**SDHB/SDHD**，SDHB 惡性風險高）。
- 影像：unenhanced CT **HU > 10**、血管豐富、**無 rapid washout**、可囊狀壞死；**脂質含量高不是其特徵**（考題 Q42 答案 B）。
- 即使手術預後佳，**高達 16% 多年後仍可能復發**（Q41 選項）。

**C. 臨床判斷流程**
```
疑 pheochromocytoma（陣發性高血壓、頭痛、心悸、盜汗）
  → 測 plasma/24h urine fractionated metanephrines（首選）
  → 影像定位（CT/MRI；必要時 MIBG/DOTATATE）
  → 術前準備：α-blockade 先行 7-14 天
        → （若出現 tachycardia/arrhythmia 才加）β-blockade
        → ± metyrosine（兒茶酚胺合成抑制）
        → 術前擴充血容量、高鈉飲食
  → 手術切除（腹腔鏡 / 開放），術中小心血壓波動
  → 長期追蹤（可能復發、遺傳篩檢）
```

**D. 診斷工具與適應症**
- **Fractionated metanephrines（血漿/24h 尿）= 現代生化診斷基石**（normetanephrine＋metanephrine）。
- 定位：CT/MRI；功能影像 **MIBG、¹⁸F-FDG PET、DOTATATE**（找腎上腺外/轉移）。
- 基因檢測：建議所有患者考慮（遺傳比例高）。

**E. 治療策略（術前準備為重中之重）**
- **第一步 α-blockade**：phenoxybenzamine（非選擇性，10mg PO bid 起，每 2–3 天加 10–20mg，總量約 1mg/kg；**手術前一晚最後一劑，當天早上不給以免術後低血壓**）；或選擇性 α1（doxazosin）。亦可用 **CCB（amlodipine 等）** 作為替代/輔助。
- **第二步（必要時）β-blockade**：**務必在足夠 α-block 之後**才開始（atenolol/metoprolol），用於控制 α-block 後的反射性心搏過速/心律不整。
- ⚠️ **絕對不可先給 β-blocker**：未 α-block 下，β 拮抗會阻斷 β2 介導的小動脈舒張，使 α1 的血管收縮作用無對抗 → 高血壓危象（考題 Q41 選項 C 描述此機轉）。
- **catecholamine synthesis blockade**：metyrosine。
- 術前**擴容**（IV fluids、高鈉），術中麻醉團隊嚴密監測。

**F. 考試高頻重點**
1. **術前順序：先 α 後 β，絕不可顛倒**（最經典考點）。
2. 診斷首選 = **fractionated metanephrines**。
3. **惡性只能由轉移定義**（無法靠組織學單獨判定，Q41 選項 A）。
4. unenhanced CT **HU > 10**、**無 rapid washout**；脂質含量高**不是**其特徵（Q42）。
5. 約 **25%** 偶發者其實遺傳；MEN2(RET)/VHL/NF1/SDHx。
6. 即使預後好，**~16% 多年後復發** → 需長期追蹤。
7. 血壓正常無症狀者**仍建議術前 α-block**（無症狀不等於不需準備）。

**G. 容易混淆比較表**
| 影像特徵 | Pheochromocytoma | Lipid-rich adenoma |
|---|---|---|
| Unenhanced HU | **>10** | <10 |
| Rapid washout | **無** | 有 |
| 血管 | 豐富 | 一般 |
| 脂質 | 低 | 高 |

| 症候群 | 基因 | 關聯腫瘤 |
|---|---|---|
| MEN2A/2B | RET | 甲狀腺髓質癌、副甲狀腺 |
| VHL type2 | VHL | RCC、視網膜/CNS血管母細胞瘤 |
| NF1 | NF1 | 神經纖維瘤、café-au-lait |
| Paraganglioma | SDHB/SDHD | SDHB 惡性風險高 |

**H. 臨床記憶法**
- **「Alpha first, Beta later」**——先擋 α 再擋 β。
- 「**惡性 = 轉移**」（pheo 沒有組織學良惡性絕對標準）。
- 25% 隱藏遺傳 → 「**看似散發，實則家族**」。

## 【主題五】Adrenal Cortical Carcinoma（ACC）與腎上腺轉移

**A. 一句話重點**
ACC 罕見但惡性度高，**腫瘤越大惡性風險越高**，多數 ACC 在診斷時為**功能性**；病理用 **Weiss criteria** 區分良惡性，治療為**手術為主＋mitotane 等多模式**。

**B. 必背定義／數字**
- **腫瘤大小與惡性顯著相關**（>4–6cm 風險升）。
- **Weiss criteria（9 項，區分良惡性）**：high nuclear grade（Fuhrman 3–4）、high mitotic rate（>5/HPF）、atypical mitoses、clear cell <25%、diffuse architecture、necrosis、venous invasion、sinusoidal invasion、capsular invasion。
- **多數 ACC 在診斷時為 functional**。
- 既往有惡性病史者新發現的 adrenal lesion，**>50% 為轉移**（但仍須代謝評估）；雙側且 bulky(>4cm) 才會造成 adrenal insufficiency。
- 兒童 ACC：**>90% 為功能性**，男性化（virilization）最常見表現（Q37 選項 E）。
- CIMP（CpG island hypermethylated phenotype）：**高度甲基化預後較差**（Q37 選項 A 為正確敘述；該題要選錯誤者）。
- FIRM-ACT trial：**mitotane + EDP（etoposide/doxorubicin/cisplatin）** 為全身治療首選，改善 ORR 與 PFS。

**C. 臨床判斷流程**
```
Adrenal mass（大、影像疑惡性）
  → 功能性評估（含排除 pheochromocytoma）
  → 影像分期（CT/MRI 看局部侵犯、IVC 血栓、轉移）
  → 可切除 → 開放完整 en-bloc 切除（避免破裂播種）
  → 多模式：mitotane ± EDP 化療、放療
  ⚠️ 疑 ACC 不建議經皮切片（播種風險；且 incidentaloma 切片首次常為 pheo→危險，Q43)
```

**D. 診斷工具與適應症**
- **影像**：CT（大小、HU、邊界、washout）、MRI（IVC 血栓）、**18F-FDG PET**（良惡性、轉移）。
- **生化**：cortisol、androgen、aldosterone、metanephrines。
- **病理（術後）**：Weiss criteria。
- **切片**：疑 ACC 或 pheochromocytoma **不建議**（Q43 答案 C：incidentaloma 切片常意外為 pheo，危險）。

**E. 治療策略**
- **手術**：完整 **en-bloc 開放切除**（ACC 有 IVC 血栓時為腹腔鏡絕對禁忌）。
- **藥物**：**mitotane**（腎上腺溶解劑）為核心；進展期合併 **EDP 化療（FIRM-ACT）**。
- **放療**：局部控制／輔助。
- **轉移性 adrenal lesion**：孤立可考慮手術，否則依原發癌治療。

**F. 考試高頻重點**
1. **腫瘤越大越可能惡性**。
2. **Weiss criteria** 區分良惡性（記得 mitosis>5/HPF、necrosis、venous invasion 等）。
3. 多數 ACC **診斷時為功能性**；兒童 ACC >90% 功能性、**男性化最常見**。
4. **mitotane + EDP（FIRM-ACT）** 為全身治療首選。
5. 高度 DNA 甲基化（CIMP）**預後較差**。
6. 疑 ACC/pheo **不要做切片**（播種、誘發危象）。
7. 既往癌症史新發 adrenal lesion **>50% 為轉移**。

**G. 容易混淆比較表**
| 項目 | 良性 adenoma | ACC |
|---|---|---|
| 大小 | 多 <4cm | 多 >4–6cm |
| HU | <10、washout 快 | 高、不均、washout 慢 |
| Weiss | <3 項 | ≥3 項 |
| 功能性 | 部分 | 多為功能性 |

**H. 臨床記憶法**
- 「**越大越壞**」（size↑ malignancy↑）。
- ACC 全身治療口訣 **「米托坦＋EDP」（mitotane + FIRM-ACT）**。
- 疑 ACC/pheo「**寧切勿戳**」（不要切片，直接手術）。

## 【主題六】Penile Cancer（陰莖癌）

**A. 一句話重點**
陰莖癌以 **squamous cell carcinoma** 為主；預後關鍵在**鼠蹊淋巴結（inguinal node）狀態**，治療趨勢為**原發病灶器官保留＋依風險分層處理淋巴結**。台灣罕見（112 年男性發生率第 31 位，約 110 例）。

**B. 必背定義／TNM（AJCC 8th, 2017）**
- **原發 T 分期**：
  - **Tis**：carcinoma in situ（PeIN）；**Ta**：非侵襲性局部 SCC。
  - **T1**：侵犯上皮下結締組織；**T1a**（無 LVI/PNI 且非 high grade）vs **T1b**（有 LVI/PNI 或 high grade/grade3/sarcomatoid）。
  - **T2**：侵犯 **corpus spongiosum**（±尿道）。
  - **T3**：侵犯 **corpus cavernosum（含 tunica albuginea）**（±尿道）。
  - **T4**：侵犯鄰近結構（陰囊、攝護腺、恥骨）。
- **cN（臨床）**：cN0 無；**cN1 單側可動單顆**；**cN2 單側可動≥2 顆或雙側**；**cN3 固定鼠蹊腫塊或骨盆淋巴結**。
- **男性原發尿道惡性腫瘤**（Q40 整理）：**前段尿道**多 SCC、**球狀尿道**多 adenocarcinoma、**後段尿道**多 urothelial carcinoma；前段腫瘤多於球狀；整體頻率 **urothelial > squamous > adenocarcinoma**（Q40 答案 D：前段尿道腫瘤位於陰莖尿道多於球狀——敘述須對照）。

**C. 臨床判斷流程**
```
陰莖病灶 → incisional/excisional biopsy（病理：grade、侵犯深度、LVI）
  → 原發 T 分期
  → 評估鼠蹊淋巴結（理學；可觸及 → CT；bulky → CT/PET）
        ├─ 不可觸及(cN0)
        │     ├─ 低風險(PeIN/Ta/T1a) → surveillance
        │     └─ 中高風險(≥T1b 或 ≥T2) → 影像 → 雙側 iLND 或 dynamic sentinel node biopsy
        └─ 可觸及 → 切片/影像 → 陽性 → ILND ± 骨盆淋巴結廓清 ± 新輔助 TIP 化療
  → 進展/轉移 → 化療(TIP)、ALPACA 顯示 avelumab 效果有限
```

**D. 診斷工具與適應症**
- **病灶切片**：grade、侵犯深度、血管/神經侵犯（決定後續淋巴結處理）。
- **鼠蹊淋巴結評估**：理學檢查為主；可觸及做 CT；bulky 用 CT/PET。
- **Dynamic sentinel node biopsy（DSNB）/ superficial inguinal dissection**：高風險、cN0 病人偵測微轉移。

**E. 治療策略**
- **原發病灶器官保留（organ preservation）**：適合**小病灶、低分級低期別（Tis/Ta/T1；grade1-2）**；方式含 limited excision、**Mohs surgery、laser ablation**、龜頭重修等；目標保留龜頭感覺與陰莖長度；復發率雖略高但分期相當下**存活率與截除術相當**（Q46 答案 D 為錯誤：器官保留復發/存活率「明顯較差」是錯的）。
- **截除術（Amputation）**：大型/深層侵犯（T2 以上）仍為標準。
- **淋巴結**：依 cN 與風險分層；**bulky/固定** 多需 **新輔助 TIP（paclitaxel/ifosfamide/cisplatin）化療 → ILND ± PLND**；骨盆淋巴結陽性加輔助治療。
- **進展期/鉑類失敗**：ALPACA 試驗 avelumab ORR 約 17%、PFS/OS 仍低，**非變革性**。

**F. 考試高頻重點**
1. T2 = corpus **spongiosum**；T3 = corpus **cavernosum**（記「海綿體 spongiosum 較淺 = T2」）。
2. **T1a vs T1b 差別 = 有無 LVI/PNI 或 high grade**。
3. cN1 單顆可動、cN2 多顆/雙側可動、cN3 固定或骨盆。
4. 小、低期低分級 → **器官保留**；器官保留存活率與截除相當（不是較差）。
5. 高風險 cN0 → **DSNB / 雙側 iLND**。
6. Bulky node → **新輔助 TIP 化療** 後手術。
7. 原發尿道癌：前段 SCC、球狀 adeno、後段 urothelial。

**G. 容易混淆比較表**
| T 分期 | 侵犯結構 |
|---|---|
| T1 | 上皮下結締組織（a/b 看 LVI/PNI/grade） |
| T2 | corpus spongiosum |
| T3 | corpus cavernosum (tunica albuginea) |
| T4 | 鄰近結構（陰囊/攝護腺/恥骨） |

**H. 臨床記憶法**
- 「**Spongiosum=2，Cavernosum=3**」（由淺到深 T 越大）。
- T1 **a乾淨、b壞**（b 有 LVI/PNI/high grade）。
- 淋巴結「**摸不到看風險，摸得到就處理，巨大先化療**」。

## 【主題七】Testicular Cancer（睪丸癌）★ 全章考點最密

**A. 一句話重點**
青壯年男性實質睪丸腫塊**視為 GCT 直到證實為止**，處置順序為**根除性睪丸切除（radical orchiectomy，經鼠蹊）→ 病理分型(seminoma vs NSGCT) → tumor marker ＋ 影像分期 → 依期別與 risk 分層治療**。台灣 112 年男性發生率第 19 位、約 320 例。

**B. 必背定義／分型／數字**
- **雙側 GCT 約佔 2%，以 metachronous（異時性）最常見**。
- 發生率：**白人最高、非裔最低**。
- **i(12p)（isochromosome 12p）**：post-pubertal GCT（spermatocytic 除外）幾乎都有 12 號染色體短臂多餘物質，**70–80% 為 i(12p)**；可作診斷輔助（找不到原發時）。
- 約 **5% GCT 為性腺外（extragonadal）**，最常見縱膈與後腹腔；**原發縱膈 NSGCT 預後差**。
- **Tumor markers 半衰期（必背）**：**AFP 半衰期 5–7 天**；**β-hCG 半衰期 24–36 小時**；LDH 反映腫瘤量。
  - **Seminoma 不分泌 AFP**（若 AFP 升高，即使病理是 seminoma 也按 NSGCT 治療）。
  - 轉移性 seminoma 約 **15% β-hCG 升高**。
- **畸胎瘤（teratoma）**：對化放療不敏感，殘餘需手術切除；即使轉移也常是其他 GCT 分化產物而非原發。
- **化療後 azoospermia**：幾乎所有 GCT 化療後造成 azoospermia；化療前精液正常者約 5 成可於 1 年內恢復。
- **青春期前 orchiopexy** 可將睪丸癌風險由 4–6 倍降至 2–3 倍。

**C. 臨床判斷流程**
```
青壯年無痛實質睪丸硬塊 → 陰囊超音波 + tumor markers(AFP/β-hCG/LDH)
  → 「經鼠蹊 radical orchiectomy」（禁經陰囊切片，避免播種）
  → 病理：Seminoma vs NSGCT（AFP 升=當 NSGCT 治療）
  → 分期：CT 胸腹骨盆 + 術後 marker
  → 依 stage 與 IGCCCG/NCCN risk 分層治療
        ├─ Seminoma：surveillance / carboplatin / RT / BEP
        └─ NSGCT：surveillance / nsRPLND / BEP
  → 進展期：BEP×3-4 或 EP/VIP，依 good/intermediate/poor risk
```

**D. 診斷工具與適應症**
- **陰囊超音波**：實質 vs 囊性。
- **Tumor markers（AFP、β-hCG、LDH）**：診斷、分期(S 分類)、追蹤、療效評估。
- **CT 胸腹骨盆**：分期；後腹腔 landing zone（右側睪丸→interaortocaval；左側→para-aortic）。
- **病理**：radical orchiectomy 標本確診與 pT 分期。
- ⚠️ **禁經陰囊切片/手術**（改變淋巴引流、播種風險）。

**E. 治療策略**
**Pure Seminoma**
- Stage IA/IB：**surveillance（強烈建議 pT1-3）** / 單劑 carboplatin (AUC7×1-2) / RT。
- Stage IIA/IIB：**<3cm** → RT（para-aortic＋同側 iliac，30Gy(1-2cm)/36Gy(2-3cm)）或 BEP×3/EP×4 或 **nsRPLND（新趨勢，COTRIMS 試驗支持）**；**3-5cm** → BEP×3 或 EP×4。
- Stage IIC/III：good risk → BEP×3 或 EP×4；intermediate → BEP×4 或 VIP×4。
- ⭐ 新趨勢：**RPLND 納入 CS IIA/B seminoma 治療選項**（COTRIMS：~90% 免化療、低併發症；mIR-371 可預測淋巴結轉移）。

**Nonseminoma (NSGCT)**
- Stage I 無風險因子：**surveillance（首選）** / nsRPLND / BEP×1。
- Stage I 有風險因子（LVI 等）：surveillance / BEP×1 / nsRPLND。
- Stage IIA/IIB：marker(-) → nsRPLND 或 BEP×3/EP×4；marker 持續升高 → 化療為主。
- 化療後殘餘腫塊：**畸胎瘤/壞死 → 手術切除殘餘；殘存 viable embryonal/yolk sac/chorio → 再化療**。

**★ Seminoma 治療演算法（依分期，NCCN 流程圖）**
```
根除性睪丸切除 → 病理 = Seminoma → 臨床分期
├ Stage IA / IB → ① Surveillance（首選，pT1-3）
│                 ② 單劑 Carboplatin（AUC7 ×1-2）
│                 ③ RT（para-aortic）
├ Stage IIA / IIB
│   ├ <3 cm → RT（para-aortic＋同側 iliac，30Gy[1-2cm]/36Gy[2-3cm]）
│   │         或 BEP×3 / EP×4
│   │         或 ns-RPLND（category 2B，新趨勢 COTRIMS）
│   │         或 Carboplatin + RT（category 2B）
│   └ 3–5 cm → BEP×3 或 EP×4
└ Stage IIC / III → 依 IGCCCG risk
        ├ Good risk → BEP×3 或 EP×4（category 1）
        └ Intermediate risk → BEP×4 或 VIP×4
   → Post first-line 化療後評估與追蹤（殘餘 seminoma 多觀察／PET 評估）
※ Seminoma 永遠沒有 poor risk
```

**★ Nonseminoma（NSGCT）治療演算法（依分期，NCCN 流程圖）**
```
根除性睪丸切除 → 病理 = NSGCT（含混合型、或 seminoma 組織但 AFP↑）→ 臨床分期
├ Stage I 無風險因子 → ① Surveillance（首選）
│                       ② ns-RPLND
│                       ③ Adjuvant BEP×1
├ Stage I 有風險因子（LVI／embryonal predominant）
│        → Surveillance 或 BEP×1 或 ns-RPLND
├ Stage IS（marker 持續/明顯升高）→ 化療為主（依 IGCCCG）
├ Stage IIA
│   ├ marker(-) → ns-RPLND 或 BEP×3 / EP×4
│   └ marker(+) → 化療（BEP×3 / EP×4）
└ Stage IIB
    ├ marker(-)：轉移在淋巴引流區內 → ns-RPLND；
    │            多發/有症狀或超出引流區 → 化療
    └ marker(+) → 化療
→ 化療後殘餘腫塊：畸胎瘤/壞死 → 手術切除；viable GCT → salvage 再化療
```

**進展期 Risk Classification（IGCCCG，post-orchiectomy）**
- **Good risk**：睪丸/後腹腔原發、無 nonpulmonary visceral mets、marker 低（AFP<1000、hCG<5000、LDH<1.5×ULN）→ BEP×3 或 EP×4。
- **Intermediate**：marker 中（AFP 1000–10000、hCG 5000–50000、LDH 1.5–10×ULN）→ BEP×4 或 VIP×4。
- **Poor risk（僅 NSGCT 有）**：縱膈原發、nonpulmonary visceral mets、或 marker 高（AFP>10000、hCG>50000、LDH>10×ULN）→ BEP×4 或 VIP×4。**Seminoma 永遠不會被歸為 poor risk**。

**F. 考試高頻重點**
1. 青壯年實質睪丸腫塊 = **GCT until proven otherwise**；**經鼠蹊 radical orchiectomy，禁經陰囊**。
2. **AFP 半衰期 5–7 天；β-hCG 半衰期 24–36 小時**。
3. **Seminoma 不分泌 AFP**（AFP↑→當 NSGCT 治療）；轉移性 seminoma ~15% hCG↑。
4. **i(12p)** 為 GCT 標誌；約 5% 為性腺外（縱膈 NSGCT 預後差）。
5. **Poor risk 只存在於 NSGCT，seminoma 沒有 poor risk**。
6. 化療幾乎都造成暫時 azoospermia；治療前可考慮**精子保存**。
7. Stage I seminoma 與 NSGCT 都以 **surveillance** 為優先。
8. CS IIA/B seminoma 新增 **nsRPLND** 選項（COTRIMS）。
9. 後腹腔 landing zone：**右睪丸→interaortocaval、左睪丸→para-aortic**。
10. 化療後畸胎瘤殘餘需**手術切除**（化放療無效）。

**G. 容易混淆比較表**
| 項目 | Seminoma | NSGCT |
|---|---|---|
| AFP | **不升高** | 可升高 |
| β-hCG | 約15%升 | 可升高 |
| 對放療 | 敏感 | 不敏感 |
| Poor risk | **無** | 有 |
| Stage I 首選 | surveillance | surveillance |
| 化療 | BEP/EP/carboplatin | BEP/EP/VIP |

| Marker | 半衰期 | 意義 |
|---|---|---|
| AFP | **5–7 天** | yolk sac/embryonal；seminoma 不分泌 |
| β-hCG | **24–36 小時** | choriocarcinoma、部分 seminoma |
| LDH | — | 腫瘤負荷量 |

**H. 臨床記憶法**
- 「**摸到實心硬塊，經鼠蹊拿掉，別碰陰囊**」。
- 半衰期口訣「**AFP 一週、hCG 一天多**」（5-7 天 vs 24-36 小時）。
- 「**Seminoma 不出 AFP、也沒 poor risk**」。
- Landing zone：「**右交叉(interaortocaval)、左主動脈旁(para-aortic)**」。

## 二、單選題 10 題（含原講義 Q37–46 考古題改寫，附答案詳解）

**1.（原Q39）** 腹腔鏡腎上腺切除術的絕對禁忌症？
(A) 明顯腹腔沾黏　(B) 腫瘤大於12公分　(C) **腎上腺皮質癌有血栓在下腔靜脈**　(D) 惡性嗜鉻細胞瘤　(E) 以上皆是
**答案：C**。ACC 合併 IVC 血栓需開放完整切除以避免腫瘤破裂播種，為腹腔鏡絕對禁忌。

**2.（原Q41）** 關於 pheochromocytoma 的敘述，何者**錯誤**？
(A) 惡性只能透過是否轉移定義
(B) 高達16%患者切除多年後仍可能復發
(C) **在沒有α-blockade情況下，β antagonists 會阻斷β1介導的小動脈舒張而增強腎上腺素對α1的作用**

(E) 嗜鉻細胞瘤 unenhanced CT 上 HU 通常>10
**答案：C（錯誤敘述，且 D 也錯）**。機轉是阻斷 **β2**（非β1）介導的血管舒張；且血壓正常者仍建議術前 α-block。本題標準答案 C。

**3.（原Q42）** 下列何者**並非**腎上腺嗜鉻細胞瘤的影像特點？

**答案：B**。嗜鉻細胞瘤脂質含量低、HU>10、無 rapid washout；脂質高是 lipid-rich adenoma 的特徵。

(D) 首次內分泌檢查若無異常、無變化則不必重複檢查（須再追蹤）
(E) 影像追蹤腫瘤變大超過1cm可安排手術

## 三、口試題 5 題（標準答案要點）

**Q1. 一名病人意外發現 4cm 腎上腺腫瘤，請說明你的評估流程。**
重點：① 完整**功能性評估**——dexamethasone suppression/尿 cortisol（Cushing）、fractionated metanephrines（pheochromocytoma，必排除）、若高血壓加 ARR（PA）。② 影像評估惡性風險——大小、unenhanced HU（>10 非單純腺瘤）、washout、邊界、FDG-PET。③ **功能性 / >4cm / 影像疑惡性 / 追蹤長大>1cm → 手術**；否則 6/12/24 月追蹤＋每年功能檢查×4 年。④ 疑 ACC/pheo **不切片**。

**Q2. Pheochromocytoma 的術前準備為何？順序與原理。**
重點：診斷靠 **metanephrines**。術前**先 α-blockade（phenoxybenzamine）7–14 天**，控制血壓並擴張血管；**必要時再加 β-blockade** 控制反射性心搏過速。⚠️ **絕不可先給 β**——未 α-block 時 β 拮抗會阻斷 β2 血管舒張，使 α1 收縮無對抗 → 高血壓危象。輔以 metyrosine、術前擴容（高鈉/IV fluids）。血壓正常無症狀者**仍需準備**；約 25% 有遺傳背景、~16% 可能復發，需追蹤與基因檢測。

**Q3. Primary aldosteronism 的診斷流程與 adrenal vein sampling 的角色。**
重點：符合篩檢適應症（含嚴重高血壓≥160/110、頑固高血壓、低血鉀、incidentaloma+HTN）→ **ARR 篩檢** → 確診試驗 → adrenal CT。**AVS 是區分單側 vs 雙側的 gold standard**：先用 **cortisol gradient（R/I、L/I）** 確認取樣 selective，再以 aldosterone ratio 判斷 lateralization。單側 → 手術；雙側增生 → MRA 藥物。多數病人 normokalemic。

**Q4. 青壯年男性無痛睪丸硬塊，請說明診斷與治療原則。**
重點：陰囊超音波＋ **tumor markers（AFP/β-hCG/LDH）**；**經鼠蹊 radical orchiectomy，禁經陰囊**（播種）。病理分 seminoma/NSGCT（**AFP 升高即按 NSGCT 治療，seminoma 不分泌 AFP**）。CT 分期、術後 marker。Stage I 兩者皆以 **surveillance** 為優先；進展期依 **IGCCCG good/intermediate/poor** 給 BEP/EP/VIP（**poor risk 僅 NSGCT**）。化療後畸胎瘤殘餘需手術。提醒**精子保存**。

**Q5. 陰莖癌的淋巴結處置原則。**
重點：預後關鍵在鼠蹊淋巴結。**cN0**：低風險(PeIN/Ta/T1a)→surveillance；中高風險(≥T1b/≥T2)→影像＋**雙側 iLND 或 dynamic sentinel node biopsy**。**可觸及/cN+**：切片/影像確認→**ILND ± 骨盆淋巴結廓清**。**Bulky/固定淋巴結**→**新輔助 TIP 化療**後再手術，骨盆陽性加輔助治療。進展期/鉑類失敗 avelumab(ALPACA)效果有限。

## 四、Top 20 必背考點（背誦優先序）

1. Pheochromocytoma 術前 **先 α-blockade 再 β-blockade，絕不可顛倒**。
2. Pheochromocytoma 診斷首選 **fractionated metanephrines**；**惡性只由轉移定義**。
3. 嗜鉻細胞瘤影像：**HU>10、無 rapid washout、脂質低**（脂質高是腺瘤）。
4. 疑 ACC/pheochromocytoma **不可貿然切片**（播種、誘發危象）。
5. 腹腔鏡腎上腺切除絕對禁忌 = **ACC 有 IVC 血栓**（需開放 en-bloc）。
6. ACC 全身治療首選 = **mitotane + EDP（FIRM-ACT）**；高度甲基化(CIMP)預後差。
7. 兒童 ACC **>90% 功能性，男性化最常見**。
8. 腎上腺分泌口訣 **GFR = 鹽(aldo)、糖(cortisol)、性(androgen)**；**glomerulosa 受 RAAS、垂體衰竭不萎縮**。
9. 腎上腺源 Cushing = **ACTH-independent（~10%）**；Cushing disease(pituitary)是內源最多。
10. PA 多數 **normokalemic**；病因 **增生 60% > 腺瘤 35%**；篩檢 **ARR**。
11. **AVS**：先 cortisol 確認取樣成功，再 aldosterone 判 lateralization；單側手術、雙側 MRA。
12. 陰莖癌 **T2=corpus spongiosum、T3=corpus cavernosum**；**T1a/b 差別=LVI/PNI/grade**。
13. 陰莖癌小、低期低分級可 **器官保留**，存活率與截除術相當（非較差）。
14. 陰莖癌 bulky 淋巴結 → **新輔助 TIP 化療** 後手術。
15. 睪丸腫塊 = **GCT until proven otherwise**；**經鼠蹊 radical orchiectomy，禁經陰囊**。
16. **AFP 半衰期 5–7 天；β-hCG 半衰期 24–36 小時**；**seminoma 不分泌 AFP**（AFP↑當 NSGCT）。
17. **i(12p)** 為 GCT 標誌；~5% 性腺外（縱膈 NSGCT 預後差）；雙側 GCT ~2%（異時性多）。
18. **Poor risk 僅見於 NSGCT，seminoma 沒有 poor risk**；分層用 IGCCCG。
19. Stage I seminoma 與 NSGCT 都以 **surveillance** 為優先；CS IIA/B seminoma 新增 **nsRPLND**（COTRIMS）。
20. 化療幾乎都致暫時性 azoospermia → 治療前 **精子保存**；化療後**畸胎瘤殘餘需手術**。

## 整體判斷（最可能的考試內容）

依 113 年考古題分布，本講義考點集中度由高到低為：**男性不孕（約 45%）＞ ED／PDE5i（約 22%）＞ 射精障礙（約 9%）＞ Peyronie's（約 8%）＞ 生理／其他（約 6%）＞ Priapism（約 4%）＝ SHBG（約 4%）＞ TRT／Hypogonadism（約 2%）**。

最可能出題方向有四類。第一類是**精液分析 WHO 2021 數字與精蟲異常命名**（Oligo/Astheno/Teratozoospermia 閾值），這是純記憶題、CP 值最高。第二類是**無精症的鑑別演算法**——以 TLA（testicular long axis）與 FSH 切點區分 OA（阻塞性）與 NOA（非阻塞性），並延伸到基因檢測時機、TESE 取精率、CBAVD/CFTR 與 EDO 的「三低精液」（低量、低 pH、低 fructose）。第三類是 **PDE5i 藥理與交互作用**，特別是 nitrate 的禁忌間隔（tadalafil 48 小時、其餘 24 小時）、riociguat 絕對禁忌、α-blocker 併用規則。第四類是 **Priapism 的 ischemic vs non-ischemic 急症鑑別**與 **TRT 禁忌症**。口試最愛問「一個無精症病人來門診，你怎麼 work-up？」——務必能講出病史、理學檢查、荷爾蒙、精液分析、影像與基因檢測的完整流程。

# Section 2：各主題 A–H 重點筆記

---

## 主題 1：Erectile Dysfunction（ED，勃起功能障礙）

**A. 一句話重點**
ED 是「無法達成或維持足以滿意性行為的勃起」，本質上多為**血管/內皮疾病**，常是心血管疾病的早期警訊（penis is the window to the heart）。

**B. 必背定義**
- ED：persistent inability to attain and/or maintain an erection sufficient for satisfactory sexual performance（須持續 ≥ 3 個月才算）。
- 勃起機轉核心通路：性刺激 → NANC 神經與內皮釋放 **NO** → 活化 **guanylate cyclase** → GTP 轉為 **cGMP** → 平滑肌鬆弛、海綿體充血 → 勃起。cGMP 由 **PDE5** 分解 → 軟掉。
- PDE5i 即抑制 PDE5、使 cGMP 累積維持勃起；**前提是要有 NO（性刺激），無刺激則無效**。

**C. 臨床判斷流程**
```
ED 主訴
 → 病史（發作緩急、晨間勃起、心理 vs 器質）＋ 用藥史（抗高血壓、抗憂鬱）
 → 理學檢查（生殖器、第二性徵、周邊脈搏）
 → IIEF-5 / EHS 分級
 → 抽血：fasting glucose/HbA1c、lipid、morning total testosterone（±free T、LH、PRL）
 → 評估心血管風險（Princeton consensus 分層）
    ├─ Low risk → 可直接治療、可性行為
    ├─ Intermediate → 先做運動心電圖/心臟評估
    └─ High risk（不穩定心絞痛、近期 MI、controlled 不佳）→ 穩定後再治療
 → 第一線：生活型態調整 + PDE5i
 → 第二線：海綿體注射（ICI, alprostadil）、真空吸引、尿道內栓劑
 → 第三線：penile prosthesis（陰莖植入物）
```

**D. 診斷工具與適應症**
- **IIEF-5（IIEF-5/SHIM）**：5 題、22–25 分正常；嚴重度分級：重度 5–7、中度 8–11、輕至中度 12–16、輕度 17–21。
- **EHS（Erection Hardness Score）**：4 級，Grade 3（夠硬可插入但不全硬）、Grade 4（完全硬挺）為治療目標。
- Morning testosterone：所有 ED 病人建議檢查，排除 hypogonadism。
- 夜間陰莖勃起測試（NPT）、Penile Doppler ultrasound：用於鑑別心因性 vs 血管性，非常規。

**E. 治療策略**
- 第一線：PDE5i（口服）＋ 心血管危險因子矯正、運動、戒菸。
- 合併低睪固酮時可加 TRT，可提升 PDE5i 療效。
- 第二線：ICI（alprostadil 海綿體注射）、真空吸引裝置（VED）、MUSE（尿道內 alprostadil）。
- 第三線：陰莖植入物（藥物無效或不適合者）。

**F. 考試高頻重點**
1. 勃起的分子機轉：**NO → cGMP↑ → 平滑肌鬆弛**；PDE5 分解 cGMP。
2. PDE5i 需要性刺激（NO）才有效，並非催情劑。
3. ED 是心血管疾病的早期 marker，內皮功能障礙先在小血管（陰莖海綿體動脈）顯現。
4. 抗高血壓藥中，**thiazide 利尿劑與 β-blocker** 較易致 ED；**ARB/ACEI、CCB、nebivolol** 相對影響小或可能改善。
5. 治療前一定要做**心血管風險分層**（Princeton）。
6. 低睪固酮會降低 PDE5i 反應，補 T 可改善。

**G. 容易混淆比較表**

| 項目 | 心因性 ED | 器質性（血管性）ED |
|---|---|---|
| 發作 | 突然 | 漸進 |
| 晨間/夜間勃起 | 保留 | 消失 |
| 情境性 | 是（換對象/自慰正常） | 否，全面性 |
| 年齡 | 年輕居多 | 中老年、有心血管危險因子 |

**H. 臨床記憶法**
「**NO cGMP 撐勃起，PDE5 來拆台；抑制 PDE5＝藥物把勃起留下來**」。
心血管口訣：「**陰莖是心臟的窗口**」——ED 領先冠心病約 2–3 年出現。

---

## 主題 2：PDE5 Inhibitors（PDE5i，第一線口服藥）

**A. 一句話重點**
四種 PDE5i 療效相近，差別在**起效時間與半衰期**——tadalafil 半衰期最長（17.5h）可「週末效應」與每日低劑量使用，其餘為「需要時」用藥。

**B. 必背定義**
- PDE5i：選擇性抑制 phosphodiesterase type 5，阻止 cGMP 被分解，延長海綿體平滑肌鬆弛。
- 共同禁忌：**併用任何形式 nitrate（硝酸鹽）為絕對禁忌**（致命性低血壓）；**riociguat（sGC stimulator）絕對禁忌**。

**C. 臨床判斷流程**
```
開立 PDE5i 前
 → 有無使用 nitrate？ 有 → 禁用（需停 nitrate 後依藥物等待 24–48h）
 → 有無使用 riociguat？ 有 → 絕對禁忌
 → 有無 α-blocker？ 有 → 隔開 ≥ 6 小時、起始半量、α-blocker 須穩定 ≥ 1 個月、選擇選擇性 α1
 → 心血管狀態穩定？ → 選藥（依起效需求與生活型態）
```

**D. 四種 PDE5i 比較表（核心必背）**

| 藥物 | 起效時間 | 半衰期 t½ | 食物影響 | 特色 |
|---|---|---|---|---|
| Sildenafil | 15–60 分 | 3–5 h | 高脂餐延遲吸收 | 最早上市、藍色視覺異常 |
| Vardenafil | 15–60 分 | 4–5 h | 高脂餐影響 | 注意 QT 延長 |
| Tadalafil | 15–120 分 | **17.5 h** | **不受食物影響** | 作用達 36h「週末藥」、可每日低劑量、可治 BPH/LUTS |
| Avanafil | 15–60 分 | 3–5 h | 影響小 | 選擇性最高、起效快 |

**E. 治療策略 / 藥物交互作用（DDI）**
- **Nitrate**：服用 PDE5i 後若需用 nitrate，**tadalafil 需間隔 48 小時、sildenafil/vardenafil/avanafil 需間隔 24 小時**。
- **Riociguat**：絕對禁忌（協同降血壓）。
- **抗高血壓藥**：一般可安全併用、不需調整。
- **α-1 blocker**：需間隔 ≥ 6 小時、起始用半量、α-blocker 須已穩定使用 ≥ 1 個月、優先選擇選擇性 α1（如 tamsulosin、silodosin）。
- **CYP3A4 抑制劑**（ketoconazole、ritonavir、erythromycin）會升高 PDE5i 濃度 → 減量。

**F. 考試高頻重點**
1. **Tadalafil 半衰期 17.5h、作用 36h、不受食物影響、可每日使用、可治 BPH**。
2. Nitrate 等待間隔：**tadalafil 48h、其餘 24h**。
3. Riociguat 為**絕對禁忌**。
4. α-blocker 併用四原則：隔 6h、半量起始、穩定 ≥1 月、選擇性 α1。
5. Sildenafil 的藍視（藍綠色視覺異常）源自對 PDE6 的微弱抑制。
6. 抗高血壓藥（除 nitrate）一般可安全合併。

**G. 容易混淆比較表**

| 鑑別點 | Sildenafil | Tadalafil |
|---|---|---|
| 半衰期 | 短（3–5h） | 長（17.5h） |
| 食物 | 受高脂餐影響 | 不受影響 |
| Nitrate 間隔 | 24h | 48h |
| 特殊適應症 | — | BPH/LUTS、每日劑量 |

**H. 臨床記憶法**
「**Tada 最長、48 不慌；其餘 24，nitrate 別碰**」。
四藥起效都「**15 分鐘起跑**」，只有 tadalafil「**跑 36 小時**」。

## 主題 3：陰莖植入物（Penile Prosthesis）

**A. 一句話重點**
陰莖植入物是 ED 的**第三線（最終）治療**，用於口服與注射均無效或不適合者；分半硬式與可充氣式，**三件式可充氣**滿意度最高。

**B. 必背定義**
- 半硬式（malleable / semirigid）：兩根可彎曲桿，永久半硬、操作簡單、機械故障率低。
- 兩件式可充氣（two-piece，如 AMS Ambicor）：泵球＋圓柱，無獨立儲液囊。
- 三件式可充氣（three-piece inflatable）：圓柱＋陰囊泵＋恥骨後儲液囊，**勃起最自然、軟態最自然、滿意度最高**。

**C. 臨床判斷流程**
```
ED 治療失敗（PDE5i + ICI/VED 無效或拒絕）
 → 評估手術風險、手部靈巧度、感染風險（糖尿病控制）
 → 選擇植入物：
    ├─ 手部靈活、要求自然 → 三件式可充氣
    └─ 操作能力差/反覆泌尿道處置 → 半硬式
```

**D. 適應症**
- 器質性 ED 對藥物與注射治療反應不佳或不耐受。
- Peyronie's disease 合併嚴重 ED（可同時矯正彎曲）。
- 神經性 ED（脊髓損傷）等。

**E. 治療策略 / 併發症**
- 主要併發症：**感染**（糖尿病、免疫低下者風險高）與**機械故障**。
- 感染一旦發生常需移除裝置。抗生素塗層可降感染率。

**F. 考試高頻重點**
1. 陰莖植入物為 ED **第三線**治療。
2. **三件式可充氣**滿意度最高、外觀最自然。
3. 主要併發症為**感染**（糖尿病高風險）。

**G. 容易混淆比較表**

| 型式 | 操作 | 自然度 | 機械故障 |
|---|---|---|---|
| 半硬式 | 最簡單 | 低（永久半硬） | 最低 |
| 三件式可充氣 | 需手部靈巧 | 最高 | 較高 |

**H. 臨床記憶法**
「**藥不行、針也不行 → 植入；要自然就選三件式，但小心感染（尤其糖尿病）**」。

---

## 主題 4：Peyronie's Disease（陰莖硬化症）

**A. 一句話重點**
Peyronie's 是 **tunica albuginea 的纖維化斑塊**造成陰莖彎曲與疼痛，分**急性（活動）期**與**慢性（穩定）期**，手術須等穩定後再做。

**B. 必背定義**
- 病灶：白膜（tunica albuginea）內形成 fibrous plaque → 陰莖彎曲、縮短、疼痛、可能 ED。
- 與 Dupuytren's contracture（手掌纖維化）有關聯。
- **急性期**：疼痛、彎曲變化中，約 6–18 個月；**慢性期**：斑塊鈣化、彎曲穩定、疼痛消失。

**C. 臨床判斷流程**
```
陰莖彎曲/疼痛
 → 病史 + 理學檢查（觸摸斑塊）
 → 評估期別（急性 vs 慢性）、彎曲角度、有無 ED
 → 急性期 → 保守治療（口服、注射、牽引），勿急著手術
 → 慢性穩定 ≥ 3–6 個月 + 彎曲影響性行為 → 考慮手術
    ├─ 角度小、無 ED → plication（短邊縫摺）
    ├─ 角度大/沙漏狀 → 斑塊切開+移植（grafting）
    └─ 嚴重 ED → 植入陰莖植入物（±矯彎）
```

**D. 診斷工具**
- 理學檢查觸診斑塊；人工勃起（intracavernosal injection）測量彎曲角度。
- 陰莖超音波評估斑塊鈣化與血流。

**E. 治療策略**
- 急性期：口服（pentoxifylline、維他命 E 證據有限）、病灶內注射（collagenase clostridium histolyticum、verapamil、interferon）、牽引治療。
- 慢性穩定期手術：plication（彎曲<60°、無 ED）、斑塊切開/切除+grafting（角度大或沙漏畸形）、陰莖植入物（合併 ED）。

**F. 考試高頻重點**
1. 病灶在 **tunica albuginea** 的纖維斑塊。
2. 與 **Dupuytren's contracture** 相關。
3. **手術須等慢性穩定期（疼痛消失、彎曲穩定 ≥3–6 個月）**。
4. Plication 用於小角度且無 ED；grafting 用於大角度；ED 則用植入物。

**G. 容易混淆比較表**

| 期別 | 疼痛 | 彎曲 | 處置 |
|---|---|---|---|
| 急性（活動）期 | 有 | 變化中 | 保守治療，勿手術 |
| 慢性（穩定）期 | 消失 | 穩定 | 可手術矯正 |

**H. 臨床記憶法**
「**痛＝急性別開刀，不痛穩定才矯彎；小角縫摺、大角補片、有 ED 就植入**」。

## 主題 5：Priapism（陰莖異常勃起）

**A. 一句話重點**
Priapism 是**與性刺激無關、持續 > 4 小時的勃起**；分**缺血性（low-flow）＝泌尿科急症**與**非缺血性（high-flow）＝多為外傷、非急症**。

**B. 必背定義**
- Ischemic（low-flow，veno-occlusive）：海綿體靜脈回流受阻 → 缺氧、酸中毒、**疼痛、海綿體僵硬**，是**急症（compartment syndrome）**，> 4h 即組織缺血、>24–48h 易致永久纖維化與 ED。
- Non-ischemic（high-flow，arterial）：海綿體動脈裂傷形成動靜脈瘻管（常見騎跨傷/會陰外傷）→ **不痛、半勃起、不缺氧**，非急症。
- Stuttering（recurrent）：反覆短暫缺血性，常見於 sickle cell disease。

**C. 臨床判斷流程**
```
持續勃起 > 4 小時
 → 海綿體血液氣體分析（cavernous blood gas）
    ├─ 缺氧（PO2↓、PCO2↑、pH↓）、疼痛、僵硬 → ISCHEMIC（急症！）
    │     → 海綿體抽吸 + 灌洗 → 海綿體內注射 α-agonist（phenylephrine）
    │     → 無效 → 分流手術（shunt）
    └─ 含氧正常、不痛、外傷史 → NON-ISCHEMIC
          → 非急症，可觀察；持續者 → 動脈攝影 + 選擇性栓塞
```

**D. 診斷工具**
- **Cavernous blood gas**：區分缺血 vs 非缺血的關鍵。
- 都卜勒超音波：缺血性血流缺如；非缺血性可見動脈瘻管/血流。

**E. 治療策略**
- 缺血性：抽吸＋灌洗，海綿體內注射 phenylephrine（α-agonist）；失敗則行 distal/proximal shunt。
- 非缺血性：觀察為主，必要時選擇性動脈栓塞。
- Sickle cell 引起者：水化、氧氣、止痛、輸血等全身處置。

**F. 考試高頻重點**
1. Priapism 定義：**與慾望無關、>4 小時**的勃起。
2. **缺血性=急症、疼痛、海綿體缺氧**；非缺血性=外傷、不痛、含氧正常。
3. 鑑別靠 **cavernous blood gas**。
4. 缺血性首選海綿體內 **phenylephrine（α-agonist）**。
5. 缺血 >24–48h 易致永久 ED。

**G. 容易混淆比較表**

| 項目 | Ischemic（low-flow） | Non-ischemic（high-flow） |
|---|---|---|
| 機轉 | 靜脈回流受阻 | 動脈瘻管（外傷） |
| 疼痛 | 有 | 無 |
| 海綿體 | 僵硬 | 半勃起 |
| 血液氣體 | 缺氧、酸中毒 | 含氧正常 |
| 急症 | 是 | 否 |
| 治療 | 抽吸+phenylephrine→shunt | 觀察/栓塞 |

**H. 臨床記憶法**
「**痛又硬又缺氧＝缺血急症，趕快抽＋打 phenylephrine；不痛半軟有外傷＝高流量，慢慢來**」。

## 主題 6：SHBG 與睪固酮生理

**A. 一句話重點**
SHBG（sex hormone-binding globulin）決定 free testosterone 的比例；當 total T 在臨界值時，**要看 free/bioavailable T**，並注意 SHBG 受年齡、肥胖、甲狀腺、肝病影響。

**B. 必背定義**
- 血中睪固酮：約 **44% 結合 SHBG（緊）、約 50% 結合 albumin（鬆）、約 2% 游離**。Bioavailable T = free + albumin-bound。
- **SHBG↑** → free T↓（症狀可能明顯卻 total T 正常）。
- **SHBG↓** → free T 相對↑。

**C. 影響 SHBG 的因素**
```
SHBG 上升：老化、甲狀腺功能亢進、肝硬化、雌激素、HIV、抗癲癇藥
SHBG 下降：肥胖、第二型糖尿病/胰島素阻抗、甲狀腺低下、雄性素、生長激素、nephrotic syndrome
```

**D. 診斷工具**
- 先測 morning **total testosterone**；臨界或 SHBG 異常時，計算/測 **free 或 bioavailable testosterone**。
- 同時驗 LH/FSH 以區分原發（性腺）vs 次發（下視丘-腦下垂體）。

**E. 臨床應用**
- 老年男性 total T 正常但症狀明顯，常因 SHBG 上升使 free T 降低 → 應評估 free T。
- 肥胖/糖尿病者 SHBG 下降，total T 偏低但 free T 可能正常。

**F. 考試高頻重點**
1. 血中 T 分布：**SHBG ~44%、albumin ~50%、free ~2%**。
2. Bioavailable T = free + albumin-bound。
3. **肥胖、糖尿病、甲狀腺低下 → SHBG↓**；**老化、甲亢、肝硬化、雌激素 → SHBG↑**。
4. Total T 臨界時要看 free/bioavailable T。

**G. 容易混淆比較表**

| 情境 | SHBG | Total T | Free T |
|---|---|---|---|
| 老化/甲亢/肝硬化 | ↑ | 可正常 | ↓ |
| 肥胖/T2DM/甲低 | ↓ | 偏低 | 可正常 |

**H. 臨床記憶法**
「**胖子糖尿 SHBG 低，老人甲亢肝硬高；total 看不準，free 才是真**」。

## 主題 7：Testosterone Replacement Therapy（TRT，睪固酮補充治療）

**A. 一句話重點**
TRT 用於**確診的 hypogonadism（症狀＋兩次 morning low T）**；**絕對不可用於想生育的男性**（會抑制精蟲生成），且 PCa、紅血球增多、未控制心衰等為禁忌。

**B. 必背定義（BOX 23-3 重點）**
- 診斷：典型症狀/徵象 ＋ **兩次清晨 total testosterone 偏低**。
- TRT 經由負回饋抑制 **LH/FSH → 睪丸內睪固酮下降、精蟲生成停止** → 故不孕者禁用。

**C. 臨床判斷流程**
```
疑似 hypogonadism（性慾↓、ED、疲倦、肌肉量↓）
 → 兩次 morning total T 皆低 + 症狀 → 確診
 → 篩檢禁忌：PCa/乳癌、PSA 未評估、Hct>54%、未控制心衰、嚴重 LUTS、想生育、睡眠呼吸中止未治
 → 無禁忌 → 開始 TRT，並監測 PSA、Hct、症狀
 → 想生育者 → 改用 hCG ± rFSH/clomiphene，勿用外源性 T
```

**D. 禁忌症（必背）**
- **攝護腺癌、男性乳癌**。
- 紅血球增多症（**Hct > 54%**）。
- 未控制的鬱血性心衰竭。
- 嚴重下泌尿道症狀（IPSS 高）/ 未評估之攝護腺結節或 PSA 升高。
- 未治療之阻塞性睡眠呼吸中止。
- **目前想生育者**（外源性 T 抑制精蟲生成）。

**E. 治療策略 / 監測**
- 劑型：注射（每 2–3 週或長效）、經皮凝膠、口服等。
- 監測：基線及追蹤 **PSA、hematocrit、症狀**；Hct 過高需減量/放血。
- 想保留生育力者：**hCG（替代 LH）± rFSH/hMG（替代 FSH）或 clomiphene/aromatase inhibitor**。

**F. 考試高頻重點**
1. 診斷需**兩次 morning low total T ＋ 症狀**。
2. **TRT 不可用於不孕/想生育男性**（抑制精蟲生成）——超高頻陷阱題。
3. 禁忌：**PCa、乳癌、Hct>54%、未控制心衰、未治 OSA、嚴重 LUTS**。
4. 監測 **PSA 與 hematocrit**。
5. 想生育的低性腺者用 **hCG ± FSH**，而非外源性睪固酮。

**G. 容易混淆比較表**

| 目標 | 用藥 | 對生育影響 |
|---|---|---|
| 補充症狀（不想生育） | 外源性 testosterone | 抑制精蟲生成 |
| 低性腺＋想生育 | hCG ± rFSH/clomiphene | 維持/促進精蟲生成 |

**H. 臨床記憶法**
「**想生小孩別補 T；PCa、乳癌、血太濃（Hct>54）、心衰 OSA 都不給**」。

## 主題 8：射精障礙（Ejaculatory Dysfunction，含 PE 早洩與 Retrograde）

**A. 一句話重點**
射精障礙含**早洩（PE）、延遲/無射精、逆行性射精**；PE 以 dapoxetine（短效 SSRI）為核心藥，逆行性射精以交感神經興奮藥（ephedrine 類）治療。

**B. 必背定義**
- **Premature ejaculation（PE）**：射精潛伏期短（lifelong 多 <1 分鐘、acquired <3 分鐘）、無法延遲射精、造成困擾。
- **Retrograde ejaculation**：膀胱頸關閉不全 → 精液逆流入膀胱（射精後尿液中可見大量精蟲）；常見糖尿病自主神經病變、TURP、後腹腔手術、α-blocker。
- **Anejaculation / Anorgasmia**：無射精/無高潮，可為神經性（脊髓損傷）、藥物（SSRI）、心理性。

**C. 臨床判斷流程**
```
射精問題
 → 是太快（PE）？ → 行為治療 + dapoxetine / 其他 SSRI ± 局部麻醉劑
 → 射精時無精液但有高潮？ → 驗射精後尿液
       ├─ 尿中大量精蟲 → 逆行性射精 → 交感興奮藥
       └─ 尿中無精蟲 → anejaculation / 射精管阻塞
 → 完全無高潮無射精 → 神經學/藥物/心理評估
```

**D. 診斷工具**
- **Post-ejaculatory urinalysis（射精後尿液鏡檢）**：診斷逆行性射精的關鍵。
- IELT（intravaginal ejaculatory latency time）：評估 PE。

**E. 治療策略**
- PE：行為治療（stop-start、squeeze）、**dapoxetine（首個專為 PE 設計的短效 SSRI，需要時服用）**、其他 SSRI（paroxetine/sertraline）、局部麻醉藥（lidocaine/prilocaine）、PDE5i（合併 ED 時）。
- 逆行性射精藥物（增加膀胱頸張力）：**ephedrine、pseudoephedrine、midodrine、imipramine、phenylephrine**；無效則取尿中精蟲做 ART。

**F. 考試高頻重點**
1. **Dapoxetine** 是專為 PE 設計、需要時服用的短效 SSRI。
2. 逆行性射精以**射精後尿液鏡檢**診斷（大量精蟲）。
3. 逆行性射精藥物：**ephedrine/pseudoephedrine/midodrine/imipramine**。
4. 糖尿病、TURP、α-blocker、後腹腔淋巴廓清是逆行性射精常見原因。

**G. 容易混淆比較表**

| 類型 | 主訴 | 射精後尿液 | 治療 |
|---|---|---|---|
| 早洩 PE | 太快射 | 正常 | SSRI/dapoxetine、行為 |
| 逆行性射精 | 高潮但無精液 | 大量精蟲 | 交感興奮藥 |
| Anejaculation | 無射精 | 無精蟲 | 依病因（神經/藥物） |

**H. 臨床記憶法**
「**射太快 → SSRI；乾性高潮 → 驗尿找精蟲（逆行），用 ephedrine 把膀胱頸關起來**」。

## 主題 9：男性不孕症概論與精液分析（WHO 2021）

**A. 一句話重點**
約 **15% 夫妻不孕、其中 男性因素佔約 50%**；評估從**病史＋理學檢查＋至少兩次精液分析**開始，精液參數用 **WHO 2021** 第 5 百分位作下限。

**B. 必背定義**
- 不孕：規律無避孕性行為 **1 年**仍未受孕（約 8–15% 夫妻）。
- 男性因素涉及約 **50%** 的不孕夫妻（單獨或合併）。
- **WHO 2021 精液參數下限（第 5 百分位）**：
  - 體積 volume ≥ **1.4 mL**
  - 精蟲濃度 concentration ≥ **16 M/mL**
  - 總精蟲數 total ≥ 39 M/射精
  - 總活動力 total motility ≥ **42%**
  - 前進活動力 progressive motility ≥ **30%**
  - 正常型態 morphology ≥ **4%**（嚴格標準）
  - 存活率 vitality ≥ 54%
- **精蟲異常命名**：
  - **Oligozoospermia**：濃度 < 16 M/mL（嚴重 < 5 M/mL）
  - **Asthenozoospermia**：前進活動力 < 30%（或總活動力 < 42%）
  - **Teratozoospermia**：正常型態 < 4%
  - **Azoospermia**：射精液中無精蟲（離心後仍無）
  - **Cryptozoospermia**：僅離心後才見少量精蟲

**C. 臨床判斷流程（男性不孕基本 work-up）**
```
不孕（嘗試 ≥ 1 年）
 → 病史（TICS：Trauma/Toxin、Infection、Childhood/development、Sexual/Systemic）+ 用藥/手術史
 → 理學檢查：睪丸大小（orchidometer）、副睪、輸精管有無、varicocele、第二性徵、Tanner stage
 → 精液分析 ×2（間隔 ≥ 2–4 週）
 → 異常 → 荷爾蒙：FSH、LH、total testosterone（± prolactin、E2）
 → 依結果 → 影像（陰囊/經直腸超音波）、基因檢測、必要時睪丸切片
```

**D. 診斷工具與適應症**
- 精液分析：禁慾 2–7 天，至少兩次。
- 荷爾蒙：精蟲濃度 < 10 M/mL、ED 或低性腺症狀時驗 FSH/LH/T。
- 影像：陰囊超音波（varicocele、腫瘤），TRUS（EDO、SV、CBAVD）。
- 基因檢測（見下一主題）。

**E. 治療策略（概覽）**
- 矯正可逆因素（varicocele、感染、藥物、內分泌）。
- 輔助生殖：IUI、IVF、ICSI；無精症則取精（PESA/TESE/mTESE）+ ICSI。

**F. 考試高頻重點**
1. 不孕定義：**規律無避孕 1 年未孕**；男性因素約 **50%**。
2. **WHO 2021：volume 1.4 / conc 16 / total motility 42% / progressive 30% / morphology 4%**。
3. 命名：**Oligo（數量）、Astheno（活動力）、Terato（型態）、Azoo（無精）**。
4. 至少做**兩次**精液分析。
5. 病史記憶法 **TICS**。

**G. 容易混淆比較表（WHO 2010 vs 2021 主要值）**

| 參數 | WHO 2010 | WHO 2021 |
|---|---|---|
| Volume | 1.5 mL | 1.4 mL |
| 濃度 | 15 M/mL | 16 M/mL |
| 總活動力 | 40% | 42% |
| 前進活動力 | 32% | 30% |
| 型態 | 4% | 4% |

**H. 臨床記憶法**
「**1.4 一夜情、16 歲、42、30、4%**」串記 WHO 2021；命名「**少（oligo）、慢（astheno）、醜（terato）、無（azoo）**」。

## 主題 10：無精症分類、基因檢測、NOA 病因與 TESE 取精率

**A. 一句話重點**
無精症分**阻塞性（OA）**與**非阻塞性（NOA）**；NOA 與嚴重寡精者須做**染色體核型＋Y 染色體顯微缺失**檢測，**AZFa/AZFb 完全缺失＝取不到精蟲**。

**B. 必背定義**
- **三大分類**：
  - Pretesticular（睪丸前）：下視丘-腦下垂體問題（hypogonadotropic hypogonadism）→ 低 FSH/LH/T。
  - Testicular（睪丸性）：原發性睪丸衰竭 → NOA、FSH↑。
  - Post-testicular（睪丸後）：阻塞或射精障礙 → OA、FSH 正常。
- 基因檢測時機：
  - **Karyotyping（染色體核型）**：azoospermia 或精蟲濃度 **< 10 M/mL**。
  - **Y chromosome microdeletion**：azoospermia 或嚴重寡精（**< 5 M/mL**）。
  - **CFTR**：CBAVD 或疑似阻塞者。

**C. NOA 病因與比例**
```
原發性睪丸衰竭（primary testicular failure）
   ├─ 不明原因 ~73%
   ├─ 染色體異常 ~15%（最多為 47XXY Klinefelter；亦有 46XX 等）
   └─ Y 染色體顯微缺失 ~7%（AZFa / AZFb / AZFc）
次發性（CHH，先天性低促性腺低性腺）：~50% 不明
Post-testicular 之 CBAVD：75–85% 帶 CFTR 突變
```

**D. TESE / mTESE 取精率（依診斷，必背數字）**

| 診斷 | 取精成功率 |
|---|---|
| Klinefelter（47XXY） | ~68% |
| AZFc 缺失 | ~70% |
| 隱睪術後（orchiopexy 後） | ~74% |
| 化療後（post-chemotherapy） | ~53% |
| Maturation arrest（成熟停滯） | ~40% |
| Sertoli cell only syndrome | ~30% |
| **AZFa / AZFb 完全缺失** | **0%（取不到）** |

**E. 治療策略**
- OA → 顯微重建（vasovasostomy 等）或取精（PESA/MESA）+ ICSI。
- NOA → **mTESE（顯微睪丸取精）+ ICSI**；先評估基因（AZFa/b 完全缺失則不必手術）。
- 矯正可逆病因（varicocele、藥物、內分泌）。

**F. 考試高頻重點**
1. **Karyotype**：azoospermia 或 **<10 M/mL**；**Y microdeletion**：azoospermia 或 **<5 M/mL**。
2. NOA 最常見可辨識的染色體異常 = **Klinefelter 47XXY**。
3. **AZFa、AZFb 完全缺失 → 取不到精蟲（0%）**；AZFc → 可取到（~70%）。
4. Klinefelter mTESE 取精率約 **68%**。
5. Y 染色體缺失會**遺傳給男性後代**。

**G. 容易混淆比較表（OA vs NOA）**

| 項目 | OA（阻塞性） | NOA（非阻塞性） |
|---|---|---|
| FSH | 正常 | 多升高 |
| 睪丸大小 | 正常 | 多偏小 |
| 副睪 | 常脹大 | 正常 |
| 基因檢測 | CFTR | Karyotype + Y microdeletion |
| 取精率 | 高 | 視病因（AZFa/b=0%） |

**H. 臨床記憶法**
「**a、b 拿不到，c 還有希望（~70%）**」記 AZF 取精率。
「**核型 10、Y 缺 5**」記基因檢測的精蟲濃度切點。

## 主題 11：Varicocele（精索靜脈曲張）

**A. 一句話重點**
Varicocele 是**最常見可矯正的男性不孕原因**，左側居多；**只有臨床可觸及（clinical）且精液異常**才建議手術，**顯微鏡下腹股溝/腹股溝下結紮**併發症最低。

**B. 必背定義**
- 盤狀靜脈叢（pampiniform plexus）擴張，約 **11.7% 男性**有 varicocele，**約 25.4% 精液異常者**有 varicocele。
- 左側多見（左睪丸靜脈直角入左腎靜脈）。
- 分級：subclinical（僅超音波）、Grade 1（Valsalva 可觸）、Grade 2（觸得到）、Grade 3（看得到）。

**C. 臨床判斷流程**
```
不孕 + 陰囊檢查
 → 觸診 ± Valsalva（站姿）
 → Clinical varicocele（可觸/可見）+ 精液異常 + 女方生育力正常或可治 → 建議 varicocelectomy
 → Subclinical（僅超音波）→ 不建議手術
```

**D. 適應症（手術指徵）**
- **臨床可觸及**的 varicocele（非 subclinical）。
- 合併**精液異常**。
- 配偶生育力正常或可矯正。
- 青少年同側睪丸發育不良也可考慮。

**E. 治療策略**
- **顯微鏡下腹股溝（inguinal）/腹股溝下（subinguinal）結紮**為首選：失敗率 0.5–1%、hydrocele 0%、可保留動脈與淋巴。
- 手術可改善精液參數；NOA 病人修補後約 **36%** 可在射精液中出現 ≥1 隻（多為不動）精蟲。

**F. 考試高頻重點**
1. **最常見可矯正的男性不孕原因**；左側為主。
2. 約 **11.7%** 男性有、約 **25.4%** 精液異常者有。
3. **只治 clinical（可觸）+ 精液異常**，subclinical 不開。
4. **顯微腹股溝/腹股溝下結紮**併發症最低（hydrocele 0%、保留動脈）。
5. NOA 修補後約 36% 射精液可見精蟲。

**G. 容易混淆比較表（術式併發症）**

| 術式 | 失敗/復發 | Hydrocele | 動脈保留 |
|---|---|---|---|
| 顯微（subinguinal/inguinal） | 0.5–1% | 0% | 是 |
| 開放高位結紮 | 較高 | 較高 | 否 |
| 腹腔鏡 | 中等 | 中等 | 視技術 |

**H. 臨床記憶法**
「**摸得到才開、subclinical 不開；顯微最讚——不漏不積水又留動脈**」。

## 主題 12：Hypogonadotropic Hypogonadism、Kallmann、Klinefelter、Y 缺失

**A. 一句話重點**
**低促性腺低性腺（HH）= FSH↓LH↓T↓**（可治、可生育）；**Klinefelter 47XXY = 高促性腺低性腺（FSH↑LH↑T↓）**；Kallmann = HH + 嗅覺缺失。

**B. 必背定義**
- **Hypogonadotropic hypogonadism（HH，次發性）**：下視丘/腦下垂體問題 → GnRH/促性腺素不足 → **FSH↓、LH↓、T↓**。
- **Kallmann syndrome**：HH + **anosmia（嗅覺缺失）**，因 GnRH 神經元與嗅球發育異常；約 10% 帶 KAL1、GNRHR 等基因突變。
- **Klinefelter syndrome（47XXY）**：最常見性染色體異常，**1/500–1000** 男性；10–20% 為鑲嵌型；表現**身高較高、小而硬睪丸、男性女乳、NOA**；荷爾蒙為 **T↓、FSH↑、LH↑（hypergonadotropic hypogonadism）**；**乳癌風險約 50 倍**。
- **Y 染色體顯微缺失**：AZFa/AZFb/AZFc 區。

**C. 臨床判斷流程**
```
低性腺症狀 + 抽血
 → FSH/LH 低 + T 低 → Hypogonadotropic（次發）
       ├─ 有嗅覺缺失 → Kallmann
       └─ 想生育 → 給 hCG（替代 LH）+ rFSH/hMG（替代 FSH），約 1–2 年誘導精蟲生成
 → FSH/LH 高 + T 低 → Hypergonadotropic（原發，如 Klinefelter）
       → 染色體核型確認 47XXY → mTESE + ICSI（早中期青春期取精率較佳）
```

**D. 診斷工具**
- 荷爾蒙 FSH/LH/T 區分原發 vs 次發。
- 核型分析確診 Klinefelter；嗅覺測試評估 Kallmann；MRI 評估下視丘/腦下垂體。

**E. 治療策略**
- HH 想生育：**hCG ± rFSH/hMG**（gonadotropin 治療常需 1–2 年）。
- HH 僅補充症狀（不生育）：可用 TRT。
- Klinefelter：NOA，**mTESE + ICSI**；建議早期（青春期早中期）評估取精以保留生育力。

**F. 考試高頻重點**
1. **HH = FSH↓LH↓T↓**（次發、可治、可生育）；**Klinefelter = FSH↑LH↑T↓**（原發）。
2. **Kallmann = HH + 嗅覺缺失**。
3. Klinefelter **47XXY**、**1/500–1000**、小硬睪丸、男性女乳、**乳癌風險 ~50×**、取精率 ~68%。
4. HH 生育治療：**hCG + FSH（rFSH/hMG）**，約 1–2 年。
5. AZFa/AZFb 完全缺失 → 無可取精蟲。

**G. 容易混淆比較表**

| 疾病 | FSH/LH | T | 特徵 | 生育 |
|---|---|---|---|---|
| HH（次發） | ↓ | ↓ | 可有嗅覺缺失(Kallmann) | hCG+FSH 可生 |
| Klinefelter（原發） | ↑ | ↓ | 47XXY、小硬睪丸、女乳 | mTESE+ICSI |

**H. 臨床記憶法**
「**低低低＝下游壞（次發 HH），可用 hCG+FSH 救回來；高高低＝睪丸壞（Klinefelter），核型 47XXY**」。
Kallmann：「**聞不到味道的不孕（嗅覺缺失＋HH）**」。

## 主題 13：Post-testicular Obstruction（睪丸後阻塞 / OA 各型）

**A. 一句話重點**
睪丸後阻塞造成 OA，特徵是 **FSH 正常、睪丸大小正常、副睪脹大**；依阻塞位置分睪丸內、副睪、輸精管、射精管，各有代表病因（CBAVD/CFTR、Young's syndrome、EDO）。

**B. 必背定義與各型**
- 睪丸後因素約佔無精症的 **15–20%**；典型表現 **normal FSH、normal testes、副睪脹大**。
- **Intratesticular obstruction**：約 OA 的 15%。
- **Epididymal obstruction**：**最常見的 OA 部位（約 30–67%）**；含感染後、Young's syndrome。
  - **Young's syndrome 三聯徵**：bronchiectasis（支氣管擴張）+ sinusitis（鼻竇炎）+ obstructive azoospermia。
- **Vas deferens obstruction**：CBAVD / CUAVD。
  - **CUAVD（單側無輸精管）**：約 80% 對側有異常、約 26% 同側腎缺如（renal agenesis）。
- **CBAVD（先天性兩側無輸精管）**：
  - 佔不孕男性約 1%、無精症約 6%。
  - **65–80%（講義 75–85%）帶 CFTR 突變**（chloride channel）；睪丸正常。
  - 精液：**量少 < 1.5 mL、pH < 7.0（偏酸）**；副睪 caput 存在但 cauda/corpus 缺如；約 10% 合併腎缺如。
  - 治療：取精（PESA/MESA/TESE）+ IVF/ICSI；**伴侶須驗 CFTR**。
- **Ejaculatory duct obstruction（EDO，射精管阻塞）**：約 OA 的 1–3%。
  - 精液：**量少、fructose↓、pH↓（酸性）**；TRUS 見 **seminal vesicle 擴張 > 15 mm**、中線 Müllerian/ejaculatory duct cyst。
- **Functional obstruction**：神經病變、SSRI 等造成。

**C. 臨床判斷流程**
```
Azoospermia + normal FSH + normal testes
 → 觸診輸精管
    ├─ 摸不到（雙側）→ CBAVD → 驗 CFTR（含伴侶）→ 取精 + ICSI
    ├─ 摸不到（單側）→ CUAVD → 腹部超音波找腎缺如
    └─ 摸得到 → 量少酸性低 fructose → TRUS
              ├─ SV > 15mm / 中線囊腫 → EDO → TURED
              └─ 副睪脹大 → 副睪阻塞 → 顯微 tubulovasostomy
```

**D. 診斷工具**
- **精液 fructose、pH、體積**：低量、低 pH、低 fructose（「三低」）指向遠端阻塞（EDO/CBAVD）。
- **TRUS（經直腸超音波）**：診斷 EDO（SV>15mm、射精管囊腫）。
- 輸精管攝影（vasography）：確認阻塞部位。
- 腹部超音波：CUAVD 找腎缺如。

**E. 治療策略**
- 副睪/輸精管阻塞：顯微重建（vasovasostomy / tubulovasostomy）。
- EDO：**TURED（經尿道射精管切開術）**，術後留 Foley 過夜、抗生素約 7 天。
- CBAVD/不可重建者：取精 + ICSI。

**F. 考試高頻重點**
1. OA 特徵：**normal FSH + normal testes + 副睪脹大**。
2. **副睪阻塞為最常見 OA 部位**；Young's syndrome = 支氣管擴張+鼻竇炎+OA。
3. **CBAVD 65–80% 帶 CFTR 突變**，精液**量少、酸性（pH<7）**；伴侶須驗 CFTR。
4. **EDO「三低」：量少、fructose 低、pH 低酸性**；TRUS SV>15mm；治療 **TURED**。
5. CUAVD → 找**同側腎缺如**。

**G. 容易混淆比較表（遠端阻塞鑑別）**

| 特徵 | CBAVD | EDO |
|---|---|---|
| 輸精管 | 雙側摸不到 | 摸得到 |
| 精液量 | 少 | 少 |
| pH | 酸（<7） | 酸 |
| Fructose | 低 | 低 |
| 影像 | 腎缺如 10% | SV>15mm、中線囊腫 |
| 治療 | 取精+ICSI | TURED |

**H. 臨床記憶法**
「**OA 三低（量、pH、fructose）= 遠端塞**」；
「**摸不到管 → CBAVD 驗 CFTR；摸得到但量少酸性 → EDO 做 TURED**」；
Young's：「**鼻竇＋支氣管＋無精＝Young's**」。

## 主題 14：無精症診斷演算法與顯微手術

**A. 一句話重點**
用 **TLA（睪丸長軸）與 FSH 兩個數字**就能高準確區分 OA 與 NOA：**TLA > 4.6 cm 且 FSH ≤ 7.6 → 96% 為阻塞性**；**TLA ≤ 4.6 cm 且 FSH > 7.6 → 89% 為生精功能障礙（NOA）**。

**B. 必背定義（演算法）**
- **TLA（testicular long axis）> 4.6 cm 且 FSH ≤ 7.6 mIU/mL → 約 96% 為 obstructive azoospermia**。
- **TLA ≤ 4.6 cm 且 FSH > 7.6 → 約 89% 為 spermatogenic dysfunction（NOA）**。
- OA「三低」：低精液量、低 pH、低 fructose（遠端阻塞時）。

**C. 臨床判斷流程**
```
Azoospermia（兩次離心確認）
 → 量測 TLA + 抽 FSH
    ├─ TLA>4.6 & FSH≤7.6 → 96% OA → 找阻塞部位 → 顯微重建 / 取精
    └─ TLA≤4.6 & FSH>7.6 → 89% NOA → 基因檢測 → mTESE + ICSI
 → 顯微手術依術中所見：
    ├─ 輸精管液有精蟲/清澈 → vasovasostomy
    └─ 輸精管液濃稠無精蟲 → 近端塞 → tubulovasostomy（副睪吻合）
```

**D. 診斷工具 / 輸精管攝影（vasography）所見**
- **Vasography 適應症**：azoospermia + 睪丸切片見 complete spermatogenesis（生精正常）+ 至少一側可觸及輸精管。
- 單側注入顯影劑卻見**兩側輸精管皆顯影** → 提示**中線射精管囊腫（midline ejaculatory duct cyst）**使兩側相通。
- 顯影解剖標誌：vas、ampulla（amp）、seminal vesicle（sv）、ejaculatory duct（ed）。

**E. 治療策略（顯微手術）**
- **Vasovasostomy（輸精管吻合）**：用於輸精管阻塞（如結紮後），通暢率約 **60–87%**；術後精蟲恢復約 **3–18 個月**。
- **Tubulovasostomy（副睪-輸精管吻合）**：近端副睪阻塞。
- **Microsurgical varicocelectomy**：保留動脈、淋巴，結紮靜脈叢。
- **mTESE**：NOA 取精。
- **TURED**：EDO，術後 Foley 過夜 + 抗生素約 7 天。

**F. 考試高頻重點**
1. **TLA>4.6 & FSH≤7.6 → 96% OA**；**TLA≤4.6 & FSH>7.6 → 89% NOA**（核心演算法數字）。
2. Vasovasostomy 通暢率 **60–87%**，精蟲恢復 **3–18 個月**。
3. 單側注射兩側皆顯影 → **中線射精管囊腫**。
4. Vasography 需先確認睪丸切片生精正常且至少一側輸精管可觸及。
5. 術中輸精管液性狀決定術式（清澈/有精蟲→vasovasostomy；濃稠無精→tubulovasostomy）。

**G. 容易混淆比較表（OA vs NOA 演算法）**

| 指標 | OA（阻塞性） | NOA（生精障礙） |
|---|---|---|
| TLA | > 4.6 cm | ≤ 4.6 cm |
| FSH | ≤ 7.6 | > 7.6 |
| 準確率 | ~96% | ~89% |
| 處置 | 重建/取精 | mTESE+ICSI |

**H. 臨床記憶法**
「**大睪丸、低 FSH＝塞住的（OA）；小睪丸、高 FSH＝壞掉的（NOA）**」；數字記「**4.6 與 7.6**」。

## 模擬單選題（10 題，附答案與解析）

**Q1.** 關於 PDE5 抑制劑，下列何者正確？
(A) Sildenafil 半衰期最長　(B) Tadalafil 作用可達 36 小時且不受食物影響　(C) 四者皆需空腹服用　(D) Avanafil 半衰期最長　(E) 皆無需考慮 nitrate
**答案：B**。Tadalafil t½ 17.5h、作用 36h、不受食物影響、可每日使用並治 BPH。Sildenafil 受高脂餐影響；nitrate 為共同絕對禁忌。

**Q2.** 服用 tadalafil 後若臨床需使用 nitrate，至少應間隔多久？
(A) 4 小時　(B) 12 小時　(C) 24 小時　(D) 48 小時　(E) 不需間隔
**答案：D**。Tadalafil 因半衰期長須間隔 **48 小時**；sildenafil/vardenafil/avanafil 為 24 小時。

**Q3.** 下列何者**不是** TRT（睪固酮補充）的禁忌？
(A) 攝護腺癌　(B) Hct 58%　(C) 目前想生育　(D) 控制良好的高血壓　(E) 未治療之嚴重睡眠呼吸中止
**答案：D**。控制良好的高血壓非禁忌。PCa、Hct>54%、想生育、未治 OSA 皆為禁忌；想生育者應用 hCG±FSH。

**Q4.** 一位無精症男性，TLA 5.0 cm、FSH 5.0 mIU/mL，最可能的診斷與處置為？
(A) NOA，行 mTESE　(B) OA，找阻塞部位　(C) Klinefelter　(D) 低促性腺低性腺　(E) 需先化療
**答案：B**。TLA>4.6 且 FSH≤7.6 → 約 96% 為**阻塞性（OA）**，應尋找阻塞部位並考慮重建或取精。

**Q5.** 關於 WHO 2021 精液分析下限，下列何者正確？
(A) 體積 ≥ 2.0 mL　(B) 精蟲濃度 ≥ 20 M/mL　(C) 總活動力 ≥ 42%　(D) 正常型態 ≥ 14%　(E) 前進活動力 ≥ 50%
**答案：C**。WHO 2021：volume 1.4mL、conc 16M/mL、total motility 42%、progressive 30%、morphology 4%。

**Q6.** 下列關於非阻塞性無精子症（NOA）之敘述，何者**不正確**？
(A) 診斷不一定需做睪丸切片　(B) 精母細胞停滯通常伴隨正常 FSH　(C) 可能由精索靜脈曲張引起　(D) 應建議染色體核型及 Y 染色體顯微缺失檢測　(E) 睪丸取精治療後該夫婦最終活產率約 40–50%
**答案：E**。NOA 找到精蟲後懷孕率約 45%、**最終活產率約 40%**（非 40–50%）。其餘正確：可用 TLA/FSH 臨床判斷不一定要切片、maturation arrest 常 FSH 正常、varicocele 可致 NOA、應做基因檢測。

**Q7.** 一位無精症男性轉介至門診，下列何者**不符合**睪丸切片（testis biopsy）的適應症？
(A) 正常陰囊大小及一致性　(B) 觸摸得到輸精管　(C) 正常血清 FSH　(D) **升高的血清 FSH**　(E) 抗精子抗體陰性
**答案：D**。Biopsy 適應症是要排除阻塞（normal testis size、palpable vas、**normal FSH**、negative antisperm antibody）；**FSH 升高**代表生精障礙（NOA），不需切片診斷阻塞。

**Q8.** 進行單側輸精管攝影注入顯影劑後，發現**兩側**輸精管皆顯影，最可能的診斷為？
(A) 中線射精管囊腫（midline ejaculatory duct cyst）　(B) 疝氣術後腹股溝截斷　(C) 射精管阻塞需 TURED　(D) 單側輸精管盲端　(E) CBAVD
**答案：A**。單側注入卻兩側皆顯影，表示兩側經中線相通 → **中線射精管囊腫**。

**Q9.** 關於 Y 染色體顯微缺失，下列何者正確？
(A) AZFc 完全缺失則完全取不到精蟲　(B) AZFa 完全缺失取精率仍達 70%　(C) **AZFa 或 AZFb 完全缺失通常取不到精蟲**　(D) 缺失不會遺傳給後代　(E) 僅需在濃度 <16 M/mL 時檢測
**答案：C**。**AZFa、AZFb 完全缺失 → 取不到可用精蟲（0%）**；AZFc 約 70% 可取到；缺失會遺傳給男性後代；檢測指徵為 azoospermia 或嚴重寡精 <5 M/mL。

**Q10.** 一位糖尿病男性主訴高潮時無精液射出，射精後尿液鏡檢見大量精蟲，最適當的初步藥物治療為？
(A) Dapoxetine　(B) Sildenafil　(C) Ephedrine（或 pseudoephedrine）　(D) hCG　(E) Finasteride
**答案：C**。此為**逆行性射精**，以增加膀胱頸張力的交感神經興奮藥（ephedrine/pseudoephedrine/midodrine/imipramine）治療。

## 口試模擬題（5 題，附標準答案）

**口試 1：一位 32 歲男性，結婚 2 年未育，精液檢查為 azoospermia，請說明你的 work-up。**
標準答案：先詳細病史（TICS：外傷/毒物、感染如腮腺炎/副睪炎、發育與隱睪史、性功能與系統性疾病、手術/化放療、用藥）。理學檢查評估睪丸大小（orchidometer）、副睪是否脹大、**輸精管是否可觸及**、varicocele、第二性徵。重複精液分析並驗精液量/pH/fructose。抽血 **FSH、LH、testosterone**。以 **TLA 與 FSH** 分流：TLA>4.6 且 FSH≤7.6 傾向 OA（找阻塞部位、TRUS/vasography），TLA≤4.6 且 FSH>7.6 傾向 NOA（安排**染色體核型＋Y 染色體顯微缺失**，必要時驗 CFTR）。NOA 規劃 mTESE+ICSI（先確認非 AZFa/b 完全缺失），OA 規劃顯微重建或取精。

**口試 2：請比較缺血性與非缺血性 priapism，以及處置原則。**
標準答案：Priapism 為與性刺激無關、持續 >4 小時的勃起。**缺血性（low-flow）**因靜脈回流受阻致海綿體缺氧酸中毒，**疼痛、僵硬，是泌尿科急症**；以 cavernous blood gas（缺氧、酸）確認，處置為海綿體抽吸＋灌洗、海綿體內注射 **phenylephrine（α-agonist）**，無效則行分流手術，>24–48h 易致永久 ED。**非缺血性（high-flow）**多因會陰/騎跨外傷造成動脈瘻管，**不痛、半勃起、血液含氧正常**，非急症，可觀察，持續者選擇性動脈栓塞。

**口試 3：CBAVD 病人的診斷特徵與處理？**
標準答案：CBAVD 為先天性兩側無輸精管，理學檢查**兩側摸不到輸精管**，睪丸生精正常。精液**量少（<1.5 mL）、pH 偏酸（<7.0）**、fructose 低。約 **65–80% 帶 CFTR 突變**，約 10% 合併腎缺如（應做腹部超音波）。處理為**睪丸/副睪取精（PESA/MESA/TESE）+ ICSI**；因 CFTR 相關，**伴侶須接受 CFTR 篩檢**以評估子代囊性纖維化風險，必要時遺傳諮詢。

**口試 4：何時及如何對男性不孕病人安排基因檢測？**
標準答案：**染色體核型分析**用於 azoospermia 或精蟲濃度 **<10 M/mL**，可發現 Klinefelter（47XXY，最常見）等。**Y 染色體顯微缺失**用於 azoospermia 或嚴重寡精 **<5 M/mL**：AZFa/AZFb 完全缺失代表取不到精蟲、可避免無謂手術，AZFc 缺失仍約 70% 可取精但會遺傳給兒子。**CFTR 突變**檢測用於 CBAVD 或疑似阻塞者，且伴侶亦須篩檢。

**口試 5：精索靜脈曲張的手術適應症與術式選擇？**
標準答案：Varicocele 是最常見的可矯正男性不孕因素，左側多見。手術適應症為**臨床可觸及（clinical，非 subclinical）的 varicocele 合併精液異常，且伴侶生育力正常或可矯正**；青少年同側睪丸發育不良亦可考慮。術式以**顯微鏡下腹股溝或腹股溝下結紮**為首選，可保留動脈與淋巴管，失敗/復發率僅 0.5–1%、hydrocele 接近 0%。手術可改善精液參數，部分 NOA 病人修補後射精液可出現少量精蟲。

## Top 20 優先複習重點（考前衝刺）

1. PDE5i 機轉：NO→cGMP↑→平滑肌鬆弛，PDE5 分解 cGMP，需性刺激才有效。
2. Tadalafil：t½ 17.5h、作用 36h、不受食物、可每日、可治 BPH。
3. Nitrate 間隔：tadalafil 48h、其餘 24h；riociguat 絕對禁忌。
4. α-blocker 併用四原則：隔 6h、半量起始、穩定 ≥1 月、選擇性 α1。
5. 陰莖植入物為 ED 第三線，三件式最自然，主併發症＝感染（DM）。
6. Peyronie's：tunica albuginea 纖維斑塊，穩定期才手術。
7. Priapism：>4h、與慾望無關；缺血=急症痛缺氧→phenylephrine。
8. 缺血 vs 非缺血 priapism 靠 cavernous blood gas 鑑別。
9. SHBG：T 分布 44/50/2；胖糖甲低→SHBG↓，老化甲亢肝硬→SHBG↑。
10. TRT 禁忌：PCa/乳癌/Hct>54%/未控制心衰/未治 OSA；想生育禁用。
11. 想生育的低性腺者用 hCG±rFSH/hMG，不可用外源性 T。
12. PE 用 dapoxetine；逆行性射精驗射精後尿液→ephedrine 類。
13. WHO 2021：1.4mL / 16M/mL / 42% / 30% / 4%。
14. 精蟲命名：oligo（<16）、astheno（<30% progressive）、terato（<4%）、azoo。
15. 基因檢測：核型<10M、Y 缺失<5M、CBAVD 驗 CFTR（含伴侶）。
16. AZFa/AZFb 完全缺失=取不到精蟲；AZFc 約 70% 可取。
17. Klinefelter 47XXY：小硬睪丸、女乳、FSH↑LH↑T↓、乳癌 50×、取精 68%。
18. Varicocele：clinical+精液異常才手術，顯微腹股溝/腹股溝下最佳。
19. OA「三低」（量、pH、fructose）；CBAVD 摸不到管驗 CFTR；EDO TRUS SV>15mm→TURED。
20. 無精演算法：TLA>4.6&FSH≤7.6=96%OA；TLA≤4.6&FSH>7.6=89%NOA。

本講義其實是一份「UDS（尿路動力學）判讀 SOP ＋ 女性下泌尿道功能障礙」的臨床實戰教材，且講者直接把**泌專口試題（Q1–Q5）**放進投影片，這些就是最高價值的考點。

### 整體判斷（最可能考什麼）

這份講義的命題核心可濃縮成四句話：

1. **UDS 三壓關係**：`pDet = pVes − pAbd`，pDet 是「推算」出來的，不是直接量測。這是所有 UDS 判讀的地基，選擇題與口試都愛問。
2. **Voiding phase 兩個指標**：`BOOI(AG number) = PdetQmax − 2×Qmax`（男 >40 為阻塞）、`BCI = PdetQmax + 5×Qmax`。會給你數字叫你算、叫你分類。
3. **女性 SUI 分型（Type 1/2/3）與 ISD**：Type 3 = ISD，鑑別工具的切點數字（**MUCP < 20 cmH₂O、CLPP < 60**）是必背。
4. **女性功能性 BOO 三本柱：DV / Fowler's / PBNO**：三者的 EMG 表現與治療（尤其 PBNO 的 TUI-BN、Fowler's 的 SNM）是口試 Q5 的答案，務必能畫鑑別表。

## 【Section 2】逐章 A–H 格式筆記

---

# 一、UDS 組成與 Uroflowmetry（尿流速圖）

### A. 一句話重點
一個完整的 UDS 包含 **Uroflowmetry、Pressure-Flow study、Urethral profile (UPP)、VUDS** 四件套；UFM 是非侵入性篩檢，只有「時間、流速」兩個參數，先看尿量足不足、再看 Qmax、再看曲線型態。

### B. 必背定義／數字
- **UFM 只有兩個參數**：時間、流速（ml/s）；**曲線下面積 = 排尿量(voided volume)**。
- **判讀四步驟（講者 SOP）**：
  1. 先看尿量：**< 150 mL 意義不大，建議重做**。
  2. 尿量夠 → 看 **Qmax：男 > 15、女 > 25**（ml/s 為正常）。
  3. 看型態：**基本上不是鐘形 (bell shape) 都算異常**。
  4. **PVR（餘尿）通常 < 50 mL** 為正常。
- 正常鐘形曲線：平滑、單峰、bell-shaped。

### C. 臨床判斷流程（異常型態辨識）
```
UFM 異常型態：
┌─ Plateau（高原型，平頂）──→ Urethral stricture（固定阻力／捏水管效應）
│      = Constrictive obstructive pattern，Qmax 被「壓」到一條低平線
├─ 矮 bell shape + 尿流時間拉很長、Qmax 小 ──→ BPH/BPO
│      = Compressive obstructive pattern
└─ 鋸齒/間斷型(interrupted/staccato) ──→ BOO 需靠腹壓代償、
       或 impaired detrusor contractility、abdominal straining
```

### D. 診斷工具與適應症
- **UFM ＋ PVR**：所有 LUTS / 排尿障礙的**第一線非侵入性檢查**，便宜、可重複。
- 缺點：無法區分「阻塞 vs 收縮力不足」（都可能 low flow）→ 需 Pressure-Flow study 才能分。
- 適應症：BPH、女性排尿困難、術前評估、神經性膀胱追蹤。

### E. 治療策略
（UFM 為診斷工具，治療依底層病因；見後續 BOO/DV/PBNO 章節。）

### F. 考試高頻重點
1. UFM 尿量 **< 150 mL 不準、要重做**（最常考的品質門檻）。
2. Qmax 正常切點：**男 > 15、女 > 25 ml/s**。
3. **Plateau = urethral stricture（constrictive）**；矮鐘形 = BPO（compressive）。
4. 曲線下面積 = voided volume。
5. UFM 不能單獨診斷 BOO（low flow 可能是阻塞或 detrusor 弱）。

### G. 容易混淆比較表
| 型態 | 外觀 | 對應病因 | 機轉 |
|------|------|---------|------|
| Plateau（高原） | 低、平頂、寬 | Urethral stricture | Constrictive（固定阻力） |
| 矮鐘形 | 低 Qmax、時間長 | BPH / BPO | Compressive（受壓） |
| 鋸齒/間斷 | 多峰、忽高忽低 | BOO 腹壓代償、DU、straining | 需腹壓推 |

### H. 臨床記憶法
- 「**平頂＝管子被掐（stricture），矮鐘＝攝護腺壓（BPO），鋸齒＝靠肚子擠（腹壓代償）**」。
- 品質門檻記「**150／50**」：尿量要 >150 才準，餘尿 <50 才正常。

---

# 二、Pressure-Flow Study（PFS）— UDS 的核心

### A. 一句話重點
PFS 同時量「膀胱內壓 pVes、腹壓 pAbd」，**逼尿肌壓 pDet 是推算出來的：pDet = pVes − pAbd**；唯有 PFS 才能把「尿不好」拆成「阻塞(BOO)」或「膀胱太弱(DU)」。

### B. 必背定義／數字
- **三個重要參數**：pVes（膀胱內壓）、pAbd（腹壓）、pDet（逼尿肌壓）。
- **三個可量測的數字**：pVes（Foley 導尿管）、pAbd（肛管/直腸內壓 = 腹內壓）、EMG（電極，記錄外括約肌活性）。
- **核心公式**：`pVes = pDet + pAbd` → 因此 **`pDet = pVes − pAbd`（推算值）**。
- 圖像記憶（同心方框）：最外 pAbd（腹腔）、中間 pDet（膀胱壁張力）、最內 pVes（膀胱腔內壓）。

### C. 臨床判斷流程（PFS 怎麼做出來的）
```
膀胱導尿管：記錄  ① 灌注水量(Vmic)  ② 膀胱內壓 pVes
肛管(直腸)：記錄  直腸內壓 = 腹內壓 pAbd
EMG 貼片  ：記錄  外括約肌活性
            ↓
pDet = pVes − pAbd（機器即時相減畫出第三條線）
```

### D. 診斷工具與適應症
- 適應症：UFM/PVR 無法判定原因的排尿障礙、術前釐清 BOO vs DU、神經性膀胱、女性排尿困難。
- VUDS（Video-UDS）= PFS ＋ 同步透視影像，可看 bladder neck 開合、VUR、漏尿點。

### E. 治療策略
（PFS 為診斷核心，依結果導向治療——BOO→解阻塞；DU→CIC/誘尿。）

### F. 考試高頻重點
1. **pDet = pVes − pAbd**（最高頻，務必背到反射）。
2. pVes 用 Foley、pAbd 用肛管(直腸壓代表腹壓)、外括約肌看 EMG。
3. pDet 是「**推算**」非直接量測 → artifact 常出在 pAbd 沒貼好。
4. 只有 PFS 能區分 BOO 與 DU；UFM 不行。
5. 直腸壓代表腹內壓的前提：直腸無強烈收縮、氣泡排除。

### G. 容易混淆比較表
| 參數 | 怎麼來 | 代表 |
|------|--------|------|
| pVes | Foley 直接量 | 膀胱腔內總壓 |
| pAbd | 肛管/直腸 直接量 | 腹內壓 |
| pDet | pVes − pAbd（推算） | 逼尿肌自身收縮壓 |
| EMG | 會陰電極 | 外括約肌活性 |

### H. 臨床記憶法
- 「**膀胱（Ves）＝肚子（Abd）＋肌肉（Det）**」→ 移項就得 `pDet = pVes − pAbd`。
- pDet 是「算出來的乖孩子」，pAbd 沒貼好它就亂跳。

# 三、Filling Phase（儲尿期）判讀 — 3C1D ＋ Incontinence

### A. 一句話重點
儲尿期判讀記「**3C（cystometry）＋ 1D ＋ incontinence**」：Capacity、Compliance、Censation(sensation)、Detrusor overactivity、有無漏尿(SUI/UUI)。

### B. 必背定義／數字
- **3C**：
  - **Capacity（容量）**：正常 **> 300 mL**（最大膀胱容量約 400–600）。
  - **Compliance（順應性）= ΔV/ΔP**：正常值約 **> 15～30 (mL/cmH₂O)**；低 compliance = 高壓儲尿 = 上尿路風險。
  - **Censation/Sensation（感覺）**：
    - First desire to void：正常約 **150–200 mL**。
    - Normal / Strong desire to void：正常約 **400–600 mL**。
    - 感覺延後 = **hyposensitivity**（低敏感）。
- **1D — Detrusor overactivity (DO)**：儲尿期 pDet 出現不自主上升（伴或不伴漏尿）；舊稱 detrusor instability。
- **Incontinence**：儲尿期是否出現 SUI（咳嗽漏尿、無 pDet 上升）或 UUI（伴 DO）。

### C. 臨床判斷流程
```
Filling phase 一條一條看：
① Capacity  > 300 ?              → 太小：可能 DO/低順應；太大：hyposensitivity/DU
② Compliance > 15~30 ?           → 低：高壓膀胱（神經性、放療、長期阻塞）→ 上尿路危險
③ Sensation：first desire 150-200、強尿意 400-600
                                  → 延後 = hyposensitivity；提早 = hypersensitivity/OAB
④ Detrusor overactivity ?        → pDet 不自主上升 = DO
⑤ Incontinence ?  咳嗽測試      → 無 pDet 上升而漏 = SUI；伴 DO 而漏 = UUI
```
> 講義範例（女性 SUI 個案）結論：normal compliance、normal capacity、**hyposensitivity**、**no DO**、**咳嗽測試無漏尿**（灌到 ~700 mL 才滲尿）。

### D. 診斷工具與適應症
- Filling cystometry（CMG）：評估儲尿期；搭配咳嗽/valsalva 誘發 SUI。
- VUDS：可同步看漏尿時 bladder neck 開放與否。

### E. 治療策略（依儲尿期異常）
- DO/OAB：抗膽鹼藥(antimuscarinic)、β3-agonist、膀胱內 Botox、SNM。
- 低 compliance：抗膽鹼、CIC、必要時膀胱擴大術；首要保護上尿路。
- SUI：見第五章。

### F. 考試高頻重點
1. 儲尿期口訣 **3C1D**：Capacity、Compliance、Sensation、Detrusor overactivity（＋incontinence）。
2. Compliance 正常 **>15～30**；低 compliance = 上尿路風險（神經性膀胱最怕）。
3. First desire **150–200 mL**、強尿意 **400–600 mL**、capacity **>300**。
4. SUI（無 pDet 上升）vs UUI（伴 DO）的鑑別。
5. Hyposensitivity 常與 DU（underactive bladder）並存。

### G. 容易混淆比較表
| 漏尿型態 | 儲尿期 pDet | 誘因 | 對應診斷 |
|---------|------------|------|---------|
| SUI | 無上升 | 咳嗽/用力/腹壓↑ | 括約肌/支撐問題 |
| UUI | 有 DO 上升 | 急尿感 | 逼尿肌過動 |
| Mixed | 兩者皆有 | 混合 | MUI |

### H. 臨床記憶法
- 「**三個 C 一個 D，最後問漏不漏**」：Capacity、Compliance、Censation、Detrusor overactivity → incontinence。
- 數字串「**150–200 起意、400–600 想尿、>300 才夠大、>15 才彈性好**」。

# 四、Voiding Phase（排尿期）判讀 — 壓力/流速四象限、BOOI、BCI

### A. 一句話重點
排尿期就是看「**尿得好不好**」：用 **pDet vs Qmax 四象限**定位，再用 **BOOI（看有沒有阻塞）**與 **BCI（看膀胱力夠不夠）**兩條公式量化。

### B. 必背定義／數字（核心公式）
- **BOOI（= AG number, Bladder Outlet Obstruction Index）**
  `BOOI = PdetQmax − 2 × Qmax`
  - **> 40 → obstructed（阻塞）**
  - **20–40 → equivocal（疑似）**
  - **< 20 → unobstructed（無阻塞）**
- **BCI（Bladder Contractility Index，膀胱收縮力）**
  `BCI = PdetQmax + 5 × Qmax`
  - **> 150 → strong**
  - **100–150 → normal**
  - **< 100 → weak（收縮力不足）**
- 講義例（PdetQmax=40、Qmax=4）：BOOI = 40 − 2×4 = **32（equivocal，20–40）**；BCI = 40 + 5×4 = **60（weak，<100）**。重點在「會把 PdetQmax 與 Qmax 代進公式並分類」。
- **Time to Qmax 正常約 10 秒**。

### C. 臨床判斷流程（壓力/流速四象限）
```
              High flow                Low flow
High      ┌───────────────────┬────────────────────┐
pressure  │ HPHF：compensated  │ HPLF：典型 BOO      │
          │ BOO，久了 HL→LL    │                     │
          ├───────────────────┼────────────────────┤
Low       │ LPHF：最正常       │ LPLF：可能 DU       │
pressure  │                    │ (underactive)       │
          └───────────────────┴────────────────────┘
   尿不好還要想：神經性膀胱 → DSD、dysfunctional voiding
```
- **LPHF = 最正常**；**HPLF = 典型 BOO**；**LPLF = DU**；**HPHF = 代償型 BOO**（長期會從 high→low contractility 惡化）。

### D. 診斷工具與適應症（三大 Nomogram）
| Nomogram | 看什麼 | 切點 |
|----------|--------|------|
| **ICS provisional** | 阻塞分區 | Pdet−2Q：上線 =40（>obstructed）、下線 =20（<unobstructed），A/G number |
| **Griffiths URA** | 阻塞阻力 | **URA > 29 有阻塞、URA < 21 無阻塞** |
| **Schafer** | 阻塞分級＋收縮力 | BOOI 線 X+? 、BCI 線：X+5Y=100（VW/W 界）、X+5Y=150 |

### E. 治療策略
- HPLF（BOO）：解除阻塞（男 TURP/解 BPH；女依 BOO 病因，見第六章）。
- LPLF（DU/UAB）：CIC、定時排尿、誘尿手法；目前無確效藥物。
- HPHF：監測，避免惡化成失代償。

### F. 考試高頻重點
1. **BOOI = PdetQmax − 2Qmax**；**>40 阻塞、<20 無阻塞、20–40 模糊**。
2. **BCI = PdetQmax + 5Qmax**；**>150 強、100–150 正常、<100 弱**。
3. 四象限：**LPHF 正常、HPLF 典型 BOO、LPLF DU、HPHF 代償 BOO**。
4. **Griffiths URA：>29 阻塞、<21 不阻塞**。
5. Schafer BCI 線：**X+5Y=100 / 150**。Time to Qmax 正常約 10 秒。

### G. 容易混淆比較表
| 象限 | pDet | Qmax | 意義 |
|------|------|------|------|
| LPHF | 低 | 高 | 最正常 |
| HPHF | 高 | 高 | compensated BOO（會惡化） |
| HPLF | 高 | 低 | 典型 BOO |
| LPLF | 低 | 低 | DU / underactive bladder |

### H. 臨床記憶法
- BOOI「**減 2 看阻塞**」、BCI「**加 5 看力氣**」（兩條都用 PdetQmax 當底）。
- 四象限「**低壓高流最健康，高壓低流是阻塞，低壓低流肌無力**」。
- BOOI 三段切點背「**20／40**」；BCI 背「**100／150**」；URA 背「**21／29**」。

# 五、Female Stress Urinary Incontinence (SUI)

### A. 一句話重點
SUI 的本質是「**腹壓上升時，Pves 傳到尿道的壓力 > Pura → 漏尿**」；分型 Type 1/2/3，其中 **Type 3 = ISD（內因性括約肌不全）**，是治療與鑑別的重點。

### B. 必背定義／分型
- **解剖分型（依 bladder neck 位置/活動度）**：
  - **Type 1**：Bladder neck hypermobility（膀胱頸下移 **0–2 cm**）。
  - **Type 2**：Bladder neck & urethrovesical hypermobility（下移 **> 2 cm**）。
  - **Type 3**：**ISD（Intrinsic Sphincter Deficiency）**——括約肌本身抵抗力很弱（**幾乎不下移**）。
- **功能分型（兩大類）**：
  - **Type A = hypermobility**：腹壓增加時壓力傳導不均勻（對應 Type 1/2）。
  - **Type B = ISD**：括約肌本身抵抗力差（對應 Type 3）。
- **漏尿的力學原理**：
  - 正常：穩固 bladder neck → 壓力均勻傳導，且 Pura 隨腹壓同步上升 → **`Pves = Pabd + Pdet ≤ Pura`**（不漏）。
  - Type 1/2 SUI：不穩固 bladder neck → 壓力無法傳到 urethra → **`Pves = Pabd + Pdet > Pura`**（漏尿）。

### C. 臨床判斷流程（如何鑑別分型）
```
懷疑 SUI → 三大工具鑑別：
① Pressure-Flow study
② Urethral Pressure Profile (UPP) — 量 MUCP
③ VUDS — 看 bladder neck descent
   ┌ Type 1：descent 0–2 cm
   ├ Type 2：descent > 2 cm
   └ Type 3(ISD)：nearly no descent
（搭配 CLPP 區分 hypermobility vs ISD）
```

### D. 診斷工具與適應症（各工具的切點）
| 工具 | 參數 | Type 1 | Type 2 | Type 3 (ISD) |
|------|------|--------|--------|--------------|
| **Pressure flow / CLPP** | CLPP（腹漏點壓） | **> 90** | **60–90** | **< 60** |
| **UPP** | MUCP（最大尿道閉合壓） | > 20 cmH₂O | > 20 cmH₂O | **< 20 cmH₂O** |
| **VUDS** | Bladder neck descent | 0–2 cm | > 2 cm | nearly no descent |

> **記憶核心：ISD（Type 3）＝ CLPP < 60 ＋ MUCP < 20 ＋ 幾乎不下移**。

### E. 治療策略（SUI 通用）
- **Conservative**：減重、骨盆底肌運動（Kegel）、生活型態調整。
- **Medication**：duloxetine（部分國家）、局部雌激素（停經後）。
- **Surgical（主力）**：
  - **Mid-urethral sling（TVT/TOT）**：hypermobility（Type 1/2）首選。
  - **ISD（Type 3）**：傾向 TVT（retropubic）、bulking agent、必要時 AUS（人工括約肌）；TOT 對純 ISD 效果較差。
- 講義個案：主訴咳嗽/久坐漏尿 → 預計做**懸吊手術（sling）**。

### F. 考試高頻重點
1. SUI 力學：**Pves > Pura → 漏尿**；正常時 Pura 隨腹壓同步上升。
2. **Type 3 = ISD**；對應功能分型 **Type B**。
3. **ISD 三切點：CLPP < 60、MUCP < 20 cmH₂O、bladder neck 幾乎不下移**。
4. Type 1 descent 0–2 cm、Type 2 > 2 cm。
5. Hypermobility → mid-urethral sling；ISD → 重建/bulking/AUS。

### G. 容易混淆比較表
| | Hypermobility (Type 1/2 / Type A) | ISD (Type 3 / Type B) |
|---|---|---|
| 機轉 | 支撐不足、壓力傳導不均 | 括約肌本身無力 |
| Bladder neck descent | 有（0–2 / >2 cm） | 幾乎無 |
| MUCP | > 20 cmH₂O | **< 20 cmH₂O** |
| CLPP | 60–90 以上 | **< 60** |
| 手術 | mid-urethral sling | TVT/bulking/AUS |

### H. 臨床記憶法
- 「**Pves 贏過 Pura 就漏尿**」一句話記住 SUI 力學。
- ISD 背「**三個 < ：CLPP<60、MUCP<20、descent≈0**」。
- 分型口訣「**1 小動、2 大動、3 不動（但最弱）**」。

# 六、Female Bladder Outlet Obstruction (BOO) — 定義與分類

### A. 一句話重點
男性 BOO 有公認標準（**AG number > 40**），女性 **UDS 無統一定論**，但精神一致＝**High pressure, low flow**；分類分 neurogenic / non-neurogenic，非神經性再分 anatomic 與 **functional（DV / Fowler's / PBNO）**。

### B. 必背定義／數字
- **Male BOO**：`AG number (BOOI) = PdetQmax − 2 × Qmax`，**> 40 → BOO**。
- **Female BOO 各家定義（沒有單一定論）**：
  - **Massey & Abrams**：PdetQmax **> 50** cmH₂O 且 Qmax **< 12** ml/s。
  - **Blaivas**：sustained PdetQmax **> 20** cmH₂O 且 Qmax **< 12** ml/s。
  - **Chassagne**：PdetQmax **> 20** cmH₂O 且 Qmax **< 15** ml/s。
  - **Nitti**：**VUDS 證實** outlet 阻塞 ＋ sustained detrusor contraction。
  - **BOOIf（女性 BOO index）**：`BOOIf = PdetQmax − 2.2 × Qmax`
    - **< 0：< 10% 機率**、**> 5：50% 機率**、**> 18：> 90% 機率** BOO。
- **女性 BOO 分類**：
  - **Neurogenic**（參考 EAU neuro-urology guideline）。
  - **Non-neurogenic**：
    - **Anatomic**：婦科（uterus tumor、POP）、iatrogenic（anti-incontinence 手術後阻塞）、urologic（malignancy、stricture、stone、ureterocele、caruncle）。
    - **Functional**：**Dysfunctional voiding (DV)**、**Fowler's syndrome**、**Primary bladder neck obstruction (PBNO)**。

### C. 臨床判斷流程
```
女性排尿困難 + UDS High pressure / Low flow
        │
        ├─ 神經學異常？ ──Yes──→ Neurogenic（DSD…，查 EAU neuro VD）
        │
        └─ No（neurologically normal）→ Non-neurogenic
              ├ 有解剖阻塞（POP、術後、stricture、tumor…）→ Anatomic
              └ 無解剖阻塞 → Functional：
                   ├ EMG 排尿時↑、間斷流（spinning top）→ Dysfunctional Voiding
                   ├ 年輕女、無法解尿、恥骨上痛、無尿急 → Fowler's syndrome
                   └ Bladder neck 不開、EMG 正常 → PBNO
```

### D. 診斷工具與適應症
- **VUDS 為功能性 BOO 鑑別黃金工具**：同時看 pressure/flow、EMG、bladder neck 開合與漏尿位置。
- DV、PBNO、Fowler's 的鑑別全靠「**EMG 表現 ＋ bladder neck 影像**」。

### E. 治療策略（總綱，細節見各疾病）
- Anatomic：去除病因（POP 修補、鬆解過緊 sling、處理 stricture/stone）。
- Functional：見下方 DV / Fowler's / PBNO 各章。

### F. 考試高頻重點
1. **男 BOO：AG>40；女性無統一 UDS 定論**，但都是 **high pressure low flow**。
2. 女性各家定義（Massey&Abrams >50/<12；Blaivas >20/<12；Chassagne >20/<15；Nitti=VUDS）。
3. **BOOIf = PdetQmax − 2.2 Qmax**（>18 → >90% BOO）。
4. 功能性女性 BOO 三本柱：**DV、Fowler's、PBNO**。
5. Anatomic 阻塞要記 **anti-incontinence 手術（醫源性）**這個易考來源。

### G. 容易混淆比較表（男 vs 女 BOO 定義）
| | Male BOO | Female BOO |
|---|---|---|
| 標準 | 明確（AG number >40） | 無單一定論，多家標準 |
| 共同精神 | High pressure low flow | High pressure low flow |
| 常用 index | BOOI = Pdet−2Q | BOOIf = Pdet−2.2Q |
| Qmax 切點 | — | 多以 <12～15 ml/s |

### H. 臨床記憶法
- 男生 BOO「**減 2 大於 40**」；女生 BOO「**減 2.2、看 VUDS**」。
- 女性功能性 BOO 三本柱記「**DV—Fowler—PBNO**」（由表淺到深、由肌肉到 bladder neck）。

# 七、Dysfunctional Voiding (DV)

### A. 一句話重點
DV ＝ **神經學正常**的女性，排尿時 peri-urethral 橫紋肌/提肛肌**不自主間歇收縮**，造成間斷/波動的尿流；要與神經性的 **DSD** 區分。

### B. 必背定義（ICS terminology）
- 「intermittent and/or fluctuating flow rate due to **involuntary intermittent contractions of the peri-urethral striated or levator muscles** during voiding in **neurologically normal** women.」
- 與 **DSD** 的關鍵差異：DV 是**神經學正常**；DSD 是神經病灶（脊髓）造成逼尿肌-括約肌不協調。

### C. 臨床判斷流程（VUDS 表現）
```
DV 的 VUDS：
  High pressure, low flow
  + Intermittent flow（間斷尿流）
  + Spinning top urethra（陀螺狀近端尿道擴張）
  + EMG ++（排尿時外括約肌活性異常增加）
```

### D. 診斷工具
- VUDS（含 EMG）為診斷關鍵：voluntary void 時 EMG 活性增加、pelvic floor 無法放鬆。

### E. 治療策略
- **Pelvic floor therapy ± biofeedback**（兒童約 **80% 改善**）——第一線。
- **藥物**：alpha blocker、**baclofen**、anti-muscarinic (Anti-M)、**Botox 注射外括約肌**。
- **Neuromodulation**（SNM）。

### F. 考試高頻重點
1. DV 定義關鍵字：**neurologically normal ＋ involuntary intermittent contraction**。
2. 必與 **DSD（神經性）**鑑別。
3. VUDS：間斷流、**spinning top urethra**、EMG↑。
4. 第一線治療 **biofeedback/pelvic floor therapy（80% 改善）**。
5. 進階：alpha-blocker、baclofen、外括約肌 Botox、SNM。

### G. 鑑別重點（DV vs DSD）
| | DV | DSD |
|---|---|---|
| 神經狀態 | 正常 | 有脊髓神經病灶 |
| 機轉 | 不自主間歇收縮 | 逼尿肌-括約肌不協調 |
| EMG | 排尿時↑ | 逼尿肌收縮時括約肌不放鬆 |

### H. 臨床記憶法
- 「**正常神經但括約肌亂收縮＝DV；有神經病灶＝DSD**」。
- 影像記「**陀螺（spinning top）轉不停＝DV**」。

# 八、Primary Bladder Neck Obstruction (PBNO)

### A. 一句話重點
PBNO ＝ 排尿時 **bladder neck 不開（漏斗化失敗）但外括約肌正常**，呈 high pressure low flow **without increased external sphincter activity**；口試 Q5 治療答案核心。

### B. 必背定義／數字
- **盛行率**：4.6% ～ **8.7%（台灣）**。
- **UDS/VUDS 表現**：
  - **High pressure, low flow**。
  - **Without increased activity of the external sphincter**（與 DV 最大差異！）。
  - **Funneling of the bladder neck 失敗**（bladder neck 不開）。
- **病因**：
  - Anatomical：bladder neck 纖維化、肥厚。
  - Functional：排尿時 bladder neck 壓力持續升高（**內括約肌不放鬆、交感興奮**）。

### C. 臨床判斷流程
```
High pressure low flow
  + EMG 外括約肌「正常」（不像 DV 會↑）
  + VUDS：bladder neck 排尿時不開（no funneling）
        → PBNO
```

### D. 診斷工具
- **VUDS**：影像直接看 bladder neck 排尿時不漏斗化、外括約肌 EMG 正常。

### E. 治療策略（Q5 答案）
- **Observation**（輕症）。
- **CIC**（清潔間歇導尿）。
- **藥物：α-blocker、baclofen**。
- **TUI-BN（Transurethral incision of bladder neck，TUI）**——確定性手術。
- **Botox**。

### F. 考試高頻重點
1. PBNO ＝ high pressure low flow **＋ 外括約肌 EMG 正常 ＋ bladder neck 不 funneling**。
2. 與 DV 區別：**DV 的 EMG↑、PBNO 的 EMG 正常**。
3. 台灣盛行率 **約 8.7%**。
4. 治療階梯：observation → CIC → α-blocker/baclofen → **TUI-BN** → Botox。
5. 病因含 anatomical（纖維化/肥厚）與 functional（內括約肌不放鬆/交感興奮）。

### G. 容易混淆比較表（功能性女性 BOO 三本柱）
| | Dysfunctional Voiding | Fowler's syndrome | PBNO |
|---|---|---|---|
| 病灶層次 | 外括約肌/骨盆底（橫紋肌） | 外括約肌（無法放鬆） | bladder neck（內括約肌/平滑肌） |
| EMG | 排尿時↑（間歇收縮） | 異常 pattern（CRD with decelerating bursts） | **正常** |
| 影像 | spinning top urethra | — | bladder neck 不 funneling |
| 神經 | 正常 | 正常（年輕女性） | 正常 |
| 治療首選 | pelvic floor/biofeedback | **Sacral neuromodulation (SNM)** | α-blocker → **TUI-BN** |

### H. 臨床記憶法
- 「**PBNO ＝ 門（bladder neck）打不開，但守衛（外括約肌）沒亂動（EMG 正常）**」。
- 三本柱 EMG「**DV↑、Fowler 亂、PBNO 正常**」。

# 九、Fowler's Syndrome ＆ Hinman Syndrome（補充考點）

### A. 一句話重點
**Fowler's**：年輕女性無法解尿、**外括約肌無法放鬆**、常有恥骨上痛但**無尿急感**，治療為 **SNM**。**Hinman（non-neurogenic neurogenic bladder）**：兒童期、行為性括約肌不放鬆，VCUG 呈 **fir-tree（聖誕樹）膀胱**。

### B. 必背定義
- **Fowler's syndrome**：
  - 對象：**年輕女性**，無法解尿（urinary retention）。
  - 症狀：**Suprapubic pain（恥骨上/膀胱痛）**；**通常不會有 urgency / 想尿尿的感覺**。
  - 解尿時：**EMG 外括約肌無法放鬆**（典型 EMG：complex repetitive discharges with decelerating bursts）。
- **Hinman syndrome（Hinman–Allen, non-neurogenic neurogenic bladder）**：
  - 罕見，**早期幼兒/兒童期**出現，常在 toilet training 後；**青春期後多自行緩解**。
  - 表現：混合性儲尿（frequency/urgency）＋排尿症狀、incontinence、反覆 UTI。
  - 影像：VCMG 呈 **fir-tree bladder（聖誕樹/松樹狀膀胱）**，可合併 VUR。

### C–E. 流程／診斷／治療
- **Fowler's**：診斷靠 EMG（外括約肌無法放鬆）；治療 **Sacral nerve modulation (SNM)**。
- **Hinman**：屬行為性 DV 的極端；治療 **Biofeedback、Botox、SNM**（同 DV 路線）。

### F. 考試高頻重點
1. Fowler's：**年輕女性、retention、suprapubic pain、無 urgency、外括約肌不放鬆 → SNM**。
2. Fowler's EMG：CRD with decelerating bursts（特徵性）。
3. Hinman = **non-neurogenic neurogenic bladder**，兒童、**fir-tree bladder**，可合併 VUR，青春期後常緩解。
4. Hinman 治療：biofeedback / Botox / SNM。

### G. 比較表
| | Fowler's | Hinman |
|---|---|---|
| 年齡/性別 | 年輕女性 | 兒童（toilet training 後） |
| 神經 | 正常 | 正常（功能性「假神經性」） |
| 特徵 | retention＋恥骨上痛、無尿急 | fir-tree bladder、反覆 UTI、可合併 VUR |
| 治療 | SNM | biofeedback / Botox / SNM |

### H. 臨床記憶法
- 「**Fowler 的女生尿不出來又痛、卻不急；治療靠骶神經（SNM）**」。
- 「**Hinman 小孩裝神經（假神經性），膀胱長成聖誕樹**」。

### 10 題單選（附答案與解析）

**Q1.** 一份 uroflowmetry 報告 voided volume 僅 120 mL，Qmax 9 ml/s。最適當處置？
- (A) 直接診斷 BOO (B) 直接診斷 DU (C) **建議重做（尿量不足）** (D) 安排膀胱鏡
**答案：C**。尿量 <150 mL 判讀意義不大，應重做。

**Q2.** 關於 pressure-flow study，下列何者正確？
- (A) pDet 直接由導尿管量測 (B) pAbd 由 Foley 量測 (C) **pDet = pVes − pAbd** (D) pVes = pDet − pAbd
**答案：C**。pVes（Foley）與 pAbd（肛管）為量測值，pDet 為推算。

**Q3.** 男性 PdetQmax = 60 cmH₂O、Qmax = 8 ml/s，BOOI 為何、如何判讀？
- (A) 44，obstructed (B) **44，obstructed** (C) 24，equivocal (D) 100，unobstructed
**答案：B**。BOOI = 60 − 2×8 = 44 > 40 → obstructed。（同題提醒 BCI = 60 + 5×8 = 100，屬 normal 下限。）

**Q4.** 下列何者最符合「典型 BOO」的 pressure-flow 象限？
- (A) Low pressure high flow (B) Low pressure low flow (C) **High pressure low flow** (D) High pressure high flow
**答案：C**。HPLF 為典型阻塞；LPLF 偏 DU、HPHF 為代償型。

**Q5.** 女性 SUI 屬 ISD（Type 3）的最佳支持證據？
- (A) MUCP 35 cmH₂O (B) bladder neck descent 3 cm (C) **MUCP 15 cmH₂O、bladder neck 幾乎不下移** (D) CLPP 95 cmH₂O
**答案：C**。ISD：MUCP <20、CLPP <60、descent≈0。

**Q6.** 關於 Griffiths URA nomogram，何者代表「有阻塞」？
- (A) URA 15 (B) **URA 32** (C) URA 20 (D) URA 25
**答案：B**。URA >29 有阻塞、<21 無阻塞。

**Q7.** 儲尿期 compliance 的正常範圍與臨床意義，何者正確？
- (A) >15~30；過低代表上尿路風險 (B) <5 為正常 (C) 與容量無關 (D) compliance = ΔP/ΔV
**答案：A**。Compliance = ΔV/ΔP，正常 >15~30；低 compliance（高壓儲尿）危害上尿路。

**Q8.** 一位神經學正常的年輕女性，排尿 high pressure low flow、間斷尿流、VUDS 見 spinning top urethra、排尿時 EMG 活性增加。最可能診斷？
- (A) PBNO (B) **Dysfunctional voiding** (C) DSD (D) Fowler's syndrome
**答案：B**。DV：神經正常＋外括約肌不自主間歇收縮、spinning top、EMG↑。

**Q9.** 女性排尿困難，VUDS 見 high pressure low flow、bladder neck 排尿時不漏斗化、外括約肌 EMG 正常。確定性手術為何？
- (A) Mid-urethral sling (B) Sacral neuromodulation (C) **Transurethral incision of bladder neck (TUI-BN)** (D) AUS
**答案：C**。此為 PBNO，TUI-BN 為確定性手術；α-blocker/baclofen 為藥物選項。

**Q10.** 年輕女性急性尿滯留、恥骨上疼痛、無尿急感，EMG 顯示外括約肌無法放鬆（CRD with decelerating bursts）。首選治療？
- (A) α-blocker (B) Mid-urethral sling (C) **Sacral neuromodulation** (D) TURP
**答案：C**。此為 Fowler's syndrome，SNM 為首選治療。

### 5 題口試（標準答案）— 取材自講義 Q1–Q5

**口試 1（講義 Q1）：67 歲女性，兩個月進行性解尿困難，理學檢查正常；過去有 HTN、高尿酸（規律服藥 >10 年），近期接受 C3-T1 HIVD 手術（C-spine decompression+fusion）及一年半前 THR。初步檢查建議？**

標準答案：
- **初步（非侵入性）**：完整病史與症狀詢問、**神經學檢查評估**（本例有頸椎手術史，須排除神經因素）、完整理學檢查、**Urinalysis**、**Post-void residual（膀胱超音波量殘尿）**、**Uroflowmetry (UFM)**、**排尿日誌（voiding diary）**。
- **進階檢查**：**UDS / VUDS**、**cystoscopy**。
- 重點提醒：頸椎減壓手術史 → 須鑑別 neurogenic 因素，VUDS 同步 EMG 最有價值。

**口試 2（講義 Q2）：請說明 ICS 對 Detrusor underactivity (DU) 與 Underactive bladder (UAB) 的定義及差異。**

標準答案：
- **Detrusor underactivity (DU)**：是 **urodynamic（尿動力學）診斷**——逼尿肌收縮強度降低和/或持續時間縮短，導致膀胱排空時間延長和/或無法在正常時間內完成排空。
- **Underactive bladder (UAB)**：是 **症候群（symptom complex）**——以排尿困難症狀（猶豫、尿流細弱、排尿延遲、需用力、排空不全感，常伴儲尿症狀）為主，**通常由 DU 引起**。
- **核心差異**：**DU 是 UDS 上的客觀發現；UAB 是病人主觀症狀的症候群**。UAB 是「症狀層次」，DU 是「尿動力證據層次」；UAB 通常以 DU 為其尿動力基礎，但兩者不可互換。

**口試 3（講義 Q3）：判讀此 VUDS。**

標準答案（依講義波形脈絡）：
- **灌注期（filling）**：first/normal/strong desire 與 urgency 集中出現於相近容量（約 262–263 mL），提示**感覺異常/容量受限**；過程有多次 cine-loop 截圖（bladder、ureter、voiding）。
- **排尿期（voiding）**：Miction command 後，pVes/pDet 變化與 flow 須對照——若 **high pressure low flow** 並配合影像 bladder neck/outlet 狀態，則往 BOO（功能性）方向判讀；若收縮力低 (low pDet) 則考慮 DU。
- 判讀步驟同 SOP：先 filling（3C1D＋incontinence）再 voiding（四象限＋BOOI/BCI），最後結合影像（bladder neck funneling、漏尿點、VUR）。

**口試 4（講義 Q4）：DU 的定義。**

標準答案：**Detrusor underactivity（ICS）**＝逼尿肌**收縮強度降低（reduced strength）和/或收縮持續時間縮短（reduced duration）**，導致膀胱排空時間延長和/或在正常時間範圍內無法完全排空。屬尿動力學診斷，量化可參考 **BCI < 100（weak）**。

**口試 5（講義 Q5）：PBNO 的治療。**

標準答案（階梯式）：
1. **Observation**（症狀輕、殘尿少）。
2. **CIC（清潔間歇導尿）**。
3. **藥物：α-blocker、baclofen**（放鬆 bladder neck/降低交感張力）。
4. **TUI-BN（經尿道 bladder neck 切開）**——確定性手術。
5. **Botox**（外/內括約肌注射）。

---

### Top 20 優先背誦點

1. **pDet = pVes − pAbd**（pDet 為推算值）。
2. **BOOI = PdetQmax − 2Qmax**；>40 阻塞、<20 無、20–40 模糊。
3. **BCI = PdetQmax + 5Qmax**；>150 強、100–150 正常、<100 弱。
4. UFM 尿量 <150 mL 重做；PVR <50 正常。
5. Qmax 正常：男 >15、女 >25 ml/s。
6. UFM 型態：plateau=stricture、矮鐘=BPO、鋸齒=腹壓代償。
7. 儲尿期口訣 **3C1D**＋incontinence。
8. Compliance 正常 >15~30；低 compliance = 上尿路風險。
9. First desire 150–200、強尿意 400–600、capacity >300 mL。
10. 四象限：LPHF 正常、HPLF 典型 BOO、LPLF DU、HPHF 代償 BOO。
11. Griffiths **URA >29 阻塞、<21 無阻塞**。
12. SUI 力學：**Pves > Pura → 漏尿**。
13. SUI 分型：T1 descent 0–2cm、T2 >2cm、**T3 = ISD**（幾乎不動）。
14. **ISD 三切點：CLPP<60、MUCP<20 cmH₂O、descent≈0**。
15. 手術：hypermobility→mid-urethral sling；ISD→TVT/bulking/AUS。
16. 男 BOO **AG>40**；女 BOO 無定論，**BOOIf = Pdet−2.2Qmax**（>18→>90%）。
17. 女功能性 BOO 三柱：**DV / Fowler's / PBNO**；EMG 表現 **↑／亂／正常**。
18. DV：神經正常、spinning top、EMG↑；首選 **biofeedback（80%）**。
19. **PBNO**：bladder neck 不 funneling、EMG 正常、台灣 ~8.7%；確定治療 **TUI-BN**。
20. **Fowler's**：年輕女、retention＋恥骨痛、無尿急、外括約肌不放鬆 → **SNM**；**Hinman**＝fir-tree bladder（兒童、可合併 VUR）。

---

> **DU vs UAB**、**男女 BOO 定義差異**、**ISD 三切點**、**DV/Fowler/PBNO 三本柱（EMG ＋ 治療）** 為本講義最可能的口試命題核心，務必能完整口述與畫鑑別表。

| Ch.16 | 輸尿管狹窄與重建（術式對應長度） | 62–64 | **高** | 內視鏡適應症、Boari/Psoas hitch 長度 |
| Ch.17 | Vesicovaginal / Ureterovaginal fistula | 64–69 | **最高** | double dye / 3-swab test、修補時機 |
| Ch.18 | 女性吊帶與 mesh 併發症 | 69–72 | **高** | 神經損傷對應、mesh 處理原則 |

### 整體判斷（最可能上榜的內容）

這份講義橫跨「感染」與「手術併發症」兩大塊，**口試最愛從以下幾處出題**：

1. **EPN 的 Huang-Tseng CT 分類與處置**（台灣本土研究、DM 病人、PCD vs 腎切的取捨）— 幾乎是台灣泌專必考。
2. **生殖器潰瘍的「痛 vs 不痛」鑑別表**（一級梅毒不痛、herpes/chancroid 痛、LGV 病灶不痛但 LAP 痛）— 經典單選＋口試。
3. **Syphilis 的血清學判讀**（non-treponemal 用於 screening/monitoring、treponemal 用於 confirmation 且終生陽性、titer 4 倍變化的意義）。
4. **染料測試**（double dye test 與 three swab test 判讀 VVF vs ureterovaginal vs urethrovaginal）＋ Indigo carmine／Methylene blue 的三大禁忌（孕婦、G6PD、合併 SSRI）。
5. **輸尿管重建術式對應 defect 長度**（Boari flap 12–15 cm、Psoas hitch 6–10 cm 並可能傷及 genitofemoral nerve）。

筆試則偏好：UTI 的 pyuria/bacteriuria 解離、XGP 病理（foamy macrophage）、Prostatitis NIH 分類、抗結核藥副作用（Ethambutol→視神經炎/紅綠色盲；INH→周邊神經病變）、HPV 疫苗價數對應型別。

# Ch.1　UTI 定義與診斷原則

**A. 一句話重點**
UTI 的診斷核心是「pyuria（白血球）＋ bacteriuria（細菌）＋ 症狀」三者的組合，三者解離時各有臨床意義。

**B. 必背定義**
- **Pyuria**：尿中白血球升高（>10 WBC/hpf 或 leukocyte esterase 陽性），代表泌尿道發炎反應。
- **Bacteriuria**：尿中有細菌。Significant bacteriuria 傳統定義 ≥10⁵ CFU/mL（中段尿）。
- **Asymptomatic bacteriuria（無症狀菌尿）**：有 bacteriuria 但無症狀，多為 **colonization（移生）**，原則上不治療（孕婦、術前泌尿手術例外）。
- **Sterile pyuria（無菌性膿尿）**：有 pyuria 但常規培養陰性 → 想到 **結核（TB）、結石、腫瘤、披衣菌/淋病、已用過抗生素**。

**C. 臨床判斷流程**
```
尿液分析 → pyuria? bacteriuria?
 ├─ pyuria(+) + bacteriuria(+) + 症狀 → UTI，治療
 ├─ bacteriuria(+) pyuria(-) 無症狀 → colonization，多不治療
 └─ pyuria(+) bacteriuria(-)（sterile pyuria）→ 查 TB / 結石 / 腫瘤 / 非典型菌
```

**D. 診斷工具與適應症**
- 尿液分析 + 鏡檢（pyuria）
- 中段尿培養（gold standard 確認菌種與抗藥性）
- 影像（US/CT）→ 用於複雜性、反覆、治療無效或懷疑阻塞/膿瘍時

**E. 治療策略**
- 依「uncomplicated vs complicated」決定療程（見 Ch.2）。
- 無症狀菌尿原則不治療，例外：孕婦、即將接受會造成黏膜出血的泌尿道手術。

**F. 考試高頻重點**
1. Sterile pyuria 的鑑別（TB、結石、腫瘤）是經典單選。
2. 無症狀菌尿不治療，孕婦例外。
3. Significant bacteriuria ≥10⁵ CFU/mL。
4. Pyuria 代表發炎，不等於一定有感染。
5. Bacteriuria without pyuria 多為移生。

**G. 容易混淆比較表**

| 情境 | pyuria | bacteriuria | 臨床意義 |
|------|:------:|:-----------:|---------|
| 典型 UTI | + | + | 感染，治療 |
| 移生 | − | + | colonization，多不治療 |
| 無菌性膿尿 | + | −（常規培養） | TB／結石／腫瘤／非典型菌 |

**H. 臨床記憶法**
> 「**有菌無白＝移生；有白無菌＝找結核結石腫瘤**」。

---

# Ch.2　Uncomplicated vs Complicated UTI

**A. 一句話重點**
有「結構/功能異常、免疫低下、留置導管、男性、孕婦、院內/抗藥菌」等危險因子者＝complicated UTI，療程較長、需評估影像。

**B. 必背定義（Box 55.1 風險因子概念）**
- **Uncomplicated UTI**：健康、非孕、無泌尿道結構/功能異常的女性下泌尿道感染。
- **Complicated UTI** 危險因子：男性、孕婦、糖尿病、免疫抑制、留置導尿管/支架、神經性膀胱、阻塞（結石/腫瘤/BPH）、腎功能不全、近期器械操作、院內感染、多重抗藥菌、移植腎。

**C. 臨床判斷流程**
```
UTI → 有上述危險因子?
 ├─ 無 → Uncomplicated → 短療程
 └─ 有 → Complicated → 較長療程 + 找/解除潛在病因（阻塞、導管、結石）
```

**D. 診斷工具與適應症**
- Uncomplicated：臨床診斷即可，不一定要培養。
- Complicated：建議培養、評估影像、找潛在解剖/功能問題。

**E. 治療策略**
- **Uncomplicated cystitis**：短療程口服（如 nitrofurantoin、TMP-SMX、fosfomycin、fluoroquinolone）。
- **Complicated UTI**：依培養延長療程，並**解除潛在病因**（最重要：引流阻塞、移除/更換導管）。

**F. 考試高頻重點**
1. 「男性 UTI 一律視為 complicated」。
2. Complicated 的核心是「找出並解除潛在病因」。
3. 孕婦 UTI（含無症狀菌尿）需治療。
4. 留置導管相關菌尿無症狀不治療，有症狀才治。
5. Complicated 療程較長。

**G. 容易混淆比較表**

| 項目 | Uncomplicated | Complicated |
|------|---------------|-------------|
| 對象 | 健康非孕女性 | 男性/孕婦/結構功能異常/免疫低下 |
| 影像 | 多不需 | 常需要 |
| 療程 | 短 | 長 + 解除病因 |

**H. 臨床記憶法**
> 「**男人、孕婦、管子、糖、阻塞、免疫差**」六項任一中 → complicated。

---

# Ch.3　Acute Pyelonephritis（APN）

**A. 一句話重點**
APN 是上泌尿道感染，多數臨床診斷即可，但符合特定條件（治療無反應、敗血、單側功能腎、糖尿病等）需影像評估找膿瘍/阻塞/氣腫。

**B. 必背定義**
- 典型三聯：發燒、腰痛（flank pain/CVA tenderness）、膿尿菌尿。
- **約 16% 影像可發現顯著異常**（膿瘍、阻塞、氣腫性變化等）。

**C. 臨床判斷流程**
```
發燒 + 腰痛 + 膿尿 → APN
 → 經適當抗生素 48–72h 無改善 / 敗血 / 疑阻塞 → 影像（CT 首選）
 → 找 abscess、obstruction、EPN、結石
```

**D. 診斷工具與適應症（Box 55.5 影像適應症概念）**
影像（首選 contrast CT）建議用於：**治療 48–72 小時無反應、敗血症/休克、糖尿病、免疫低下、疑似阻塞或結石、單側功能腎、反覆 APN、懷疑膿瘍或氣腫**。

**E. 治療策略**
- 經驗性靜脈抗生素（涵蓋 GNB，依在地抗藥性），退燒穩定後轉口服，總療程約 7–14 天。
- 有阻塞 → 立即引流（雙J或腎造廔）。

**F. 考試高頻重點**
1. APN 約 16% 影像有顯著異常。
2. 影像首選 contrast CT。
3. 治療 48–72h 無反應是影像關鍵指標。
4. 阻塞性 APN 是急症，要立即引流。
5. 糖尿病/免疫低下要積極影像。

**G. 容易混淆比較表**

| | 一般 APN | 需影像的 APN |
|--|----------|--------------|
| 反應 | 48–72h 退燒 | 無反應 |
| 處置 | 抗生素 | CT + 引流膿瘍/阻塞 |

**H. 臨床記憶法**
> 「**燒不退、糖尿病、單腎、疑阻塞**」→ 照 CT。

---

# Ch.4　Emphysematous Pyelonephritis（EPN）★台灣經典

**A. 一句話重點**
EPN 是腎實質/集尿系統產氣的壞死性感染，幾乎都發生在糖尿病患者，致死率高，以 **Huang-Tseng CT 分類**決定引流或腎切。

**B. 必背定義／流病**
- 病原：**E. coli 最常見**（其次 Klebsiella）。
- **糖尿病佔 80–90%**；**女性多於男性（F:M≈6:1）**。
- 三聯症：**Fever、Vomiting、Flank pain**。
- 致死率約 **19–43%**。
- **Huang-Tseng CT 分類（台灣 2000 年經典）**：
  - **Class 1**：氣體僅在集尿系統內（≒ emphysematous pyelitis）。
  - **Class 2**：氣體在腎實質，無腎外擴散。
  - **Class 3A**：氣體/膿瘍延伸至腎周（perinephric）腔。
  - **Class 3B**：氣體延伸至腎旁（pararenal）腔。
  - **Class 4**：雙側 EPN，或單一功能腎之 EPN。

**C. 臨床判斷流程**
```
DM + 發燒腰痛嘔吐 → CT 看到腎臟氣體 → EPN
 → Huang-Tseng 分類
   Class 1–2 → 抗生素 + 血糖控制 ± PCD（經皮引流）
   Class 3–4 或合併休克/血小板低/AKI/意識改變等risk → PCD 引流為主，
            引流失敗或多重危險因子 → Nephrectomy
```

**D. 診斷工具與適應症**
- **影像 gold standard：CT**（判斷氣體位置與範圍、分類）。
- KUB/US 可初步發現氣體但不足以分類。

**E. 治療策略**
- **Conservative/Medication**：積極補液、血糖控制、廣效靜脈抗生素。
- **Endoscopic/Drainage**：**經皮腎造廔引流（PCD）**為現代第一線，多數可避免腎切。
- **Open/Surgery**：**Nephrectomy** 保留給 PCD 失敗、廣泛壞死、或多重不良預後因子者（休克、血小板<60k、AKI、意識障礙）。
- 現代趨勢：**先 PCD 保腎，能不切就不切**（與舊年代「一律緊急腎切」不同）。

**F. 考試高頻重點**
1. 病原 **E. coli**、**DM 80–90%**、**女>男**。
2. **三聯：Fever/Vomiting/Flank pain**。
3. 致死率 **19–43%**。
4. **Huang-Tseng Class 1–4** 必背（Class 4＝雙側或孤立腎）。
5. 現代處置：**PCD 優先，腎切保留給失敗/高危**。

**G. 容易混淆比較表**

| | EPN | XGP |
|--|-----|-----|
| 病原 | E. coli | Proteus（其次 E. coli） |
| 特徵 | 產氣壞死、急症 | 慢性肉芽腫、假腫瘤 |
| 性別 | 女>男（6:1） | 女>男（4:1） |
| DM | 80–90% | 相關 |
| 結石 | 較少 | staghorn ~50% |
| 處置急迫性 | 急症（PCD/腎切） | 非急症，多需腎切 |

**H. 臨床記憶法**
> Huang-Tseng：**1 在腎盂、2 在腎實質、3A 腎周、3B 腎旁、4 雙側或孤腎**。
> 「**EPN＝糖尿病阿姨產氣腎，先放管（PCD），救不回才切腎**」。

---

# Ch.5　Chronic Pyelonephritis & XGP

**A. 一句話重點**
慢性腎盂腎炎是反覆感染/VUR 造成的腎瘢痕化，可進展至 ESRD；XGP 是慢性化膿肉芽腫，常合併 staghorn 結石，影像/病理像腫瘤，治療多需腎切。

**B. 必背定義**
- **Chronic pyelonephritis**：反覆/持續感染與 **VUR**（膀胱輸尿管逆流）導致 **renal scarring**，可進展至 **ESRD**。
- **Xanthogranulomatous pyelonephritis（XGP）**：
  - 病原 **Proteus 最常見**（其次 E. coli）。
  - **女>男（F:M≈4:1）**。
  - 約 **50% 合併 staghorn（鹿角）結石**，常伴阻塞。
  - 病理特徵：**lipid-laden foamy macrophages（充滿脂質的泡沫巨噬細胞）**。
  - 影像常呈「假腫瘤」樣，難與 RCC 區分。

**C. 臨床判斷流程**
```
反覆 UTI + staghorn stone + 腎功能下降 + 假腫瘤影像
 → 懷疑 XGP（病理才能確診：foamy macrophage）
 → 治療：抗生素穩定 + Nephrectomy（非緊急）
```

**D. 診斷工具與適應症**
- CT（假腫瘤、staghorn、腎周延伸）。
- 確診靠 **病理**（foamy macrophage）。

**E. 治療策略**
- Chronic PN：控制感染、矯治 VUR/阻塞、保護腎功能。
- XGP：抗生素控制後 **腎切除（nephrectomy）**，**非緊急手術**。

**F. 考試高頻重點**
1. XGP 病原 **Proteus**、女>男 4:1。
2. XGP **staghorn ~50%**。
3. 病理 **foamy/lipid-laden macrophage**。
4. XGP 影像像腫瘤（pseudotumor）。
5. XGP 治療＝腎切，但**非緊急**（與 EPN 急症不同）。

**G. 容易混淆比較表**

| | Chronic PN | XGP |
|--|-----------|-----|
| 機轉 | VUR/反覆感染→瘢痕 | 慢性化膿肉芽腫 |
| 結石 | 可有 | staghorn ~50% |
| 病理 | 瘢痕 | foamy macrophage |
| 處置 | 保腎、矯治VUR | 腎切（非急） |

**H. 臨床記憶法**
> 「**XGP＝變形桿菌（Proteus）+ 鹿角石 + 泡泡巨噬細胞 + 假腫瘤 → 切腎**」。

# Ch.6　Prostatitis（攝護腺炎）

**A. 一句話重點**
依 NIH 分為 I–IV 型，急性細菌性（I）與慢性細菌性（II）以 E. coli 為主，慢性骨盆疼痛症候群（III）最常見且最難治，以 4-glass/2-glass 定位、UPOINT 分型與 NIH-CPSI 評估。

**B. 必背定義（NIH 分類）**
- **Category I**：Acute bacterial prostatitis（急性細菌性）。
- **Category II**：Chronic bacterial prostatitis（慢性細菌性，反覆 UTI）。
- **Category III**：Chronic prostatitis / Chronic pelvic pain syndrome（CP/CPPS）— **最常見**。
  - IIIA：發炎性（EPS/精液/VB3 有白血球）。
  - IIIB：非發炎性。
- **Category IV**：Asymptomatic inflammatory prostatitis（無症狀，偶然發現）。
- 細菌性病原：**E. coli 佔 65–80%**。
- **UPOINT** 六/七大表型：**U**rinary、**P**sychosocial、**O**rgan-specific、**I**nfection、**N**eurologic/systemic、**T**enderness（+ **S**exual）。
- **NIH-CPSI** 症狀評分量表（疼痛、排尿、生活品質）。

**C. 臨床判斷流程**
```
攝護腺炎症狀 →
 急性高燒、攝護腺壓痛劇烈 → Category I（避免攝護腺按摩）
 反覆同菌 UTI → Category II
 慢性骨盆痛 >3 個月，培養陰性 → Category III（IIIA有白血球/IIIB無）
 → 4-glass（Meares-Stamey）或簡化 2-glass test 定位
 → UPOINT 分型 + NIH-CPSI 評估 → 個別化治療
```

**D. 診斷工具與適應症**
- **4-glass test（Meares-Stamey）**：VB1（初尿/尿道）、VB2（中段/膀胱）、EPS（攝護腺按摩液）、VB3（按摩後尿）。
- **2-glass test**：按摩前後尿（pre/post-massage），臨床較常用。
- 急性（Cat I）**禁止攝護腺按摩**（恐菌血症）。

**E. 治療策略**
- **Cat I（急性）**：靜脈/口服抗生素（fluoroquinolone），療程較長（2–4 週），重症住院。
- **Cat II（慢性細菌性）**：**Quinolone 4–6 週**（穿透攝護腺佳）。
- **Cat III（CPPS）**：多模式 — 依 UPOINT 給 α-blocker、抗生素試驗、止痛/抗發炎、肌肉放鬆/復健、心理支持。
- **Cat IV**：通常不需治療（除非影響生育或 PSA）。

**F. 考試高頻重點**
1. **NIH I–IV 分類**＋III 最常見。
2. 病原 **E. coli 65–80%**。
3. **Cat I 禁攝護腺按摩**。
4. 慢性細菌性用 **Quinolone（穿透好）**。
5. **UPOINT** 表型＋ **NIH-CPSI** 評分。

**G. 容易混淆比較表**

| 類別 | 細菌培養 | 白血球 | 典型 |
|------|:--------:|:------:|------|
| I 急性細菌 | + | + | 高燒、急症 |
| II 慢性細菌 | + | + | 反覆同菌UTI |
| IIIA 發炎CPPS | − | + | 慢性骨盆痛 |
| IIIB 非發炎CPPS | − | − | 慢性骨盆痛 |
| IV 無症狀 | ± | + | 偶然發現 |

**H. 臨床記憶法**
> 「**急性別按摩（怕菌血症），慢性用 quinolone（鑽得進攝護腺）**」。
> UPOINT 記「**你（U）怕（P）噢（O）愛（I）你（N）疼（T）**」。

# Ch.7　泌尿生殖道結核（GUTB）與抗結核藥

**A. 一句話重點**
GUTB 是肺外結核第二常見部位，腎臟最先受侵犯，典型表現為「無菌性膿尿」，以 6 個月雞尾酒療法治療，需熟記第一線藥物副作用。

**B. 必背定義／流病**
- 肺外結核佔所有結核約 **10%**；**GUTB 是肺外結核第二常見（約 30–40%）**。
- **腎臟最常受侵犯**（血行散布），再向下蔓延輸尿管/膀胱（攣縮膀胱、輸尿管狹窄）。
- 標誌：**sterile pyuria（無菌性膿尿）**、血尿、頻尿、晨尿抗酸菌/結核培養/PCR。
- **6 個月雞尾酒療法**：前 2 個月 **HRZE（INH + Rifampin + Pyrazinamide + Ethambutol）**，後 4 個月 **HR（INH + Rifampin）**。

**C. 第一線抗結核藥副作用（TABLE 60.2，必背）**
```
Isoniazid (INH)    → 周邊神經病變(給B6預防)、肝毒性
Rifampin           → 肝毒性、流感樣症候群、搔癢、體液變橘紅、藥物交互作用多
Rifabutin          → 肝毒性、流感樣、葡萄膜炎(uveitis)、嗜中性球低下
Rifapentine        → 同 rifampin（搔癢、肝毒性、流感樣）
Pyrazinamide (PZA) → 關節痛、肝毒性、高尿酸血症、紅疹、腸胃症狀
Ethambutol (EMB)   → 視神經炎、紅綠色盲(降低紅綠辨識)、視力下降
```

**D. 臨床判斷流程**
```
慢性膀胱炎症狀 + sterile pyuria + 血尿（常規培養陰性）
 → 晨尿 AFB×3 / TB culture / PCR、影像（腎鈣化、輸尿管串珠、攣縮膀胱）
 → 確診 → 抗結核 6 個月雞尾酒 ± 處理狹窄/攣縮膀胱（支架、重建、擴大膀胱）
```

**E. 治療策略**
- **藥物**：HRZE 2 個月 → HR 4 個月（標準 6 個月）。
- **手術**：處理併發症 — 輸尿管狹窄（支架/重建）、攣縮小膀胱（augmentation）、無功能腎（腎切）。

**F. 考試高頻重點**
1. GUTB 是肺外結核**第二常見**，**腎最先受侵**。
2. 標誌＝**sterile pyuria**。
3. **6 個月**雞尾酒（2HRZE/4HR）。
4. **Ethambutol → 視神經炎/紅綠色盲**；**INH → 周邊神經病變（補 B6）**。
5. **Rifabutin → uveitis**；Rifampin → 體液變橘紅、藥物交互作用。

**G. 容易混淆比較表**

| 藥 | 招牌副作用 |
|----|-----------|
| INH | 周邊神經病變、肝毒 |
| Rifampin | 橘紅體液、肝毒、藥交互 |
| Rifabutin | 葡萄膜炎、嗜中性球低 |
| PZA | 高尿酸、關節痛、肝毒 |
| EMB | 視神經炎、紅綠色盲 |

**H. 臨床記憶法**
> 「**E**thambutol＝**E**ye（眼睛，視神經炎/紅綠盲）」；「**I**NH＝**I** feel numb（周邊神經麻，補 B6）」；「Rif-**a**butin＝**u**veitis（葡萄膜炎）」。
