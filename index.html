# Ch.8　STD 總論與分類

**A. 一句話重點**
性病可依臨床表現分為分泌型、潰瘍型、贅生物型、全身型四大類；在台灣性病屬第三類法定傳染病，猴痘則為第二類。

**B. 必背定義（四型分類）**
- **分泌型（discharge）**：淋病、披衣菌、陰道滴蟲、其他尿道炎。
- **潰瘍型（ulcer）**：初期梅毒、herpes、軟性下疳（chancroid）。
- **贅生物型（growth）**：菜花（condyloma acuminata）、傳染性軟疣（molluscum）。
- **全身型（systemic）**：愛滋病、二期與三期梅毒。
- **法定傳染病**：性病屬**第三類**；**猴痘（mpox）屬第二類**。
- 台灣本土通報（2025，講義數據）：梅毒 9935、淋病 6417、HIV/AIDS 1600。

**C. 臨床判斷流程**
```
主訴 →
 尿道/陰道分泌 → 分泌型（GC/Chlamydia/Trichomonas）
 生殖器潰瘍 → 潰瘍型（先分「痛/不痛」）
 生殖器贅生物 → 贅生物型（菜花/軟疣）
 全身症狀 → 全身型（HIV、二/三期梅毒）
```

**D–E.** 各型診治見後續章節。

**F. 考試高頻重點**
1. 四型分類與代表病原。
2. 性病＝**第三類**法定傳染病；**猴痘＝第二類**。
3. 二期/三期梅毒屬「全身型」。
4. 潰瘍型先分痛/不痛（見 Ch.11）。
5. 分泌型主要 GC + NGU。

**G. 容易混淆比較表**

| 型別 | 代表病原 |
|------|---------|
| 分泌型 | 淋病、披衣菌、滴蟲 |
| 潰瘍型 | 初期梅毒、herpes、chancroid |
| 贅生物型 | 菜花(HPV)、軟疣(Pox) |
| 全身型 | HIV、二/三期梅毒 |

**H. 臨床記憶法**
> 「**分泌、潰瘍、贅生、全身**」四型；猴痘特別升級為**第二類**。

# Ch.9　尿道炎：Gonococcal vs Non-gonococcal

**A. 一句話重點**
GC 尿道炎發作快、膿性自發分泌、疼痛明顯；NGU 症狀多元、較不痛、分泌少，半數為披衣菌；治療採「同時涵蓋淋病＋披衣菌」的雙重療法。

**B. 必背定義**
- **Gonococcal urethritis（GC）**：Neisseria gonorrhoeae（GN 雙球菌）。潛伏期 **3–14 天**，好侵犯**柱狀上皮**（尿道、cervix、rectum）。發作快、疼痛、混濁尿、**自發膿性分泌（purulent discharge）**。
- **Non-gonococcal urethritis（NGU）**：症狀多元、較不痛、多無分泌；**約 50% 為 Chlamydia**，其他：黴漿菌（Mycoplasma）、陰道滴蟲。
- **Chlamydia**：STD 最常見致病菌；菌株 **E>D>Da**；incidence 16–18%；潛伏期 **7–21 天**（比 GC 慢）；**年輕男性附睪炎主因**；可致 **Reiter's syndrome（尿道炎+關節炎+結膜炎）**；女性感染 **75% 無症狀**。

**C. 臨床判斷流程**
```
尿道炎 →
 快速、痛、膿性分泌 → 懷疑 GC
 較不痛、分泌少/多元 → 懷疑 NGU（半數披衣菌）
 → NAAT（尿/swab）+ 同時檢測 chlamydia/syphilis/HIV
 → 雙重治療（涵蓋 GC + Chlamydia）
```

**D. 診斷工具與適應症（Neisseria）**
- **NAAT**（高敏感）：男性尿道 swab 或尿、女性 cervical swab。
- **Culture（只能用 swab）**：約需 3–14 天，可測抗藥性。
- 傳染途徑：sexual contact；hematogenous 少見（可致 arthritis/dermatitis/meningitis/endocarditis = DGI）。
- 臨床：男性 urethritis/epididymo-orchitis/prostatitis/proctitis；女性 PID/不孕/子宮外孕/tubal scarring/慢性骨盆痛。

**E. 治療策略**
- **Dual therapy（同時打淋病＋披衣菌）**：
  - **Ceftriaxone 250 mg IM（單劑）＋ Azithromycin 1 g PO（單劑）** 或 **Doxycycline 100 mg BID × 7 天**。
  - 講義替代方案：Ceftriaxone 1 g IM/IV + Azithromycin 1–1.5 g；或單劑口服 Cefixime 800 mg；或 Cefixime 400 mg + Azithromycin 1 g。
- **NGU/Chlamydia**：**Azithromycin 1 g 單劑（孕婦可用）** 或 **Doxycycline 100 mg BID × 7 天** 或 Erythromycin 500 mg Q6H × 7 天。
- 同時檢測並治療 chlamydia、syphilis、HIV；伴侶一起治療。

**F. 考試高頻重點**
1. GC 潛伏 **3–14 天**、好侵**柱狀上皮**、**膿性分泌**。
2. NGU **50% 披衣菌**、較不痛。
3. Chlamydia＝STD 最常見、**年輕男性附睪炎主因**、女性 **75% 無症狀**、Reiter's syndrome。
4. **雙重治療：Ceftriaxone + Azithromycin/Doxycycline**。
5. 診斷首選 **NAAT**；culture 只能用 swab。

**G. 容易混淆比較表**

| | Gonococcal | Non-gonococcal |
|--|-----------|----------------|
| 病原 | N. gonorrhoeae | Chlamydia(50%)、黴漿菌、滴蟲 |
| 潛伏期 | 3–14 天 | 7–21 天 |
| 分泌 | 膿性、自發 | 少/多元 |
| 疼痛 | 明顯 | 較不痛 |
| 治療 | Ceftriaxone | Azithromycin/Doxycycline |

**H. 臨床記憶法**
> 「**淋病快又膿，披衣慢又靜（女性 75% 無症狀）**」；治療一律「**打一針（Ceftriaxone）+ 吃一藥（Azithro/Doxy）**」兩個都蓋。

# Ch.10　Trichomonas（陰道滴蟲）

**A. 一句話重點**
NGU 用 Doxycycline 效果不佳時要想到陰道滴蟲，只有 Metronidazole 才有效；女性典型「草莓樣」子宮頸/外陰。

**B. 必背定義**
- 病原：**Trichomonas vaginalis**（鞭毛原蟲）。
- 男性：症狀同其他 NGU；女性：**strawberry rash of vulva / strawberry cervix（草莓子宮頸）**。
- 診斷：**NAAT（最敏感）**、culture。

**C. 臨床判斷流程**
```
NGU 用 Doxycycline 無效 → 想滴蟲 → NAAT/culture
 → Metronidazole（伴侶同時治療）
```

**D. 診斷工具**：NAAT（more sensitive）、culture、濕鏡可見運動鞭毛蟲體。

**E. 治療策略（EAU 2023）**
- **Metronidazole 2 g PO 單劑** 或 **Tinidazole 2 g PO 單劑**。
- 替代：Metronidazole 500 mg PO BID × 7 天。

**F. 考試高頻重點**
1. **Doxycycline 無效 → 想滴蟲 → Metronidazole**。
2. **草莓子宮頸**為標誌。
3. 診斷首選 **NAAT**。
4. 單劑 2 g Metronidazole/Tinidazole。
5. 伴侶同治、治療期間禁酒（disulfiram-like）。

**G. 容易混淆**：滴蟲是唯一需用 nitroimidazole（Metronidazole）的尿道炎病原，β-lactam/doxycycline 無效。

**H. 臨床記憶法**
> 「**Doxy 打不死的尿道炎 → 滴蟲 → Metronidazole；草莓宮頸是招牌**」。

# Ch.11　生殖器潰瘍鑑別（★最常考表）

**A. 一句話重點**
生殖器潰瘍以 herpes 最常見（Herpes > syphilis > chancroid > LGV，前三者比例 1000:1:0.01），鑑別關鍵是「病灶痛不痛、淋巴結痛不痛」。

**B. 必背定義（痛/不痛鑑別，TABLE 58.2）**

| 疾病 | 病原 | 病灶 | 淋巴結(LAP) | 全身症狀 |
|------|------|:----:|:-----------:|:--------:|
| 一級梅毒 | Treponema pallidum | **不痛**(單一、硬、clean base) | **不痛**(橡皮、雙側) | 無 |
| 生殖器疱疹 | HSV | **痛**(多顆、表淺水泡) | **痛**(雙側) | 初次感染時有 |
| 軟性下疳 chancroid | Haemophilus ducreyi | **痛**(化膿、單或多) | **痛**(局部、化膿) | 無 |
| 性病淋巴肉芽腫 LGV | Chlamydia trachomatis(L1-3) | **不痛**(小水泡→潰瘍) | **痛**(化膿、matted、有 fistula/groove sign) | 潰瘍癒合後出現 |
| 腹股溝肉芽腫 Donovanosis | Klebsiella granulomatis | **不痛** | **不痛**(LAP少見) | — |

**C. 臨床判斷流程**
```
生殖器潰瘍 → 病灶痛嗎?
 ├─ 不痛 → 一級梅毒(LAP也不痛) / LGV(LAP會痛) / Donovanosis
 └─ 痛  → Herpes(多顆水泡) / Chancroid(化膿、GNB)
```

**D. 診斷**：依病原（梅毒血清學、HSV PCR、chancroid culture、LGV/Donovan body）。

**E. 治療原則（共通）**
- **伴侶（可能多重）一起治療**；治療完成前避免性行為；固定伴侶且戴套；**經同意檢測 HIV**；以上性病治療後**極易復發**。

**F. 考試高頻重點**
1. 發生率 **Herpes > syphilis > chancroid > LGV（1000:1:0.01）**。
2. **一級梅毒：病灶不痛、LAP 不痛**。
3. **Herpes、Chancroid：病灶痛、LAP 痛**。
4. **LGV：病灶不痛但 LAP 痛（groove sign）**。
5. **Donovanosis：不痛、LAP 少見、Donovan body**。

**G. 容易混淆比較表**：見上方 B 表（痛/不痛是命門）。

**H. 臨床記憶法**
> 「**梅毒不痛、皰疹下疳會痛；LGV 病灶不痛卻腫到溝（groove sign）**」。
> 不痛潰瘍三兄弟：**梅毒、LGV、Donovanosis**（其中只有 LGV 的 LAP 會痛）。

# Ch.12　Syphilis（梅毒）★最常考

**A. 一句話重點**
梅毒分一/二/三期與潛伏期，血清學以 non-treponemal（RPR/VDRL）做篩檢與療效追蹤、treponemal（TPHA/FTA-ABS）做確診且終生陽性；治療首選 penicillin，注意 Jarisch-Herxheimer 反應。

**B. 必背定義**
- 病原：**Treponema pallidum（梅毒螺旋體）**，每 **30–33 小時**複製一次；潛伏期 **10–90 天（平均 3 週）**。
- **一期（Primary）**：感染後 1–3 週出現 **Chancre（硬性下疳）**，**通常單一、不痛、clean/indurated**；不治療 3–8 週自行消失；LAP 雙側、不痛。
- **二期（Secondary）**：感染後 3–5 個月，**傳染力最強**，bacteremia。**Maculopapular rash（侵犯手掌、腳掌、頭皮）**、**Condylomata lata（扁平濕疣）**；可有 fever/LAP/alopecia/體重下降；**聽力受損（CN8）**；10% 有 vasculitis（hepatitis/nephritis/iritis）。
- **潛伏期（Latent）**：無臨床症狀但體內仍有螺旋體。
  - **Early latent**：感染 **<1 年**，**仍具傳染性**。
  - **Late latent**：感染 **>1 年**，傳染力較弱。
- **三期/晚期（Tertiary）**：感染後 **3–7 年**。
  - **Gummatous syphilis（梅毒腫，gummas）**：侵犯皮膚/上皮/骨骼肌肉。
  - **Neurosyphilis**：脊髓 **tabes dorsalis（運動失調、喪失振動覺/本體覺）**；腦 **general paresis（麻痺性失智、口齒不清）**。
  - **Cardiovascular syphilis（15–20 年）**：aortic aneurysm、aortic regurgitation。

**C. 血清學判讀（必背）**
```
Non-treponemal（RPR、VDRL）
 - 用途：Screening + monitoring（療效追蹤）
 - 高偽陽性 → 老年人、HIV、藥癮、孕婦
 - Titer 意義：有症狀 ≥1:4；early latent ≥1:8；late latent ≥1:2

Treponemal（TPHA、EIA、FTA-ABS）
 - 用途：Confirmation（確診）
 - 一旦感染，終生陽性
 - TPHA >1:320 陽性、<1:80 陰性
```

**D. 臨床判斷流程**
```
疑梅毒 → non-treponemal(RPR/VDRL) 篩檢
 → 陽性 → treponemal(TPHA/FTA-ABS) 確診
 → 分期(臨床+病史時序) → 對應治療
 → 第 6、12 個月追蹤 titer
```

**E. 治療策略（TABLE 58.6）**
- **無神經侵犯之一期/二期/早期潛伏**：**Benzathine penicillin G 2.4 M U IM 單劑**；過敏 → Doxycycline 100 mg BID × 2 週 或 Tetracycline 500 mg QID × 2 週。
- **無神經侵犯之三期/晚期潛伏（或不明病程）**：**Benzathine penicillin G 2.4 M U IM 每週 ×3**；過敏改 Doxycycline/Tetracycline **延長至 4 週**。
- **神經性梅毒**：**Aqueous crystalline penicillin G 1800–2400 萬 U/天 IV × 10–14 天**（或 procaine penicillin + probenecid）。
- **Jarisch-Herxheimer reaction**：首劑後 **1–3 小時**發作，**治療早期梅毒較常見**；發燒、倦怠、N/V、寒顫、皮疹、低血壓、休克（自限性）。

**追蹤判讀**
- **第 6、12 個月** clinical + serologic evaluation。
- **成功治療**：RPR/VDRL 轉陰 或 titer **下降 ≥4 倍**（例：1:16 → 1:4）。
- **再感染/復發**：症狀 + titer **上升 ≥4 倍**且持續 2 週 → 重新治療。
- **治療無效**：半年後 titer 降不到 4 倍 → 重驗 HIV、考慮 neurosyphilis（抽 CSF）、重新給每週一劑 penicillin G ×3 週（須先排除 neurosyphilis）。

**F. 考試高頻重點**
1. **Non-treponemal（RPR/VDRL）= 篩檢/追蹤**；**Treponemal（TPHA/FTA-ABS）= 確診、終生陽性**。
2. **二期傳染力最強**，rash 侵**手掌腳掌**。
3. **Condylomata lata = 梅毒**；Condyloma acuminata = HPV。
4. **Titer 4 倍變化**＝療效/復發判讀（1:16→1:4 為成功）。
5. **首選 penicillin**；**Jarisch-Herxheimer** 首劑後 1–3 小時。

**G. 容易混淆比較表**

| | Non-treponemal | Treponemal |
|--|----------------|------------|
| 代表 | RPR、VDRL | TPHA、FTA-ABS、EIA |
| 用途 | 篩檢、追蹤療效 | 確診 |
| 治療後 | 會下降/轉陰 | 終生陽性 |
| 偽陽性 | 老人/HIV/藥癮/孕婦 | 少 |

**H. 臨床記憶法**
> 「**Non-treponemal 會變（追療效），Treponemal 永遠在（確診）**」。
> 「**扁平濕疣（lata）梅毒、尖型濕疣（acuminata）HPV**」。
> 「**手掌腳掌出疹＝二期梅毒**」。

# Ch.13　Genital Herpes / Chancroid / LGV

## 13-1　Genital Herpes（生殖器疱疹）

**A. 一句話重點**　HSV（雙股 DNA）造成多顆、表淺、**會痛**的水泡，潛伏於 sacral root ganglion，HSV2 比 HSV1 易復發。

**B. 必背**：潛伏期約 4 天；病灶多顆、表淺、痛、**不沿神經分布**；LAP 雙側壓痛；**第一次發作 13–36% 合併輕度腦膜炎**；潛伏在 **sacral root ganglion**；HSV2 易復發。

**C–E. 診治**：臨床 + HSV PCR；治療 **Acyclovir 400 mg TID / Valacyclovir 1 g BID / Famciclovir 250 mg BID，各 7–10 天**；**topical 抗病毒效果差**。

**F. 高頻**：①痛性多顆水泡 ②潛伏 sacral ganglion ③HSV2 易復發 ④口服勝外用 ⑤初發可有腦膜炎。

**H. 記憶法**：「**疱疹＝痛、多、復發；藏在薦神經節，吃藥勝擦藥**」。

## 13-2　Chancroid（軟性下疳）

**A. 一句話重點**　Haemophilus ducreyi（GNB）造成**疼痛性**化膿潰瘍 + 痛性化膿淋巴結，多見發展中國家性工作者。

**B. 必背**：潛伏 3–7 天；**痛性 ulcer（單或多、化膿）**；LAP 局部、非對稱、壓痛、化膿；診斷 **culture**；不治療 1–3 週自然緩解但會產生痛性淋巴腫。

**E. 治療**：**Ceftriaxone 250 mg IM 單劑** / **Azithromycin 1 g PO 單劑** / Ciprofloxacin 500 mg BID ×3 天 / Erythromycin 500 mg TID ×7 天。

**F. 高頻**：①痛性化膿潰瘍 ②H. ducreyi（GNB） ③culture 診斷 ④Ceftriaxone/Azithro ⑤痛性化膿 LAP。

**H. 記憶法**：「**軟（chancroid）會痛、硬（chancre 梅毒）不痛**」對照記。

## 13-3　Lymphogranuloma Venereum（LGV，性病淋巴肉芽腫）

**A. 一句話重點**　Chlamydia trachomatis L1/L2/L3 造成「病灶不痛、卻有痛性化膿淋巴結（groove sign）」，MSM 可致 proctitis 與直腸狹窄/廔管。

**B. 必背**：潛伏 3–30 天；病灶**不痛**小水泡→潰瘍，2–4 週後形成**會痛的 LAP**；MSM 可 proctitis → colorectal fistula/stricture。
- **3 stages**：Stage I 潰瘍；Stage II LAP（男>女）+ 全身症狀；Stage III（多未治療）colorectal fistula/stricture、生殖器象皮病（elephantiasis）。

**E. 治療**：**Doxycycline 100 mg BID × 21 天** / Azithromycin 1 g QW × 3 週 / Erythromycin 500 mg QID × 21 天。

**F. 高頻**：①L1/L2/L3 ②病灶不痛、LAP 痛（groove sign） ③MSM proctitis/狹窄 ④Doxycycline 21 天 ⑤Stage III 象皮病。

**H. 記憶法**：「**LGV：下面不痛、腫塊痛到出溝（groove）；Doxy 吃三週**」。

# Ch.14　Donovanosis / Molluscum / Condyloma（HPV）

## 14-1　Donovanosis（granuloma inguinale，腹股溝肉芽腫）

**B. 必背**：病原 **Klebsiella granulomatis（GNB）**；已很少見；潛伏約 50 天；診斷 **Donovan body（巨噬細胞胞質內 dark-staining 內含菌）**；**painless** 緩慢進展潰瘍；**腹股溝侵犯少見（10%）**。
**E. 治療**：**至少 3 週至病灶完全消失** — Azithromycin 1 g QW 或 500 mg QD、Doxycycline 100 mg BID、Erythromycin 500 mg QID、Baktar 160/800 BID。

## 14-2　Molluscum Contagiosum（傳染性軟疣）

**B. 必背**：**Pox virus（雙股 DNA）**；**會自然痊癒**（積極可 laser/冷凍/藥膏）；3–5 mm 紅疹，**central depression（中央凹陷）**；**HIV 病人特別嚴重**；skin biopsy 見 **molluscum body**。

## 14-3　Condyloma Acuminata（菜花，HPV）

**B. 必背**：**HPV（雙股 DNA）**；**90% 由 HPV 6, 11 造成**（不易癌變）；致 **anal/cervical cancer 為 HPV 16, 18**（+31/33/34/35/45）；HPV 6/11 潛伏期數週至數年（平均 3 個月）。
**E. 治療與預防**：
- 外用/局部：Podophyllotoxin（Podofilox/化疣敵）、**Imiquimod（樂得美 Aldara）**、Sinecatechins、5-FU；或冷凍、雷射/電燒、光動力、免疫治療、干擾素。
- **HPV 疫苗價數（必背）**：
  - **9 價**：HPV **6, 11, 16, 18, 31, 33, 45, 52, 58**。
  - **4 價**：HPV **6, 11, 16, 18**（0-2-6 月、FDA 男女 9–26 歲）。
  - **2 價**：HPV **16, 18**（0-1-6 月、女性 ≥9 歲）。

**G. 三種「濕疣/軟疣」鑑別表（★高頻）**

| 中文 | 英文 | 病原 |
|------|------|------|
| 扁平濕疣 | Condylomata lata | **Syphilis（梅毒）** |
| 尖型濕疣（菜花） | Condyloma acuminata | **HPV** |
| 傳染性軟疣 | Molluscum contagiosum | **Pox virus** |

**F. 合併高頻重點**
1. **三種濕疣對應病原**（lata=梅毒、acuminata=HPV、molluscum=Pox）。
2. **菜花 90% 為 HPV 6/11**；致癌為 **16/18**。
3. **疫苗 9/4/2 價型別**。
4. Molluscum **中央凹陷**、自癒、HIV 嚴重。
5. Donovanosis：**Donovan body**、painless、Klebsiella granulomatis。

**H. 臨床記憶法**
> 「**6、11 長菜花；16、18 變癌症**」；「軟疣中間有肚臍眼（central umbilication）」。

# Ch.15　醫源性輸尿管損傷與染料測試（★最常考禁忌）

**A. 一句話重點**
輸尿管撥離可致醫源性損傷/腎水腫，術中以 Indigo carmine 或 Methylene blue 靜脈注射確認通暢；兩者皆禁用於孕婦，Methylene blue 另禁 G6PD 缺乏與合併 SSRI。

**B. 必背定義**
- 輸尿管撥離導致腎水腫，**最常見於 Aortoiliac 或 aortofemoral bypass 手術（約 12–20%）**，多會自行癒合。
- **Indigo carmine 與 Methylene blue**：皆**靜脈注射（IV）**，術中以膀胱鏡看染料流下→表示輸尿管通暢。
- **禁忌（必背）**：
  - **兩者皆不可用於孕婦**（會致孕婦死亡或死胎）。
  - **Methylene blue 是強效 MAOI → 不可合併 SSRI**（serotonin syndrome）。
  - **Methylene blue 不可用於 G6PD deficiency**（會溶血）。

**C. 臨床判斷流程**
```
骨盆/血管手術疑輸尿管損傷 → IV 染料(Indigo carmine/Methylene blue)
 → 膀胱鏡看雙側輸尿管口噴出染料 → 確認通暢/找漏點
 → 選藥前確認：孕婦? G6PD? 在用 SSRI? → 有則避開 Methylene blue
```

**D. 診斷工具**：術中染料 + 膀胱鏡；術後懷疑損傷可影像（CTU/IVU/RP）。

**E. 治療策略**：依損傷位置與長度行支架置放或重建（見 Ch.16）。

**F. 考試高頻重點**
1. Aortoiliac/aortofemoral bypass 輸尿管併發 **12–20%**。
2. 染料皆 **IV**，膀胱鏡確認。
3. **孕婦兩者皆禁**。
4. **Methylene blue = MAOI，禁合併 SSRI**。
5. **Methylene blue 禁 G6PD deficiency（溶血）**。

**G. 容易混淆比較表**

| | Indigo carmine | Methylene blue |
|--|----------------|----------------|
| 給法 | IV | IV |
| 孕婦 | 禁 | 禁 |
| G6PD | （相對安全） | **禁（溶血）** |
| SSRI/MAOI | — | **禁（強 MAOI）** |

**H. 臨床記憶法**
> 「**Methylene blue 三禁：孕婦、G6PD、SSRI（藍色最毒）**」；Indigo carmine 只記孕婦禁。

# Ch.16　輸尿管狹窄與重建

**A. 一句話重點**
良性輸尿管狹窄若患側腎功能 ≥20% 且狹窄 ≤2 cm 可內視鏡處理（依位置決定切開方向），否則依 defect 長度選擇對應重建術式。

**B. 必背定義／適應症**
- **內視鏡手術適應症**：**患側腎功能至少 20%**、**狹窄最多 2 cm**。
- 內視鏡切開方向（依血供避開血管）：**上端切外後（lateral/posterolateral）；中下端切內前（anterior/anteromedial）**。
- **重建術式對應 defect 長度（必背表）**：

| 術式 | 可修補 defect 長度 |
|------|:------------------:|
| Ureteroureterostomy | 2–3 cm |
| Ureteroneocystostomy（再植） | 4–5 cm |
| **Psoas hitch** | **6–10 cm** |
| **Boari flap** | **12–15 cm** |
| Renal descensus（腎下移） | 5–8 cm |

- **Psoas hitch 最常造成 genitofemoral nerve 損傷**。
- 依位置：**Upper** → ureteroureterostomy / transureteroureterostomy；**Middle** → 同上；**Lower** → reimplantation / Psoas hitch。

**C. 臨床判斷流程（Fig 89.25）**
```
評估狹窄長度與腎功能
 ├─ <2 cm 且 >20% function → 內視鏡（依位置切方向）
 └─ >2 cm → moiety >20% → open/lap 重建
            moiety <20% → laparoscopic nephrectomy
            （小兒/腎功能不全 select 仍可修補）
```

**D. 診斷工具**：影像（IVU/CTU/RP/antegrade）評估長度與位置；核醫腎功能（split function）。

**E. 治療策略**
- 短、功能佳 → 內視鏡切開/氣球擴張。
- 依 defect 長度由短到長：ureteroureterostomy → reimplant → Psoas hitch → Boari flap；極長/上段不夠 → renal descensus 或腸代輸尿管。

**F. 考試高頻重點**
1. 內視鏡：**腎功能 ≥20%、狹窄 ≤2 cm**。
2. 切開方向：**上外後、下內前**。
3. **Boari flap 12–15 cm（最長）**；**Psoas hitch 6–10 cm**。
4. **Psoas hitch → genitofemoral nerve 損傷**。
5. >2 cm 且 moiety <20% → 腎切。

**G. 容易混淆**：長度由短到長排序＝ureteroureterostomy(2-3) < reimplant(4-5) < renal descensus(5-8) < Psoas hitch(6-10) < Boari flap(12-15)。

**H. 臨床記憶法**
> 「**Boari 最長（12-15）、Psoas hitch 傷 genitofemoral**」；「**上外後、下內前**」。

# Ch.17　Vesicovaginal / Ureterovaginal Fistula（★染料測試必考）

**A. 一句話重點**
持續陰道漏尿想到泌尿生殖廔管；VVF 最常見於婦科手術後（良性子宮全切），以 double dye / three swab test 區分 VVF、ureterovaginal、urethrovaginal，修補時機依病因而定。

**B. 必背定義**
- **Vesicovaginal fistula（VVF）**：**12% 合併 ureteral injury** → 必做 upper tract image。
  - 病因（Box 129.3）：postsurgical（**abdominal/vaginal hysterectomy 最常**）、抗失禁手術、前陰道壁脫垂修補、放射治療、晚期骨盆惡性腫瘤、產科（obstructed labor、forceps、子宮破裂、剖腹產傷膀胱）。
- **Ureterovaginal fistula**：
  - **最常見原因＝婦產科手術導致 distal ureter injury**；**良性子宮全切比 radical 更常見**（Box 129.4）。
  - Risk：endometriosis、肥胖、PID、放療、骨盆惡性腫瘤。
  - 病人**持續漏尿但 voiding pattern 正常**。

**C. Double dye test（必背判讀）**
```
口服 phenazopyridine(Uroprin) 200 mg TID → 腎臟尿液變橘黃
膀胱灌注 indigo carmine/methylene blue → 膀胱尿液變藍
判讀：
 Blue          → vesicovaginal fistula
 Orange        → ureterovaginal fistula
 Blue + Orange → 兩者並存
注意 false positive：urethral leakage 使灌注液流到陰道下方
 （淡藍出現在下層紗布、中間紗布反而乾）
```

**Three swab test（膀胱灌注 methylene blue）**
```
1. 最上/中間紗布染色 → vesicovaginal fistula
2. 最上紗布「濕但不染色」（被橘色腎尿濕潤）→ ureterovaginal fistula
3. 最下紗布染色、上兩條乾 → urethrovaginal fistula
```

**D. 診斷工具與適應症**
- VVF 評估流程（Fig 89-9）：Hx/PE ± dye test → 定位到 fistula 才做 cystoscopy ± biopsy → 評估 ureteral injury（CT/RPG/IVU）。
- 影像：**VCUG（評估小廔管）、CTU、IVU、cystography、US、RP、MRI**；進一步 vaginoscopy、cystoscopy。

**E. 治療策略與修補時機**
- **Ureterovaginal fistula**（Key points / Fig 129.25）：先排除 VVF → 確診 → **嘗試置放輸尿管支架（stent）**，成功則 **4–6 週後移除**重新評估；失敗或完全阻塞 → **ureteroneocystostomy（± psoas hitch）**。
- **VVF 修補時機（Fig 129.11）**：
  - **發炎/感染病人 → delay repair**。
  - **Obstructed labor → delay 3–6 個月**。
  - **放射性（irradiation）→ delay 6–12 個月**，需 interposition material。
  - **Uncomplicated GYN surgery → ASAP**（early 2–3 週、late 2–3 個月）。
  - **Abdominal repair 通常 delay 較久；Vaginal repair 通常 2–3 週後即可**。
  - Recurrent fistula：用 interposition material（如 Martius flap）。

**F. 考試高頻重點**
1. **VVF 12% 合併輸尿管損傷** → 一定做 upper tract image。
2. **Double dye：藍=VVF、橘=ureterovaginal、藍橘=兩者**。
3. **Three swab：上染=VVF、上濕不染=ureterovaginal、下染=urethrovaginal**。
4. Ureterovaginal 先**試放支架 4–6 週**，失敗才 reimplant。
5. 修補時機：感染/放療要 delay；單純婦科術後可 early（vaginal 2–3 週）。

**G. 容易混淆比較表**

| 測試結果 | 廔管類型 |
|----------|---------|
| 藍色 | Vesicovaginal |
| 橘色 | Ureterovaginal |
| 藍+橘 | 兩者並存 |
| 三紗布最上濕但不染 | Ureterovaginal |
| 三紗布最下染、上兩乾 | Urethrovaginal |

**H. 臨床記憶法**
> 「**藍從膀胱（灌注）、橘從腎（口服 pyridium）**；藍=VVF、橘=輸尿管陰道廔」。
> 「**感染、放療先等等（delay）；乾淨婦科術後早早修（vaginal 2-3 週）**」。

# Ch.18　女性吊帶（Sling）與 Mesh 併發症

**A. 一句話重點**
吊帶手術約 10% 併發症（疼痛/排尿障礙/mesh erosion 等），不同吊帶路徑傷及不同神經；mesh 併發症先保守處理，反覆暴露/嚴重疼痛/盆底功能異常才考慮（部分）切除。

**B. 必背定義**
- **併發症約 10%**：感覺異常（pain/dyspareunia＝神經傷害）、功能影響（排尿/解便/obstruction）、手術併發（mesh erosion、出血、感染、廔管、器官傷害）。
- **吊帶路徑對應神經**：
  - **Retropubic sling arms**：尖銳局部痛 → **ilioinguinal nerve（L1）** 與 **genitofemoral nerve 生殖支**。
  - **Obturator arms**：**posterior femorocutaneous nerve**；posterior cutaneous（L2–S3）、pudendal、perineal、inferior anal、obturator nerves（L5–S1）。

**C. Mesh 併發症處理（必背）**
```
尿不出來：MUS 約 8% 需處理；urethrolysis 後 80% 改善
陰道暴露感染(症狀不明顯)：先抗生素(Clindamycin + metronidazole)
組織萎縮：vaginal estrogen
膀胱內暴露：內視鏡雷射燒灼或剪除
何時考慮 mesh 切除：
 - 盆底器官功能異常(pelvic organ dysfunction)
 - 反覆 mesh 暴露
 - 嚴重疼痛、復健無效
 → 手術以「部分移除」為主
```

**D. 診斷工具**：理學/陰道檢查、膀胱鏡（評估膀胱內暴露）、尿動力（排尿障礙）。

**E. 治療策略**
- 階梯式：陰道局部 estrogen / 抗生素 → 內視鏡處理膀胱內 mesh → urethrolysis（尿滯留）→ 嚴重者**部分切除 mesh**。

**F. 考試高頻重點**
1. 吊帶併發症約 **10%**。
2. **Retropubic → ilioinguinal(L1) + genitofemoral**；**Obturator → femorocutaneous/posterior cutaneous(L2-S3)**。
3. **MUS 尿滯留 8%，urethrolysis 80% 改善**。
4. Mesh 暴露先**抗生素/局部 estrogen**，切除以**部分移除**為主。
5. 膀胱內暴露 → 內視鏡雷射/剪除。

**G. 容易混淆比較表**

| 路徑 | 受傷神經 |
|------|---------|
| Retropubic | ilioinguinal(L1)、genitofemoral 生殖支 |
| Obturator | posterior femorocutaneous、pudendal、obturator(L5-S1) |

**H. 臨床記憶法**
> 「**Retropubic 走前面傷 ilioinguinal/genitofemoral；Obturator 走外側傷 femorocutaneous**」；「**Mesh 出問題：先藥後刀，切也只切一部分**」。

## 📝 Section 3：總整合複習

### 一頁式總複習表

| 主題 | 一句話命門 |
|------|-----------|
| UTI 解離 | 有菌無白=移生；有白無菌=找TB/結石/腫瘤 |
| Complicated UTI | 男人/孕婦/管子/糖/阻塞/免疫差 |
| APN 影像 | 48-72h 無反應/DM/單腎 → CT；16% 異常 |
| **EPN** | E.coli、DM 80-90%、女>男；Huang-Tseng 1-4；PCD 優先，腎切保留高危 |
| XGP | Proteus、staghorn 50%、foamy macrophage、假腫瘤 → 腎切(非急) |
| Prostatitis | NIH I-IV(III最常)、E.coli 65-80%、Cat I 禁按摩、UPOINT/CPSI |
| GUTB | 腎最先、sterile pyuria、2HRZE/4HR；EMB→視神經、INH→周邊神經 |
| 尿道炎 | GC 快膿痛/NGU 50%披衣；雙重治療 Ceftriaxone+Azithro/Doxy |
| 滴蟲 | Doxy 無效→Metronidazole；草莓宮頸 |
| 潰瘍鑑別 | 梅毒不痛/herpes・chancroid 痛/LGV 病灶不痛但LAP痛 |
| **Syphilis** | Non-trep(RPR/VDRL)篩追、Trep(TPHA/FTA)確診終生陽；titer 4倍；penicillin；J-H reaction |
| Herpes/Chancroid/LGV | 痛性水泡藏薦節/H.ducreyi痛膿/L1-3 groove sign |
| 濕疣三兄弟 | lata=梅毒、acuminata=HPV、molluscum=Pox |
| HPV 疫苗 | 9價:6/11/16/18/31/33/45/52/58；致癌16/18 |
| **染料禁忌** | Methylene blue 三禁：孕婦、G6PD、SSRI |
| 輸尿管重建 | Boari 12-15(最長)、Psoas hitch 6-10傷genitofemoral；上外後下內前 |
| **VVF/染料測試** | 藍=VVF、橘=ureterovaginal；VVF 12%合併輸尿管傷 |
| 廔管時機 | 感染/放療delay；單純婦科術後early(vaginal 2-3週) |
| Sling/Mesh | Retropubic傷ilioinguinal(L1)/Obturator傷femorocutaneous；mesh部分切除 |

### 🎯 單選題 10 題（附答案與解析）

**Q1.** 65 歲糖尿病女性，發燒、嘔吐、右側腰痛，CT 見右腎實質內氣體並延伸至腎周腔。依 Huang-Tseng 分類為何？
- (A) Class 1　(B) Class 2　(C) Class 3A　(D) Class 4

<details><summary>答案</summary>

**(C) Class 3A**。氣體延伸至 perinephric（腎周）腔=3A；pararenal（腎旁）=3B；僅集尿系統=1；僅腎實質無腎外=2；雙側/孤腎=4。EPN 好發 DM 女性、E. coli。</details>

**Q2.** 關於梅毒血清學，下列何者正確？
- (A) RPR 用於確診且終生陽性
- (B) TPHA 用於篩檢與療效追蹤
- (C) Non-treponemal test 治療成功後 titer 下降 ≥4 倍
- (D) Treponemal test 治療後會轉陰

<details><summary>答案</summary>

**(C)**。Non-treponemal（RPR/VDRL）用於篩檢與追蹤，成功治療 titer 下降≥4 倍（如 1:16→1:4）；Treponemal（TPHA/FTA-ABS）用於確診且終生陽性。</details>

**Q3.** 進行 double dye test，病人口服 phenazopyridine 並膀胱灌注 methylene blue，陰道紗布最上端「濕潤但呈橘色（非藍）」，最可能診斷？
- (A) Vesicovaginal fistula　(B) Ureterovaginal fistula　(C) Urethrovaginal fistula　(D) 正常

<details><summary>答案</summary>

**(B) Ureterovaginal fistula**。橘色來自口服 pyridium 經腎臟→輸尿管的尿；藍色來自膀胱灌注。橘=ureterovaginal，藍=vesicovaginal。</details>

**Q4.** 哪種情況下 Methylene blue 為禁忌？
- (A) 高血壓　(B) G6PD deficiency　(C) 氣喘　(D) 高血脂

<details><summary>答案</summary>

**(B) G6PD deficiency**（會溶血）。Methylene blue 另禁孕婦與合併 SSRI（強效 MAOI，恐 serotonin syndrome）。</details>

**Q5.** 25 歲男性生殖器出現單一、不痛、邊緣硬化、clean base 的潰瘍，雙側不痛性淋巴結腫大。最可能病原？
- (A) HSV　(B) Haemophilus ducreyi　(C) Treponema pallidum　(D) Chlamydia L2

<details><summary>答案</summary>

**(C) Treponema pallidum**（一級梅毒）。單一、不痛、硬性下疳（chancre）+ 不痛 LAP 為典型；herpes/chancroid 會痛，LGV 病灶不痛但 LAP 痛。</details>

**Q6.** 關於 XGP，下列何者正確？
- (A) 最常見病原為 E. coli
- (B) 男性多於女性
- (C) 病理可見 lipid-laden foamy macrophages，常合併 staghorn 結石
- (D) 屬泌尿急症需緊急腎切

<details><summary>答案</summary>

**(C)**。XGP 病原以 **Proteus** 最常見、女>男（4:1）、約 50% 合併 staghorn、病理見泡沫巨噬細胞、影像像腫瘤；治療為腎切但**非緊急**（與 EPN 急症不同）。</details>

**Q7.** 年輕男性附睪炎，尿道炎症狀但分泌少、較不痛，女性伴侶多無症狀。最可能病原？
- (A) N. gonorrhoeae　(B) Chlamydia trachomatis　(C) Proteus　(D) Trichomonas

<details><summary>答案</summary>

**(B) Chlamydia trachomatis**。為 NGU 最常見病原（約 50%）、**年輕男性附睪炎主因**、女性 75% 無症狀；可致 Reiter's syndrome。治療 Azithromycin 1 g 或 Doxycycline 7 天。</details>

**Q8.** 良性輸尿管狹窄，下段缺損約 13 cm，下列最適合的重建術式？
- (A) Ureteroureterostomy　(B) Ureteroneocystostomy　(C) Psoas hitch　(D) Boari flap

<details><summary>答案</summary>

**(D) Boari flap（12–15 cm）**。對應長度：ureteroureterostomy 2–3、reimplant 4–5、renal descensus 5–8、Psoas hitch 6–10、Boari flap 12–15 cm（最長）。</details>

**Q9.** 第一線抗結核藥中，會造成視神經炎與紅綠色盲的是？
- (A) Isoniazid　(B) Rifampin　(C) Pyrazinamide　(D) Ethambutol

<details><summary>答案</summary>

**(D) Ethambutol**（Eye）。INH→周邊神經病變（補 B6）；Rifampin→體液橘紅、藥交互；Rifabutin→葡萄膜炎；PZA→高尿酸、關節痛。</details>

**Q10.** 因良性子宮全切後持續陰道漏尿但 voiding pattern 正常，影像確認 distal ureter 與陰道相通且輸尿管仍通暢。最適當的初步處置？
- (A) 立即 ureteroneocystostomy
- (B) 嘗試置放輸尿管支架，4–6 週後重新評估
- (C) 立即腎切除
- (D) 觀察 6 個月不處理

<details><summary>答案</summary>

**(B)**。Ureterovaginal fistula 若輸尿管仍通，先試置 stent，成功則 4–6 週移除重評估；失敗或完全阻塞才行 ureteroneocystostomy（± psoas hitch）。良性子宮全切比 radical 更常造成此廔管。</details>

### 🗣️ 口試題 5 題（標準答案）

**口試 Q1：請說明 EPN（emphysematous pyelonephritis）的流行病學、Huang-Tseng 分類與現代處置原則。**

標準答案：EPN 是腎臟產氣的壞死性感染，病原以 **E. coli** 最常見，**80–90% 為糖尿病患者**，**女性多於男性（約 6:1）**，典型三聯為發燒、嘔吐、腰痛，致死率約 19–43%。診斷以 **CT 為 gold standard**，依台灣 **Huang-Tseng 分類**：Class 1 氣體限於集尿系統、Class 2 在腎實質無腎外、Class 3A 延伸腎周、Class 3B 延伸腎旁、Class 4 為雙側或孤立功能腎。**現代處置以積極補液、血糖控制、廣效抗生素加上經皮腎造廔引流（PCD）為第一線，盡量保腎**；腎切除保留給 PCD 失敗、廣泛壞死，或合併休克、血小板低下、急性腎損傷、意識障礙等多重不良預後因子者。

**口試 Q2：生殖器潰瘍如何用「痛 vs 不痛」做鑑別診斷？**

標準答案：生殖器潰瘍以 herpes 最常見（Herpes > syphilis > chancroid > LGV）。鑑別關鍵在病灶與淋巴結痛不痛：**一級梅毒病灶不痛、LAP 也不痛（單一硬性下疳）**；**生殖器疱疹病灶痛、LAP 痛（多顆水泡）**；**軟性下疳（chancroid，H. ducreyi）病灶痛、化膿、LAP 痛性化膿**；**LGV（Chlamydia L1-3）病灶不痛，但 2–4 週後出現痛性化膿淋巴結與 groove sign**；Donovanosis（Klebsiella granulomatis）不痛、LAP 少見、診斷靠 Donovan body。簡言之，不痛潰瘍想梅毒、LGV、Donovanosis；痛性潰瘍想 herpes、chancroid。

**口試 Q3：請解釋梅毒血清學檢查的分類、用途與 titer 判讀。**

標準答案：分兩類。**Non-treponemal test（RPR、VDRL）**用於**篩檢與療效追蹤**，會隨治療下降甚至轉陰，但有高偽陽性（老人、HIV、藥癮、孕婦），titer 意義為有症狀 ≥1:4、early latent ≥1:8、late latent ≥1:2。**Treponemal test（TPHA、FTA-ABS、EIA）**用於**確診**，一旦感染**終生陽性**。判讀上，**成功治療**為 titer 下降 ≥4 倍或轉陰（如 1:16→1:4）；**再感染/復發**為 titer 上升 ≥4 倍且持續兩週；**治療無效**為半年後降不到 4 倍，此時需重驗 HIV、考慮 neurosyphilis 抽 CSF，並重新給每週一劑 penicillin G ×3 週。

**口試 Q4：術中如何確認輸尿管通暢？使用染料時有哪些禁忌？**

標準答案：可於術中以 **Indigo carmine 或 Methylene blue 靜脈注射**，再用膀胱鏡觀察雙側輸尿管口是否噴出染料，確認通暢或找出漏點。禁忌方面：**兩者皆不可用於孕婦**（可能致孕婦死亡或死胎）。**Methylene blue 是強效 MAOI，不可與 SSRI 併用**（serotonin syndrome 風險），且**不可用於 G6PD 缺乏者**（會引發溶血）。因此選藥前須確認病人是否懷孕、有無 G6PD 缺乏、是否使用 SSRI。

**口試 Q5：女性持續陰道漏尿，如何鑑別 vesicovaginal、ureterovaginal 與 urethrovaginal fistula？**

標準答案：可用 **double dye test** 或 **three swab test**。Double dye：口服 phenazopyridine 使腎尿變橘黃、膀胱灌注 indigo carmine/methylene blue 使膀胱尿變藍；陰道紗布**藍色＝vesicovaginal、橘色＝ureterovaginal、藍橘並存＝兩者皆有**。Three swab test（膀胱灌注 methylene blue）：**上/中紗布染藍＝vesicovaginal；最上紗布濕但不染色（被橘色腎尿濕潤）＝ureterovaginal；最下紗布染色而上兩條乾＝urethrovaginal**。要注意 VVF 約 **12% 合併輸尿管損傷**，故須加做 upper tract image；ureterovaginal 若輸尿管仍通暢可先試置支架 4–6 週，失敗再行 ureteroneocystostomy。

### 🏆 Top 20 優先必背重點

1. **UTI 解離**：有菌無白＝移生（不治）；有白無菌（sterile pyuria）＝找 TB／結石／腫瘤。
2. **Complicated UTI**＝男人/孕婦/導管/糖尿病/阻塞/免疫差 → 找並解除病因。
3. **APN**：治療 48–72h 無反應/DM/單腎 → CT；約 16% 影像有顯著異常。
4. **EPN**：E. coli、DM 80–90%、女>男；**Huang-Tseng Class 1–4**；**PCD 優先，腎切保留高危**。
5. **XGP**：Proteus、staghorn 50%、**foamy macrophage**、假腫瘤 → 腎切（非急）。
6. **Prostatitis**：NIH I–IV（III 最常）、E. coli 65–80%、**Cat I 禁按摩**、UPOINT/NIH-CPSI。
7. **GUTB**：腎最先受侵、**sterile pyuria**、**2HRZE/4HR（6 個月）**。
8. **抗結核藥**：**EMB→視神經炎/紅綠色盲**、INH→周邊神經（補 B6）、Rifabutin→葡萄膜炎。
9. **尿道炎雙重治療**：**Ceftriaxone + Azithromycin/Doxycycline**（同蓋 GC + Chlamydia）。
10. **Chlamydia**＝STD 最常見、年輕男性附睪炎主因、女性 75% 無症狀、Reiter's syndrome。
11. **滴蟲**：Doxycycline 無效 → **Metronidazole**；草莓子宮頸。
12. **潰瘍鑑別**：梅毒不痛/herpes・chancroid 痛/**LGV 病灶不痛但 LAP 痛（groove sign）**。
13. **梅毒血清學**：Non-trep（RPR/VDRL）篩追、Trep（TPHA/FTA）確診終生陽；**titer 4 倍**判效。
14. **梅毒二期**傳染力最強、rash 侵**手掌腳掌**；治療首選 **penicillin**；**Jarisch-Herxheimer** 首劑後 1–3h。
15. **三種濕疣**：**lata＝梅毒、acuminata＝HPV、molluscum＝Pox**。
16. **HPV**：菜花 90% HPV 6/11；致癌 16/18；9 價＝6/11/16/18/31/33/45/52/58。
17. **染料禁忌**：**Methylene blue 三禁 — 孕婦、G6PD、SSRI（MAOI）**。
18. **輸尿管重建長度**：**Boari 12–15（最長）**、**Psoas hitch 6–10（傷 genitofemoral）**；切開上外後、下內前。
19. **VVF/染料**：**藍＝VVF、橘＝ureterovaginal**；VVF **12% 合併輸尿管損傷**；ureterovaginal 先試 stent 4–6 週。
20. **修補時機/Sling**：感染/放療要 delay、單純婦科術後 early（vaginal 2–3 週）；Retropubic 傷 ilioinguinal(L1)、Obturator 傷 femorocutaneous；mesh 以**部分切除**為主。

| 章節 | 頁碼（約） | 主題 | 考試重要度 | 為何重要 |
|---|---|---|---|---|
| 一、總論／兒童泌尿特性 | 1–6 | 小兒與成人泌尿差異、產前篩檢 | 中 | 觀念題、口試開場常考 |

| 三、Vesicoureteral Reflux（VUR） | 15–26 | 逆流分級、VCUG、DMSA、CAP、手術適應症 | **極高** | 兒童泌尿最核心考點，必考 |

| 六、Hypospadias（尿道下裂） | 41–48 | 分型、chordee、手術時機與術式 | **高** | 解剖分型＋禁忌（割包皮）常考 |

**整體判斷**：本講義以 **VUR、Hydronephrosis、UPJO、Hypospadias、Cryptorchidism、Pediatric UTI** 六大主題為考試核心。其中 **VUR（分級／影像／CAP／手術）** 與 **水腎分級（SFU、UTD）** 是出題密度最高的區塊；**隱睪手術時機** 與 **尿道下裂禁忌（不可先割包皮）** 是最常見的「陷阱題」。

# 📗 Section 2：各章節高效率學習筆記（A–H 格式）

---

## 【主題一】Antenatal / Postnatal Hydronephrosis（產前／產後水腎）

**A. 一句話重點**
產前水腎是最常見的胎兒泌尿異常，多數為生理性、會自行緩解；重點在於用 **SFU / UTD 分級**評估嚴重度，並排除 **UPJO、VUR、PUV、ureterocele** 等病理性原因。

**B. 必背定義／分級／數字**
- 發生率：產前超音波約 **1–2%** 胎兒有 hydronephrosis；其中約 **多數（>50%）為 transient/physiologic**。
- **APD（前後腎盂直徑，Anteroposterior Diameter）門檻**：
  - 第二孕期（mid-trimester）：APD **≥4 mm** 異常；**≥7 mm** 需追蹤。
  - 第三孕期（third-trimester）：APD **≥7 mm** 異常；**≥10 mm** 顯著。
  - 產後：APD **>10–15 mm** 為中重度，需積極評估。
- **SFU Grading（Society for Fetal Urology，0–4 級）**：
  - **Grade 0**：無擴張。
  - **Grade 1**：僅腎盂（renal pelvis）輕度擴張。
  - **Grade 2**：腎盂＋部分腎盞（a few calyces）擴張。
  - **Grade 3**：腎盂＋幾乎所有腎盞（virtually all calyces）擴張，腎實質厚度正常。
  - **Grade 4**：如 Grade 3 ＋**腎實質變薄（parenchymal thinning）**。
- **UTD 分級（Urinary Tract Dilation，2014 共識，取代/補充 SFU）**：
  - 產前：**UTD A1（low risk）** vs **UTD A2-3（increased risk）**。
  - 產後：**UTD P1 / P2 / P3**（low / intermediate / high risk）。
  - 評估 6 項：APD、calyceal dilation、parenchymal thickness、parenchymal appearance、ureter、bladder（含 amniotic fluid 量）。

**C. 臨床判斷流程**
```
產前超音波發現 hydronephrosis
  → 測 APD、分 SFU/UTD 級、評估對側腎/羊水/膀胱/輸尿管
  → 出生後「48–72 小時後」再做腎超音波（太早做因生理脫水會低估）
       ├─ 輕度(SFU 1-2 / UTD P1)：定期超音波追蹤，多數緩解
       └─ 中重度(SFU 3-4 / UTD P2-3) 或雙側 / 輸尿管擴張 / 膀胱異常
              → VCUG（排除 VUR、PUV）
              → 利尿腎圖 MAG3（評估 UPJO 等阻塞）
              → 視結果觀察 vs 手術
```

**D. 診斷工具與適應症**
- **產後腎超音波**：第一線；務必出生 **48–72 小時後**做（避免生理性少尿低估）。
- **VCUG（排尿膀胱尿道攝影）**：懷疑 VUR、PUV、ureterocele、雙側／輸尿管擴張時。
- **MAG3 利尿腎圖（diuretic renogram）**：評估是否有阻塞與分腎功能；**T½ >20 min** 提示阻塞，**<10 min** 無阻塞。
- **DMSA**：評估腎皮質瘢痕與分腎功能。

**E. 治療策略**
- **Conservative（觀察）**：輕度、單側、無症狀 → 定期超音波追蹤，多數自行緩解。
- **預防性抗生素（CAP）**：高級別水腎合併輸尿管擴張、懷疑 VUR、或女嬰／未割包皮男嬰可考慮。
- **手術介入指徵**：分腎功能下降、進行性惡化、症狀性（疼痛/感染）、確診 UPJO 或 PUV。

**F. 考試高頻重點**
1. 產後超音波要在 **48–72 小時後**做（陷阱：太早做會低估）。
2. **SFU Grade 4 = 腎實質變薄**（與 Grade 3 唯一差別）。
3. 多數產前水腎為**生理性、會自行緩解**。
4. UTD 分級取代部分 SFU，分 A1/A2-3（產前）與 P1/P2/P3（產後）。
5. MAG3 **T½ >20 min = 阻塞**。
6. 雙側水腎＋男嬰＋膀胱壁厚／key-hole sign → 要想到 **PUV**。

**G. 容易混淆比較表**
| 項目 | SFU Grading | UTD Classification |
|---|---|---|
| 年代 | 1993 | 2014 共識 |
| 級數 | 0–4 | 產前 A1/A2-3；產後 P1-3 |
| 評估面向 | 主要看腎盂腎盞擴張 | 多面向（含輸尿管、膀胱、羊水） |
| 強項 | 直觀、廣用 | 風險分層、預後預測較佳 |

**H. 臨床記憶法**
- **「48–72」**＝產後超音波黃金時機。
- **SFU 4 = Four = Floor（地板變薄）**＝腎實質 thinning。
- APD 口訣「**4-7-10**」：mid-trimester 4、third-trimester 7、產後 10。

## 【主題二】Vesicoureteral Reflux（VUR，膀胱輸尿管逆流）★ 全章最核心

**A. 一句話重點**
VUR 是尿液由膀胱逆流回輸尿管／腎臟，主要危害是 **febrile UTI → reflux nephropathy（腎瘢痕）→ 高血壓／腎功能損傷**；處置原則是「**分級＋分腎功能＋感染史**」三軸決定觀察、CAP 或手術。

**B. 必背定義／分級（International Reflux Study，Grade I–V）**
- **Grade I**：逆流僅到 **ureter**（未到腎盂）。
- **Grade II**：逆流到 **renal pelvis/calyces，但無擴張（no dilation）**，腎盞 fornices 正常。
- **Grade III**：輸尿管／腎盂**輕中度擴張**，腎盞 fornices **輕度變鈍（mild blunting）**。
- **Grade IV**：**中度擴張＋迂曲（tortuous ureter）**，腎盞 fornices 明顯變鈍但仍可見乳頭壓痕（papillary impression）。
- **Grade V**：**嚴重擴張＋迂曲**，腎盞乳頭壓痕**消失**，腎盂腎盞 grossly dilated。
- 分類：**Primary VUR**（先天 VUJ 瓣膜機制不良，UVJ tunnel 過短，最常見）vs **Secondary VUR**（續發於膀胱高壓：PUV、neurogenic bladder、BBD）。
- 自然緩解率（spontaneous resolution）：與級別、年齡、單／雙側相關。**低級別（I-II）緩解率高（~80%）**；高級別（IV-V）低（~30–40% 或更低），雙側、年紀大、有 BBD 者更難緩解。

**C. 臨床判斷流程**
```
小孩 febrile UTI（尤其 <2 歲）或產前水腎 → 評估 VUR
  → 腎超音波（看 hydronephrosis、瘢痕、雙腎）
  → VCUG 確診並分級（Grade I-V）
  → DMSA 評估腎瘢痕與分腎功能
        ├─ 低級別(I-III)、無/輕瘢痕、無突破性感染
        │     → 觀察 ± CAP（continuous antibiotic prophylaxis）+ 處理 BBD
        └─ 高級別(IV-V)、明顯瘢痕、反覆突破性 febrile UTI、CAP 下仍感染
              → 手術（ureteral reimplantation）或內視鏡注射(Deflux)
```

**D. 診斷工具與適應症**
- **VCUG（voiding cystourethrogram）**：**診斷與分級的 gold standard**；可看尿道（排除 PUV）。需導尿、有輻射。
- **RNC（radionuclide cystography，核醫膀胱攝影）**：輻射較低、敏感度高，適合**追蹤**；但**無法精確分級、看不清尿道解剖**。
- **ceVUS（contrast-enhanced voiding urosonography）**：無輻射，歐洲漸普及。
- **DMSA scan**：評估 **腎皮質瘢痕（cortical scar）與分腎功能** 的 gold standard；急性期可診斷 acute pyelonephritis（「top-down approach」即先 DMSA 再決定是否 VCUG）。
- **超音波**：篩檢，但敏感度不足以排除 VUR。

**E. 治療策略**
- **Conservative（觀察）**：低級別、無瘢痕、無突破感染者；**同時治療 BBD（bladder bowel dysfunction）**——便祕／憋尿是 VUR 不癒與感染的關鍵可逆因子。
- **Medication（CAP）**：低劑量預防性抗生素。常用 **TMP-SMX、nitrofurantoin、amoxicillin/cephalexin（新生兒/<2 月用）**。目的：降低 febrile UTI 與新瘢痕（RIVUR trial 證實降低 UTI 復發約一半，但對新瘢痕影響有限）。
- **Endoscopic（內視鏡）**：**Deflux（dextranomer/hyaluronic acid）** 黏膜下注射（STING/HIT technique），微創、成功率中高（低級別佳），高級別成功率較低。
- **Open / Lap / Robotic（輸尿管再植入術，ureteral reimplantation）**：成功率最高（>95%）。術式：**Cohen（cross-trigonal）、Politano-Leadbetter、Lich-Gregoir（extravesical）**。
- **手術適應症**：高級別（IV-V）、CAP 下仍反覆 febrile UTI（breakthrough）、進行性腎瘢痕／分腎功能下降、家長無法配合長期 CAP、合併解剖異常（如 ureterocele、duplication）。

**F. 考試高頻重點**
1. **VCUG 是診斷與分級 gold standard**；DMSA 是**腎瘢痕**評估 gold standard。
2. **Grade I = ureter；II = 到腎盂無擴張；III = 輕度擴張＋fornix 變鈍；IV = 中度擴張迂曲；V = 嚴重擴張、乳頭壓痕消失**。
3. 低級別自行緩解率高，高級別低。
4. **BBD（便祕＋排尿功能障礙）必須一起治療**，否則 VUR 難癒、CAP 失效。
5. **RIVUR trial**：CAP 降低 UTI 復發約 50%，對新瘢痕預防效果有限。
6. Secondary VUR 要先解除膀胱出口阻塞（如 PUV）再談逆流。
7. 內視鏡注射首選藥劑 = **Deflux**；技術 STING / HIT。
8. 手術金標準術式 = **Cohen cross-trigonal reimplantation**。

**G. 容易混淆比較表**
| 工具 | 能分級? | 看尿道解剖? | 輻射 | 主要用途 |
|---|---|---|---|---|
| **VCUG** | ✅ 精準 | ✅ | 較高 | 初診斷＋分級 |
| **RNC（核醫）** | ❌ 粗略 | ❌ | 低 | 追蹤 |
| **ceVUS** | ✅ | ✅ | 無 | 無輻射診斷 |
| **DMSA** | — | — | 中 | 腎瘢痕/分腎功能 |

| 項目 | Primary VUR | Secondary VUR |
|---|---|---|
| 原因 | UVJ tunnel 過短（先天） | 膀胱高壓（PUV/NGB/BBD） |
| 處理重點 | 觀察/CAP/手術 | **先解除出口阻塞** |

**H. 臨床記憶法**
- 分級口訣：**「一管、二盂、三鈍、四彎、五失」**（I 到 ureter；II 到 pelvis；III fornix 變鈍；IV tortuous 彎曲；V 乳頭壓痕消失）。
- **VCUG = Voiding → 分級＋看尿道**；**DMSA = Damage（瘢痕）**。
- 想到 VUR 一定要問「**便祕＋憋尿（BBD）**」。

## 【主題三】Pediatric UTI（兒童泌尿道感染）

**A. 一句話重點**
兒童 **febrile UTI ≒ acute pyelonephritis**，目標是「**正確診斷（避免污染）、足量治療、並找出 underlying anomaly（VUR/阻塞）以防腎瘢痕**」。

**B. 必背定義／數字（AAP guideline 重點）**
- **診斷需「同時」符合**：① **膿尿（pyuria）/ 細菌尿** ＋ ② **單一致病菌** 菌落數達標。
- **菌落數標準（依採檢方式）**：
  - **導尿（catheter）**：**≥5×10⁴ (50,000) CFU/mL**。
  - **恥骨上膀胱穿刺（SPA）**：**任何 gram-negative 桿菌生長**即算（最準）。
  - **中段尿（清潔取樣）**：**≥10⁵ (100,000) CFU/mL**。
  - **貼袋尿（bag urine）**：**僅能排除、不能確診**（污染率高，陽性需重採）。
- 最常見致病菌：**E. coli（最多）**，其次 Klebsiella、Proteus（與結石相關）、Enterococcus、Pseudomonas。
- 危險因子：女嬰、**未割包皮男嬰**、VUR、BBD（便祕/憋尿）、解剖異常。

**C. 臨床判斷流程（2–24 個月發燒嬰幼兒）**
```
不明原因發燒嬰幼兒 → 留「乾淨」尿（導尿或 SPA，勿只靠 bag）
  → 驗尿（pyuria）＋ 尿培養
  → 確診 febrile UTI → 抗生素治療
  → 所有 febrile UTI：做「腎及膀胱超音波（RBUS）」
        ├─ 超音波異常 / 非典型或反覆 UTI → 做 VCUG
        └─ 第二次 febrile UTI → 做 VCUG
  → 依結果評估 VUR / 阻塞，必要時 DMSA 評估瘢痕
```

**D. 診斷工具與適應症**
- **尿液分析＋培養**：診斷基礎；**治療前務必留培養**。
- **腎膀胱超音波（RBUS）**：AAP 建議**所有 2–24 月首次 febrile UTI 都做**。
- **VCUG**：**不建議首次單純 febrile UTI 常規做**；於 **超音波異常、非典型/複雜 UTI、或第二次 febrile UTI** 時施行。
- **DMSA**：評估急性腎盂腎炎與後續瘢痕（top-down approach）。

**E. 治療策略**
- **經驗性抗生素**：依年齡與在地抗藥性；口服（cephalosporin）對非中毒兒童療效不亞於靜脈。
- **住院/靜脈指徵**：**<2 個月**、毒性外觀、無法口服／脫水、敗血症、免疫不全。
- **療程**：febrile UTI 一般 **7–14 天**。
- **後續**：找出並處理 VUR、阻塞、BBD；視情況 CAP。

**F. 考試高頻重點**
1. 導尿 **5×10⁴**、中段尿 **10⁵**、SPA 任何生長——**菌落數標準必背**。
2. **Bag urine 只能排除不能確診**。
3. **所有 2–24 月首次 febrile UTI → 做超音波**；**VCUG 不常規**，留給異常/第二次。
4. 最常見菌 = **E. coli**。
5. **<2 個月發燒** → 視為高風險，積極（住院/IV）。
6. 治療前一定先留尿培養。

**G. 容易混淆比較表**
| 採檢方式 | 確診菌落數門檻 | 備註 |
|---|---|---|
| SPA 穿刺 | 任何 G(-) 生長 | 最準、最具侵入性 |
| 導尿 | ≥5×10⁴ | 臨床常用 |
| 中段清潔尿 | ≥10⁵ | 需配合度 |
| 貼袋尿 | — | 只排除、陽性需重採 |

**H. 臨床記憶法**
- 菌落口訣「**穿刺隨便、導尿五萬、中段十萬、貼袋不算**」。
- 影像「**先超音波，VCUG 留二次**」。
- 致病菌 **E. coli 永遠第一名**。

## 【主題四】UPJ Obstruction（腎盂輸尿管交界處阻塞）

**A. 一句話重點**
UPJO 是**兒童先天性上尿路阻塞最常見原因**，多由產前水腎發現；治療關鍵在於用 **MAG3 利尿腎圖**區分「真阻塞」與「非阻塞性擴張」，並依**分腎功能與症狀**決定是否做 **pyeloplasty**。

**B. 必背定義／數字**
- 病因：**內在性（intrinsic，最常見：管腔狹窄／無動力段 adynamic segment）**、外在性（crossing vessel 跨越血管壓迫，較常見於大童／青少年）、續發性。
- 男 > 女；**左側 > 右側**；約 **10–40% 雙側**。
- MAG3 利尿腎圖判讀：
  - **T½ < 10 min**：無阻塞。
  - **T½ 10–20 min**：不確定（indeterminate）。
  - **T½ > 20 min**：阻塞。
  - **分腎功能（DRF）< 40%** 視為功能受損。

**C. 臨床判斷流程**
```
產前水腎（常 SFU 3-4，腎盂明顯擴張但「輸尿管不擴張、膀胱正常」）
  → 產後超音波確認（腎盂腎盞擴張、輸尿管不擴張）
  → VCUG 排除 VUR（鑑別擴張原因）
  → MAG3 利尿腎圖：評估 T½ 與分腎功能
        ├─ 無阻塞 / 功能良好(DRF>40%)、無症狀 → 觀察追蹤
        └─ 阻塞且 DRF 下降 / 進行性水腎 / 症狀(痛、感染、結石) → Pyeloplasty
```

**D. 診斷工具與適應症**
- **超音波**：腎盂腎盞擴張、**輸尿管不擴張**（與 VUR、megaureter 鑑別關鍵）。
- **VCUG**：排除合併 VUR。
- **MAG3 diuretic renogram**：**評估阻塞與分腎功能的核心工具**。
- **(MR urography)**：解剖細節、找 crossing vessel。

**E. 治療策略**
- **Conservative（觀察）**：分腎功能良好、無症狀 → 連續超音波＋腎圖追蹤，部分自行改善。
- **手術（Pyeloplasty）金標準＝ Anderson-Hynes dismembered pyeloplasty**；可開放／腹腔鏡／機器人；成功率 **>90–95%**。
- **手術適應症**：**分腎功能 < 40% 或進行性下降**、進行性水腎惡化、症狀（疼痛、反覆感染、結石）、雙側或單腎合併阻塞。

**F. 考試高頻重點**
1. UPJO = **兒童先天上尿路阻塞最常見原因**。
2. 超音波特徵：**腎盂腎盞擴張但輸尿管不擴張**（vs VUR/megaureter 會擴張）。
3. **MAG3 T½ >20 min = 阻塞**；**DRF <40% = 功能受損**。
4. 手術金標準 = **Anderson-Hynes dismembered pyeloplasty**。
5. 大童／青少年間歇性側腹痛（**Dietl crisis**）想到 **crossing vessel** 造成 UPJO。
6. 內在型 = 無動力狹窄段（最常見）；外在型 = 跨越血管。

**G. 容易混淆比較表**
| 鑑別 | UPJO | VUR | Primary megaureter |
|---|---|---|---|
| 輸尿管 | **不擴張** | 可擴張 | **擴張（遠端）** |
| VCUG | 陰性 | 逆流陽性 | 多陰性 |
| 阻塞位置 | UPJ | — | UVJ（遠端） |
| 核心檢查 | MAG3 | VCUG | MAG3 |

**H. 臨床記憶法**
- 「**腎盂大、輸尿管不大 = UPJO**」。
- 手術名 **Anderson-Hynes**＝把無動力段「切掉重接（dismembered）」。
- 青少年運動後／喝水後絞痛 → **Dietl crisis → crossing vessel**。

## 【主題五】Hypospadias（尿道下裂）

**A. 一句話重點**
尿道下裂是**尿道開口位於陰莖腹側（ventral）異常位置**，三大特徵為 **異位尿道口、chordee（陰莖下彎）、背側包皮過剩（dorsal hooded prepuce）**；**絕對禁忌＝出生時割包皮**（包皮是重建材料）。

**B. 必背定義／分型／數字**
- 發生率約 **1/200–1/300 男嬰**。
- **三主徵（triad）**：① 異位尿道口（ventral）② chordee（ventral curvature）③ dorsal hooded foreskin。
- **依尿道口位置分型**：
  - **Anterior / Distal（約 50–70%，最常見）**：glanular、coronal、subcoronal。
  - **Middle（約 20–30%）**：distal/mid/proximal penile。
  - **Posterior / Proximal（約 20%）**：penoscrotal、scrotal、perineal（最嚴重，常合併嚴重 chordee）。
- 合併異常：**隱睪（cryptorchidism）、腹股溝疝氣**；**proximal hypospadias ＋ 單/雙側隱睪 → 警惕 DSD（disorder of sex development），需做染色體與內分泌評估**。
- **MAGPI、TIP（Snodgrass tubularized incised plate）、Onlay island flap、二階段（Bracka/Byars）** 為常見術式。

**C. 臨床判斷流程**
```
新生兒發現尿道下裂
  → 「不可割包皮」！(留作重建)
  → 評估嚴重度：尿道口位置、chordee 程度、陰莖大小
  → proximal hypospadias + 隱睪/雙側 → 評估 DSD（karyotype、超音波、內分泌）
  → 安排手術，理想時機「6–18 個月」
        ├─ distal：TIP(Snodgrass) / MAGPI 單階段
        └─ proximal/severe chordee：onlay flap 或 二階段重建
```

**D. 診斷工具與適應症**
- **理學檢查**：尿道口位置、chordee、陰莖大小、是否合併隱睪／陰囊分裂。
- **DSD 評估**（proximal ＋ 隱睪／陰囊異常時）：karyotype、骨盆超音波、17-OHP、睪固酮等。
- 一般不需常規上尿路影像（除非合併其他泌尿異常）。

**E. 治療策略（手術為主）**
- **手術時機**：建議 **6–18 個月**（麻醉風險、心理、組織大小綜合考量）。
- **手術目標**：① 矯正 chordee（伸直陰莖）② 重建尿道至龜頭頂端 ③ 良好外觀與正常站立排尿、未來性功能。
- **術式**：distal → **TIP（Snodgrass）**、MAGPI；proximal/嚴重彎曲 → onlay island flap、**二階段（Bracka）**。
- **併發症**：**尿道皮膚瘻管（urethrocutaneous fistula，最常見）、尿道狹窄、meatal stenosis、憩室、傷口裂開**。

**F. 考試高頻重點**
1. **絕對禁忌：出生時割包皮**（包皮是重建材料）。
2. 三主徵：**異位尿道口＋chordee＋dorsal hooded prepuce**。
3. **proximal hypospadias ＋ 隱睪 → 想 DSD，須染色體/內分泌檢查**。
4. 手術時機 **6–18 個月**。
5. 最常見術後併發症 = **urethrocutaneous fistula**。
6. Distal 最常見術式 = **TIP（Snodgrass）**。

**G. 容易混淆比較表**
| 分型 | 尿道口位置 | 約佔比 | chordee | 處置 |
|---|---|---|---|---|
| Distal/Anterior | glanular–subcoronal | 最多(50-70%) | 輕 | 單階段 TIP/MAGPI |
| Middle | penile shaft | 20-30% | 中 | TIP/onlay |
| Proximal/Posterior | penoscrotal–perineal | ~20% | 重 | 二階段、查 DSD |

| 對照 | Hypospadias | Epispadias |
|---|---|---|
| 尿道口位置 | 腹側 ventral | 背側 dorsal |
| 包皮 | dorsal hood | ventral hood |
| 合併 | DSD | 膀胱外翻(exstrophy) complex |

**H. 臨床記憶法**
- **「下裂在下（ventral），別割包皮」**。
- DSD 警訊口訣：**Proximal ＋ Undescended = 查染色體**。
- 併發症首位記 **Fistula（瘻管）**。

## 【主題六】Cryptorchidism（隱睪／未降睪丸 Undescended Testis）

**A. 一句話重點**
隱睪是**睪丸未降至陰囊**，因影響**生育力與惡性風險（精原細胞瘤）**，需在 **6–18 個月**內手術固定（orchiopexy）；**摸不到的睪丸（impalpable）首選腹腔鏡探查**。

**B. 必背定義／數字**
- 發生率：**足月男嬰約 3%、早產兒約 30%**；**1 歲時降至約 1%**（多數在 **3–6 個月內自行下降**，6 月後極少自行下降）。
- 分類：
  - **Palpable（可觸及，約 80%）**：inguinal canal、ectopic、retractile（可回縮，非真隱睪）。
  - **Impalpable（不可觸及，約 20%）**：腹內（intra-abdominal）、inguinal、**vanishing/absent（atrophy）**。
  - **Retractile testis**：可被拉回陰囊並停留，屬正常變異，僅需追蹤（少數變 ascending testis）。
- 風險：**不孕（雙側風險更高）、睪丸惡性腫瘤（最常 seminoma）、扭轉、疝氣、心理**。
- **惡性風險**：相對風險上升（約 2.5–8 倍）；**早期 orchiopexy（<10–13 歲）可降低風險**，但仍高於常人，且**對側正常睪丸風險也略升**；腹內位置風險最高。

**C. 臨床判斷流程**
```
新生兒/嬰兒陰囊空虛 → 理學檢查分「可觸及 vs 不可觸及」
  → 6 個月仍未下降（足月）→ 不會再自行降 → 轉外科
        ├─ Palpable → inguinal orchiopexy（腹股溝睪丸固定術）
        └─ Impalpable → 「腹腔鏡探查（diagnostic laparoscopy，金標準）」
                ├─ 找到腹內睪丸 → orchiopexy（必要時 Fowler-Stephens 分期）
                ├─ vanishing/atrophic → 切除 nubbin
                └─ 雙側不可觸及 → 先查 HCG stimulation / 內分泌 / karyotype（排除 DSD/無睪症）
```

**D. 診斷工具與適應症**
- **理學檢查為主**（溫暖環境、放鬆）。
- **影像（超音波）價值有限**：對 impalpable testis 敏感／特異度皆不足，**不建議常規用來定位**。
- **腹腔鏡（laparoscopy）= 不可觸及睪丸定位與處理的 gold standard**。
- **雙側不可觸及**：HCG stimulation test（看睪固酮反應）、karyotype、AMH/inhibin B 評估有無睪丸組織。

**E. 治療策略**
- **手術（Orchiopexy）為標準**，**時機 6–18 個月**（早做利於生育力與降低惡性風險）。
- **Palpable**：inguinal orchiopexy。
- **Intra-abdominal**：腹腔鏡 orchiopexy；睪丸血管太短 → **Fowler-Stephens（分期或一次性結紮精索血管，靠輸精管動脈側枝供血）**。
- **荷爾蒙治療（HCG/GnRH）**：療效有限，不作首選。
- **青春期後單側隱睪／萎縮**：可考慮 orchiectomy（惡性風險＋無功能）。

**F. 考試高頻重點**
1. 手術時機 **6–18 個月**（6 月後不會自行下降）。
2. **不可觸及睪丸 → 腹腔鏡是金標準**，超音波無用。
3. 惡性風險上升，最常見 **seminoma**；早手術降低（但不歸零），對側也略升。
4. **Retractile testis = 正常變異**，追蹤即可。
5. 血管過短 → **Fowler-Stephens orchiopexy**。
6. **雙側 impalpable → 先做內分泌/染色體（排除 DSD、anorchia）**。
7. 早產兒發生率高（~30%），足月約 3%，1 歲約 1%。

**G. 容易混淆比較表**
| 類型 | 可否觸及 | 處置 |
|---|---|---|
| Retractile | 可（會回縮但能停留） | 追蹤 |
| Inguinal UDT | 可 | inguinal orchiopexy |
| Intra-abdominal | 不可 | 腹腔鏡 ± Fowler-Stephens |
| Vanishing/atrophic | 不可 | 切除 nubbin |

**H. 臨床記憶法**
- 時機口訣「**六月不降，六到十八月開刀**」。
- 摸不到 → **腹腔鏡（Laparoscopy），不是超音波**。
- 血管短 → **Fowler-Stephens（FS = 切血管靠側枝）**。

## 【主題七】陰囊急症與其他（Scrotal Emergency / PUV）

**A. 一句話重點**
**急性陰囊痛優先排除睪丸扭轉（testicular torsion）——泌尿外科急症，黃金搶救 <6 小時**；男嬰雙側水腎＋膀胱壁厚要想 **posterior urethral valve（PUV）**。

**B. 必背定義／數字**
- **睪丸扭轉**：好發**新生兒與青春期**；典型突發劇痛、**cremasteric reflex 消失**、睪丸抬高橫位（bell-clapper deformity 為易感因素）。**6 小時內手術救援率高（>90%），>24 小時多需切除**。
- **附睪／睪丸附件扭轉（torsion of appendix testis）**：學齡兒最常見陰囊痛原因，**blue dot sign**，多保守治療。
- **PUV**：**男嬰最常見先天下尿路阻塞**；產前雙側水腎＋**膀胱壁增厚＋key-hole sign**；出生後腎功能不良、排尿費力；**VCUG 為診斷依據**，治療為**內視鏡瓣膜切除（valve ablation）**。

**C. 臨床判斷流程**
```
急性陰囊腫痛 → 先排除睪丸扭轉
  → 病史(突發、劇痛、噁心)、理學(高位橫位、cremasteric reflex 消失)
  → 高度懷疑 → 「立即手術探查」勿等影像
  → 不確定 → 陰囊都卜勒超音波(血流↓=扭轉)
PUV：產前雙側水腎+膀胱壁厚 → 出生後 VCUG → 內視鏡瓣膜切除
```

**D. 診斷工具與適應症**
- **陰囊都卜勒超音波**：扭轉血流減少／消失（但高度懷疑時勿因檢查延誤手術）。
- **VCUG**：PUV 診斷（後尿道擴張＋膀胱小樑化）。

**E. 治療策略**
- **睪丸扭轉**：**緊急手術復位＋固定（orchiopexy），並固定對側**；壞死則 orchiectomy。
- **附件扭轉**：保守（止痛、觀察）。
- **PUV**：先導尿引流穩定腎功能、矯正電解質 → **內視鏡瓣膜切除**；長期追蹤腎功能與膀胱功能（valve bladder syndrome）。

**F. 考試高頻重點**
1. **睪丸扭轉 = 急症，<6 小時黃金時間**，高度懷疑直接手術。
2. **Cremasteric reflex 消失** 支持扭轉；**blue dot sign** 為附件扭轉。
3. **扭轉手術要「雙側」固定**（對側也有 bell-clapper 風險）。
4. **PUV = 男嬰最常見下尿路阻塞**，VCUG 診斷、內視鏡切除。
5. 產前「雙側水腎＋膀胱壁厚＋key-hole」→ PUV。

**G. 容易混淆比較表**
| 鑑別 | 睪丸扭轉 | 附件扭轉 | 副睪炎 |
|---|---|---|---|
| 年齡 | 新生兒/青春期 | 學齡 | 青少年/性活躍 |
| 起病 | 突發劇痛 | 較緩 | 漸進 |
| 特徵 | reflex 消失、高位橫位 | blue dot sign | Prehn(+)、reflex 在 |
| 血流 | 減少 | 正常 | 增加 |
| 處置 | 急手術 | 保守 | 抗生素 |

**H. 臨床記憶法**
- 扭轉「**六小時、雙側固定**」。
- **Blue dot = 附件**；**Reflex 消失 = 主睪丸扭轉**。
- 男嬰雙腎水腫看到 **key-hole → PUV**。

## 二、單選題 10 題（附答案與詳解）

**1.** 關於 SFU hydronephrosis 分級，Grade 3 與 Grade 4 最主要的差別為何？
(A) 是否有腎盂擴張　(B) 是否有腎盞擴張　(C) **是否有腎實質變薄**　(D) 是否合併輸尿管擴張
**答案：C**。SFU 3 為腎盂腎盞皆擴張但腎實質正常；**Grade 4 多了 parenchymal thinning**。

**2.** 兒童 VUR 的診斷與分級之 gold standard 為？
(A) 腎超音波　(B) **VCUG**　(C) DMSA　(D) MAG3 renogram
**答案：B**。VCUG 可分級並評估尿道；DMSA 評估腎瘢痕。

**3.** 2 個月大發燒嬰兒，以導尿留取尿液培養，下列何者菌落數可診斷 UTI？
(A) ≥10³　(B) **≥5×10⁴**　(C) ≥10⁵ 才算　(D) 任何生長即算
**答案：B**。導尿 **≥5×10⁴ CFU/mL**；中段尿需 ≥10⁵；SPA 任何 G(-) 生長。

**4.** 依 AAP guideline，2–24 個月首次 febrile UTI 的影像處置，下列正確的是？
(A) 常規做 VCUG　(B) **所有人做腎膀胱超音波，VCUG 留給超音波異常或第二次**　(C) 一律先 DMSA　(D) 不需任何影像
**答案：B**。

**5.** 產前發現單側水腎，產後超音波見腎盂腎盞擴張但**輸尿管不擴張、膀胱正常**，VCUG 陰性。最可能診斷？
(A) VUR　(B) **UPJ obstruction**　(C) Primary megaureter　(D) PUV
**答案：B**。輸尿管不擴張＋VCUG 陰性是 UPJO 典型。

**6.** UPJO 行 MAG3 利尿腎圖，下列何者最支持「真阻塞」？
(A) T½ < 10 min　(B) T½ 10–20 min　(C) **T½ > 20 min**　(D) 分腎功能 50%
**答案：C**。T½>20 min 為阻塞；<10 min 無阻塞。

**7.** 關於尿道下裂，下列敘述何者**錯誤**？
(A) 三主徵為異位尿道口、chordee、dorsal hooded prepuce
(B) **應在出生時先行包皮環切以利照護**
(C) proximal hypospadias 合併隱睪需評估 DSD
(D) 最常見術後併發症為 urethrocutaneous fistula
**答案：B（錯誤者）**。包皮為重建材料，**禁止割包皮**。

**8.** 足月男嬰右側陰囊空虛，睪丸不可觸及，最適當的定位／處置為？
(A) 立即陰囊超音波定位　(B) 等到 3 歲再說　(C) **6 個月後仍未降則安排腹腔鏡探查**　(D) 立即 HCG 治療
**答案：C**。impalpable testis 以腹腔鏡為金標準；6 月後不會自行下降。

**9.** 14 歲男孩運動後突發左側陰囊劇痛、噁心嘔吐，左睪丸高位橫位、cremasteric reflex 消失。最適當處置？
(A) 口服抗生素　(B) 安排隔日門診超音波　(C) **立即手術探查**　(D) 冰敷觀察
**答案：C**。高度懷疑睪丸扭轉，<6 小時黃金時間，**勿因檢查延誤手術**，並雙側固定。

**10.** RIVUR trial 對於 VUR 兒童使用 continuous antibiotic prophylaxis 的結論為？
(A) 完全無效　(B) **降低 UTI 復發約一半，但對新腎瘢痕預防效果有限**　(C) 顯著降低新瘢痕且無抗藥性疑慮　(D) 可取代手術
**答案：B**。

## 三、口試題 5 題（標準答案要點）

**Q1. 請說明產前水腎產後的評估流程。**
重點：① 產後 **48–72 小時後**做腎超音波（避免生理脫水低估）；② 依 SFU/UTD 分級；③ 中重度、雙側、輸尿管擴張或膀胱異常 → **VCUG**（排除 VUR、PUV）；④ 懷疑阻塞 → **MAG3 利尿腎圖**（T½、分腎功能）；⑤ 依分腎功能與進展決定觀察或手術；多數輕度為生理性會緩解。

**Q2. VUR 的分級系統與各檢查工具角色。**
重點：International grading **I–V**（一管、二盂無擴張、三輕度擴張 fornix 鈍、四中度迂曲、五重度乳頭壓痕消失）。**VCUG = 診斷分級 gold standard 並看尿道；RNC = 低輻射追蹤但不能精準分級；DMSA = 腎瘢痕與分腎功能**。處置三軸：級別、分腎功能、感染史；務必**同時治療 BBD**。

**Q3. 兒童 febrile UTI 的診斷標準與後續影像建議。**
重點：診斷需膿尿＋單一菌＋達標菌落數（**導尿 5×10⁴／中段 10⁵／SPA 任意生長；bag 不能確診**）。最常見菌 E. coli。所有 2–24 月首次 febrile UTI **做超音波**；**VCUG 不常規**（超音波異常／非典型／第二次才做）；必要時 DMSA。

**Q4. 如何鑑別並處理 UPJ obstruction？手術金標準為何？**
重點：超音波見**腎盂腎盞擴張但輸尿管不擴張**、VCUG 排除 VUR、**MAG3** 評估 T½（>20 min 阻塞）與 DRF（<40% 受損）。觀察 vs 手術依分腎功能與症狀；手術金標準 **Anderson-Hynes dismembered pyeloplasty**，成功率 >90%。青少年間歇痛想 crossing vessel（Dietl crisis）。

**Q5. 隱睪的手術時機、impalpable testis 處置與惡性風險。**
重點：手術時機 **6–18 個月**（6 月後不自行下降，早做利生育與降惡性）。**impalpable → 腹腔鏡為金標準**（超音波無用）；腹內睪丸血管短用 **Fowler-Stephens**；雙側不可觸及先查內分泌/染色體（DSD/anorchia）。惡性風險上升（最常 **seminoma**），早 orchiopexy 可降低但不歸零，對側亦略升。

## 四、Top 20 必背考點（背誦優先序）

1. **VCUG** = VUR 診斷與分級 gold standard；**DMSA** = 腎瘢痕／分腎功能 gold standard。
2. VUR 分級口訣：**一管、二盂（無擴張）、三鈍、四彎、五（乳頭壓痕）失**。
3. 低級別 VUR 緩解率高（~80%），高級別低；**必同時治療 BBD**。
4. **RIVUR**：CAP 降 UTI 復發約一半，對新瘢痕效果有限。
5. 兒童 UTI 菌落數：**導尿 5×10⁴／中段 10⁵／SPA 任意；bag 不能確診**。
6. 最常見兒童 UTI 致病菌 = **E. coli**。
7. 2–24 月首次 febrile UTI → **做超音波；VCUG 不常規**（異常／第二次才做）。
8. 產後腎超音波要在 **出生 48–72 小時後**做。
9. **SFU Grade 4 = 腎實質變薄**（與 G3 唯一差別）。
10. APD 門檻口訣 **4-7-10**（mid/third trimester/產後）。
11. **MAG3 T½ > 20 min = 阻塞；DRF < 40% = 功能受損**。
12. UPJO = 兒童先天上尿路阻塞最常見原因；**輸尿管不擴張**為特徵。
13. UPJO 手術金標準 = **Anderson-Hynes dismembered pyeloplasty**。
14. 尿道下裂三主徵：**異位尿道口＋chordee＋dorsal hooded prepuce**；**禁止割包皮**。
15. **Proximal hypospadias ＋ 隱睪 → 查 DSD（染色體/內分泌）**。
16. 尿道下裂最常見術後併發症 = **urethrocutaneous fistula**；手術時機 6–18 月。
17. 隱睪手術時機 **6–18 個月**；足月 3%、早產 30%、1 歲 1%。
18. **Impalpable testis → 腹腔鏡是金標準**（超音波無用）；血管短用 **Fowler-Stephens**。
19. 睪丸扭轉 = 急症，**<6 小時黃金**，高度懷疑直接手術並**雙側固定**；blue dot = 附件扭轉。
20. **PUV = 男嬰最常見下尿路阻塞**；雙腎水腫＋膀胱壁厚＋key-hole sign，VCUG 診斷、內視鏡瓣膜切除。

> 範圍：膀胱癌（Bladder cancer）＋上泌尿道尿路上皮癌（UTUC）；NMIBC／MIBC／轉移性 UC 全身性治療

## 【主題一】總論、分類與流行病學（Classification & Epidemiology）

**A. 一句話重點**
尿路上皮癌是泌尿道最常見惡性腫瘤，依部位分 **上泌尿道（renal pelvis、ureter）** 與 **下泌尿道（bladder、urethra）**；組織學以 **urothelial carcinoma（約 90%）** 為主，膀胱癌遠多於 UTUC，但 **台灣 UTUC 比例明顯高於西方**。

**B. 必背定義／數字**
- 分類：**上泌尿道＝輸尿管＋腎盂；下泌尿道＝膀胱＋尿道**。
- 發生率排序：**膀胱癌 > 腎盂癌 > 輸尿管癌**。
- **西方：bladder : UTUC ≈ 93 : 7**；UTUC 男女比 **2–3:1**。
- **台灣：bladder : UTUC ≈ 60 : 40**（UTUC 比例高很多）；台灣 UTUC **男女比約 1 : 1.3（女略多，與西方相反）**——與馬兜鈴酸、砷暴露相關。
- **多部位／復發特性（panurothelial field defect）**：
- 膀胱癌後上泌尿道復發：**2%～6%**。
- **UTUC 後膀胱復發：15%～75%（5 年內）**（很高，故 UTUC 術後要追蹤膀胱）。
- 膀胱復發機轉三理論：**① downstream seeding（順流播種）② 致癌物暴露時間長 ③ 膀胱尿路上皮細胞數多**。

**C. 臨床判斷流程**
```
診斷 UC → 定位(上泌尿道 vs 膀胱) → 評估是否多發/雙側
  → 膀胱癌：注意上泌尿道(2–6%)
  → UTUC：術後嚴密追蹤膀胱(15–75% 復發)
台灣病人：問馬兜鈴酸(中草藥)、砷(烏腳病地區)、染料職業
```

**D-E. 工具與處置**：見主題三、五、六、八。

**F. 考試高頻重點**
1. UC 是泌尿道最常見惡性腫瘤，**urothelial carcinoma 約 90%**。
2. **台灣 UTUC 比例高（約 40%）**，男女比約 1:1.3，與馬兜鈴酸/砷相關。
3. **UTUC 後膀胱復發 15–75%**；膀胱癌後上泌尿道復發僅 2–6%。
4. 發生率：膀胱 > 腎盂 > 輸尿管。

**G. 容易混淆比較表**
| 項目 | 西方 | 台灣 |
|---|---|---|
| Bladder:UTUC | 93:7 | 60:40 |
| UTUC 男女比 | 2–3:1（男多） | ~1:1.3（女略多） |
| 特殊危險因子 | 吸菸/職業 | 馬兜鈴酸、砷 |

**H. 臨床記憶法**
- 「**UTUC → 膀胱復發很高（15–75%），所以一定追蹤膀胱**」。
- 台灣特色「**馬兜鈴酸 + 砷 → UTUC 多、女不少**」。

---

## 【主題二】危險因子（Risk Factors）★ UTUC 特色必考

**A. 一句話重點**
吸菸是 UC 最重要的可改變危險因子；UTUC 另有特有危險因子 **馬兜鈴酸（aristolochic acid）、砷、止痛藥濫用、Balkan nephropathy、Lynch syndrome（遺傳）**。

**B. 必背定義／數字**
- **一般 UC 危險因子**：
- **吸菸：佔 UC 的 30%～40%（最重要）**。
- 肥胖（BMI↑）。
- **職業暴露：aromatic amines（芳香胺）**——菸草、染料、橡膠、美髮、油漆、皮革工人。
- 慢性發炎（長期留置導尿）、**Schistosomiasis（血吸蟲→鱗狀細胞癌）**、感染、放射線。
- 化療藥 **cyclophosphamide**。
- 環境汙染：**飲水含砷（arsenic）**。
- **UTUC 特有危險因子**：
- **止痛藥濫用**（腎盂/輸尿管腫瘤病人 22%／11% 有止痛藥濫用史）。
- **Balkan nephropathy**（間質性發炎疾病）。
- **馬兜鈴酸（Aristolochic acid，馬兜鈴酸，中草藥）★台灣重要**。
- **砷（arsenic）**。
- **遺傳性 UTUC：Lynch syndrome（mismatch repair 基因突變）**。

**C-E. 流程與處置**：戒菸、避免馬兜鈴酸中草藥、職業防護；Lynch syndrome 病人篩檢。

**F. 考試高頻重點**
1. **吸菸佔 UC 30–40%（最重要可改變因子）**。
2. 職業致癌物 = **aromatic amines（芳香胺）**。
3. **馬兜鈴酸、砷、止痛藥濫用、Balkan nephropathy、Lynch syndrome** = UTUC 特有。
4. **Schistosoma haematobium → 膀胱鱗狀細胞癌（SCC）**（埃及/非洲）。
5. Cyclophosphamide 化療為醫源性危險因子。
6. **Lynch syndrome（HNPCC，MMR 基因）** = 遺傳性 UTUC。

**G. 容易混淆比較表**
| 危險因子 | 主要關聯 |
|---|---|
| 吸菸/芳香胺 | 一般 UC（膀胱為主） |
| 馬兜鈴酸/砷/止痛藥/Balkan | **UTUC** |
| 血吸蟲 | 膀胱 **SCC** |
| 慢性發炎/結石/長期導尿 | 膀胱 **SCC** |
| Lynch syndrome | 遺傳性 UTUC |

**H. 臨床記憶法**
- UTUC 特有口訣「**馬（馬兜鈴酸）、砷、止痛藥、Balkan、Lynch**」。
- 「**血吸蟲、結石、慢性發炎 → 鱗狀細胞癌（SCC）**」。

---

## 【主題三】症狀、實驗室與影像診斷（Symptoms, Lab & Imaging）

**A. 一句話重點**
**無痛性血尿（painless hematuria）** 是 UC 最典型表現；診斷的 gold standard 在膀胱為 **膀胱鏡＋切片**，影像評估上泌尿道與分期則靠 **CT urography**。

**B. 必背定義／數字**
- **膀胱癌症狀**：**血尿 85–90%（肉眼或顯微、間歇性）**為主；膀胱刺激症狀（尤其 diffuse CIS）；晚期骨痛/側腹痛、膀胱壁增厚或可觸腫塊、肝腫大、鎖骨上淋巴結、下肢淋巴水腫。
- **UTUC 症狀**：**肉眼血尿 56–98%**、**側腹痛 20–30%**、刺激性排尿症狀；晚期/轉移症狀。
- **實驗室**：尿液常規、Cr；**尿液細胞學（urine cytology）**——對高惡性度/CIS 敏感度佳、低惡性度差；其他 biomarker：**NMP22、BTA、FISH（UroVysion）、ImmunoCyt、CxBladder**。
- **影像與診斷**：
- **膀胱鏡＋輸尿管鏡＋切片＝膀胱癌診斷 gold standard**。
- IVP / RP（逆行性腎盂攝影）。
- **CT urography 為診斷準確度最高的影像**（評估上泌尿道與分期）。
- MRI 輔助。

**C. 臨床判斷流程**
```
無痛性血尿 → 尿細胞學 + 影像(CT urography) + 膀胱鏡
  ├ 膀胱見腫瘤 → TURBT(診斷+治療)
  └ 上泌尿道病灶 → 輸尿管鏡 + 切片 → 確診 UTUC
```

**D-E. 工具與處置**：如上。Cytology 對 CIS 敏感、對 low-grade 差。

**F. 考試高頻重點**
1. UC 最典型 = **無痛性血尿（膀胱癌血尿 85–90%）**。
2. **膀胱鏡＋切片 = 膀胱癌診斷 gold standard**。
3. **CT urography = 診斷準確度最高的影像**。
4. **尿細胞學對高惡性度/CIS 敏感、low-grade 差**。
5. Diffuse CIS 常以**膀胱刺激症狀**表現。

**G. 容易混淆比較表**
| 工具 | 角色 |
|---|---|
| 膀胱鏡＋切片 | 膀胱癌診斷 gold standard |
| CT urography | 影像準確度最高、分期/上泌尿道 |
| 尿細胞學 | 篩檢/追蹤，CIS 佳、low-grade 差 |
| FISH/NMP22/BTA | 輔助 biomarker |

**H. 臨床記憶法**
- 「**無痛血尿 = UC 直到證實為止**」。
- 「**膀胱鏡確診、CT urography 看全貌、cytology 抓 CIS**」。

---

## 【主題四】病理、分級與分期（Histopathology, Grading & Staging）★ 極高頻

**A. 一句話重點**
UC 約佔 90%，需熟記 **變異型（variant）、WHO grading（low vs high grade，與預後相關、與大小無關）**，以及最關鍵的 **NMIBC（Ta/T1/CIS）vs MIBC（≥T2）分期分界**。

**B. 必背組織型與分期**
- **組織型**：**Urothelial carcinoma 90%**；**Squamous cell carcinoma 5–10%**（慢性感染、膀胱結石、長期導尿、血吸蟲）；**Adenocarcinoma <2%**（urachus 臍尿管腺癌位於 **bladder dome**）。
- **良性病灶**：papilloma、inverted papilloma、von Brunn nests。
- **侵襲性 variant（預後差）**：**micropapillary（男>女）、small cell（APOBEC、TP53/RB1/TERT promoter 突變，需化療如 small cell lung）、plasmacytoid（1%，易腹膜擴散）、sarcomatoid（0.3–0.6%）**。
- **Grading**：與**膀胱癌預後相關，與腫瘤大小無關**；WHO low-grade vs high-grade。
- **TNM 分期（膀胱）**：
- **Ta**：非侵襲性乳突狀癌（侷限黏膜）。
- **Tis（CIS）**：原位癌，扁平、高惡性度。
- **T1**：侵入 **lamina propria（黏膜下層）**。
- **以上 Ta/Tis/T1 = NMIBC（非肌肉侵犯性）**。
- **T2**：侵入 **muscularis propria（肌肉層）** → **MIBC 起點**。
- **T3**：侵入膀胱周圍脂肪（perivesical）。
- **T4**：侵犯鄰近器官（攝護腺、子宮、陰道、骨盆/腹壁）。
- **UTUC 分期/分布**：輸尿管腫瘤多在**遠端輸尿管（70%）**、中段 25%、上段 5%；**雙側 3–5%**；**膀胱復發 15–75%（5 年內）**；CIS 雙側/多發比例高。

**C. 臨床判斷流程**
```
TURBT 病理 → 看侵犯深度
  ├ Ta / Tis / T1 → NMIBC → 風險分層 + 膀胱灌注
  └ ≥T2(肌肉層) → MIBC → 新輔助化療 + 根除性膀胱切除
病理見 variant(micropapillary/small cell/plasmacytoid) → 較侵襲、積極處理
```

**F. 考試高頻重點**
1. **NMIBC = Ta/Tis/T1；MIBC = ≥T2（肌肉層）**——分界必背。
2. **T1 = 侵入 lamina propria；T2 = 侵入 muscularis propria**。
3. **CIS（Tis）= 扁平、高惡性度**，predisposes 進展。
4. Grading **與預後相關、與大小無關**。
5. **Urachus 腺癌位於 bladder dome**。
6. **Small cell carcinoma → 比照小細胞肺癌，先化療**。
7. Variant（micropapillary/plasmacytoid/sarcomatoid）= 預後差、積極治療。
8. 血吸蟲/慢性發炎 → **SCC**。

**G. 容易混淆比較表**
| 分期 | 侵犯層次 | 分類 |
|---|---|---|
| Ta | 黏膜(非侵襲乳突) | NMIBC |
| Tis (CIS) | 扁平原位、高惡性 | NMIBC |
| T1 | lamina propria | NMIBC |
| T2 | muscularis propria | **MIBC** |
| T3 | perivesical fat | MIBC |
| T4 | 鄰近器官 | MIBC |

**H. 臨床記憶法**
- 「**T2 踏進肌肉就變 MIBC，治療策略大轉彎**」。
- CIS =「**扁平的壞東西（high grade）**」。
- 「**Urachus 在頂（dome）= adenocarcinoma**」。

---

## 【主題五】NMIBC 風險分層與治療（TURBT / re-TURBT / 灌注）★ 超高頻

**A. 一句話重點**
NMIBC 以 **TURBT（經尿道膀胱腫瘤切除）** 診斷兼治療，依 **EAU 風險分層** 決定膀胱內灌注（**化療 MMC 或免疫 BCG**），高風險者並考慮 **re-TURBT**；目標降低**復發與進展**。

**B. 必背重點**
- **TURBT 併發症**：**膀胱穿孔**（避免過度膨脹；側壁腫瘤用麻醉肌肉鬆弛避免 **obturator reflex 閉孔神經反射**）、腹膜外穿孔（延長導尿）、TUR syndrome（少見）。
- **Re-TURBT（第二次 TURBT）適應症 ★**：
- 初次 TURBT 不完全切除。
- 對切除完整性存疑。
- **檢體無肌肉層**（除了 TaG1 與 primary CIS）。
- **所有 T1 腫瘤**。
- **時機：初次切除後 2–6 週**。
- **膀胱內灌注**：
- **即刻單次化療灌注（MMC，術後 24 小時內）**：**降低腫瘤細胞種植與復發率**；用於低/中危。
- **BCG（卡介苗）**：**降低復發與進展率**，用於高危與 CIS；機轉＝直接結合 fibronectin、誘發 **IFN-γ、IL-2、IL-12 之 Th1 免疫反應**。
- MMC 機轉：防止腫瘤細胞種植。
- **BCG 無效（BCG-unresponsive）NMIBC**：可考慮 **pembrolizumab（KEYNOTE-057）** 或膀胱切除。
- EAU 風險分群另計：**年齡 >70、多發乳突狀腫瘤、腫瘤直徑 >3 cm** 為附加危險因子。

**C. 臨床判斷流程**
```
膀胱腫瘤 → TURBT(切除+病理) → 即刻單次 MMC(低中危)
  → EAU 風險分層
       ├ 低危 → 觀察追蹤
       ├ 中危 → MMC 或 BCG 維持
       └ 高危 / CIS / T1 / 高惡性度 → BCG(誘導+維持)；T1 做 re-TURBT(2–6 週)
  → BCG 無效 → pembrolizumab 或 根除性膀胱切除
```

**F. 考試高頻重點**
1. **所有 T1 與「檢體無肌肉層」→ 做 re-TURBT（2–6 週）**（TaG1/primary CIS 除外）。
2. **即刻單次 MMC（24h 內）降復發/種植**；**BCG 降復發與進展**。
3. **BCG 機轉 = Th1 免疫（IFN-γ/IL-2/IL-12）＋結合 fibronectin**。
4. **側壁腫瘤 TURBT 注意 obturator reflex → 用肌肉鬆弛**。
5. 高危 NMIBC/CIS → **BCG 為主**。
6. **BCG-unresponsive → pembrolizumab（KEYNOTE-057）或膀胱切除**。
7. EAU 附加危險因子：年齡>70、多發、>3 cm。

**G. 容易混淆比較表**
| 灌注藥 | 主要目的 | 機轉 | 用於 |
|---|---|---|---|
| **MMC（化療）** | 防種植、降復發 | 直接細胞毒、防 implantation | 低/中危、即刻單次 |
| **BCG（免疫）** | 降復發＋**降進展** | Th1（IFN-γ/IL-2/IL-12）、結合 fibronectin | 高危、CIS |

**H. 臨床記憶法**
- 「**T1 一定 re-TURBT；沒肌肉層也要再切**」。
- 「**MMC 即刻打、BCG 救高危＆CIS（還能防進展）**」。
- 側壁腫瘤怕「**閉孔神經跳（obturator reflex）→ 肌肉鬆弛**」。

## 【主題六】MIBC 治療（Neoadjuvant + Radical Cystectomy）★ 必考

**A. 一句話重點**
肌肉侵犯性膀胱癌（MIBC, ≥T2）標準治療為 **含順鉑新輔助化療（neoadjuvant cisplatin-based）＋根除性膀胱切除（radical cystectomy, RC）＋骨盆淋巴結廓清＋尿流改道**；不適合手術者可考慮膀胱保留三合一療法。

**B. 必背重點**
- **新輔助化療（NAC）**：順鉑為基礎（如 **ddMVAC 或 GC**），可提升存活；MIBC 標準流程「**先化療再手術**」。
- **根除性膀胱切除（RC）範圍**：男性切膀胱＋攝護腺＋精囊；女性切膀胱＋子宮＋附件＋部分陰道前壁（依情況）。
- **標準骨盆淋巴結廓清模板（解剖邊界）**：
- **外側：genitofemoral nerve（生殖股神經）**。
- **內側：internal iliac artery（內髂動脈）**。
- **下方：Cooper's ligament（庫柏氏韌帶）**。
- **上方：輸尿管跨越 common iliac artery 處**。
- **清除淋巴結數 >10 顆可改善存活**。
- **尿流改道（urinary diversion）與代謝**：
- 使用腸段吸收尿中物質 → 電解質/酸鹼異常。
- **回腸/結腸導管或新膀胱 → hyperchloremic metabolic acidosis（代謝性酸中毒）**。
- **胃做改道 → metabolic alkalosis（代謝性鹼中毒，少見）**。
- 不適合 cisplatin（腎功能差等）者，不建議用 carboplatin 取代作 NAC。

**C. 臨床判斷流程**
```
確診 MIBC(≥T2) → 評估順鉑適格性
  ├ Cisplatin 適合 → 新輔助 cisplatin 化療 → RC + LND(>10) + 尿流改道
  └ 不適合手術/想保膀胱 → 三合一(最大 TURBT + 化療 + 放療)
術後依病理 → 高風險可考慮輔助 nivolumab(CheckMate 274)
```

**F. 考試高頻重點**
1. **MIBC 標準 = 新輔助 cisplatin 化療 ＋ RC ＋ LND ＋ 尿流改道**。
2. **LND 邊界**：外側 genitofemoral nerve、內側 internal iliac artery、下方 Cooper's ligament、上方 ureter 跨 common iliac；**清 >10 顆改善存活**。
3. **回腸/結腸尿流改道 → 高血氯代謝性酸中毒**；胃 → 鹼中毒。
4. 新輔助化療「**先化療再開刀**」可提升 OS。
5. 不能手術／保膀胱 → **三合一（TURBT + chemoradiation）**。

**G. 容易混淆比較表**
| 尿流改道使用腸段 | 酸鹼異常 |
|---|---|
| 回腸 / 結腸 | **代謝性酸中毒（高血氯）** |
| 胃 | 代謝性鹼中毒 |
| 空腸（少用） | 低鈉低氯高鉀代謝性酸中毒 |

**H. 臨床記憶法**
- 「**MIBC = 化療打頭陣，再切膀胱＋清>10 顆淋巴**」。
- LND 邊界口訣「**外神經、內髂動、下 Cooper、上 ureter 跨髂**」。
- 「**腸子做膀胱 → 酸中毒；胃做 → 鹼中毒**」。

## 【主題七】轉移性 UC 全身性治療（Systemic Therapy for mUC）★ 新藥熱點

**A. 一句話重點**
轉移性 UC 第一線已從「鉑類化療 ± 維持」演進到 **Enfortumab Vedotin（EV）＋ Pembrolizumab（EV-302）成為新標準**；後線有 **erdafitinib（FGFR）、HER2 ADC** 等生物標記導向治療。

**B. 必背重點**
- **第一線（1L）**：
- 傳統化療反應率 **40–50%（Gem/Cis 略高），但 PFS 短**。
- **Cisplatin eligible**：Gem/Cis；或加 IO。
- **Cisplatin ineligible**：Carboplatin/Gem ＋ **avelumab maintenance（JAVELIN Bladder 100，維持治療提升 OS）**；或 pembrolizumab（PD-L1+）。
- **EV + Pembrolizumab（EV-302）**：**FDA 2023 核准、台灣 2024**，成為 1L 新標準（優於化療）。
- ICI 在 cisplatin-ineligible 且 PD-L1+ 有效（IMvigor210、KEYNOTE-052）。
- **Enfortumab Vedotin（EV）**：**抗 Nectin-4 抗體藥物複合體（ADC），帶 MMAE**；Nectin-4 在 mUC **>90% 過度表現**；與 pembrolizumab 合併＝直接殺癌＋免疫原性細胞死亡＋解除 T 細胞抑制（協同）。
- **第二線（2L）**：
- 鉑類失敗後 **pembrolizumab（KEYNOTE-045）** 為標準（優於化療）。
- 單藥 ORR 約 **15–23%**，約一半 1 年存活。
- **後線/生物標記**：
- **Erdafitinib**：小分子 **FGFR 抑制劑**；**FDA 2019 核准**（THOR study）；用於 **FGFR2/3 突變/融合**（膀胱癌 ~約 1/3 帶 FGFR alteration）；副作用 **onycholysis（甲剝離）、stomatitis、手足症候群、高磷血症（需監測）**。
- **HER2**：膀胱癌 **HER2 IHC 3+ 比率最高（~13.9%）**；HER2 過度表現為**不良預後**；UTUC 約 1/3 有 HER2 過表現 → HER2 ADC（如 trastuzumab deruxtecan）為新方向。
- **台灣健保給付（2025/8/20 更新重點）**：ICI 僅給付 **PD-L1+**；EV 僅給付**曾接受鉑類化療＋ICI 後**的病人。

**C. 臨床判斷流程**
```
轉移性 UC → 評估 cisplatin 適格 + PD-L1 + 基因(FGFR/HER2)
  1L:
    ├ EV + Pembrolizumab(新標準, EV-302)
    ├ Cis eligible → Gem/Cis (± 後續 IO/維持)
    └ Cis ineligible → Carbo/Gem + avelumab 維持 / pembrolizumab(PD-L1+)
  2L:
    ├ 鉑後 → pembrolizumab(KEYNOTE-045)
    └ FGFR+ → erdafitinib
  後線: HER2 ADC、其他
```

**F. 考試高頻重點**
1. **EV + Pembrolizumab（EV-302）= 1L 新標準**（FDA 2023、台灣 2024）。
2. **EV = 抗 Nectin-4 ADC（MMAE）**；Nectin-4 在 mUC >90% 表現。
3. **Cisplatin-ineligible：Carbo/Gem + avelumab 維持**（JAVELIN）。
4. **2L 鉑後標準 = pembrolizumab（KEYNOTE-045）**。
5. **Erdafitinib = FGFR 抑制劑**（FGFR2/3 突變），副作用高磷血症/甲剝離/手足症候群。
6. **膀胱癌 HER2 IHC 3+ 比率最高（~14%）**，為不良預後。
7. 台灣給付：ICI 限 PD-L1+；EV 限鉑＋ICI 後。

**G. 容易混淆比較表**
| 藥物 | 標靶/機轉 | 定位 |
|---|---|---|
| EV | 抗 Nectin-4 ADC | 1L(+pembro)、後線 |
| Pembrolizumab | PD-1 | 1L(PD-L1+/EV合併)、2L |
| Avelumab | PD-L1 維持 | 1L 化療後維持 |
| Erdafitinib | FGFR2/3 抑制 | FGFR+ 後線 |
| HER2 ADC | HER2 | HER2+ 新方向 |

**H. 臨床記憶法**
- 「**EV + Pembro 改寫 1L（Nectin-4 ADC）**」。
- 「**化療後維持用 avelumab；2L 用 pembrolizumab**」。
- 「**FGFR → erdafitinib（記副作用：磷高、甲剝離、手足）**」。

## 【主題八】UTUC 分期與治療（Upper Tract UC）★ 台灣重點

**A. 一句話重點**
上泌尿道尿路上皮癌標準治療為 **根除性腎輸尿管切除術（radical nephroureterectomy, RNU）＋膀胱袖口切除（bladder cuff）**；低風險/單腎可考慮 **保腎（kidney-sparing）**；台灣 UTUC 盛行，術後務必追蹤膀胱（復發 15–75%）。

**B. 必背重點**
- **風險分層（決定 RNU vs 保腎）**：
- **低風險**：單發、<2 cm、low-grade、cytology 非 high-grade、影像無侵犯 → 可 **保腎（內視鏡雷射、節段性輸尿管切除）**。
- **高風險**：multifocal、≥2 cm、high-grade、hydronephrosis、既往膀胱癌、variant → **RNU**。
- **RNU**：切除腎、全段輸尿管、**膀胱袖口（bladder cuff）**；可開放/腹腔鏡/機器人。
- **淋巴清除模板（UTUC, Kondo/Tanabe extended）**：依腫瘤位置決定（右側、左側、上中下段不同）。
- **術後膀胱內單次化療灌注**（如 MMC）可降低術後膀胱復發。
- **新輔助/輔助化療**：高風險 UTUC 可考慮輔助 cisplatin 化療（POUT trial 支持輔助化療改善 DFS）。
- 台灣健保給付（2025/8/20）：a/mUC 之 ICI 限 PD-L1+、EV 限鉑＋ICI 後。

**C. 臨床判斷流程**
```
UTUC 確診(輸尿管鏡+切片/CT urography) → 風險分層
  ├ 低風險(單發<2cm low-grade) → 保腎(內視鏡/節段切除) + 追蹤
  └ 高風險 → RNU + bladder cuff + (依位置)淋巴清除
RNU 術後 → 單次膀胱灌注 MMC；高風險考慮輔助化療(POUT)
所有 UTUC → 嚴密追蹤膀胱(復發 15–75%)
```

**F. 考試高頻重點**
1. **UTUC 標準 = RNU + bladder cuff 切除**。
2. **低風險（單發<2cm、low-grade）→ 保腎**；高風險→RNU。
3. **術後單次膀胱內 MMC 灌注降膀胱復發**。
4. 高風險 UTUC → **輔助 cisplatin 化療（POUT trial）**。
5. UTUC 術後膀胱復發 **15–75%**，要追蹤膀胱。
6. 淋巴清除模板依腫瘤位置（Kondo/Tanabe）。

**G. 容易混淆比較表**
| 風險 | 條件 | 治療 |
|---|---|---|
| 低風險 | 單發、<2cm、low-grade、無侵犯 | 保腎(內視鏡/節段) |
| 高風險 | 多發、≥2cm、high-grade、hydronephrosis | RNU + bladder cuff |

**H. 臨床記憶法**
- 「**UTUC = RNU + 膀胱袖口；小而低惡性才保腎**」。
- 「**RNU 後打一次 MMC，永遠追蹤膀胱**」。
- 「**高風險 UTUC → POUT 輔助化療**」。

## 二、單選題 10 題（附答案與詳解）

**1.** UC 最重要的可改變危險因子為？
(A) 肥胖　(B) **吸菸（佔 30–40%）**　(C) 放射線　(D) 咖啡
**答案：B**。

**2.** 下列何者**最不是** UTUC 的特有危險因子？
(A) 馬兜鈴酸　(B) 砷　(C) Lynch syndrome　(D) **Schistosoma haematobium**
**答案：D**。血吸蟲與膀胱 **鱗狀細胞癌（SCC）** 相關，非 UTUC 典型。

**3.** 膀胱癌診斷的 gold standard 為？
(A) 尿細胞學　(B) CT urography　(C) **膀胱鏡＋切片**　(D) NMP22
**答案：C**。

**4.** 關於分期，T2 代表侵犯到哪一層，屬於何種分類？
(A) lamina propria，NMIBC
(B) **muscularis propria（肌肉層），MIBC**
(C) perivesical fat，MIBC
(D) 黏膜，NMIBC
**答案：B**。T2 進入肌肉層即為 MIBC。

**5.** 下列哪種情況**最該**安排 re-TURBT？
(A) TaG1 低惡性度乳突狀腫瘤
(B) Primary CIS
(C) **所有 T1 腫瘤（或檢體無肌肉層）**
(D) 完全切除且含肌肉的 Ta 腫瘤
**答案：C**。T1 與無肌肉層檢體需 re-TURBT（2–6 週），TaG1/primary CIS 除外。

**6.** 高危 NMIBC 與 CIS 的標準膀胱內治療為？
(A) 即刻單次 MMC　(B) **BCG（誘導＋維持）**　(C) 全身化療　(D) 放療
**答案：B**。BCG 可同時降復發與**進展**。

**7.** 根除性膀胱切除骨盆淋巴結廓清的**上方**邊界為？
(A) Cooper's ligament
(B) genitofemoral nerve
(C) **輸尿管跨越 common iliac artery 處**
(D) internal iliac artery
**答案：C**。外側=genitofemoral nerve、內側=internal iliac artery、下方=Cooper's ligament、上方=ureter 跨 common iliac。

**8.** 使用回腸做尿流改道，最常見的代謝異常為？
(A) 代謝性鹼中毒　(B) **高血氯代謝性酸中毒**　(C) 低鉀低氯　(D) 呼吸性酸中毒
**答案：B**。回腸/結腸吸收 → hyperchloremic metabolic acidosis；胃改道才是鹼中毒。

**9.** 轉移性 UC 目前的第一線新標準治療為？
(A) 單用 cisplatin　(B) **Enfortumab Vedotin ＋ Pembrolizumab（EV-302）**　(C) 單用 BCG　(D) erdafitinib
**答案：B**。EV（抗 Nectin-4 ADC）＋pembrolizumab，FDA 2023、台灣 2024。

**10.** Erdafitinib 適用於帶何種變異的 UC？副作用需特別監測？
(A) HER2；監測心毒性
(B) **FGFR2/3 突變/融合；監測高磷血症（並注意甲剝離、手足症候群）**
(C) PD-L1；監測甲狀腺
(D) EGFR；監測皮疹
**答案：B**。

## 三、口試題 5 題（標準答案要點）

**Q1. 請說明 NMIBC 與 MIBC 的分期分界與治療策略差異。**
重點：**NMIBC = Ta/Tis/T1（未到肌肉層）；MIBC = ≥T2（侵入 muscularis propria）**。NMIBC 以 TURBT＋膀胱內灌注（即刻 MMC、高危/CIS 用 BCG）、T1 與無肌肉層檢體需 re-TURBT（2–6 週）。MIBC 以新輔助 cisplatin 化療＋根除性膀胱切除＋淋巴廓清＋尿流改道，或不能手術者三合一保膀胱。

**Q2. NMIBC 膀胱內灌注：MMC 與 BCG 的角色與機轉。**
重點：**即刻單次 MMC（術後 24h 內）防腫瘤細胞種植、降復發**，用於低/中危；**BCG 降復發並降進展**，用於高危與 CIS，機轉為誘發 Th1 免疫反應（IFN-γ、IL-2、IL-12）並結合 fibronectin。BCG 無效→pembrolizumab（KEYNOTE-057）或膀胱切除。

**Q3. 根除性膀胱切除的淋巴廓清範圍與尿流改道的代謝併發症。**
重點：標準模板邊界——外側 genitofemoral nerve、內側 internal iliac artery、下方 Cooper's ligament、上方 ureter 跨 common iliac artery；清 >10 顆改善存活。尿流改道用回腸/結腸→**高血氯代謝性酸中毒**；胃→鹼中毒。

**Q4. 轉移性 UC 的全身性治療演進。**
重點：1L 從鉑類化療（反應 40–50% 但 PFS 短）演進到 **EV+pembrolizumab（EV-302）新標準**；cisplatin-ineligible 用 Carbo/Gem＋avelumab 維持或 pembrolizumab（PD-L1+）。2L 鉑後用 pembrolizumab（KEYNOTE-045）。生物標記導向：FGFR→erdafitinib；HER2 過表現→HER2 ADC。

**Q5. UTUC 的危險因子、治療原則與術後追蹤。**
重點：危險因子含馬兜鈴酸、砷、止痛藥、Balkan nephropathy、Lynch syndrome（台灣盛行）。標準治療 **RNU＋bladder cuff**；低風險（單發<2cm、low-grade）可保腎；術後單次膀胱 MMC 灌注、高風險輔助 cisplatin 化療（POUT）。**膀胱復發率 15–75%，需嚴密追蹤膀胱**。

## 四、Top 20 必背考點（背誦優先序）

1. UC 約 **90% 為 urothelial carcinoma**；最典型表現＝**無痛性血尿**。
2. **吸菸佔 UC 30–40%（最重要）**；職業＝芳香胺。
3. **UTUC 特有：馬兜鈴酸、砷、止痛藥、Balkan、Lynch**；血吸蟲/慢性發炎→SCC。
4. **台灣 UTUC 比例高（~40%）**；UTUC 後膀胱復發 **15–75%**。
5. **膀胱鏡＋切片 = 膀胱癌診斷 gold standard**；CT urography 影像準確度最高。
6. **NMIBC = Ta/Tis/T1；MIBC = ≥T2（肌肉層）**。
7. **T1=lamina propria；T2=muscularis propria**。
8. **CIS（Tis）= 扁平、高惡性度**；urachus 腺癌在 bladder dome。
9. Grading **與預後相關、與大小無關**。
10. **所有 T1 與無肌肉層檢體 → re-TURBT（2–6 週）**（TaG1/primary CIS 除外）。
11. **即刻單次 MMC 降種植/復發；BCG 降復發＋進展（高危/CIS）**。
12. **BCG 機轉 = Th1（IFN-γ/IL-2/IL-12）＋結合 fibronectin**。
13. 側壁腫瘤 TURBT 注意 **obturator reflex → 肌肉鬆弛**。
14. **MIBC = 新輔助 cisplatin 化療 ＋ RC ＋ LND（>10）＋ 尿流改道**。
15. **LND 邊界：外 genitofemoral nerve、內 internal iliac a.、下 Cooper's ligament、上 ureter 跨 common iliac**。
16. **回腸/結腸尿流改道 → 高血氯代謝性酸中毒**；胃→鹼中毒。
17. **1L mUC 新標準 = EV（抗 Nectin-4 ADC）＋ Pembrolizumab（EV-302）**。
18. **Cis-ineligible：Carbo/Gem ＋ avelumab 維持**；2L 鉑後 = pembrolizumab（KEYNOTE-045）。
19. **Erdafitinib = FGFR2/3 抑制劑**（高磷血症、甲剝離、手足症候群）；膀胱癌 HER2 IHC 3+ 比率最高。
20. **UTUC 標準 = RNU + bladder cuff**；低風險保腎、高風險輔助化療（POUT），術後追蹤膀胱。

---

> 📌 **備註**：本筆記依李香瑩醫師講義（8 李香瑩.pdf）文字內容整理，並依 EAU / NCCN / AUA guideline 與重要臨床試驗（EV-302、JAVELIN Bladder 100、KEYNOTE-045/052/057、THOR、POUT、CheckMate 274 等）補全。藥物適應症與台灣健保給付規定（2025/8/20 更新）可能持續變動，臨床請以最新版 guideline 與給付規定為準。

<script>
"use strict";
/* ============ 解析 Markdown 模組 ============ */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return s;
}
function renderTable(rows){
  const cells=r=>r.replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
  const head=cells(rows[0]);
  let h='<div class="table-wrap"><table><thead><tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>';
  for(let r=2;r<rows.length;r++){
    const c=cells(rows[r]);
    h+='<tr>'+c.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>';
  }
  return h+'</tbody></table></div>';
}
function mdToHtml(md){
  if(!md) return '';
  const L=md.split(/\r?\n/); let html='',i=0;
  const isTbl=s=>/^\|(.+)\|\s*$/.test(s);
  while(i<L.length){
    let line=L[i];
    if(/^```/.test(line)){
      i++;let code=[];
      while(i<L.length && !/^```/.test(L[i])){code.push(L[i]);i++;}
      i++;
      html+='<pre class="flow">'+esc(code.join('\n'))+'</pre>';continue;
    }
    if(/^\s*$/.test(line)){i++;continue;}
    if(/^---+\s*$/.test(line)){i++;continue;}
    let hm=line.match(/^(#{1,6})\s+(.*)$/);
    if(hm){const lv=Math.min(6,hm[1].length+1);html+='<h'+lv+'>'+inline(hm[2])+'</h'+lv+'>';i++;continue;}
    if(isTbl(line) && i+1<L.length && /^\|[\s:\-|]+\|\s*$/.test(L[i+1])){
      let tb=[line];i++;tb.push(L[i]);i++;
      while(i<L.length && isTbl(L[i])){tb.push(L[i]);i++;}
      html+=renderTable(tb);continue;
    }
    if(/^>\s?/.test(line)){
      let q=[];while(i<L.length && /^>\s?/.test(L[i])){q.push(L[i].replace(/^>\s?/,''));i++;}
      html+='<blockquote>'+inline(q.join(' '))+'</blockquote>';continue;
    }
    if(/^[-*]\s+/.test(line)){
      let it=[];while(i<L.length && /^[-*]\s+/.test(L[i])){it.push(L[i].replace(/^[-*]\s+/,''));i++;}
      html+='<ul>'+it.map(t=>'<li>'+inline(t)+'</li>').join('')+'</ul>';continue;
    }
    if(/^\d+\.\s+/.test(line)){
      let it=[];while(i<L.length && /^\d+\.\s+/.test(L[i])){it.push(L[i].replace(/^\d+\.\s+/,''));i++;}
      html+='<ol>'+it.map(t=>'<li>'+inline(t)+'</li>').join('')+'</ol>';continue;
    }
    let p=[line];i++;
    while(i<L.length && !/^\s*$/.test(L[i]) && !/^#{1,6}\s/.test(L[i]) && !isTbl(L[i])
          && !/^[-*]\s/.test(L[i]) && !/^\d+\.\s/.test(L[i]) && !/^>/.test(L[i])
          && !/^```/.test(L[i]) && !/^---+\s*$/.test(L[i])){p.push(L[i]);i++;}
    html+='<p>'+inline(p.join(' '))+'</p>';
  }
  return html;
}
function parseModule(md){
  const L=md.split(/\r?\n/);
  let title=(L.find(l=>/^#\s+/.test(l))||'# 模組').replace(/^#\s+/,'').trim();
  const cards=[];let cur=null,curPanel=null,buf=[],inFence=false,seenTitle=false;
  function flush(){
    if(!cur){buf=[];return;}
    const t=buf.join('\n').replace(/^\s+|\s+$/g,'');
    if(curPanel)curPanel.md=t;
    else cur.introMd=(cur.introMd?cur.introMd+'\n':'')+t;
    buf=[];
  }
  for(let i=0;i<L.length;i++){
    const line=L[i];
    if(/^```/.test(line)){inFence=!inFence;buf.push(line);continue;}
    if(inFence){buf.push(line);continue;}
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    const ah=h?h[2].match(/^([A-H])[\.、]\s*(.+)$/):null;
    const bold=line.match(/^\*\*([A-H])[\.、]\s*(.+?)\*\*\s*$/);
    if(h && !ah){
      const lv=h[1].length,ttl=h[2].trim();
      if(!seenTitle && lv===1){seenTitle=true;flush();cur=null;curPanel=null;continue;}
      flush();curPanel=null;
      cur={level:lv,title:ttl,introMd:'',panels:[]};cards.push(cur);continue;
    }
    if((ah||bold) && cur){
      flush();const m=ah||bold;
      curPanel={letter:m[1],title:m[2].trim(),md:''};cur.panels.push(curPanel);continue;
    }
    buf.push(line);
  }
  flush();
  return {title,cards};
}

/* ============ 載入資料 ============ */
const MODULES=[];
document.querySelectorAll('script[type="text/markdown"]').forEach(s=>{
  const m=parseModule(s.textContent);
  m.id='m'+MODULES.length;m.name=s.getAttribute('data-name')||m.title;
  m.subtitle=s.getAttribute('data-sub')||'';
  MODULES.push(m);
});

/* 搜尋索引 */
const INDEX=[];
MODULES.forEach(m=>{
  m.cards.forEach((c,ci)=>{
    if(c.introMd) INDEX.push({mid:m.id,ci,pi:-1,title:c.title,crumb:m.name+' › '+c.title,raw:c.introMd});
    c.panels.forEach((p,pi)=>{
      INDEX.push({mid:m.id,ci,pi,title:p.title,crumb:m.name+' › '+c.title,raw:p.md+' '+p.title});
    });
  });
});

/* 衝刺模式判定 */
const SPRINT_PANEL=/必背|高頻|混淆|陷阱/;
const SPRINT_CARD=/單選|口試|Top|總複習|衝刺|陷阱|整合複習/i;
function panelIsSprint(p){return SPRINT_PANEL.test(p.title);}
function cardIsSprint(c){
  if(c.panels.some(panelIsSprint))return true;
  return SPRINT_CARD.test(c.title);
}

/* ============ 介面狀態 ============ */
let activeId=MODULES[0].id;
const main=document.getElementById('main');
const side=document.getElementById('side');

function buildSidebar(){
  side.innerHTML='';
  MODULES.forEach(m=>{
    const wrap=document.createElement('div');wrap.className='mod'+(m.id===activeId?' active':'');
    wrap.dataset.mid=m.id;
    const head=document.createElement('div');head.className='mod-head';
    head.innerHTML='<span class="tw">▶</span><span>'+esc(m.name)+'</span>';
    head.onclick=()=>{selectModule(m.id);};
    wrap.appendChild(head);
    const toc=document.createElement('div');toc.className='toc';
    m.cards.forEach((c,ci)=>{
      if(c.level>3)return;
      const a=document.createElement('a');a.className='lvl'+c.level;
      a.textContent=c.title;a.href='#';
      a.onclick=e=>{e.preventDefault();gotoCard(m.id,ci,-1);};
      toc.appendChild(a);
    });
    wrap.appendChild(toc);
    side.appendChild(wrap);
  });
}

function renderModule(m){
  let html='<div class="mod-title">'+esc(m.name)+'</div>';
  if(m.subtitle)html+='<div class="mod-sub">'+esc(m.subtitle)+'</div>';
  html+='<div class="mode-banner">⚡ 最後衝刺模式：僅顯示必背數字、考試高頻重點、易混淆比較表與考題（陷阱）。</div>';
  html+='<div class="tools">'
      +'<button class="btn ghost" id="expAll">展開本科全部</button>'
      +'<button class="btn ghost" id="colAll">收合全部</button>'
      +'</div>';
  m.cards.forEach((c,ci)=>{
    const noPanel=c.panels.length===0;
    const divider=noPanel && c.level===1 && /Section|Ｓection/i.test(c.title)===false ? false : (noPanel&&c.level===1);
    const isDivider=noPanel && c.level===1 && (!c.introMd || c.introMd.length<2);
    const sprintHideCard=!cardIsSprint(c)?' data-sprintcard="0"':' data-sprintcard="1"';
    let cls='card lv'+c.level;
    if(isDivider)cls+=' divider';
    html+='<section class="'+cls+'" id="'+m.id+'_'+ci+'"'+sprintHideCard+'>';
    html+='<div class="card-h">'+inline(c.title)+'</div>';
    if(!isDivider){
      html+='<div class="card-body">';
      if(c.introMd){
        const introSprint=cardIsSprint(c)&&c.panels.length===0?'1':'0';
        html+='<div class="intro" data-sprintintro="'+introSprint+'">'+mdToHtml(c.introMd)+'</div>';
      }
      c.panels.forEach((p,pi)=>{
        const hot=panelIsSprint(p);
        html+='<div class="acc'+(hot?' hot':'')+'" data-sprintpanel="'+(hot?'1':'0')+'" id="'+m.id+'_'+ci+'_'+pi+'">'
            +'<button class="acc-h"><span class="acc-tag">'+esc(p.letter||'•')+'</span>'
            +'<span>'+inline(p.title)+'</span><span class="tw">▶</span></button>'
            +'<div class="acc-body">'+mdToHtml(p.md)+'</div></div>';
      });
      html+='</div>';
    } else if(c.introMd){
      html+='<div class="card-body">'+mdToHtml(c.introMd)+'</div>';
    }
    html+='</section>';
  });
  main.innerHTML=html;
  main.querySelectorAll('.acc-h').forEach(b=>{
    b.onclick=()=>b.parentElement.classList.toggle('open');
  });
  document.getElementById('expAll').onclick=()=>main.querySelectorAll('.acc').forEach(a=>a.classList.add('open'));
  document.getElementById('colAll').onclick=()=>main.querySelectorAll('.acc').forEach(a=>a.classList.remove('open'));
  applySprintFilter();
}

function applySprintFilter(){
  const on=document.body.classList.contains('sprint');
  main.querySelectorAll('.card').forEach(card=>{
    card.classList.toggle('hide-sprint', on && card.dataset.sprintcard==='0');
  });
  main.querySelectorAll('.acc').forEach(a=>{
    const hot=a.dataset.sprintpanel==='1';
    a.classList.toggle('hide-sprint', on && !hot);
    if(on && hot)a.classList.add('open');
  });
  main.querySelectorAll('.intro').forEach(intro=>{
    intro.classList.toggle('hide-sprint', on && intro.dataset.sprintintro==='0');
  });
}

function selectModule(id){
  activeId=id;
  document.querySelectorAll('.mod').forEach(x=>x.classList.toggle('active',x.dataset.mid===id));
  const m=MODULES.find(x=>x.id===id);
  renderModule(m);
  window.scrollTo(0,0);
  closeSide();
}

function gotoCard(mid,ci,pi){
  clearSearch(false);
  if(activeId!==mid)selectModule(mid);
  requestAnimationFrame(()=>{
    const el=document.getElementById(mid+'_'+ci);
    if(el){
      el.classList.remove('hide-sprint');
      el.scrollIntoView({behavior:'smooth',block:'start'});
      const h=el.querySelector('.card-h');if(h){h.classList.add('flash');setTimeout(()=>h.classList.remove('flash'),1400);}
    }
    if(pi>=0){
      const pa=document.getElementById(mid+'_'+ci+'_'+pi);
      if(pa){pa.classList.remove('hide-sprint');pa.classList.add('open');setTimeout(()=>{pa.scrollIntoView({behavior:'smooth',block:'center'});},200);}
    }
    closeSide();
  });
}

/* ============ 搜尋 ============ */
const searchEl=document.getElementById('search');
const clearEl=document.getElementById('searchClear');
function snippet(raw,q){
  const low=raw.toLowerCase(),idx=low.indexOf(q.toLowerCase());
  if(idx<0)return esc(raw.slice(0,90));
  const s=Math.max(0,idx-36),e=Math.min(raw.length,idx+q.length+54);
  let frag=(s>0?'…':'')+raw.slice(s,e).replace(/\n/g,' ')+(e<raw.length?'…':'');
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return esc(frag).replace(re,'<mark>$1</mark>');
}
function runSearch(q){
  q=q.trim();
  if(!q){clearSearch(true);return;}
  clearEl.style.display='block';
  const low=q.toLowerCase();
  const hits=INDEX.filter(e=>e.raw.toLowerCase().includes(low)||e.title.toLowerCase().includes(low));
  let html='<div class="mod-title">搜尋結果</div><div class="res-count">「'+esc(q)+'」找到 '+hits.length+' 筆</div><div class="results">';
  if(!hits.length)html+='<div class="empty">查無結果。可改用其他中文或英文關鍵字（例如縮寫 PSA、TURP、Bosniak）。</div>';
  hits.slice(0,200).forEach(h=>{
    html+='<div class="res" data-mid="'+h.mid+'" data-ci="'+h.ci+'" data-pi="'+h.pi+'">'
       +'<div class="crumb">'+esc(h.crumb)+'</div>'
       +'<div class="rtitle">'+inline(h.title)+'</div>'
       +'<div class="snip">'+snippet(h.raw,q)+'</div></div>';
  });
  html+='</div>';
  main.innerHTML=html;
  main.querySelectorAll('.res').forEach(r=>{
    r.onclick=()=>gotoCard(r.dataset.mid,+r.dataset.ci,+r.dataset.pi);
  });
  window.scrollTo(0,0);
}
function clearSearch(rerender){
  searchEl.value='';clearEl.style.display='none';
  if(rerender)selectModule(activeId);
}
let st;
searchEl.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>runSearch(searchEl.value),140);});
clearEl.onclick=()=>{clearSearch(true);searchEl.focus();};

/* ============ 衝刺 / 展開 / 選單 ============ */
document.getElementById('sprintBtn').onclick=function(){
  document.body.classList.toggle('sprint');
  this.classList.toggle('on',document.body.classList.contains('sprint'));
  this.textContent=document.body.classList.contains('sprint')?'✕ 離開衝刺':'⚡ 最後衝刺';
  if(!searchEl.value.trim())applySprintFilter();
};
document.getElementById('expandBtn').onclick=function(){
  const accs=main.querySelectorAll('.acc');
  const anyClosed=[...accs].some(a=>!a.classList.contains('open'));
  accs.forEach(a=>a.classList.toggle('open',anyClosed));
  this.textContent=anyClosed?'收合全部':'展開全部';
};
const sideEl=document.getElementById('side'),bd=document.getElementById('backdrop');
function closeSide(){sideEl.classList.remove('open');bd.classList.remove('show');}
document.getElementById('menuBtn').onclick=()=>{sideEl.classList.toggle('open');bd.classList.toggle('show');};
bd.onclick=closeSide;

/* ============ 啟動 ============ */
buildSidebar();
selectModule(activeId);
</script>
